rong>.<\/li>\n<li>Fast response time (&lt;100 ms) and scalable.<\/li>\n<\/ul>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Requirements<\/h3>\n<ol>\n<li><strong>Real-Time Suggestions:<\/strong> Display relevant matches as the user types.<\/li>\n<li><strong>Top-k Results:<\/strong> Return up to 5 results sorted by popularity.<\/li>\n<li><strong>Scalability:<\/strong> Handle <strong>10 million DAU<\/strong> with a peak QPS of <strong>48,000<\/strong>.<\/li>\n<li><strong>High Availability:<\/strong> Handle failures without system downtime.<\/li>\n<li><strong>Data Growth:<\/strong> Support daily storage growth of <strong>0.4 GB<\/strong> for new query data.<\/li>\n<\/ol>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<p>At the high-level, the system is broken down into two services:\n1. <strong>Data Gathering Service:<\/strong> \n    - Collects user queries and aggregates them for frequency analysis in real-time.\n    - Real-time processing is not practical for large data sets; however, it is a good starting point<\/p>\n<ol start=\"2\">\n<li><strong>Query Service:<\/strong> Provides the top-k suggestions based on the user’s input.<\/li>\n<\/ol>\n<hr />\n<h3>Data Gathering Service<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"13. Search Autocomplete/images/data-gathering.png\" alt=\"Data Gathering\" width=\"600\">\n<\/div>\n\n<ul>\n<li>Aggregates query data from analytics logs and updates the frequency table.<\/li>\n<li>Processes historical data weekly to build a <strong>trie<\/strong> (prefix tree).<\/li>\n<\/ul>\n<h3>Query Service<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"13. Search Autocomplete/images/frequency-table.png\" alt=\"Frequency Table\" width=\"400\">\n    <img src=\"13. Search Autocomplete/images/basic-search-suggestions.png\" alt=\"Search Suggestions\" width=\"360\">\n<\/div>\n\n<ul>\n<li>Uses the frequency table from data gathering service.<\/li>\n<li>Processes user input and retrieves top-k suggestions from the frequency table using a Trie.<\/li>\n<li>Optimized for fast lookups using caching and efficient data structures.<\/li>\n<li>For example when a user types “tw” in the search box, the following top 5 searched queries are displayed.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Trie Data Structure<\/h3>\n<p>The <strong>trie<\/strong> is a tree-like data structure used to store and retrieve query strings efficiently.<\/p>\n<h4>Key Features<\/h4>\n<ol>\n<li><strong>Compact Storage:<\/strong> Represents prefixes hierarchically to minimize redundancy.<\/li>\n<li>\n<p><strong>Frequency Information:<\/strong> Stores the popularity of queries at each node.<\/p>\n<\/li>\n<li>\n<p><strong>Steps to get top k most searched queries<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"13. Search Autocomplete/images/trie-structure.png\" alt=\"Trie Structure\" width=\"500\">\n   <\/div>\n<\/p>\n<ul>\n<li>Find the prefix<\/li>\n<li>Traverse the subtree from prefix node to get all valid children<\/li>\n<li>Sort the children and get top k <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Optimizations:<\/strong>\n   - Cache top-k queries at each node to speed up retrieval and avoid traversing the whole trie.<\/p>\n<pre><code>&lt;img src=\"13. Search Autocomplete/images/cached-trie.png\" alt=\"Cached Trie\" width=\"600\"&gt;\n<\/code><\/pre>\n<\/li>\n<\/ol>\n<ul>\n<li>Limit prefix length to reduce search space as users rarely type a loong search query (say 50).<\/li>\n<\/ul>\n<h4>Trie Operations<\/h4>\n<ol>\n<li><strong>Create:<\/strong> <ul>\n<li>Built weekly using aggregated query data.<\/li>\n<li>The source of data is from Analytics Log/DB.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Update:<\/strong> Rarely updated in real-time; weekly updates replace old data.<\/li>\n<li>\n<p><strong>Delete:<\/strong> \n      <div style=\"margin-left:3rem\">\n         <img src=\"13. Search Autocomplete/images/delete-kv.png\" alt=\"Delete KV\" width=\"500\">\n      <\/div><\/p>\n<ul>\n<li>Filters remove unwanted or harmful suggestions (e.g., hate speech).<\/li>\n<li>Having a filter layer gives us the flexibility of removing results based on different filter rules.<\/li>\n<li>Unwanted suggestions are removed physically from the database asynchronically.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr />\n<h3>Query Processing Flow<\/h3>\n<ol>\n<li><strong>Prefix Search:<\/strong>\n   - Identify the prefix node corresponding to the user’s input.\n   - Traverse the subtree to collect valid suggestions.<\/li>\n<li><strong>Top-k Sorting:<\/strong>\n   - Cache top-k suggestions at each node to minimize sorting overhead.<\/li>\n<li><strong>Response Construction:<\/strong>\n   - Construct results using cached data for fast response times.<\/li>\n<\/ol>\n<hr />\n<h3>Optimizations<\/h3>\n<ol>\n<li><strong>Cache at Each Node:<\/strong>\n   - Store the top-k queries to avoid redundant traversals.<\/li>\n<li><strong>Limit Prefix Length:<\/strong>\n   - Cap prefix length to a small value (e.g., 50 characters) for faster lookups.<\/li>\n<li><strong>AJAX Requests:<\/strong>\n   - Use lightweight asynchronous requests for real-time responses.<\/li>\n<li><strong>Browser Caching:<\/strong>\n   - Save autocomplete results in the browser cache for frequently searched terms.<\/li>\n<\/ol>\n<hr />\n<h3>Data Gathering Pipeline<\/h3>\n<p>In the high-level design, whenever a user types a search query, data is updated in real-time. This appraoch is not practical.\n- Users may enter billions of queries per day. Updating the trie on every query is not feasible.\n- Top suggestions may not change much one the trie is built.<\/p>\n<h4>Updated Design<\/h4>\n<div style=\"margin-left:3rem\">\n   <img src=\"13. Search Autocomplete/images/data-gathering-flow.png\" alt=\"Updated Data Gathering Flow\" width=\"600\">\n<\/div>\n\n<ol>\n<li><strong>Analytics Logs:<\/strong>\n   - Stores raw query data as logs for weekly aggregation.\n   - Logs are append-only and are not indexed<\/li>\n<li><strong>Aggregators:<\/strong>\n   - Process logs into frequency tables, suitable for trie construction.\n   - For real-time applications such as Twitter, aggregate data in a shorter time interval.\n   - For other cases, aggregating data less frequently, say once per week is good enough.<\/li>\n<li><strong>Workers:<\/strong>\n   - Asynchronous servers rebuild the trie and store it in persistent storage.<\/li>\n<li><strong>Storage Options:<\/strong><ul>\n<li><strong>Trie Cache<\/strong>: Trie Cache is a distributed cache system that keeps trie in memory for fast read.<\/li>\n<li><strong>Trie DB<\/strong> <ol>\n<li><strong>Document Store (e.g., MongoDB)<\/strong>: Since a new trie is built weekly, we can periodically take a snapshot of it, serialize it, and store the serialized data in the database like MongoDB<\/li>\n<li><strong>Key-Value Store:<\/strong> <ul>\n<li>Maps prefixes to node data for fast access.<\/li>\n<li>Every prefix in the trie is mapped to a key in a hash table.<\/li>\n<li>\n<p>Data on each trie node is mapped to a value in a hash table.<\/p>\n<h2><img src=\"13. Search Autocomplete/images/trie-db.png\" alt=\"Trie DB\" width=\"600\"><\/h2>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>Scalability<\/h3>\n<ol>\n<li><strong>Sharding:<\/strong>\n   - Distribute trie nodes across servers based on prefix ranges (e.g., <code>a-m<\/code>, <code>n-z<\/code>).\n   - Further shard within prefixes to balance uneven distributions (e.g., <code>aa-ag<\/code>, <code>ah-an<\/code>).<\/li>\n<li><strong>Load Balancing:<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"13. Search Autocomplete/images/sharding.png\" alt=\"Sharding\" width=\"400\">\n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>Use a shard map manager to route requests to the appropriate server.<\/li>\n<\/ul>\n<hr />\n<h2>Step 4: Advanced Features<\/h2>\n<h3>Multi-Language Support<\/h3>\n<ol>\n<li><strong>Unicode Characters:<\/strong> Use Unicode to support non-English languages.<\/li>\n<li><strong>Country-Specific Tries:<\/strong> Build separate tries for different countries or regions.<\/li>\n<\/ol>\n<h3>Trending Queries<\/h3>\n<ul>\n<li>Handle real-time events by dynamically updating trie nodes or weighting recent queries more heavily.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>自动补全（autocomplete），也称为 typeahead 或增量搜索（incremental search），在用户于搜索框中输入时实时提供建议。该系统必须基于历史查询数据，高效地返回 top-k 条相关且热门的建议。<\/p>\n<h3>关键特性<\/h3>\n<ul>\n<li>最多给出 <strong>5 条自动补全结果<\/strong>。<\/li>\n<li>基于<strong>查询热度<\/strong>（出现频率）。<\/li>\n<li>仅支持<strong>小写英文字符<\/strong>。<\/li>\n<li>响应快（&lt;100 ms）且可扩展。<\/li>\n<\/ul>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>需求<\/h3>\n<ol>\n<li><strong>实时建议：<\/strong> 在用户输入时显示相关匹配项。<\/li>\n<li><strong>top-k 结果：<\/strong> 最多返回 5 条按热度排序的结果。<\/li>\n<li><strong>可扩展性：<\/strong> 应对 <strong>1000 万 DAU<\/strong>，峰值 QPS 达 <strong>48,000<\/strong>。<\/li>\n<li><strong>高可用性：<\/strong> 在发生故障时系统不停机。<\/li>\n<li><strong>数据增长：<\/strong> 支持新查询数据每天 <strong>0.4 GB<\/strong> 的存储增长。<\/li>\n<\/ol>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<p>在高层上，该系统被拆分为两个服务：\n1. <strong>数据采集服务（Data Gathering Service）：<\/strong> \n    - 采集用户查询，并实时聚合它们以进行频率分析。\n    - 对于大型数据集，实时处理并不现实；不过，它是一个不错的起点。<\/p>\n<ol start=\"2\">\n<li><strong>查询服务（Query Service）：<\/strong> 根据用户输入提供 top-k 建议。<\/li>\n<\/ol>\n<hr />\n<h3>数据采集服务<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"13. Search Autocomplete/images/data-gathering.png\" alt=\"数据采集\" width=\"600\">\n<\/div>\n\n<ul>\n<li>从分析日志中聚合查询数据，并更新频率表。<\/li>\n<li>每周处理历史数据，以构建一棵<strong>前缀树（trie）<\/strong>。<\/li>\n<\/ul>\n<h3>查询服务<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"13. Search Autocomplete/images/frequency-table.png\" alt=\"频率表\" width=\"400\">\n    <img src=\"13. Search Autocomplete/images/basic-search-suggestions.png\" alt=\"搜索建议\" width=\"360\">\n<\/div>\n\n<ul>\n<li>使用来自数据采集服务的频率表。<\/li>\n<li>处理用户输入，并使用前缀树从前缀树中检索 top-k 建议。<\/li>\n<li>通过缓存和高效的数据结构，针对快速查找做了优化。<\/li>\n<li>例如，当用户在搜索框中输入「tw」时，会显示以下搜索量最高的 5 条查询。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3>前缀树数据结构<\/h3>\n<p><strong>前缀树（trie）<\/strong> 是一种树状数据结构，用于高效地存储和检索查询字符串。<\/p>\n<h4>关键特性<\/h4>\n<ol>\n<li><strong>紧凑存储：<\/strong> 以分层方式表示前缀，以最小化冗余。<\/li>\n<li>\n<p><strong>频率信息：<\/strong> 在每个节点处存储查询的热度。<\/p>\n<\/li>\n<li>\n<p><strong>获取搜索量最高的 top k 条查询的步骤<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"13. Search Autocomplete/images/trie-structure.png\" alt=\"前缀树结构\" width=\"500\">\n   <\/div>\n<\/p>\n<ul>\n<li>找到前缀<\/li>\n<li>从前缀节点开始遍历子树，获取所有有效的子节点<\/li>\n<li>对子节点排序，取出 top k<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>优化：<\/strong>\n   - 在每个节点缓存 top-k 查询，以加快检索速度并避免遍历整棵前缀树。<\/p>\n<pre><code>&lt;img src=\"13. Search Autocomplete/images/cached-trie.png\" alt=\"带缓存的前缀树\" width=\"600\"&gt;\n<\/code><\/pre>\n<\/li>\n<\/ol>\n<ul>\n<li>限制前缀长度以缩小搜索空间，因为用户很少输入很长的搜索查询（比如 50 个字符）。<\/li>\n<\/ul>\n<h4>前缀树操作<\/h4>\n<ol>\n<li><strong>创建（Create）：<\/strong> <ul>\n<li>使用聚合后的查询数据每周构建一次。<\/li>\n<li>数据来源是分析日志/数据库（Analytics Log/DB）。<\/li>\n<\/ul>\n<\/li>\n<li><strong>更新（Update）：<\/strong> 很少实时更新；每周的更新会替换旧数据。<\/li>\n<li>\n<p><strong>删除（Delete）：<\/strong> \n      <div style=\"margin-left:3rem\">\n         <img src=\"13. Search Autocomplete/images/delete-kv.png\" alt=\"删除键值\" width=\"500\">\n      <\/div><\/p>\n<ul>\n<li>过滤器移除不需要的或有害的建议（例如仇恨言论）。<\/li>\n<li>拥有一个过滤层，使我们能够根据不同的过滤规则灵活地移除结果。<\/li>\n<li>不需要的建议会异步地从数据库中物理删除。<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr />\n<h3>查询处理流程<\/h3>\n<ol>\n<li><strong>前缀搜索：<\/strong>\n   - 找到与用户输入对应的前缀节点。\n   - 遍历子树以收集有效的建议。<\/li>\n<li><strong>top-k 排序：<\/strong>\n   - 在每个节点缓存 top-k 建议，以最小化排序开销。<\/li>\n<li><strong>响应构建：<\/strong>\n   - 使用缓存的数据构建结果，以获得快速的响应时间。<\/li>\n<\/ol>\n<hr />\n<h3>优化<\/h3>\n<ol>\n<li><strong>在每个节点缓存：<\/strong>\n   - 存储 top-k 查询，以避免冗余遍历。<\/li>\n<li><strong>限制前缀长度：<\/strong>\n   - 将前缀长度上限设为一个较小的值（例如 50 个字符），以加快查找。<\/li>\n<li><strong>AJAX 请求：<\/strong>\n   - 使用轻量级的异步请求，以获得实时响应。<\/li>\n<li><strong>浏览器缓存：<\/strong>\n   - 在浏览器缓存中保存常用搜索词的自动补全结果。<\/li>\n<\/ol>\n<hr />\n<h3>数据采集流水线<\/h3>\n<p>在高层设计中，每当用户输入一条搜索查询时，数据都会实时更新。这种做法并不现实。\n- 用户每天可能输入数十亿条查询。对每一条查询都更新前缀树是不可行的。\n- 前缀树一旦构建完成，热门建议可能不会有太大变化。<\/p>\n<h4>更新后的设计<\/h4>\n<div style=\"margin-left:3rem\">\n   <img src=\"13. Search Autocomplete/images/data-gathering-flow.png\" alt=\"更新后的数据采集流程\" width=\"600\">\n<\/div>\n\n<ol>\n<li><strong>分析日志（Analytics Logs）：<\/strong>\n   - 将原始查询数据以日志形式存储，供每周聚合使用。\n   - 日志只追加（append-only），且不建立索引。<\/li>\n<li><strong>聚合器（Aggregators）：<\/strong>\n   - 将日志处理成频率表，适用于构建前缀树。\n   - 对于 Twitter 这类实时应用，以更短的时间间隔聚合数据。\n   - 对于其他情况，较低频率地聚合数据，比如每周一次就足够了。<\/li>\n<li><strong>工作进程（Workers）：<\/strong>\n   - 异步服务器重建前缀树，并将其存入持久化存储。<\/li>\n<li><strong>存储选项：<\/strong><ul>\n<li><strong>前缀树缓存（Trie Cache）<\/strong>：前缀树缓存是一个分布式缓存系统，将前缀树保存在内存中以实现快速读取。<\/li>\n<li><strong>前缀树数据库（Trie DB）<\/strong> <ol>\n<li><strong>文档存储（例如 MongoDB）：<\/strong> 由于每周都会构建一棵新的前缀树，我们可以定期对它拍一个快照（snapshot），将其序列化，并把序列化后的数据存入像 MongoDB 这样的数据库。<\/li>\n<li><strong>键值存储（Key-Value Store）：<\/strong> <ul>\n<li>将前缀映射到节点数据，以实现快速访问。<\/li>\n<li>前缀树中的每个前缀都映射到哈希表中的一个键。<\/li>\n<li>\n<p>每个前缀树节点上的数据都映射到哈希表中的一个值。<\/p>\n<h2><img src=\"13. Search Autocomplete/images/trie-db.png\" alt=\"前缀树数据库\" width=\"600\"><\/h2>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>可扩展性<\/h3>\n<ol>\n<li><strong>分片（Sharding）：<\/strong>\n   - 按前缀范围将前缀树节点分布到多台服务器上（例如 <code>a-m<\/code>、<code>n-z<\/code>）。\n   - 在前缀内部进一步分片，以平衡不均匀的分布（例如 <code>aa-ag<\/code>、<code>ah-an<\/code>）。<\/li>\n<li><strong>负载均衡：<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"13. Search Autocomplete/images/sharding.png\" alt=\"分片\" width=\"400\">\n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>使用分片映射管理器（shard map manager）将请求路由到合适的服务器。<\/li>\n<\/ul>\n<hr />\n<h2>第 4 步：高级特性<\/h2>\n<h3>多语言支持<\/h3>\n<ol>\n<li><strong>Unicode 字符：<\/strong> 使用 Unicode 来支持非英语语言。<\/li>\n<li><strong>按国家划分的前缀树：<\/strong> 为不同国家或地区构建单独的前缀树。<\/li>\n<\/ol>\n<h3>热门查询<\/h3>\n<ul>\n<li>通过动态更新前缀树节点或加大近期查询的权重，来处理实时事件。<\/li>\n<\/ul>", "enTitle": "Chapter 13: Design a Search Autocomplete System", "zhTitle": "第 13 章：设计搜索自动补全系统", "short": "Search Autocomplete", "num": "13"}, "14. Youtube": {"en": "\n<h2>Introduction<\/h2>\n<p>YouTube is a massive video streaming platform supporting video uploads, playback, and various interactions. This chapter focuses on designing a scalable video streaming system with the following core features:\n- <strong>Fast video uploads<\/strong>\n- <strong>Smooth video streaming<\/strong>\n- <strong>Ability to change video quality<\/strong>\n- <strong>Low infrastructure cost<\/strong>\n- <strong>High availability and reliability<\/strong><\/p>\n<h3>Key Statistics (2020)<\/h3>\n<ul>\n<li><strong>2 billion monthly active users<\/strong><\/li>\n<li><strong>5 billion videos watched per day<\/strong><\/li>\n<li><strong>37% of mobile internet traffic comes from YouTube<\/strong><\/li>\n<li>Available in <strong>80 languages<\/strong><\/li>\n<li><strong>$15.1 billion ad revenue<\/strong> in 2019<\/li>\n<\/ul>\n<hr />\n<h2>Step 1: Understand the Problem and Scope<\/h2>\n<h3>Core Functionalities<\/h3>\n<ol>\n<li>Upload videos<\/li>\n<li>Watch videos<\/li>\n<\/ol>\n<h3>Supported Platforms<\/h3>\n<ul>\n<li>Mobile apps, web browsers, and smart TVs<\/li>\n<\/ul>\n<h3>Assumptions<\/h3>\n<ul>\n<li><strong>Daily Active Users (DAU):<\/strong> 5 million<\/li>\n<li><strong>Average Video Size:<\/strong> 300 MB<\/li>\n<li><strong>Upload Limits:<\/strong> Max 1 GB per video<\/li>\n<li><strong>Daily Storage Need:<\/strong> 150 TB<\/li>\n<li><strong>CDN Costs:<\/strong> 5 million * 5 videos * 0.3GB * $0.02 =  $150,000/day (using Amazon CloudFront)<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Components<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/high-level-design.png\" alt=\"High Level Design\" width=\"400\">\n<\/div>\n\n<ol>\n<li><strong>Client:<\/strong> Devices like smartphones, computers, and TVs.<\/li>\n<li><strong>CDN (Content Delivery Network):<\/strong> Stores and streams videos.<\/li>\n<li><strong>API Servers:<\/strong> Handles all user interactions except video streaming (e.g., uploads, metadata updates).<\/li>\n<li><strong>Metadata Database:<\/strong> Stores video metadata (e.g., title, description, size).<\/li>\n<li><strong>Original Storage:<\/strong> Blob storage for uploaded videos.<\/li>\n<li><strong>Transcoding Servers:<\/strong> Convert videos into multiple resolutions and formats.<\/li>\n<li><strong>Transcoded Storage:<\/strong> Blob storage for transcoded videos.<\/li>\n<\/ol>\n<hr />\n<h3>Core Workflows<\/h3>\n<h4>1. Video Uploading Flow<\/h4>\n<ul>\n<li>\n<p><strong>Parallel Processes:<\/strong>\n  1. Upload video to original storage.\n  2. Update video metadata in the database.<\/p>\n<\/li>\n<li>\n<p><strong>Video Upload (Steps):<\/strong><\/p>\n<p><div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/video-uploading-flow.png\" alt=\"Video Upload Flow\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>[1] Videos are uploaded to blob storage. <\/li>\n<li>[2] Transcoding servers convert videos to multiple formats.<\/li>\n<li>[3] One trasncoding is complete, following two steps are exectued in parallel.<ul>\n<li>[3a] Transcoded videos are sent to transcoded storage.<\/li>\n<li>[3b] Transcoding completion events are queued in the completion queue. <\/li>\n<\/ul>\n<\/li>\n<li>[3a.1] Videos are distributed to the CDN. <\/li>\n<li>[3b.1] Completion handlers update metadata and inform users. <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Metadata Upload (Steps):<\/strong><\/p>\n<p><div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/metadata-upload.png\" alt=\"Metadata Upload\" height=\"500\">\n<\/div><\/p>\n<ul>\n<li>The client in parallel sends a request to update the video metadata <\/li>\n<li>The request contains video metadata, including file name, size, format, etc.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>2. Video Streaming Flow<\/h4>\n<div style=\"margin-left: 3em;\">\n  <img src=\"14. Youtube/images/video-streaming-flow.png\" alt=\"Video Streaming Flow\" height=\"400\">\n<\/div>\n\n<ul>\n<li>Videos are streamed directly from the CDN using edge servers to minimize latency.<\/li>\n<li>Some of te popular streaming protocols are MPEG_DASH, Apple HLS, Adobe HDS.<\/li>\n<li><em>Different streaming protocols support different video encodings and playback players.<\/em><\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Video Transcoding<\/h3>\n<h4>Importance<\/h4>\n<ol>\n<li>Raw video consumes large amounts of storage space. It Reduces storage space.<\/li>\n<li>Ensures compatibility across devices and browsers.<\/li>\n<li>Adapts video quality to network conditions.<\/li>\n<\/ol>\n<h4>Components<\/h4>\n<ul>\n<li><strong>Container:<\/strong> Encapsulates video, audio, and metadata (e.g., MP4, AVI).<\/li>\n<li><strong>Codecs:<\/strong> Compression and Decompression algorithms (e.g., H.264, VP9).<\/li>\n<\/ul>\n<h4>Directed Acyclic Graph (DAG) Model<\/h4>\n<div style=\"margin-left: 3em;\">\n    <img src=\"14. Youtube/images/dag-video-transcoding.png\" alt=\"DAG Video Transcoding\" width=\"600\">\n<\/div>\n\n<ul>\n<li>Transcoding a video is computationally expensive and time-consuming.<\/li>\n<li>DAG Model defines tasks like encoding, thumbnail generation, and watermarking.<\/li>\n<li>\n<p>Allows high parallelism in video processing.<\/p>\n<\/li>\n<li>\n<p>The original video is split into video, audio, and metadata. <\/p>\n<ul>\n<li>Video encodings: Videos are converted to support different resolutions, codec, bitrates.<\/li>\n<li>Thumbnail: It can either be uploaded by a user or automatically generated bythe system.<\/li>\n<li>Watermark: Image overlay on top of your video contains identifying information about the video.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>Video Transcoding Architecture<\/h3>\n<div style=\"margin-left: 3em;\">\n<img src=\"14. Youtube/images/video-transcoding-architecture.png\" alt=\"Video Transcoding\" width=\"600\">\n<\/div>\n\n<ol>\n<li>\n<p><strong>Preprocessor:<\/strong> Splits videos into smaller chunks (GOP alignment). It has 4 responsibilities.<\/p>\n<p><div style=\"margin-left: 3em;\">\n    <img src=\"14. Youtube/images/dag-config.png\" alt=\"DAG Config\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>Video splitting: Video stream is split or further split into smaller Group of Pictures (GOP) alignment.<\/li>\n<li>It split videos by GOP alignment for old clients.<\/li>\n<li>It generates DAG based on configuration files client programmers write. <\/li>\n<li>It stores GOPs and metadata in temporary storage in case the encoding fails, the system could use persisted data for retry operations.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>DAG Scheduler:<\/strong> Organizes tasks into sequential or parallel stages.\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/dag-scheduler.png\" alt=\"DAG Scheduler\" width=\"500\">\n    <\/div><\/p>\n<ul>\n<li>It splits a DAG graph into stages of tasks and puts them in the task queue in the resource manager. <\/li>\n<li>Stage 1: video, audio, and metadata.<\/li>\n<li>The video file is further split into two tasks in stage 2: video encoding and thumbnail. <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Resource Manager:<\/strong> Responsible for managing the efficiency of resource allocation.It\ncontains 3 queues and a task scheduler.\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/resource-manager.png\" alt=\"Resource Manager\" width=\"700\">\n    <\/div><\/p>\n<ul>\n<li>Task queue: priority queue that contains tasks to be executed.<\/li>\n<li>Worker queue: priority queue that contains worker utilization info.<\/li>\n<li>Running queue: contains  currently running tasks and workers running the tasks.<\/li>\n<li>Task scheduler: picks the optimal task/worker, and instructs the chosen task worker to execute the job.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Task Workers:<\/strong> Perform transcoding and other operations.\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/task-worker.png\" alt=\"Task Worker\" width=\"250\">\n   <\/div><\/p>\n<ul>\n<li>Different task workers may run different tasks <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Temporary Storage:<\/strong> Stores intermediate data for retries.<\/p>\n<ul>\n<li>The choice of storage system depends on factors like data type, data size, access frequency, data life span, etc. <\/li>\n<\/ul>\n<\/li>\n<li><strong>Output:<\/strong> Transcoded videos ready for distribution.<\/li>\n<\/ol>\n<hr />\n<h2>System Optimizations<\/h2>\n<h3>Speed Optimizations<\/h3>\n<ol>\n<li>\n<p><strong>Parallel Video Uploads:<\/strong> Split videos into smaller chunks for faster, resumable uploads.<\/p>\n<p><img src=\"14. Youtube/images/video-split.png\" alt=\"Video Split\" width=\"600\"><\/p>\n<\/li>\n<li>\n<p><strong>Distributed Upload Centers:<\/strong> Use CDNs as upload hubs close to users.<\/p>\n<\/li>\n<li>\n<p><strong>Parallel Processing:<\/strong> Decouple modules using message queues for high parallelism.<\/p>\n<p><img src=\"14. Youtube/images/message-queue1.png\" alt=\"Message Queue\" width=\"600\">\n<img src=\"14. Youtube/images/message-queue2.png\" alt=\"Message Queue\" height=\"170\" width=\"500\"><\/p>\n<\/li>\n<\/ol>\n<h3>Safety Optimizations<\/h3>\n<ol>\n<li>\n<p><strong>Pre-Signed URLs:<\/strong> Restrict video uploads to authorized users.<\/p>\n<p><img src=\"14. Youtube/images/pres-signed-urls.png\" alt=\"Pre Signed\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Protect Videos:<\/strong>\n   - <strong>DRM Systems<\/strong> (e.g., Apple FairPlay, Google Widevine).\n   - <strong>AES Encryption.<\/strong>\n   - <strong>Watermarking.<\/strong><\/p>\n<\/li>\n<\/ol>\n<h3>Cost-Saving Optimizations<\/h3>\n<ol>\n<li>Serve only popular videos via CDN; less popular ones from high-capacity servers.<\/li>\n<li>Encode on-demand for rarely accessed videos.<\/li>\n<li>Regionalize video distribution based on popularity.<\/li>\n<li>Build custom CDNs and partner with ISPs to reduce bandwidth costs.<\/li>\n<\/ol>\n<hr />\n<h2>Error Handling<\/h2>\n<h3>Recoverable Errors<\/h3>\n<ul>\n<li>Retry failed uploads, transcoding, or resource allocation tasks.<\/li>\n<\/ul>\n<h3>Non-Recoverable Errors<\/h3>\n<ul>\n<li>Stop malformed video processing and return error codes.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>YouTube 是一个大型视频流媒体平台，支持视频上传、播放以及各种互动。本章聚焦于设计一个可扩展的视频流媒体系统，它具备以下核心特性：\n- <strong>快速的视频上传<\/strong>\n- <strong>流畅的视频流媒体播放<\/strong>\n- <strong>能够切换视频画质<\/strong>\n- <strong>低廉的基础设施成本<\/strong>\n- <strong>高可用性与可靠性<\/strong><\/p>\n<h3>关键数据（2020 年）<\/h3>\n<ul>\n<li><strong>20 亿月活跃用户<\/strong><\/li>\n<li><strong>每天观看 50 亿个视频<\/strong><\/li>\n<li><strong>移动互联网流量的 37% 来自 YouTube<\/strong><\/li>\n<li>提供 <strong>80 种语言<\/strong><\/li>\n<li>2019 年广告收入达 <strong>151 亿美元<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>第 1 步：理解问题与范围<\/h2>\n<h3>核心功能<\/h3>\n<ol>\n<li>上传视频<\/li>\n<li>观看视频<\/li>\n<\/ol>\n<h3>支持的平台<\/h3>\n<ul>\n<li>移动应用、网页浏览器和智能电视<\/li>\n<\/ul>\n<h3>假设<\/h3>\n<ul>\n<li><strong>日活跃用户（DAU）：<\/strong> 500 万<\/li>\n<li><strong>平均视频大小：<\/strong> 300 MB<\/li>\n<li><strong>上传限制：<\/strong> 每个视频最大 1 GB<\/li>\n<li><strong>每日存储需求：<\/strong> 150 TB<\/li>\n<li><strong>CDN 成本：<\/strong> 500 万 * 5 个视频 * 0.3GB * $0.02 = $150,000/天（使用 Amazon CloudFront）<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>组件<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/high-level-design.png\" alt=\"高层设计\" width=\"400\">\n<\/div>\n\n<ol>\n<li><strong>客户端（Client）：<\/strong> 智能手机、电脑和电视等设备。<\/li>\n<li><strong>CDN（内容分发网络）：<\/strong> 存储并流媒体传输视频。<\/li>\n<li><strong>API 服务器（API Servers）：<\/strong> 处理除视频流媒体传输之外的所有用户交互（例如上传、元数据更新）。<\/li>\n<li><strong>元数据数据库（Metadata Database）：<\/strong> 存储视频元数据（例如标题、描述、大小）。<\/li>\n<li><strong>原始存储（Original Storage）：<\/strong> 用于已上传视频的 blob 存储。<\/li>\n<li><strong>转码服务器（Transcoding Servers）：<\/strong> 将视频转换为多种分辨率和格式。<\/li>\n<li><strong>转码后存储（Transcoded Storage）：<\/strong> 用于转码后视频的 blob 存储。<\/li>\n<\/ol>\n<hr />\n<h3>核心工作流程<\/h3>\n<h4>1. 视频上传流程<\/h4>\n<ul>\n<li>\n<p><strong>并行流程：<\/strong>\n  1. 将视频上传到原始存储。\n  2. 在数据库中更新视频元数据。<\/p>\n<\/li>\n<li>\n<p><strong>视频上传（步骤）：<\/strong><\/p>\n<p><div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/video-uploading-flow.png\" alt=\"视频上传流程\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>[1] 视频被上传到 blob 存储。 <\/li>\n<li>[2] 转码服务器将视频转换为多种格式。<\/li>\n<li>[3] 一旦转码完成，以下两步并行执行。<ul>\n<li>[3a] 转码后的视频被发送到转码后存储。<\/li>\n<li>[3b] 转码完成事件被放入完成队列（completion queue）。 <\/li>\n<\/ul>\n<\/li>\n<li>[3a.1] 视频被分发到 CDN。 <\/li>\n<li>[3b.1] 完成处理器（completion handler）更新元数据并通知用户。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>元数据上传（步骤）：<\/strong><\/p>\n<p><div style=\"margin-left:3rem\">\n    <img src=\"14. Youtube/images/metadata-upload.png\" alt=\"元数据上传\" height=\"500\">\n<\/div><\/p>\n<ul>\n<li>客户端并行发送一个更新视频元数据的请求。 <\/li>\n<li>该请求包含视频元数据，包括文件名、大小、格式等。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>2. 视频流媒体播放流程<\/h4>\n<div style=\"margin-left: 3em;\">\n  <img src=\"14. Youtube/images/video-streaming-flow.png\" alt=\"视频流媒体播放流程\" height=\"400\">\n<\/div>\n\n<ul>\n<li>视频使用边缘服务器（edge server）直接从 CDN 流媒体传输，以最小化延迟。<\/li>\n<li>一些流行的流媒体协议有 MPEG-DASH、Apple HLS、Adobe HDS。<\/li>\n<li><em>不同的流媒体协议支持不同的视频编码和播放播放器。<\/em><\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3>视频转码<\/h3>\n<h4>重要性<\/h4>\n<ol>\n<li>原始视频占用大量存储空间。它可减少存储空间占用。<\/li>\n<li>确保跨设备和浏览器的兼容性。<\/li>\n<li>使视频画质能根据网络状况自适应。<\/li>\n<\/ol>\n<h4>组成<\/h4>\n<ul>\n<li><strong>容器（Container）：<\/strong> 封装视频、音频和元数据（例如 MP4、AVI）。<\/li>\n<li><strong>编解码器（Codecs）：<\/strong> 压缩与解压缩算法（例如 H.264、VP9）。<\/li>\n<\/ul>\n<h4>有向无环图（DAG）模型<\/h4>\n<div style=\"margin-left: 3em;\">\n    <img src=\"14. Youtube/images/dag-video-transcoding.png\" alt=\"DAG 视频转码\" width=\"600\">\n<\/div>\n\n<ul>\n<li>转码一段视频在计算上代价高昂且耗时。<\/li>\n<li>DAG 模型定义了诸如编码、缩略图生成和水印等任务。<\/li>\n<li>\n<p>允许视频处理高度并行。<\/p>\n<\/li>\n<li>\n<p>原始视频被拆分为视频、音频和元数据。 <\/p>\n<ul>\n<li>视频编码：视频被转换以支持不同的分辨率、编解码器和码率。<\/li>\n<li>缩略图：它既可以由用户上传，也可以由系统自动生成。<\/li>\n<li>水印：叠加在视频之上的图像，包含关于该视频的识别信息。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>视频转码架构<\/h3>\n<div style=\"margin-left: 3em;\">\n<img src=\"14. Youtube/images/video-transcoding-architecture.png\" alt=\"视频转码\" width=\"600\">\n<\/div>\n\n<ol>\n<li>\n<p><strong>预处理器（Preprocessor）：<\/strong> 将视频拆分为更小的数据块（按 GOP 对齐）。它有 4 项职责。<\/p>\n<p><div style=\"margin-left: 3em;\">\n    <img src=\"14. Youtube/images/dag-config.png\" alt=\"DAG 配置\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>视频切分：视频流被切分或进一步切分为更小的图像组（GOP，Group of Pictures）对齐单元。<\/li>\n<li>它按 GOP 对齐切分视频，以兼容旧客户端。<\/li>\n<li>它根据客户端程序员编写的配置文件生成 DAG。 <\/li>\n<li>它将 GOP 和元数据存储在临时存储中，以防编码失败时，系统可以使用已持久化的数据进行重试。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>DAG 调度器（DAG Scheduler）：<\/strong> 将任务组织成顺序或并行的阶段。\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/dag-scheduler.png\" alt=\"DAG 调度器\" width=\"500\">\n    <\/div><\/p>\n<ul>\n<li>它将一个 DAG 图拆分为若干任务阶段，并把它们放入资源管理器中的任务队列。 <\/li>\n<li>阶段 1：视频、音频和元数据。<\/li>\n<li>视频文件在阶段 2 中进一步拆分为两个任务：视频编码和缩略图。 <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>资源管理器（Resource Manager）：<\/strong> 负责管理资源分配的效率。它包含 3 个队列和一个任务调度器。\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/resource-manager.png\" alt=\"资源管理器\" width=\"700\">\n    <\/div><\/p>\n<ul>\n<li>任务队列：包含待执行任务的优先级队列。<\/li>\n<li>工作进程队列：包含工作进程利用率信息的优先级队列。<\/li>\n<li>运行队列：包含当前正在运行的任务以及运行这些任务的工作进程。<\/li>\n<li>任务调度器：挑选最优的任务/工作进程，并指示选中的工作进程执行该作业。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>任务工作进程（Task Workers）：<\/strong> 执行转码及其他操作。\n    <div style=\"margin-left: 3em;\">\n        <img src=\"14. Youtube/images/task-worker.png\" alt=\"任务工作进程\" width=\"250\">\n   <\/div><\/p>\n<ul>\n<li>不同的任务工作进程可能运行不同的任务。 <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>临时存储（Temporary Storage）：<\/strong> 存储用于重试的中间数据。<\/p>\n<ul>\n<li>存储系统的选择取决于数据类型、数据大小、访问频率、数据生命周期等因素。 <\/li>\n<\/ul>\n<\/li>\n<li><strong>输出（Output）：<\/strong> 可用于分发的转码后视频。<\/li>\n<\/ol>\n<hr />\n<h2>系统优化<\/h2>\n<h3>速度优化<\/h3>\n<ol>\n<li>\n<p><strong>并行视频上传：<\/strong> 将视频拆分为更小的数据块，以实现更快、可断点续传的上传。<\/p>\n<p><img src=\"14. Youtube/images/video-split.png\" alt=\"视频切分\" width=\"600\"><\/p>\n<\/li>\n<li>\n<p><strong>分布式上传中心：<\/strong> 将 CDN 用作靠近用户的上传枢纽。<\/p>\n<\/li>\n<li>\n<p><strong>并行处理：<\/strong> 使用消息队列解耦各模块，以实现高度并行。<\/p>\n<p><img src=\"14. Youtube/images/message-queue1.png\" alt=\"消息队列\" width=\"600\">\n<img src=\"14. Youtube/images/message-queue2.png\" alt=\"消息队列\" height=\"170\" width=\"500\"><\/p>\n<\/li>\n<\/ol>\n<h3>安全性优化<\/h3>\n<ol>\n<li>\n<p><strong>预签名 URL（Pre-Signed URLs）：<\/strong> 将视频上传限制为授权用户。<\/p>\n<p><img src=\"14. Youtube/images/pres-signed-urls.png\" alt=\"预签名 URL\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>保护视频：<\/strong>\n   - <strong>DRM 系统<\/strong>（例如 Apple FairPlay、Google Widevine）。\n   - <strong>AES 加密。<\/strong>\n   - <strong>水印。<\/strong><\/p>\n<\/li>\n<\/ol>\n<h3>成本节约优化<\/h3>\n<ol>\n<li>仅通过 CDN 分发热门视频；较冷门的视频从大容量服务器提供。<\/li>\n<li>对极少访问的视频按需编码。<\/li>\n<li>根据热度对视频分发进行区域化。<\/li>\n<li>自建 CDN 并与 ISP 合作，以降低带宽成本。<\/li>\n<\/ol>\n<hr />\n<h2>错误处理<\/h2>\n<h3>可恢复错误<\/h3>\n<ul>\n<li>重试失败的上传、转码或资源分配任务。<\/li>\n<\/ul>\n<h3>不可恢复错误<\/h3>\n<ul>\n<li>停止处理格式错误的视频，并返回错误码。<\/li>\n<\/ul>", "enTitle": "Chapter 14: Design YouTube", "zhTitle": "第 14 章：设计 YouTube", "short": "Youtube", "num": "14"}, "15. Google Drive": {"en": "\n<h2>Introduction<\/h2>\n<p>Google Drive is a cloud-based file storage and synchronization service that allows users to store, access, and share files from various devices. This chapter discusses designing a scalable system with the following features:\n- <strong>File Upload and Download<\/strong>\n- <strong>File Sync Across Devices<\/strong>\n- <strong>File Sharing<\/strong>\n- <strong>File Revision History<\/strong>\n- <strong>Notifications for Edits, Deletes, and Shares<\/strong><\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Key Requirements<\/h3>\n<h4>Functional Requirements:<\/h4>\n<ul>\n<li>Upload and download files.<\/li>\n<li>Sync files across multiple devices.<\/li>\n<li>Maintain file revisions.<\/li>\n<li>Enable file sharing with permissions.<\/li>\n<li>Send notifications on file edits, deletions, and shares.<\/li>\n<\/ul>\n<h4>Non-Functional Requirements:<\/h4>\n<ul>\n<li><strong>Reliability:<\/strong> Data loss is unacceptable.<\/li>\n<li><strong>Fast Sync Speed:<\/strong> Avoid user impatience with delayed syncing.<\/li>\n<li><strong>Bandwidth Efficiency:<\/strong> Minimize unnecessary data usage.<\/li>\n<li><strong>Scalability:<\/strong> Handle 10 million daily active users (DAU).<\/li>\n<li><strong>High Availability:<\/strong> Operate seamlessly during server failures or network issues.<\/li>\n<\/ul>\n<h3>Constraints and Assumptions<\/h3>\n<ul>\n<li>Users get <strong>10 GB free space<\/strong>.<\/li>\n<li>Maximum file size: <strong>10 GB<\/strong>.<\/li>\n<li>Average file upload size: <strong>500 KB<\/strong>.<\/li>\n<li>Upload frequency: <strong>2 files per day per user<\/strong>.<\/li>\n<li>Total storage required: <strong>500 PB<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Single-Server Setup<\/h3>\n<p>A basic setup includes:\n1. <strong>Web Server:<\/strong> Handles uploads and downloads.\n2. <strong>Metadata Database:<\/strong>  to keep track of metadata like user data, login info, files info/\n3. <strong>Storage Directory:<\/strong> Holds files organized by namespaces.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"15. Google Drive/images/namespaces.png\" alt=\"Namespaces\" width=\"400\" />\n<\/div>\n\n<ul>\n<li>A web server and a directory called drive/ is set up as the root directory to store uploaded files. <\/li>\n<li>Under drive/ directory, there is a list of directories called namespaces. <\/li>\n<li>Each namespace contains all the uploaded files for that user. <\/li>\n<li>Each file or folder can be uniquely identified by joining the namespace and the relative path.<\/li>\n<\/ul>\n<p>This design serves as a starting point but is inadequate for scaling.<\/p>\n<h4>APIs<\/h4>\n<ol>\n<li><strong>Upload a file to Google Drive:<\/strong> Two types of uploads are supported<ul>\n<li>Simple upload: Used when file size is small.<\/li>\n<li>Resumable upload: <ul>\n<li>Endpoint: https://api.example.com/files/upload?uploadType=resumable<\/li>\n<li>Send the initial request to retrieve the resumable URL.<\/li>\n<li>Upload the data and monitor upload state<\/li>\n<li>If upload is disturbed, resume the upload.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>Download a file from Google Drive:<\/strong> To download a file<ul>\n<li>Endpoint: https://api.example.com/files/download<\/li>\n<\/ul>\n<\/li>\n<li><strong>Get file revisions:<\/strong><ul>\n<li>Endpoint: https://api.example.com/files/list_revisions<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>Moving to Distributed Systems<\/h3>\n<h4>Improvements:<\/h4>\n<ol>\n<li><strong>Sharding:<\/strong> Split storage across servers based on <code>user_id<\/code>.<\/li>\n<li>\n<p><strong>Amazon S3:<\/strong> Use S3 for scalable and redundant file storage with cross-region replication.<\/p>\n<p><img src=\"15. Google Drive/images/replication.png\" alt=\"Replication\" width=\"600\" /><\/p>\n<\/li>\n<li>\n<p><strong>Load Balancer:<\/strong> Distribute traffic across multiple web servers.<\/p>\n<\/li>\n<li><strong>Metadata Database Replication:<\/strong> Ensure availability through database sharding and replication.<\/li>\n<\/ol>\n<h4>Sync Conflicts:<\/h4>\n<p>For a large storage system like Google Drive, sync conflicts happen from time to time.\nWhen two users modify the same file or folder at the same time, a conflict happens.<\/p>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/sync-conflicts.png\" alt=\"Sync Conflicts\" width=\"600\" />\n<\/div>\n\n<ul>\n<li>In the example user 1 and user 2 tries to update the same file at the same time, but user 1’s file is processed by our system first.<\/li>\n<li>User 1’s update operation goes through, but, user 2 gets a sync conflict. <\/li>\n<li>The system presents both copies of the same file: user 2’s local copy and the latest version from the server.<\/li>\n<li>User 2 has the option to merge both files or override one version with the other.<\/li>\n<\/ul>\n<h3>Improved design<\/h3>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/high-level-design.png\" alt=\"High Level Design\" width=\"500\" />\n<\/div>\n\n<ol>\n<li>\n<p><strong>User Interaction:<\/strong>: Users access the application via browser or mobile app.<\/p>\n<\/li>\n<li>\n<p><strong>Block Servers:<\/strong>\n   - Files are split into <strong>4 MB blocks<\/strong> (maximum size) and assigned unique hash values.\n   - Blocks are stored independently in cloud storage (e.g., Amazon S3).\n   - File reconstruction involves joining blocks in a specific order.<\/p>\n<\/li>\n<li>\n<p><strong>Cloud Storage:<\/strong> Blocks are stored in cloud storage for scalability and redundancy.<\/p>\n<\/li>\n<li>\n<p><strong>Cold Storage:<\/strong> Inactive files are moved to cold storage to reduce costs.<\/p>\n<\/li>\n<li>\n<p><strong>Load Balancer:<\/strong> Distributes requests evenly among API servers to ensure efficient operation.<\/p>\n<\/li>\n<li>\n<p><strong>API Servers:<\/strong>\n   - Handle user authentication, profile management, and file metadata updates.\n   - Manage all non-uploading workflows.<\/p>\n<\/li>\n<li>\n<p><strong>Metadata Database and Cache:<\/strong>\n   - Stores metadata for users, files, blocks, and versions.\n   - Frequently accessed metadata is cached for faster retrieval.<\/p>\n<\/li>\n<li>\n<p><strong>Notification Service:<\/strong>\n   - A <strong>publisher/subscriber system<\/strong> that notifies clients about file changes (add, edit, delete).\n   - Ensures clients can pull the latest updates.<\/p>\n<\/li>\n<li>\n<p><strong>Offline Backup Queue:<\/strong> Temporarily stores file change information for offline clients to sync when back online.<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Metadata Database<\/h3>\n<p>A highly simplified is shown below version as it only includes the most important tables and fields.<\/p>\n<h4>Schema Design:<\/h4>\n<ul>\n<li><strong>User Table:<\/strong> Stores user profiles and preferences.<\/li>\n<li><strong>File Table:<\/strong> Maintains file metadata (e.g., size, name, path).<\/li>\n<li><strong>Block Table:<\/strong> Tracks file blocks for reconstructing files.<\/li>\n<li><strong>File Version Table:<\/strong> Stores file revision history.<\/li>\n<\/ul>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/metadata-database.png\" alt=\"Metadata Database \" width=\"500\" />\n<\/div>\n\n<hr />\n<h3>File Upload Flow<\/h3>\n<ol>\n<li><strong>File Upload:<\/strong>\n   - File is split into blocks, compressed, and encrypted by the block server.\n   - Blocks are uploaded to block servers and stored in S3.<\/li>\n<li><strong>Metadata Upload:<\/strong>\n   - Client sends metadata to the API server.\n   - Metadata is stored in the database with status <code>pending<\/code>.<\/li>\n<li><strong>Completion:<\/strong>\n   - S3 triggers a callback to update the file status to <code>uploaded<\/code>.\n   - Notification service informs relevant users.<\/li>\n<\/ol>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/upload-flow.png\" alt=\"Upload Flow \" width=\"500\" />\n<\/div>\n\n<hr />\n<h3>File Sync<\/h3>\n<ol>\n<li>\n<p><strong>Delta Sync:<\/strong> Transfer only modified blocks instead of the entire file.<\/p>\n<p><div style=\"margin-left:2rem\">\n<img src=\"15. Google Drive/images/delta-sync.png\" alt=\"Delta Sync\" width=\"400\" />\n<\/div><\/p>\n<\/li>\n<li>\n<p><strong>Compression:<\/strong> Blocks are compressed using compression algorithms depending on file types. <\/p>\n<\/li>\n<li><strong>Conflict Resolution:<\/strong>\n   - First processed version wins.\n   - Conflicting versions are saved separately for user resolution.<\/li>\n<\/ol>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/file-sync.png\" alt=\"File Synce \" width=\"400\" />\n<\/div>\n\n<hr />\n<h3>File Download Flow<\/h3>\n<p>Download flow is triggered when a file is added or edited elsewhere. There are two ways a client can know:\n- If client A is online while a file is changed by another client, notification service will inform client A.\n- If client A is offline while a file is changed by another client, data will be saved to the cache. When the offline client is online again, it pulls the latest changes.<\/p>\n<p>Once a client knows a file is changed, it first requests metadata via API servers, then\ndownloads blocks to construct the file.<\/p>\n<ol>\n<li><strong>Trigger:<\/strong> Notification service informs the client of file updates.<\/li>\n<li><strong>Metadata Fetch:<\/strong> Client retrieves updated metadata via API.<\/li>\n<li><strong>Block Download:<\/strong> Client downloads updated blocks from block servers and reconstructs the file.<\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n<img src=\"15. Google Drive/images/download-flow.png\" alt=\"Upload Flow \" width=\"600\" />\n<\/div>\n\n<hr />\n<h3>Notification Service<\/h3>\n<ol>\n<li><strong>Purpose:<\/strong> Keeps clients updated about file changes.<\/li>\n<li><strong>Mechanism:<\/strong> Implements <strong>long polling<\/strong> for asynchronous notifications.<\/li>\n<li><strong>Example:<\/strong> When a file is added, edited, or deleted, notifications are pushed to all relevant clients.<\/li>\n<\/ol>\n<hr />\n<h3>Storage Optimization<\/h3>\n<ol>\n<li><strong>De-duplication:<\/strong> Remove duplicate blocks at the account level using hash-based comparisons.<\/li>\n<li><strong>Versioning Strategy:<\/strong>\n   - Limit the number of saved revisions.\n   - Prioritize recent versions for frequently edited files.<\/li>\n<li><strong>Cold Storage:<\/strong> Move rarely accessed files to cheaper storage solutions (e.g., Amazon S3 Glacier).<\/li>\n<\/ol>\n<hr />\n<h3>Failure Handling<\/h3>\n<ol>\n<li><strong>Load Balancer Failure:<\/strong> Secondary load balancer becomes active.<\/li>\n<li><strong>Block Server Failure:<\/strong> Pending tasks are reassigned to other servers.<\/li>\n<li><strong>Metadata Database Failure:<\/strong>\n   - Promote a slave node to master.\n   - Redirect traffic to remaining replicas.<\/li>\n<li><strong>Cloud Storage Failure:<\/strong> Use cross-region replication to fetch unavailable files.<\/li>\n<li><strong>Notification Service Failure:<\/strong> Clients reconnect to alternative servers.<\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p>Google Drive 是一项基于云的文件存储与同步服务，允许用户从各种设备存储、访问和共享文件。本章讨论如何设计一个可扩展的系统，它具备以下特性：\n- <strong>文件上传与下载<\/strong>\n- <strong>跨设备文件同步<\/strong>\n- <strong>文件共享<\/strong>\n- <strong>文件修订历史<\/strong>\n- <strong>编辑、删除和共享时的通知<\/strong><\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>关键需求<\/h3>\n<h4>功能需求：<\/h4>\n<ul>\n<li>上传和下载文件。<\/li>\n<li>在多台设备之间同步文件。<\/li>\n<li>维护文件修订版本。<\/li>\n<li>支持带权限的文件共享。<\/li>\n<li>在文件被编辑、删除和共享时发送通知。<\/li>\n<\/ul>\n<h4>非功能需求：<\/h4>\n<ul>\n<li><strong>可靠性：<\/strong> 数据丢失是不可接受的。<\/li>\n<li><strong>快速同步速度：<\/strong> 避免用户因同步延迟而失去耐心。<\/li>\n<li><strong>带宽效率：<\/strong> 尽量减少不必要的数据使用。<\/li>\n<li><strong>可扩展性：<\/strong> 应对 1000 万日活跃用户（DAU）。<\/li>\n<li><strong>高可用性：<\/strong> 在服务器故障或网络问题期间无缝运行。<\/li>\n<\/ul>\n<h3>约束与假设<\/h3>\n<ul>\n<li>用户获得 <strong>10 GB 免费空间<\/strong>。<\/li>\n<li>最大文件大小：<strong>10 GB<\/strong>。<\/li>\n<li>平均文件上传大小：<strong>500 KB<\/strong>。<\/li>\n<li>上传频率：<strong>每用户每天 2 个文件<\/strong>。<\/li>\n<li>所需总存储：<strong>500 PB<\/strong>。<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>单服务器设置<\/h3>\n<p>一个基础设置包括：\n1. <strong>Web 服务器（Web Server）：<\/strong> 处理上传和下载。\n2. <strong>元数据数据库（Metadata Database）：<\/strong> 跟踪用户数据、登录信息、文件信息等元数据。\n3. <strong>存储目录（Storage Directory）：<\/strong> 存放按命名空间（namespace）组织的文件。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"15. Google Drive/images/namespaces.png\" alt=\"命名空间\" width=\"400\" />\n<\/div>\n\n<ul>\n<li>设置一台 Web 服务器和一个名为 drive/ 的目录，作为存储已上传文件的根目录。 <\/li>\n<li>在 drive/ 目录下，有一系列名为命名空间（namespaces）的目录。 <\/li>\n<li>每个命名空间包含该用户上传的所有文件。 <\/li>\n<li>每个文件或文件夹都可以通过将命名空间与相对路径拼接起来而被唯一标识。<\/li>\n<\/ul>\n<p>该设计可作为一个起点，但不足以支撑扩展。<\/p>\n<h4>API 接口<\/h4>\n<ol>\n<li><strong>将文件上传到 Google Drive：<\/strong> 支持两种上传类型。<ul>\n<li>简单上传（Simple upload）：在文件较小时使用。<\/li>\n<li>可断点续传上传（Resumable upload）： <ul>\n<li>端点：https://api.example.com/files/upload?uploadType=resumable<\/li>\n<li>发送初始请求以获取可续传的 URL。<\/li>\n<li>上传数据并监控上传状态。<\/li>\n<li>如果上传被中断，则断点续传。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>从 Google Drive 下载文件：<\/strong> 下载一个文件时<ul>\n<li>端点：https://api.example.com/files/download<\/li>\n<\/ul>\n<\/li>\n<li><strong>获取文件修订版本：<\/strong><ul>\n<li>端点：https://api.example.com/files/list_revisions<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>转向分布式系统<\/h3>\n<h4>改进：<\/h4>\n<ol>\n<li><strong>分片（Sharding）：<\/strong> 基于 <code>user_id<\/code> 将存储拆分到多台服务器。<\/li>\n<li>\n<p><strong>Amazon S3：<\/strong> 使用 S3 实现可扩展、冗余的文件存储，并带跨区域复制。<\/p>\n<p><img src=\"15. Google Drive/images/replication.png\" alt=\"复制\" width=\"600\" /><\/p>\n<\/li>\n<li>\n<p><strong>负载均衡器：<\/strong> 将流量分发到多台 Web 服务器。<\/p>\n<\/li>\n<li><strong>元数据数据库复制：<\/strong> 通过数据库分片和复制确保可用性。<\/li>\n<\/ol>\n<h4>同步冲突（Sync Conflicts）：<\/h4>\n<p>对于像 Google Drive 这样的大型存储系统，同步冲突时有发生。\n当两个用户同时修改同一个文件或文件夹时，就会发生冲突。<\/p>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/sync-conflicts.png\" alt=\"同步冲突\" width=\"600\" />\n<\/div>\n\n<ul>\n<li>在本例中，用户 1 和用户 2 试图同时更新同一个文件，但用户 1 的文件先被我们的系统处理。<\/li>\n<li>用户 1 的更新操作通过了，但用户 2 遇到了同步冲突。 <\/li>\n<li>系统呈现同一个文件的两个副本：用户 2 的本地副本和来自服务器的最新版本。<\/li>\n<li>用户 2 可以选择合并这两个文件，或者用一个版本覆盖另一个版本。<\/li>\n<\/ul>\n<h3>改进后的设计<\/h3>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/high-level-design.png\" alt=\"高层设计\" width=\"500\" />\n<\/div>\n\n<ol>\n<li>\n<p><strong>用户交互：<\/strong> 用户通过浏览器或移动应用访问该应用。<\/p>\n<\/li>\n<li>\n<p><strong>块服务器（Block Servers）：<\/strong>\n   - 文件被拆分为 <strong>4 MB 的块（block）<\/strong>（最大尺寸），并被赋予唯一的哈希值。\n   - 块独立地存储在云存储中（例如 Amazon S3）。\n   - 文件重建涉及按特定顺序把各块拼接起来。<\/p>\n<\/li>\n<li>\n<p><strong>云存储（Cloud Storage）：<\/strong> 块存储在云存储中，以实现可扩展性和冗余。<\/p>\n<\/li>\n<li>\n<p><strong>冷存储（Cold Storage）：<\/strong> 不活跃的文件被移到冷存储以降低成本。<\/p>\n<\/li>\n<li>\n<p><strong>负载均衡器：<\/strong> 将请求均匀地分发到各 API 服务器，以确保高效运行。<\/p>\n<\/li>\n<li>\n<p><strong>API 服务器：<\/strong>\n   - 处理用户认证、资料管理和文件元数据更新。\n   - 管理所有非上传类工作流程。<\/p>\n<\/li>\n<li>\n<p><strong>元数据数据库与缓存：<\/strong>\n   - 存储用户、文件、块和版本的元数据。\n   - 频繁访问的元数据被缓存，以加快检索。<\/p>\n<\/li>\n<li>\n<p><strong>通知服务（Notification Service）：<\/strong>\n   - 一个<strong>发布/订阅系统（publisher/subscriber system）<\/strong>，就文件变更（添加、编辑、删除）通知客户端。\n   - 确保客户端能够拉取最新更新。<\/p>\n<\/li>\n<li>\n<p><strong>离线备份队列（Offline Backup Queue）：<\/strong> 临时存储文件变更信息，供离线客户端在重新上线时同步。<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3>元数据数据库<\/h3>\n<p>下面展示的是一个高度简化的版本，因为它只包含最重要的表和字段。<\/p>\n<h4>Schema 设计：<\/h4>\n<ul>\n<li><strong>用户表（User Table）：<\/strong> 存储用户资料和偏好设置。<\/li>\n<li><strong>文件表（File Table）：<\/strong> 维护文件元数据（例如大小、名称、路径）。<\/li>\n<li><strong>块表（Block Table）：<\/strong> 跟踪文件块，用于重建文件。<\/li>\n<li><strong>文件版本表（File Version Table）：<\/strong> 存储文件修订历史。<\/li>\n<\/ul>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/metadata-database.png\" alt=\"元数据数据库\" width=\"500\" />\n<\/div>\n\n<hr />\n<h3>文件上传流程<\/h3>\n<ol>\n<li><strong>文件上传：<\/strong>\n   - 文件被块服务器拆分为块、压缩并加密。\n   - 块被上传到块服务器，并存储在 S3 中。<\/li>\n<li><strong>元数据上传：<\/strong>\n   - 客户端向 API 服务器发送元数据。\n   - 元数据以 <code>pending<\/code> 状态存入数据库。<\/li>\n<li><strong>完成：<\/strong>\n   - S3 触发一个回调，将文件状态更新为 <code>uploaded<\/code>。\n   - 通知服务通知相关用户。<\/li>\n<\/ol>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/upload-flow.png\" alt=\"上传流程\" width=\"500\" />\n<\/div>\n\n<hr />\n<h3>文件同步<\/h3>\n<ol>\n<li>\n<p><strong>增量同步（Delta Sync）：<\/strong> 只传输被修改的块，而不是整个文件。<\/p>\n<p><div style=\"margin-left:2rem\">\n<img src=\"15. Google Drive/images/delta-sync.png\" alt=\"增量同步\" width=\"400\" />\n<\/div><\/p>\n<\/li>\n<li>\n<p><strong>压缩：<\/strong> 根据文件类型，使用压缩算法对块进行压缩。 <\/p>\n<\/li>\n<li><strong>冲突解决（Conflict Resolution）：<\/strong>\n   - 先处理的版本胜出。\n   - 冲突的版本被单独保存，供用户处理。<\/li>\n<\/ol>\n<div style=\"margin-left:5rem\">\n<img src=\"15. Google Drive/images/file-sync.png\" alt=\"文件同步\" width=\"400\" />\n<\/div>\n\n<hr />\n<h3>文件下载流程<\/h3>\n<p>当一个文件在别处被添加或编辑时，会触发下载流程。客户端有两种方式得知这一情况：\n- 如果客户端 A 在线，而另一个客户端修改了某个文件，通知服务会通知客户端 A。\n- 如果客户端 A 离线，而另一个客户端修改了某个文件，数据会被保存到缓存中。当该离线客户端重新上线时，它会拉取最新的变更。<\/p>\n<p>一旦客户端知道某个文件已被修改，它首先通过 API 服务器请求元数据，然后下载各块以构建该文件。<\/p>\n<ol>\n<li><strong>触发：<\/strong> 通知服务将文件更新告知客户端。<\/li>\n<li><strong>元数据获取：<\/strong> 客户端通过 API 检索更新后的元数据。<\/li>\n<li><strong>块下载：<\/strong> 客户端从块服务器下载更新后的块，并重建文件。<\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n<img src=\"15. Google Drive/images/download-flow.png\" alt=\"下载流程\" width=\"600\" />\n<\/div>\n\n<hr />\n<h3>通知服务<\/h3>\n<ol>\n<li><strong>目的：<\/strong> 让客户端随时了解文件变更。<\/li>\n<li><strong>机制：<\/strong> 实现<strong>长轮询（long polling）<\/strong>以进行异步通知。<\/li>\n<li><strong>示例：<\/strong> 当一个文件被添加、编辑或删除时，通知会被推送给所有相关客户端。<\/li>\n<\/ol>\n<hr />\n<h3>存储优化<\/h3>\n<ol>\n<li><strong>去重（De-duplication）：<\/strong> 使用基于哈希的比较，在账户级别移除重复的块。<\/li>\n<li><strong>版本策略：<\/strong>\n   - 限制保存的修订版本数量。\n   - 对频繁编辑的文件优先保留近期版本。<\/li>\n<li><strong>冷存储：<\/strong> 将极少访问的文件移到更廉价的存储方案中（例如 Amazon S3 Glacier）。<\/li>\n<\/ol>\n<hr />\n<h3>故障处理<\/h3>\n<ol>\n<li><strong>负载均衡器故障：<\/strong> 备用负载均衡器接管并转为活动状态。<\/li>\n<li><strong>块服务器故障：<\/strong> 待处理任务被重新分配到其他服务器。<\/li>\n<li><strong>元数据数据库故障：<\/strong>\n   - 将一个从节点（slave）提升为主节点（master）。\n   - 将流量重定向到剩余的副本。<\/li>\n<li><strong>云存储故障：<\/strong> 使用跨区域复制来获取不可用的文件。<\/li>\n<li><strong>通知服务故障：<\/strong> 客户端重连到备用服务器。<\/li>\n<\/ol>", "enTitle": "Chapter 15: Design Google Drive", "zhTitle": "第 15 章：设计 Google Drive", "short": "Google Drive", "num": "15"}, "16. Proximity Service": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>proximity service<\/strong> is designed to find nearby locations, such as restaurants, hotels, gas stations, and other businesses. This functionality is used in applications like <strong>Google Maps<\/strong> and <strong>Yelp<\/strong> to help users discover places within a defined radius.<\/p>\n<h2>Step 1: Understanding the Problem and Establishing Scope<\/h2>\n<h3><strong>Functional Requirements<\/strong><\/h3>\n<ol>\n<li><strong>Search for businesses<\/strong> based on user location (latitude, longitude) and search radius.<\/li>\n<li><strong>Allow business owners<\/strong> to add, update, or delete businesses (not real-time).<\/li>\n<li><strong>Provide detailed business information<\/strong> when requested.<\/li>\n<\/ol>\n<h3><strong>Non-Functional Requirements<\/strong><\/h3>\n<ul>\n<li><strong>Low latency<\/strong>: Users should get quick responses.<\/li>\n<li><strong>Data privacy<\/strong>: Compliance with GDPR and CCPA regulations.<\/li>\n<li><strong>High availability<\/strong>: Handle peak-hour spikes in busy locations.<\/li>\n<\/ul>\n<h3><strong>Back-of-the-Envelope Estimation<\/strong><\/h3>\n<ul>\n<li><strong>100 million daily active users<\/strong>.<\/li>\n<li><strong>200 million businesses<\/strong> in the system.<\/li>\n<li><strong>Search QPS Calculation<\/strong>:<\/li>\n<li>Users make <strong>5 searches per day<\/strong>.<\/li>\n<li><strong>Search QPS<\/strong> = (100M × 5) / 86,400 ≈ <strong>5,000 QPS<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3><strong>API Design<\/strong><\/h3>\n<h4><strong>Search Nearby Businesses<\/strong><\/h4>\n<p>GET /v1/search/nearby<\/p>\n<ul>\n<li><strong>Request Parameters<\/strong>:<\/li>\n<li><code>latitude<\/code>: User’s location latitude.<\/li>\n<li><code>longitude<\/code>: User’s location longitude.<\/li>\n<li><code>radius<\/code>: Search radius (default: 5000m).<\/li>\n<\/ul>\n<h4><strong>Business APIs<\/strong><\/h4>\n<table>\n<thead>\n<tr>\n<th>API Endpoint<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GET /v1/businesses/{id}<\/code><\/td>\n<td>Fetch detailed business info<\/td>\n<\/tr>\n<tr>\n<td><code>POST /v1/businesses<\/code><\/td>\n<td>Add a new business<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /v1/businesses/{id}<\/code><\/td>\n<td>Update business details<\/td>\n<\/tr>\n<tr>\n<td><code>DELETE /v1/businesses/{id}<\/code><\/td>\n<td>Remove a business from the system<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3><strong>Data Model<\/strong><\/h3>\n<ul>\n<li>Since the read volume is high because two features are very commonly used, a realtional database such as MySQL is a good fit.<\/li>\n<li>Search for nearby businesses<\/li>\n<li>View the detailed information of a business<\/li>\n<\/ul>\n<h3><strong>Data Schema<\/strong><\/h3>\n<ul>\n<li>Key Database tables are the business table and the geospatial index table<\/li>\n<li>The business table consists the detailed information about a business.<\/li>\n<\/ul>\n<h3><strong>High-Level System Architecture<\/strong><\/h3>\n<p>The system comprises of two parts: Location based service (LBS) and business related service.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/high-level-design.png\" alt=\"HLD\" width=\"400\" />\n<\/div>\n\n<ul>\n<li><strong>Location-Based Service (LBS)<\/strong>: <\/li>\n<li>Processes location-based search queries.<\/li>\n<li>Read-heavy service with no write requests.<\/li>\n<li>QPS is high especially during peak hours in dense areas and the system is stateless.<\/li>\n<li><strong>Business Service<\/strong>: Deals with two types of requests.<\/li>\n<li>Business owners create, update or delete businesses.<\/li>\n<li>Customers view detailed information about a business.<\/li>\n<li><strong>Load Balancer<\/strong>: Routes traffic to LBS and Business service.<\/li>\n<li><strong>Database Cluster<\/strong>: <\/li>\n<li>Uses <strong>primary-replica architecture<\/strong> for read-heavy workloads.<\/li>\n<li>There might be some discrepancy between data read b/w data read by LBS and data written by by primary database.<\/li>\n<li>This incosistency is not an issue beacuase the business information is not updated in real-time.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Algorithms for Fetching Nearby Businesses<\/h2>\n<h3><strong>Option 1: Two-Dimensional Search (Naive Approach)<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/2d-search.png\" alt=\"2D\" width=\"250\" />\n<\/div>\n\n<p>The most intuitive way is to draw a circle with pre-defined radius and find all the businesses within the circle.<\/p>\n<p><strong>SQL Query:<\/strong><\/p>\n<pre><code>SELECT business_id, latitude, longitude\nFROM business\nWHERE (latitude BETWEEN :lat - radius AND :lat + radius)\nAND (longitude BETWEEN :long - radius AND :long + radius);\n<\/code><\/pre>\n<p><strong>Problems:<\/strong>\n- <strong>Inefficient<\/strong>: Requires scanning the entire database.\n- <strong>Limited by one-dimensional indexes<\/strong> (latitude/longitude).<\/p>\n<p>A potiential improvement is to build index on logitude and latitude columns, alhtough this is slighlty better but still vry slow.<\/p>\n<h3>Better Approach<\/h3>\n<ul>\n<li>The problem with last approach is that the database index can only increase search speed in one dimension.<\/li>\n<li>An optimal apporach is to reprsent the two-dimensional data into one dimension using geospatial indexing.<\/li>\n<li>Hash: Even grid, Geo Hash<\/li>\n<li>Tree: Quadtree, Google S2, RTree<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geospatial-index-types.png\" alt=\"2D\" width=\"500\" />\n  <\/div>\n\n<h3><strong>Option 2: Evenly Divided Grid<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/even-grid.png\" alt=\"Even Grid\" width=\"400\" />\n  <\/div>\n\n<ul>\n<li><strong>Divides the world into fixed-size grids<\/strong>.<\/li>\n<li><strong>Issue<\/strong>: Uneven business distribution (high density in cities, sparse in rural areas).<\/li>\n<\/ul>\n<h3><strong>Option 3: Geohash<\/strong><\/h3>\n<ul>\n<li>Divide the planet into four quadrants along with the prime meridian and equator. And then divide each grid into four smaller grids. <\/li>\n<li>Each grids can be represented by altering b/w longitude and latitude bit.<\/li>\n<li>Repeat this subdivision<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geohash.png\" alt=\"Geohash\" width=\"300\" />\n    <img src=\"16. Proximity Service/images/geohash-1.png\" alt=\"Geohash\" width=\"285\" />\n  <\/div>\n\n<ul>\n<li><strong>Encodes latitude and longitude into a single alphanumeric string<\/strong>. It has 12 precisions (levels)<\/li>\n<li><strong>Hierarchical grid structure<\/strong> allows for efficient searching.<\/li>\n<li>\n<p>The right precision is chosen by using the minimal geohash length according to the table.\n<br />\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geohash-radius-mapping.png\" alt=\"Geohash Radius\" width=\"400\" />\n  <\/div><\/p>\n<\/li>\n<li>\n<p>Geohash guarantees that the longer a shared prefix is between two geohashes, the closer they are.<\/p>\n<\/li>\n<li>\n<p><strong>Challenges<\/strong>:\n<br />\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/boundary-issue.png\" alt=\"Boundary Issue\" width=\"300\" />\n  <\/div>\n<\/p>\n<\/li>\n<li>\n<p><strong>Boundary issues<\/strong> (businesses close to grid edges may get excluded).<\/p>\n<ul>\n<li>Two locations can be very close but have no shared prefix at all (can be on other side of equator)<\/li>\n<li>Two locations can have a long shared prefix but belong to different geohashes.<\/li>\n<\/ul>\n<\/li>\n<li>Solution: Need to search neighboring grids.<\/li>\n<\/ul>\n<h3><strong>Option 4: Quadtree<\/strong><\/h3>\n<p>A quadtree is a tree data structure that recursively divides a two-dimensional space into four quadrants, with each internal node having exactly four children, representing the four sub-regions of the space.\n  - The quadtree is an in-memory data structure and it runs on each LBS server and built on server startup time.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/quadtree.png\" alt=\"Quadtree\" width=\"500\" />\n  <\/div>\n\n<ul>\n<li>The root node is recursively broken down into 4 quadrants until no nodes are left with more than x number of businesses (100 in this case).<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/building-quadtree.png\" alt=\"Building Quadtree\" width=\"500\" />\n  <\/div>\n\n<ul>\n<li>The quadtree index doen't take too much memory (typically in GBs) and can easily fit in one server.<\/li>\n<li>Since tge time complexity to build the tree is nlogn, it might take a few minutes to build the tree.<\/li>\n<li><strong>Efficient for k-nearest search queries<\/strong> (e.g., find the closest gas station).<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/realworld-quadtree.png\" alt=\"Real World Quadtree\" width=\"400\" />\n  <\/div>\n\n<h4>Operational considerations<\/h4>\n<ul>\n<li>For around 200 million businesses, it might take few minutes to build a quadtree at the server start time.<\/li>\n<li>While the quadtree is built it cannot serve traffic, therefore a new release should be rolled out incrementally to a subset of servers.<\/li>\n<li>When updating a business or adding a new the easiest approach is to incrementally rebuild the quadtree. (Leading to a lot of cache invalidation)<\/li>\n<li>Also possible to update the quadtree on the fly but more complex to implement. (Needs locking mechanism)<\/li>\n<\/ul>\n<h3><strong>Option 5: Google S2<\/strong><\/h3>\n<p>It maps a sphere to a !D index based on Hilbert curve.Two points that are close to each other on the Hilbert curve are close in 1D space.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/hilbert-curve.png\" alt=\"Hilbert curve\" width=\"300\" />\n    <img src=\"16. Proximity Service/images/geofence.png\" alt=\"Geofence\" width=\"355\" />\n  <\/div>\n\n<ul>\n<li><strong>Divides the earth into small cells using a Hilbert curve<\/strong>.<\/li>\n<li>Great for geofencing becuase it can cover arbitrary areas with varying levels.<\/li>\n<li>Geofencing also allows to define parameters that surround the area of interest.<\/li>\n<li>Aother advantage if instead of having a fixed level of precision, we can specify min,max level and max cells in S2.<\/li>\n<\/ul>\n<h2>Tradeoff Comparison<\/h2>\n<h4>Geohash<\/h4>\n<ul>\n<li>Easy to use and implement- No need to build/rebuild a tree<\/li>\n<li>Supports fixed radius results<\/li>\n<li>Updating the index is easy.<\/li>\n<li>Cannot dynamically adjust the grid size based on population density.<\/li>\n<\/ul>\n<h4>Quadtree<\/h4>\n<ul>\n<li>Slightly harder to implement.<\/li>\n<li>Supports fetching k-nearest businesses.<\/li>\n<li>Can dynamically adjust the grid size based on population desnsity.<\/li>\n<li>Updating the index is more complicated as might need to rebuild the whole tree.<\/li>\n<\/ul>\n<hr />\n<h2>Step 4: Scaling the Database and Caching Strategy<\/h2>\n<h3><strong>Scaling the Business Table<\/strong><\/h3>\n<ul>\n<li><strong>Sharding by business ID<\/strong> ensures even data distribution.<\/li>\n<li>We have separate rows for each business in the table.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Geohash<\/th>\n<th>Business ID<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>9q9hvu<\/td>\n<td>343<\/td>\n<\/tr>\n<tr>\n<td>9q9hvu<\/td>\n<td>347<\/td>\n<\/tr>\n<tr>\n<td>9q9hvu<\/td>\n<td>112<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3><strong>Scaling the Geospatial Index<\/strong><\/h3>\n<ul>\n<li>Might not be a good fit for the geohash table. In this case everything can fit in a single server so there's no tehcnical reason for sharding.<\/li>\n<li>A better approach is to have read-replicas to help with read loads.<\/li>\n<\/ul>\n<hr />\n<h3><strong>Cache Strategy<\/strong><\/h3>\n<p>The most obvious cache key choice is the location coordinate, however it has a few issues:\n - Location coordinates from gps are not accurate.\n - A user can move casuing the location coordinate to change.\n - A better key is the geohash.<\/p>\n<table>\n<thead>\n<tr>\n<th>Cache Key<\/th>\n<th>Cache Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>geohash<\/code><\/td>\n<td>List of business IDs in that grid<\/td>\n<\/tr>\n<tr>\n<td><code>business_id<\/code><\/td>\n<td>Business details (name, address, reviews, etc.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Step 5: Deployment Strategy and Final Architecture<\/h2>\n<h3><strong>Region and Availability Zones<\/strong><\/h3>\n<ul>\n<li>Deploy LBS and Business Service <strong>across multiple regions<\/strong>.<\/li>\n<\/ul>\n<h3><strong>Handling Real-Time Updates<\/strong><\/h3>\n<ul>\n<li><strong>Business updates are batch processed daily<\/strong>.<\/li>\n<\/ul>\n<h3><strong>Final System Architecture<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/final-design.png\" alt=\"Final Design\" width=\"500\" />\n  <\/div>\n\n<p>This final algorithm looks like this:<\/p>\n<h2>Steps to Retrieve Nearby Businesses<\/h2>\n<ol>\n<li>\n<p><strong>User Request:<\/strong><br />\n   - A user searches for restaurants within <strong>500 meters<\/strong>.<br />\n   - The client sends <strong>latitude (37.776720), longitude (-122.416730), and radius (500m)<\/strong> to the <strong>load balancer<\/strong>.<\/p>\n<\/li>\n<li>\n<p><strong>Request Forwarding:<\/strong><br />\n   - The <strong>load balancer (LB)<\/strong> forwards the request to the <strong>Location-Based Service (LBS)<\/strong>.<\/p>\n<\/li>\n<li>\n<p><strong>Geohash Calculation:<\/strong><br />\n   - LBS determines the <strong>geohash length<\/strong> matching the radius.<br />\n   - Using a reference table, <strong>500m corresponds to geohash length = 6<\/strong>.<\/p>\n<\/li>\n<li>\n<p><strong>Fetching Neighboring Geohashes:<\/strong><br />\n   - LBS calculates <strong>neighboring geohashes<\/strong> to include nearby areas.<br />\n   - The result is a list:<br />\n<code>[my_geohash, neighbor1_geohash, neighbor2_geohash, ..., neighbor8_geohash]<\/code><\/p>\n<\/li>\n<li>\n<p><strong>Fetching Business IDs from Redis:<\/strong><br />\n   - For each geohash in the list, LBS queries the <strong>Geohash Redis server<\/strong> to fetch <strong>business IDs<\/strong>.<br />\n   - Parallel queries are used to minimize latency.<\/p>\n<\/li>\n<li>\n<p><strong>Retrieving &amp; Ranking Businesses:<\/strong><br />\n   - LBS fetches <strong>full business details<\/strong> from the <strong>Business Info Redis server<\/strong>.<br />\n   - Businesses are <strong>sorted by distance<\/strong> from the user’s location.<br />\n   - The <strong>ranked results<\/strong> are sent back to the client.<\/p>\n<\/li>\n<\/ol>\n<h2>Key Optimizations<\/h2>\n<ul>\n<li><strong>Parallel Redis Calls<\/strong>: Reduces response time.  <\/li>\n<li><strong>Geohash Indexing<\/strong>: Ensures efficient spatial queries.  <\/li>\n<li><strong>Caching<\/strong>: Speeds up lookup and retrieval of business data.  <\/li>\n<\/ul>\n<p>This method ensures <strong>low-latency, scalable<\/strong> retrieval of businesses near a user’s location.<\/p>\n<hr />\n<h3><strong>Choosing the Best Indexing Method<\/strong><\/h3>\n<table>\n<thead>\n<tr>\n<th>Indexing Method<\/th>\n<th>Pros<\/th>\n<th>Cons<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Geohash<\/strong><\/td>\n<td>Easy to implement, efficient for proximity search<\/td>\n<td>Boundary issues, fixed grid size<\/td>\n<\/tr>\n<tr>\n<td><strong>Quadtree<\/strong><\/td>\n<td>Dynamically adjusts to density, supports k-nearest queries<\/td>\n<td>More complex, requires tree rebalancing<\/td>\n<\/tr>\n<tr>\n<td><strong>Google S2<\/strong><\/td>\n<td>Advanced geofencing, used in Google Maps<\/td>\n<td>Harder to implement<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>References<\/h2>\n<ol>\n<li><a href=\"https://www.movable-type.co.uk/scripts/geohash.html\">Geohash Algorithm<\/a><\/li>\n<li><a href=\"https://en.wikipedia.org/wiki/Quadtree\">Quadtree Indexing<\/a><\/li>\n<li><a href=\"https://s2geometry.io/\">Google S2 Geometry<\/a><\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p><strong>邻近服务（proximity service）<\/strong> 用于查找附近的地点，例如餐厅、酒店、加油站和其他商户。这项功能被用于 <strong>Google Maps<\/strong> 和 <strong>Yelp<\/strong> 等应用中，帮助用户发现指定半径范围内的地点。<\/p>\n<h2>第 1 步：理解问题并确定范围<\/h2>\n<h3><strong>功能需求<\/strong><\/h3>\n<ol>\n<li>根据用户位置（纬度、经度）和搜索半径<strong>搜索商户<\/strong>。<\/li>\n<li><strong>允许商户所有者<\/strong>添加、更新或删除商户（非实时）。<\/li>\n<li>在被请求时<strong>提供详细的商户信息<\/strong>。<\/li>\n<\/ol>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li><strong>低延迟<\/strong>：用户应能获得快速响应。<\/li>\n<li><strong>数据隐私<\/strong>：符合 GDPR 和 CCPA 法规。<\/li>\n<li><strong>高可用性<\/strong>：应对繁忙地段高峰时段的流量尖峰。<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-Envelope Estimation）<\/strong><\/h3>\n<ul>\n<li><strong>1 亿日活跃用户<\/strong>。<\/li>\n<li>系统中有 <strong>2 亿个商户<\/strong>。<\/li>\n<li><strong>搜索 QPS 计算<\/strong>：<\/li>\n<li>用户每天进行 <strong>5 次搜索<\/strong>。<\/li>\n<li><strong>搜索 QPS<\/strong> = (100M × 5) / 86,400 ≈ <strong>5,000 QPS<\/strong>。<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3><strong>API 设计<\/strong><\/h3>\n<h4><strong>搜索附近的商户<\/strong><\/h4>\n<p>GET /v1/search/nearby<\/p>\n<ul>\n<li><strong>请求参数<\/strong>：<\/li>\n<li><code>latitude<\/code>：用户位置纬度。<\/li>\n<li><code>longitude<\/code>：用户位置经度。<\/li>\n<li><code>radius<\/code>：搜索半径（默认值：5000m）。<\/li>\n<\/ul>\n<h4><strong>商户 API<\/strong><\/h4>\n<table>\n<thead>\n<tr>\n<th>API 端点<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GET /v1/businesses/{id}<\/code><\/td>\n<td>获取商户详细信息<\/td>\n<\/tr>\n<tr>\n<td><code>POST /v1/businesses<\/code><\/td>\n<td>添加一个新商户<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /v1/businesses/{id}<\/code><\/td>\n<td>更新商户详情<\/td>\n<\/tr>\n<tr>\n<td><code>DELETE /v1/businesses/{id}<\/code><\/td>\n<td>从系统中移除一个商户<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3><strong>数据模型<\/strong><\/h3>\n<ul>\n<li>由于有两个功能被非常频繁地使用，读量很大，因此像 MySQL 这样的关系型数据库是一个不错的选择。<\/li>\n<li>搜索附近的商户<\/li>\n<li>查看某个商户的详细信息<\/li>\n<\/ul>\n<h3><strong>数据 Schema<\/strong><\/h3>\n<ul>\n<li>关键的数据库表是商户表（business table）和地理空间索引表（geospatial index table）。<\/li>\n<li>商户表包含关于某个商户的详细信息。<\/li>\n<\/ul>\n<h3><strong>高层系统架构<\/strong><\/h3>\n<p>该系统由两部分组成：基于位置的服务（LBS，Location Based Service）和商户相关服务。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/high-level-design.png\" alt=\"高层设计\" width=\"400\" />\n<\/div>\n\n<ul>\n<li><strong>基于位置的服务（LBS）<\/strong>： <\/li>\n<li>处理基于位置的搜索查询。<\/li>\n<li>一个读多写少（read-heavy）的服务，没有写请求。<\/li>\n<li>QPS 很高，尤其是在密集地段的高峰时段，并且该系统是无状态的。<\/li>\n<li><strong>商户服务（Business Service）<\/strong>：处理两类请求。<\/li>\n<li>商户所有者创建、更新或删除商户。<\/li>\n<li>顾客查看某个商户的详细信息。<\/li>\n<li><strong>负载均衡器：<\/strong> 将流量路由到 LBS 和商户服务。<\/li>\n<li><strong>数据库集群：<\/strong> <\/li>\n<li>对读多写少的工作负载使用<strong>主-副本架构（primary-replica architecture）<\/strong>。<\/li>\n<li>LBS 读取的数据与主数据库写入的数据之间可能存在一些差异。<\/li>\n<li>这种不一致不是问题，因为商户信息并不是实时更新的。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：获取附近商户的算法<\/h2>\n<h3><strong>方案 1：二维搜索（朴素方法）<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/2d-search.png\" alt=\"二维搜索\" width=\"250\" />\n<\/div>\n\n<p>最直观的方法是画一个具有预定义半径的圆，找出圆内的所有商户。<\/p>\n<p><strong>SQL 查询：<\/strong><\/p>\n<pre><code>SELECT business_id, latitude, longitude\nFROM business\nWHERE (latitude BETWEEN :lat - radius AND :lat + radius)\nAND (longitude BETWEEN :long - radius AND :long + radius);\n<\/code><\/pre>\n<p><strong>问题：<\/strong>\n- <strong>效率低<\/strong>：需要扫描整个数据库。\n- <strong>受限于一维索引<\/strong>（纬度/经度）。<\/p>\n<p>一个可能的改进是在经度和纬度列上建立索引，尽管这稍微好一点，但仍然非常慢。<\/p>\n<h3>更好的方法<\/h3>\n<ul>\n<li>上一种方法的问题在于，数据库索引只能提高一个维度上的搜索速度。<\/li>\n<li>一种最优的方法是使用地理空间索引，将二维数据表示为一维。<\/li>\n<li>哈希（Hash）：均匀网格（Even grid）、地理哈希（Geo Hash）<\/li>\n<li>树（Tree）：四叉树（Quadtree）、Google S2、R 树（RTree）<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geospatial-index-types.png\" alt=\"地理空间索引类型\" width=\"500\" />\n  <\/div>\n\n<h3><strong>方案 2：均匀划分的网格<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/even-grid.png\" alt=\"均匀网格\" width=\"400\" />\n  <\/div>\n\n<ul>\n<li><strong>将世界划分为固定大小的网格<\/strong>。<\/li>\n<li><strong>问题<\/strong>：商户分布不均匀（城市密度高，农村地区稀疏）。<\/li>\n<\/ul>\n<h3><strong>方案 3：地理哈希（Geohash）<\/strong><\/h3>\n<ul>\n<li>沿本初子午线和赤道将地球划分为四个象限。然后将每个网格再划分为四个更小的网格。 <\/li>\n<li>每个网格可以通过在经度位和纬度位之间交替来表示。<\/li>\n<li>重复这种细分。<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geohash.png\" alt=\"地理哈希\" width=\"300\" />\n    <img src=\"16. Proximity Service/images/geohash-1.png\" alt=\"地理哈希\" width=\"285\" />\n  <\/div>\n\n<ul>\n<li><strong>将纬度和经度编码为单个字母数字字符串<\/strong>。它有 12 个精度（层级）。<\/li>\n<li><strong>分层的网格结构<\/strong>允许高效搜索。<\/li>\n<li>\n<p>根据对照表，使用最小的地理哈希长度来选择合适的精度。\n<br />\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/geohash-radius-mapping.png\" alt=\"地理哈希半径对照\" width=\"400\" />\n  <\/div><\/p>\n<\/li>\n<li>\n<p>地理哈希保证：两个地理哈希之间共享的前缀越长，它们在地理位置上就越近。<\/p>\n<\/li>\n<li>\n<p><strong>挑战<\/strong>：\n<br />\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/boundary-issue.png\" alt=\"边界问题\" width=\"300\" />\n  <\/div>\n<\/p>\n<\/li>\n<li>\n<p><strong>边界问题<\/strong>（靠近网格边缘的商户可能被排除在外）。<\/p>\n<ul>\n<li>两个地点可能非常近，但完全没有共享前缀（可能在赤道的另一侧）。<\/li>\n<li>两个地点可能有很长的共享前缀，却属于不同的地理哈希。<\/li>\n<\/ul>\n<\/li>\n<li>解决方案：需要搜索相邻的网格。<\/li>\n<\/ul>\n<h3><strong>方案 4：四叉树（Quadtree）<\/strong><\/h3>\n<p>四叉树是一种树状数据结构，它递归地将二维空间划分为四个象限，每个内部节点恰好有四个子节点，表示该空间的四个子区域。\n  - 四叉树是一种内存中的数据结构，它运行在每台 LBS 服务器上，并在服务器启动时构建。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/quadtree.png\" alt=\"四叉树\" width=\"500\" />\n  <\/div>\n\n<ul>\n<li>根节点被递归地分解为 4 个象限，直到没有哪个节点包含超过 x 个商户为止（本例中为 100 个）。<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/building-quadtree.png\" alt=\"构建四叉树\" width=\"500\" />\n  <\/div>\n\n<ul>\n<li>四叉树索引占用的内存不多（通常以 GB 计），可以轻松放进一台服务器。<\/li>\n<li>由于构建该树的时间复杂度为 nlogn，构建这棵树可能需要几分钟。<\/li>\n<li><strong>对 k 近邻搜索查询很高效<\/strong>（例如，找到最近的加油站）。<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/realworld-quadtree.png\" alt=\"真实世界的四叉树\" width=\"400\" />\n  <\/div>\n\n<h4>运维考量<\/h4>\n<ul>\n<li>对于大约 2 亿个商户，在服务器启动时构建一棵四叉树可能需要几分钟。<\/li>\n<li>在四叉树构建期间，它无法对外提供流量，因此新版本应该增量地发布到一部分服务器上。<\/li>\n<li>更新一个商户或新增一个商户时，最简单的方法是增量地重建四叉树。（这会导致大量缓存失效。）<\/li>\n<li>也可以动态地更新四叉树，但实现起来更复杂。（需要锁机制。）<\/li>\n<\/ul>\n<h3><strong>方案 5：Google S2<\/strong><\/h3>\n<p>它基于希尔伯特曲线（Hilbert curve）将球面映射为一维索引。在希尔伯特曲线上相互靠近的两个点，在一维空间中也是靠近的。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/hilbert-curve.png\" alt=\"希尔伯特曲线\" width=\"300\" />\n    <img src=\"16. Proximity Service/images/geofence.png\" alt=\"地理围栏\" width=\"355\" />\n  <\/div>\n\n<ul>\n<li><strong>使用希尔伯特曲线将地球划分为小单元格（cell）<\/strong>。<\/li>\n<li>非常适合地理围栏（geofencing），因为它可以用不同层级覆盖任意区域。<\/li>\n<li>地理围栏还允许围绕感兴趣的区域定义参数。<\/li>\n<li>另一个优势是，在 S2 中我们可以指定最小、最大层级和最大单元格数，而不必使用固定的精度层级。<\/li>\n<\/ul>\n<h2>权衡对比<\/h2>\n<h4>地理哈希（Geohash）<\/h4>\n<ul>\n<li>易于使用和实现——无需构建/重建树。<\/li>\n<li>支持固定半径的结果。<\/li>\n<li>更新索引很容易。<\/li>\n<li>无法根据人口密度动态调整网格大小。<\/li>\n<\/ul>\n<h4>四叉树（Quadtree）<\/h4>\n<ul>\n<li>实现起来稍难。<\/li>\n<li>支持获取 k 近邻商户。<\/li>\n<li>可以根据人口密度动态调整网格大小。<\/li>\n<li>更新索引更复杂，因为可能需要重建整棵树。<\/li>\n<\/ul>\n<hr />\n<h2>第 4 步：扩展数据库与缓存策略<\/h2>\n<h3><strong>扩展商户表<\/strong><\/h3>\n<ul>\n<li><strong>按商户 ID 分片<\/strong>确保数据均匀分布。<\/li>\n<li>表中每个商户都有单独的行。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>地理哈希<\/th>\n<th>商户 ID<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>9q9hvu<\/td>\n<td>343<\/td>\n<\/tr>\n<tr>\n<td>9q9hvu<\/td>\n<td>347<\/td>\n<\/tr>\n<tr>\n<td>9q9hvu<\/td>\n<td>112<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3><strong>扩展地理空间索引<\/strong><\/h3>\n<ul>\n<li>地理哈希表可能不太适合分片。在本例中，所有数据都能放进单台服务器，因此没有技术上的分片理由。<\/li>\n<li>更好的做法是使用读副本（read-replica）来分担读负载。<\/li>\n<\/ul>\n<hr />\n<h3><strong>缓存策略<\/strong><\/h3>\n<p>最显而易见的缓存键选择是位置坐标，然而它有几个问题：\n - GPS 给出的位置坐标并不准确。\n - 用户可能移动，导致位置坐标发生变化。\n - 更好的键是地理哈希。<\/p>\n<table>\n<thead>\n<tr>\n<th>缓存键<\/th>\n<th>缓存值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>geohash<\/code><\/td>\n<td>该网格内的商户 ID 列表<\/td>\n<\/tr>\n<tr>\n<td><code>business_id<\/code><\/td>\n<td>商户详情（名称、地址、评价等）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>第 5 步：部署策略与最终架构<\/h2>\n<h3><strong>区域与可用区<\/strong><\/h3>\n<ul>\n<li><strong>跨多个区域<\/strong>部署 LBS 和商户服务。<\/li>\n<\/ul>\n<h3><strong>处理实时更新<\/strong><\/h3>\n<ul>\n<li><strong>商户更新按天批量处理<\/strong>。<\/li>\n<\/ul>\n<h3><strong>最终系统架构<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"16. Proximity Service/images/final-design.png\" alt=\"最终设计\" width=\"500\" />\n  <\/div>\n\n<p>这个最终算法的工作过程如下：<\/p>\n<h2>检索附近商户的步骤<\/h2>\n<ol>\n<li>\n<p><strong>用户请求：<\/strong><br />\n   - 用户搜索 <strong>500 米<\/strong>范围内的餐厅。<br />\n   - 客户端将<strong>纬度（37.776720）、经度（-122.416730）和半径（500m）<\/strong>发送给<strong>负载均衡器<\/strong>。<\/p>\n<\/li>\n<li>\n<p><strong>请求转发：<\/strong><br />\n   - <strong>负载均衡器（LB）<\/strong> 将请求转发给<strong>基于位置的服务（LBS）<\/strong>。<\/p>\n<\/li>\n<li>\n<p><strong>地理哈希计算：<\/strong><br />\n   - LBS 确定与半径匹配的<strong>地理哈希长度<\/strong>。<br />\n   - 通过一张对照表，<strong>500m 对应地理哈希长度 = 6<\/strong>。<\/p>\n<\/li>\n<li>\n<p><strong>获取相邻地理哈希：<\/strong><br />\n   - LBS 计算<strong>相邻的地理哈希<\/strong>，以涵盖周边区域。<br />\n   - 结果是一个列表：<br />\n<code>[my_geohash, neighbor1_geohash, neighbor2_geohash, ..., neighbor8_geohash]<\/code><\/p>\n<\/li>\n<li>\n<p><strong>从 Redis 获取商户 ID：<\/strong><br />\n   - 对于列表中的每个地理哈希，LBS 查询<strong>地理哈希 Redis 服务器<\/strong>以获取<strong>商户 ID<\/strong>。<br />\n   - 使用并行查询以最小化延迟。<\/p>\n<\/li>\n<li>\n<p><strong>检索与排序商户：<\/strong><br />\n   - LBS 从<strong>商户信息 Redis 服务器<\/strong>获取<strong>完整的商户详情<\/strong>。<br />\n   - 商户按与用户位置的<strong>距离排序<\/strong>。<br />\n   - <strong>排序后的结果<\/strong>被发回给客户端。<\/p>\n<\/li>\n<\/ol>\n<h2>关键优化<\/h2>\n<ul>\n<li><strong>并行 Redis 调用<\/strong>：减少响应时间。  <\/li>\n<li><strong>地理哈希索引<\/strong>：确保高效的空间查询。  <\/li>\n<li><strong>缓存<\/strong>：加快商户数据的查找和检索。<\/li>\n<\/ul>\n<p>这种方法确保了对用户位置附近商户的<strong>低延迟、可扩展<\/strong>检索。<\/p>\n<hr />\n<h3><strong>选择最佳的索引方法<\/strong><\/h3>\n<table>\n<thead>\n<tr>\n<th>索引方法<\/th>\n<th>优点<\/th>\n<th>缺点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>地理哈希（Geohash）<\/strong><\/td>\n<td>易于实现，邻近搜索高效<\/td>\n<td>边界问题，网格大小固定<\/td>\n<\/tr>\n<tr>\n<td><strong>四叉树（Quadtree）<\/strong><\/td>\n<td>可根据密度动态调整，支持 k 近邻查询<\/td>\n<td>更复杂，需要重新平衡树<\/td>\n<\/tr>\n<tr>\n<td><strong>Google S2<\/strong><\/td>\n<td>高级地理围栏，用于 Google Maps<\/td>\n<td>实现难度更高<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>参考资料<\/h2>\n<ol>\n<li><a href=\"https://www.movable-type.co.uk/scripts/geohash.html\">地理哈希算法（Geohash Algorithm）<\/a><\/li>\n<li><a href=\"https://en.wikipedia.org/wiki/Quadtree\">四叉树索引（Quadtree Indexing）<\/a><\/li>\n<li><a href=\"https://s2geometry.io/\">Google S2 几何库（Google S2 Geometry）<\/a><\/li>\n<\/ol>", "enTitle": "Chapter 16: Proximity Service", "zhTitle": "第 16 章：邻近服务（Proximity Service）", "short": "Proximity Service", "num": "16"}, "17. Nearby Friends": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter focuses on designing a scalable backend for an application which enables user to share their location and discover friends who are <strong>nearby<\/strong>.<\/p>\n<p>The major difference with the proximity chapter is that in this problem, <strong>locations constantly change<\/strong>, whereas in that one, business addresses more or less stay the same.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<p>Some questions to drive the interview:\n * C: How geographically close is considered to be \"nearby\"?\n * I: 5 miles, this number should be configurable\n * C: Is distance calculated as straight-line distance vs. taking into consideration eg a river in-between friends\n * I: Yes, that is a reasonable assumption\n * C: How many users does the app have?\n * I: 1bil users and 10% of them use the nearby friends feature\n * C: Do we need to store location history?\n * I: Yes, it can be valuable for eg machine learning\n * C: Can we assume inactive friends will disappear from the feature in 10min\n * I: Yes\n * C: Do we need to worry about GDPR, etc?\n * I: No, for simlicity's sake<\/p>\n<h3><strong>Functional requirements<\/strong><\/h3>\n<ul>\n<li>Users should be able to see nearby friends on their mobile app. Each friend has a distance and timestamp, indicating when the location was updated<\/li>\n<li>Nearby friends list should be updated every few seconds<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>Low latency<\/strong>: it's important to receive location updates without too much delay<\/li>\n<li><strong>Reliability<\/strong>: Occassional data point loss is acceptable, but system should be generally available<\/li>\n<li><strong>Eventual consistency<\/strong>: Location data store doesn't need strong consistency. Few seconds delay in receiving location data in different replicas is acceptable<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope<\/strong><\/h3>\n<p>Some estimations to determine potential scale:\n * Nearby friends are friends within 5mile radius\n * Location refresh interval is 30s. Human walking speed is slow, hence, no need to update location too frequently.\n * On average, 100mil users use the feature every day \\w 10% concurrent users, ie 10mil\n * On average, a user has 400 friends, all of them use the nearby friends feature\n * App displays 20 nearby friends per page\n * <strong>Location Update QPS<\/strong> = 10mil / 30 == ~334k updates per second<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>Before exploring API and data model design, we'll study the communication protocol we'll use as it's less ubiquitous than traditional request-response communication model.<\/p>\n<h3><strong>High-level design<\/strong><\/h3>\n<p>At a high-level we'd want to establish effective message passing between peers. This can be done via a peer-to-peer protocol, but that'
