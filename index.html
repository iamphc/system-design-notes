mirroring<\/a> as a work around.<\/p>\n<p>How do we handle redistribution of replicas when a new broker is added?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/broker-replica-redistribution.png\" alt=\"broker-replica-redistribution\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>We can temporarily allow more replicas than configured, until new broker catches up<\/li>\n<li>Once it does, we can remove the partition replica which is no longer needed<\/li>\n<\/ul>\n<h4>Partition<\/h4>\n<p>Whenever a new partition is added, the producer is notified and consumer rebalancing is triggered.<\/p>\n<p>In terms of data storage, we can only store new messages to the new partition vs. trying to copy all old ones:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partition-exmaple.png\" alt=\"partition-example\" width=\"500\" />\n<\/div>\n\n<p>Decreasing the number of partitions is more involved:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partition-decrease.png\" alt=\"partition-decrease\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Once a partition is decommissioned, new messages are only received by remaining partitions<\/li>\n<li>The decommissioned partition isn't removed immediately as messages can still be consumed from it<\/li>\n<li>Once a pre-configured retention period passes, do we truncate the data and storage space is freed up<\/li>\n<li>During the transitional period, producers only send messages to active partitions, but consumers read from all<\/li>\n<li>Once retention period expires, consumers are rebalanced<\/li>\n<\/ul>\n<h3><strong>Data delivery semantics<\/strong><\/h3>\n<p>Let's discuss different delivery semantics.<\/p>\n<h4>At-most once<\/h4>\n<p>With this guarantee, messages are delivered not more than once and could not be delivered at all.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/at-most-once.png\" alt=\"at-most-once\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Producer sends a message asynchronously to a topic. If message delivery fails, there is no retry.<\/li>\n<li>Consumer fetches message and immediately commits offset. If consumer crashes before processing the message, the message will not be processed.<\/li>\n<\/ul>\n<h4>At-least once<\/h4>\n<p>A message can be sent more than once and no message should be left unprocessed.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/at-least-once.png\" alt=\"at-least-once\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Producer sends message with <code>ack=1<\/code> or <code>ack=all<\/code>. If there is any issue, it will keep retrying.<\/li>\n<li>Consumer fetches the message and consumes the offset only after it's done processing it.<\/li>\n<li>It is possible for a message to be delivered more than once if eg consumer crashes before committing offset but after processing it.<\/li>\n<li>This is why, this is good for use-cases where data duplication is acceptable or deduplication is possible.<\/li>\n<\/ul>\n<h4>Exactly once<\/h4>\n<p>Extremely costly to implement for the system, albeit it's the friendliest guarantee to users:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/exactly-once.png\" alt=\"exactly-once\" width=\"500\" />\n<\/div>\n\n<h3><strong>Advanced features<\/strong><\/h3>\n<p>Let's discuss some advanced features, we might discuss in the interview.<\/p>\n<h4>Message filtering<\/h4>\n<p>Some consumers might want to only consume messages of a certain type within a partition.<\/p>\n<p>This can be achieved by building separate topics for each subset of messages, but this can be costly if systems have too many differing use-cases.\n * It is a waste of resources to store the same message on different topics\n * Producer is now tightly coupled to consumers as it changes with each new consumer requirement<\/p>\n<p>We can resolve this using message filtering.\n * A naive approach would be to do the filtering on the consumer-side, but that introduces unnecessary consumer traffic\n * Alternatively, messages can have tags attached to them and consumers can specify which tags they're subscribed to\n * Filtering could also be done via the message payloads but that can be challenging and unsafe for encrypted/serialized messages\n * For more complex mathematical formulaes, the broker could implement a grammar parser or script executor, but that can be heavyweight for the message queue<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-filtering.png\" alt=\"message-filtering\" width=\"500\" />\n<\/div>\n\n<h4>Delayed messages &amp; scheduled messages<\/h4>\n<p>For some use-cases, we might want to delay or schedule message delivery. \nFor example, we might submit a payment verification check for 30m from now, which triggers the consumer to see if a payment was successful.<\/p>\n<p>This can be achieved by sending messages to temporary storage in the broker and moving the message to the partition at the right time:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/delayed-message-implementation.png\" alt=\"delayed-message-implementation\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>The temporary storage can be one or more special message topics<\/li>\n<li>The timing function can be achieved using dedicated delay queues or a <a href=\"http://www.cs.columbia.edu/~nahum/w6998/papers/sosp87-timing-wheels.pdf\">hierarchical time wheel<\/a><\/li>\n<\/ul>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Additional talking points:\n- <strong>Protocol of communication<\/strong>: Important considerations - support all use-cases and high data volume, as well as verify message integrity. Popular protocols - AMQP and Kafka protocol.\n- <strong>Retry consumption<\/strong>: if we can't process a message immediately, we could send it to a dedicated retry topic to be attempted later.\n- <strong>Historical data archive<\/strong>: old messages can be backed up in high-capacity storages such as HDFS or object storage (eg S3).<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>本章将设计一个<strong>分布式消息队列（message queue）<\/strong>。<\/p>\n<p>消息队列的好处：\n- <strong>解耦<\/strong>：消除组件之间的紧耦合。让它们独立更新。\n- <strong>提升可扩展性<\/strong>：生产者和消费者可以根据流量独立扩展。\n- <strong>提升可用性<\/strong>：如果系统的一部分宕机，其他部分继续与队列交互。\n- <strong>更好的性能<\/strong>：生产者无需等待消费者确认即可生产消息。<\/p>\n<p>一些流行的消息队列实现 —— Kafka、RabbitMQ、RocketMQ、Apache Pulsar、ActiveMQ、ZeroMQ。<\/p>\n<p>严格来说，Kafka 和 Pulsar 不是消息队列。它们是事件流平台。\n然而，两者的功能正在融合，模糊了消息队列与事件流平台之间的界限。<\/p>\n<p>在本章中，我们将构建一个支持更高级功能的消息队列，例如长数据保留期、重复消息消费等。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<p>消息队列应该支持一些基本功能 —— 生产者生产消息，消费者消费消息。\n然而，在性能、消息投递、数据保留等方面存在不同的考量。<\/p>\n<p>以下是候选人与面试官之间可能出现的一组问题：\n * C：消息的格式和平均大小是多少？只有文本吗？\n * I：消息只有文本，通常几 KB\n * C：消息可以被重复消费吗？\n * I：可以，消息可以被不同的消费者重复消费。这是一个附加需求，传统消息队列不支持。\n * C：消息按生产顺序被消费吗？\n * I：是的，应该保留顺序保证。这是一个附加需求，传统消息队列不支持。\n * C：数据保留需求是什么？\n * I：消息需要保留两周。这是一个附加需求。\n * C：我们要支持多少生产者和消费者？\n * I：越多越好。\n * C：我们想支持哪种数据投递语义？至多一次（at-most-once）、至少一次（at-least-once）还是恰好一次（exactly-once）？\n * I：我们一定要支持至少一次。理想情况下，我们可以全部支持并做成可配置的。\n * C：端到端延迟的目标吞吐量是多少？\n * I：它应该既支持日志聚合等用例的高吞吐量，也支持更传统用例的低吞吐量。<\/p>\n<h3><strong>功能需求<\/strong><\/h3>\n<ul>\n<li>生产者向消息队列发送消息<\/li>\n<li>消费者从队列消费消息<\/li>\n<li>消息可以消费一次或多次<\/li>\n<li>历史数据可以被截断<\/li>\n<li>消息大小在 KB 级别<\/li>\n<li>需要保留消息顺序<\/li>\n<li>数据投递语义可配置 —— 至多一次/至少一次/恰好一次。<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li><strong>高吞吐量或低延迟<\/strong>：根据用例可配置<\/li>\n<li><strong>可扩展<\/strong>：系统应该是分布式的，支持消息量的突然激增<\/li>\n<li><strong>持久化与耐用<\/strong>：数据应持久化到磁盘，并在节点间复制<\/li>\n<\/ul>\n<p>传统消息队列通常不支持数据保留，也不提供顺序保证。这大大简化了设计，我们将讨论它。<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<p>消息队列的关键组件：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-queue-components.png\" alt=\"消息队列组件\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>生产者向队列发送消息<\/li>\n<li>消费者订阅队列，并消费订阅的消息<\/li>\n<li>消息队列是位于中间的服务，将生产者与消费者解耦，让它们独立扩展。<\/li>\n<li>生产者和消费者都是客户端，而消息队列是服务器。<\/li>\n<\/ul>\n<h3><strong>消息传递模型<\/strong><\/h3>\n<p>第一种消息传递模型是点对点（point-to-point）模型，常见于传统消息队列：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/point-to-point-model.png\" alt=\"点对点模型\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>消息被发送到一个队列，并且只被恰好一个消费者消费。<\/li>\n<li>可以有多个消费者，但一条消息只被消费一次。<\/li>\n<li>一旦消息被确认为已消费，它就从队列中移除。<\/li>\n<li>点对点模型中没有数据保留，但我们的设计中有。<\/li>\n<\/ul>\n<p>另一方面，发布-订阅（publish-subscribe）模型在事件流平台中更常见：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/publish-subscribe-model.png\" alt=\"发布-订阅模型\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>在这个模型中，消息与主题（topic）关联。<\/li>\n<li>消费者订阅某个主题，接收发送到该主题的所有消息。<\/li>\n<\/ul>\n<h3><strong>主题、分区与代理节点（broker）<\/strong><\/h3>\n<p>如果一个主题的数据量太大怎么办？一种扩展方式是把主题拆分成多个分区（partition，即分片）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partitions.png\" alt=\"分区\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>发送到主题的消息均匀分布在各个分区上<\/li>\n<li>托管分区的服务器称为代理节点（broker）<\/li>\n<li>每个主题像一个队列一样运作，使用 FIFO 处理消息。分区内的消息顺序得到保留。<\/li>\n<li>消息在分区中的位置称为<strong>偏移量（offset）<\/strong>。<\/li>\n<li>每条生产的消息被发送到一个特定分区。分区键（partition key）指定消息应落到哪个分区。<\/li>\n<li>例如，可以使用 <code>user_id<\/code> 作为分区键，以保证同一用户的消息顺序。<\/li>\n<li>每个消费者订阅一个或多个分区。当多个消费者消费同一批消息时，它们构成一个消费者组（consumer group）。<\/li>\n<\/ul>\n<h3><strong>消费者组<\/strong><\/h3>\n<p>消费者组是一组协同工作、从一个主题消费消息的消费者：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-groups.png\" alt=\"消费者组\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>消息按消费者组复制（而不是按消费者复制）。<\/li>\n<li>每个消费者组维护自己的偏移量。<\/li>\n<li>消费者组并行读取消息可以提高吞吐量，但会损害顺序保证。<\/li>\n<li>可以通过只允许组内一个消费者订阅某个分区来缓解这个问题。<\/li>\n<li>这意味着一个组中的消费者数不能超过分区数。<\/li>\n<\/ul>\n<h3><strong>高层架构<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/high-level-architecture.png\" alt=\"高层架构\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>客户端<\/strong>：生产者和消费者。生产者把消息推送到指定主题。消费者组订阅某个主题的消息。<\/li>\n<li><strong>代理节点（broker）<\/strong>：持有多个分区。一个分区持有某个主题的消息子集。<\/li>\n<li><strong>数据存储<\/strong>：在分区中存储消息。<\/li>\n<li><strong>状态存储<\/strong>：保存消费者状态。<\/li>\n<li><strong>元数据存储<\/strong>：存储配置和主题属性<\/li>\n<li><strong>协调服务<\/strong>：负责服务发现（哪些代理节点存活）和主节点选举（哪个代理节点是主节点，负责分配分区）。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>为了实现高吞吐量并满足高数据保留要求，我们做了一些重要的设计选择：\n * 我们选择了一种磁盘数据结构，它利用了现代 HDD 的特性和现代操作系统的磁盘缓存策略。\n * 消息数据结构是不可变的，以避免额外的拷贝 —— 在高体量/高流量的系统中我们要避免拷贝。\n * 我们的写入围绕批处理（batching）设计，因为小 I/O 是高吞吐量的大敌。<\/p>\n<h3><strong>数据存储<\/strong><\/h3>\n<p>为了找到最适合消息的数据存储，我们必须考察消息的特性：\n * 写密集、读密集\n * 没有更新/删除操作。在传统消息队列中，有\"删除\"操作，因为消息不被保留。\n * 主要是顺序读写访问模式。<\/p>\n<p>我们的选项有哪些：\n- <strong>数据库<\/strong>：不理想，因为典型的数据库无法同时很好地支持写密集和读密集的系统。\n- <strong>预写日志（WAL）<\/strong>：一个只支持追加写入的纯文本文件，非常适合 HDD。\n  * 我们把分区拆分成多个段（segment），以避免维护一个超大文件。\n  * 旧段是只读的。只有最新段接受写入。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/wal-example.png\" alt=\"WAL 示例\" width=\"500\" />\n<\/div>\n\n<p>WAL 文件与传统 HDD 配合使用时效率极高。<\/p>\n<p>有一种误解认为 HDD 访问很慢，但这很大程度上取决于访问模式。\n当访问模式是顺序的（如我们的情况）时，HDD 可以达到几 MB/s 的读写速度，足以满足我们的需求。\n我们还借助了操作系统积极地在内存中缓存磁盘数据这一事实。<\/p>\n<h3><strong>消息数据结构<\/strong><\/h3>\n<p>消息模式（schema）在生产者、队列和消费者之间保持一致非常重要，这样可以避免额外拷贝。这会让处理高效得多。<\/p>\n<p>消息结构示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-structure.png\" alt=\"消息结构\" width=\"500\" />\n<\/div>\n\n<p>消息的键指定消息属于哪个分区。一个示例映射是 <code>hash(key) % numPartitions<\/code>。\n为了更灵活，生产者可以覆盖默认键，以控制消息被分发到哪些分区。<\/p>\n<p>消息的值是消息的负载。它可以是纯文本，也可以是压缩的二进制块。<\/p>\n<p><strong>注意：<\/strong> 与传统 KV 存储不同，消息键不必唯一。允许有重复键，甚至允许键缺失。<\/p>\n<p>其他消息字段：\n- <strong>主题（Topic）<\/strong>：消息所属的主题\n- <strong>分区（Partition）<\/strong>：消息所属分区的 ID\n- <strong>偏移量（Offset）<\/strong>：消息在分区中的位置。可以通过 <code>topic<\/code>、<code>partition<\/code>、<code>offset<\/code> 定位一条消息。\n- <strong>时间戳（Timestamp）<\/strong>：消息存储的时间\n- <strong>大小（Size）<\/strong>：这条消息的大小\n- <strong>CRC<\/strong>：校验和，确保消息完整性<\/p>\n<p>通过添加额外字段，可以支持过滤等附加功能。<\/p>\n<h3><strong>批处理<\/strong><\/h3>\n<p>批处理对我们系统的性能至关重要。我们在生产者、消费者和消息队列中都应用它。<\/p>\n<p>它之所以关键，是因为：\n * 它让操作系统可以把消息组合在一起，摊薄昂贵的网络往返成本\n * 消息成组顺序地写入 WAL，这带来大量顺序写入和磁盘缓存<\/p>\n<p>延迟与吞吐量之间存在权衡：\n * 高批处理量带来高吞吐量，但延迟更高。\n * 低批处理量带来较低的吞吐量和更低的延迟。<\/p>\n<p>如果系统作为传统消息队列部署，需要支持更低的延迟，可以把系统调优为使用更小的批大小。<\/p>\n<p>如果为吞吐量调优，我们可能需要为每个主题设置更多分区，以补偿较慢的顺序磁盘写吞吐量。<\/p>\n<h3><strong>生产者流程<\/strong><\/h3>\n<p>如果生产者想把消息发送到某个分区，它应该连接到哪个代理节点？<\/p>\n<p>一种方案是引入一个路由层，把消息路由到正确的代理节点。如果启用了复制，正确的代理节点就是主副本（leader replica）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/routing-layer.png\" alt=\"路由层\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>路由层从元数据存储中读取复制计划，并在本地缓存。<\/li>\n<li>生产者向路由层发送消息。<\/li>\n<li>消息被转发给代理节点 1，它是给定分区的主节点<\/li>\n<li>从副本（follower）从主节点拉取新消息。一旦收到足够的确认，主节点提交数据并响应生产者。<\/li>\n<\/ul>\n<p>设置副本的原因是实现容错。<\/p>\n<p>这种方法可行，但有一些缺点：\n * 额外组件导致额外的网络跳数\n * 该设计不支持消息批处理<\/p>\n<p>为了缓解这些问题，我们可以把路由层嵌入生产者中：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/routing-layer-producer.png\" alt=\"嵌入生产者的路由层\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>更少的网络跳数带来更低的延迟<\/li>\n<li>生产者可以控制消息被路由到哪个分区<\/li>\n<li>缓冲区让我们可以在内存中批处理消息，并在单个请求中发送更大的批次，从而提高吞吐量。<\/li>\n<\/ul>\n<p>批大小的选择是吞吐量与延迟之间的经典权衡。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/batch-size-throughput-vs-latency.png\" alt=\"批大小：吞吐量与延迟的权衡\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>更大的批大小意味着批次提交前等待时间更长。<\/li>\n<li>更小的批大小意味着请求更早发送，延迟更低，但吞吐量也更低。<\/li>\n<\/ul>\n<h3><strong>消费者流程<\/strong><\/h3>\n<p>消费者指定它在某个分区中的偏移量，并从该偏移量开始接收一批消息：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-example.png\" alt=\"消费者示例\" width=\"500\" />\n<\/div>\n\n<p>设计消费者时的一个重要考量是使用推模型还是拉模型：\n- <strong>推模型<\/strong>：带来更低的延迟，因为代理节点一收到消息就推送给消费者。\n  * 然而，如果消费速度落后于生产速度，消费者可能会被压垮。\n  * 由于消费速率由代理节点控制，处理处理能力各不相同的消费者很有挑战。\n- <strong>拉模型<\/strong>：由消费者控制消费速率。\n  * 如果消费速度慢，消费者不会被压垮，我们可以扩展它来追上进度。\n  * 拉模型更适合批处理，因为在推模型下，代理节点不知道一个消费者能处理多少消息。\n  * 而在拉模型下，消费者可以积极地拉取大批量消息。\n  * 缺点是延迟更高，以及在没有新消息时产生额外的网络调用。后一个问题可以用长轮询来缓解。<\/p>\n<p>因此，大多数消息队列（包括我们）选择拉模型。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-flow.png\" alt=\"消费者流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>一个新消费者订阅主题 A，并加入组 1。<\/li>\n<li>通过对组名做哈希找到正确的代理节点。这样，一个组中的所有消费者都连接到同一个代理节点。<\/li>\n<li>注意，这个消费者组协调者与协调服务（ZooKeeper）不同。<\/li>\n<li>协调者确认消费者已加入组，并把分区 2 分配给该消费者。<\/li>\n<li>有不同的分区分配策略 —— 轮询（round-robin）、范围（range）等。<\/li>\n<li>消费者从上次偏移量拉取最新消息。状态存储保存消费者偏移量。<\/li>\n<li>消费者处理消息，并把偏移量提交给代理节点。这些操作的顺序影响消息投递语义。<\/li>\n<\/ul>\n<h3><strong>消费者重平衡<\/strong><\/h3>\n<p>消费者重平衡（rebalancing）负责决定哪些消费者负责哪些分区。<\/p>\n<p>当消费者加入/离开，或分区被添加/移除时，会发生这个过程。<\/p>\n<p>代理节点充当协调者，在编排重平衡工作流中发挥巨大作用。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-rebalancing.png\" alt=\"消费者重平衡\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>同一组的所有消费者都连接到同一个协调者。协调者通过对组名做哈希找到。<\/li>\n<li>当消费者列表变化时，协调者选出组的新领导者。<\/li>\n<li>组的领导者计算新的分区分配计划，并报告给协调者，由协调者广播给其他消费者。<\/li>\n<\/ul>\n<p>当协调者不再收到某个组中消费者的心跳时，就触发重平衡：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-rebalance-example.png\" alt=\"消费者重平衡示例\" width=\"500\" />\n<\/div>\n\n<p>我们来看看当消费者加入一个组时会发生什么：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-join-group-usecase.png\" alt=\"消费者加入组的用例\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>最初，组中只有消费者 A，它消费所有分区。<\/li>\n<li>消费者 B 发送加入组的请求。<\/li>\n<li>协调者通知所有组成员该被动重平衡的时间到了 —— 作为对心跳的响应。<\/li>\n<li>一旦所有消费者重新加入组，协调者选出一个领导者，并把选举结果通知其他人。<\/li>\n<li>领导者生成分区分配计划并发送给协调者。其他人等待分配计划。<\/li>\n<li>消费者开始从新分配的分区消费。<\/li>\n<\/ul>\n<p>当消费者离开组时会发生：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-leaves-group-usecase.png\" alt=\"消费者离开组的用例\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>消费者 A 和 B 在同一个组中<\/li>\n<li>消费者 B 请求离开组<\/li>\n<li>当协调者收到 A 的心跳时，通知他们该重平衡了。<\/li>\n<li>其余步骤相同。<\/li>\n<\/ul>\n<p>当消费者长时间不发送心跳时，过程类似：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-no-heartbeat-usecase.png\" alt=\"消费者无心跳的用例\" width=\"500\" />\n<\/div>\n\n<h3><strong>状态存储<\/strong><\/h3>\n<p>状态存储保存分区与消费者之间的映射，以及某个分区最后消费到的偏移量。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/state-storage.png\" alt=\"状态存储\" width=\"500\" />\n<\/div>\n\n<p>组 1 的偏移量在 6，意味着之前的消息都已被消费。如果一个消费者崩溃，新消费者将从那条消息之后继续。<\/p>\n<p>消费者状态的数据访问模式：\n * 频繁的读/写操作，但量小\n * 数据更新频繁，但很少删除\n * 随机读/写\n * 数据一致性很重要<\/p>\n<p>基于这些需求，像 ZooKeeper 这样快速的 KV 存储是理想选择。<\/p>\n<h3><strong>元数据存储<\/strong><\/h3>\n<p>元数据存储保存配置和主题属性 —— 分区编号、保留期、副本分布。<\/p>\n<p>元数据不常变化，量也小，但一致性要求高。ZooKeeper 是这种存储的好选择。<\/p>\n<h3><strong>ZooKeeper<\/strong><\/h3>\n<p>ZooKeeper 对于构建分布式消息队列至关重要。<\/p>\n<p>它是一个分层键值存储，常用于分布式配置、同步服务和命名注册（即服务发现）。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/zookeeper.png\" alt=\"ZooKeeper\" width=\"500\" />\n<\/div>\n\n<p>有了这个改变，代理节点只需要维护消息数据。元数据和状态存储放在 ZooKeeper 中。<\/p>\n<p>ZooKeeper 还有助于代理节点副本的主节点选举。<\/p>\n<h3><strong>复制<\/strong><\/h3>\n<p>在分布式系统中，硬件问题不可避免。我们可以通过复制来应对，以实现高可用。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/replication-example.png\" alt=\"复制示例\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>每个分区在多个代理节点上复制，但只有一个主副本。<\/li>\n<li>生产者向主副本发送消息<\/li>\n<li>从副本从主节点拉取复制的消息<\/li>\n<li>一旦足够多的副本同步完成，主节点向生产者返回确认<\/li>\n<li>每个分区的副本分布称为副本分布计划。<\/li>\n<li>给定分区的主节点创建副本分布计划，并保存在 ZooKeeper 中<\/li>\n<\/ul>\n<h3><strong>同步副本<\/strong><\/h3>\n<p>我们需要解决的一个问题是：让给定分区的消息在主节点与从节点之间保持同步。<\/p>\n<p>同步副本（in-sync replica, ISR）是指与主节点保持同步的分区副本。<\/p>\n<p><code>replica.lag.max.messages<\/code> 定义一个副本落后主节点多少条消息仍被视为同步。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/in-sync-replicas-example.png\" alt=\"同步副本示例\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>已提交偏移量是 13<\/li>\n<li>两条新消息写入主节点，但尚未提交。<\/li>\n<li>当 ISR 中的所有副本都同步了某条消息后，该消息才算提交<\/li>\n<li>副本 2 和 3 已完全追上主节点，因此它们在 ISR 中<\/li>\n<li>副本 4 落后了，因此暂时被移出 ISR<\/li>\n<\/ul>\n<p>ISR 反映了性能与持久性之间的权衡。\n * 为了让生产者不丢失消息，所有副本在发送确认前都应该同步\n * 但一个慢副本会导致整个分区不可用<\/p>\n<p>确认处理是可配置的。<\/p>\n<p><code>ACK=all<\/code> 意味着 ISR 中的所有副本都必须同步一条消息。消息发送慢，但消息持久性最高。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-all.png\" alt=\"ACK=all\" width=\"500\" />\n<\/div>\n\n<p><code>ACK=1<\/code> 意味着生产者在主节点收到消息后就收到确认。消息发送快，但消息持久性低。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-1.png\" alt=\"ACK=1\" width=\"500\" />\n<\/div>\n\n<p><code>ACK=0<\/code> 意味着生产者发送消息时不等待主节点的任何确认。消息发送最快，消息持久性最低。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-0.png\" alt=\"ACK=0\" width=\"500\" />\n<\/div>\n\n<p>在消费者侧，我们可以把所有消费者连接到某个分区的主节点，让它们从主节点读取消息：\n * 这是最简单的设计，也最容易运维\n * 分区中的消息只发送给组中的一个消费者，这限制了到主副本的连接数\n * 只要主题不是超级热点，到主副本的连接数通常不高\n * 我们可以通过增加分区数和消费者数来扩展热点主题\n * 在某些场景下，让消费者从 ISR 中的副本读取可能是合理的，例如它们位于单独的数据中心时<\/p>\n<p>ISR 列表由主节点维护，它跟踪自己与每个副本之间的差距。<\/p>\n<h3><strong>可扩展性<\/strong><\/h3>\n<p>我们来评估如何扩展系统的不同部分。<\/p>\n<h4>生产者<\/h4>\n<p>生产者比消费者小得多。它的扩展性可以很容易地通过添加/移除新的生产者实例来实现。<\/p>\n<h4>消费者<\/h4>\n<p>消费者组之间相互隔离。可以随意添加/移除消费者组。<\/p>\n<p>重平衡帮助优雅地处理消费者加入/移出组的情况。<\/p>\n<p>消费者组的重平衡帮助我们实现可扩展性和容错。<\/p>\n<h4>代理节点<\/h4>\n<p>代理节点如何处理故障？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/broker-failure-recovery.png\" alt=\"代理节点故障恢复\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>一旦某个代理节点故障，仍有足够的副本可以避免分区数据丢失<\/li>\n<li>选出新的主节点，代理节点协调者把故障代理节点上的分区重新分配给现有副本<\/li>\n<li>现有副本接手新分区并充当从节点，直到追上主节点并成为 ISR<\/li>\n<\/ul>\n<p>让代理节点具备容错能力的额外考量：\n * ISR 的最小数量在延迟与安全之间取得平衡。你可以精细调优以满足需求。\n * 如果一个分区的所有副本都在同一节点上，那是浪费资源。副本应该分布在不同的代理节点上。\n * 如果一个分区的所有副本都崩溃，数据就永久丢失了。把副本分散到多个数据中心会有帮助，但会增加大量延迟。一种方案是使用<a href=\"https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=27846330\">数据镜像<\/a>作为变通方法。<\/p>\n<p>添加新代理节点时，我们如何处理副本的重新分配？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/broker-replica-redistribution.png\" alt=\"代理节点副本重新分配\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>我们可以临时允许副本数超过配置值，直到新代理节点追上进度<\/li>\n<li>一旦追上，我们就可以移除不再需要的分区副本<\/li>\n<\/ul>\n<h4>分区<\/h4>\n<p>每当添加新分区时，生产者会收到通知，并且触发消费者重平衡。<\/p>\n<p>在数据存储方面，我们只把新消息存到新分区，而不尝试复制所有旧消息：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partition-exmaple.png\" alt=\"分区示例\" width=\"500\" />\n<\/div>\n\n<p>减少分区数要复杂得多：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partition-decrease.png\" alt=\"减少分区\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>一旦某个分区被停用，新消息只由剩余分区接收<\/li>\n<li>被停用的分区不会立即删除，因为仍可以从中消费消息<\/li>\n<li>一旦超过预配置的保留期，我们就截断数据，存储空间被释放<\/li>\n<li>在过渡期，生产者只向活跃分区发送消息，但消费者从所有分区读取<\/li>\n<li>一旦保留期到期，消费者被重平衡<\/li>\n<\/ul>\n<h3><strong>数据投递语义<\/strong><\/h3>\n<p>我们来讨论不同的投递语义。<\/p>\n<h4>至多一次<\/h4>\n<p>在这种保证下，消息最多投递一次，也可能完全不投递。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/at-most-once.png\" alt=\"至多一次\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>生产者异步地向主题发送消息。如果消息投递失败，不会重试。<\/li>\n<li>消费者拉取消息后立即提交偏移量。如果消费者在处理消息前崩溃，这条消息就不会被处理。<\/li>\n<\/ul>\n<h4>至少一次<\/h4>\n<p>一条消息可能被发送多次，但不应有任何消息未被处理。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/at-least-once.png\" alt=\"至少一次\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>生产者以 <code>ack=1<\/code> 或 <code>ack=all<\/code> 发送消息。如果出现任何问题，它会不断重试。<\/li>\n<li>消费者拉取消息后，只有在处理完成后才提交偏移量。<\/li>\n<li>消息可能被投递多次，例如消费者在处理完消息后、提交偏移量前崩溃。<\/li>\n<li>这就是为什么它适用于允许数据重复或可以去重的用例。<\/li>\n<\/ul>\n<h4>恰好一次<\/h4>\n<p>对系统而言实现成本极高，尽管它是对用户最友好的保证：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/exactly-once.png\" alt=\"恰好一次\" width=\"500\" />\n<\/div>\n\n<h3><strong>高级功能<\/strong><\/h3>\n<p>我们来讨论一些面试中可能谈到的高级功能。<\/p>\n<h4>消息过滤<\/h4>\n<p>有些消费者可能只想消费某个分区中特定类型的消息。<\/p>\n<p>可以通过为每类消息子集构建单独的主题来实现，但如果系统有太多不同的用例，这样做成本很高。\n * 在不同主题上存储同一条消息是对资源的浪费\n * 生产者现在与消费者紧耦合，因为它随着每个新的消费者需求而变化<\/p>\n<p>我们可以用消息过滤来解决这个问题。\n * 朴素的做法是在消费者侧做过滤，但这会带来不必要的消费者流量\n * 或者，可以给消息附加标签，消费者指定订阅哪些标签\n * 也可以通过消息负载做过滤，但对于加密/序列化的消息来说，这可能很有挑战且不安全\n * 对于更复杂的数学公式，代理节点可以实现语法解析器或脚本执行器，但这对消息队列来说可能过于重量级<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-filtering.png\" alt=\"消息过滤\" width=\"500\" />\n<\/div>\n\n<h4>延迟消息与定时消息<\/h4>\n<p>对于某些用例，我们可能希望延迟或定时投递消息。\n例如，我们可能从现在起 30 分钟后提交一次支付验证检查，触发消费者检查支付是否成功。<\/p>\n<p>这可以通过把消息发送到代理节点中的临时存储，并在合适的时机把消息移动到分区来实现：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/delayed-message-implementation.png\" alt=\"延迟消息的实现\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>临时存储可以是一个或多个特殊消息主题<\/li>\n<li>定时功能可以使用专用延迟队列或<a href=\"http://www.cs.columbia.edu/~nahum/w6998/papers/sosp87-timing-wheels.pdf\">分层时间轮<\/a>实现<\/li>\n<\/ul>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>额外的讨论点：\n- <strong>通信协议<\/strong>：重要考量 —— 支持所有用例和大数据量，以及验证消息完整性。流行协议 —— AMQP 和 Kafka 协议。\n- <strong>重试消费<\/strong>：如果我们无法立即处理某条消息，可以把它发送到专用的重试主题，稍后再尝试。\n- <strong>历史数据归档<\/strong>：旧消息可以备份到 HDFS 或对象存储（如 S3）等大容量存储中。<\/p>", "enTitle": "Chapter 19: Distributed Message Queue", "zhTitle": "第 19 章：分布式消息队列", "short": "Distributed Message Queue", "num": "19"}, "20. Metrics Monitoring and Alerting System": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter focuses on designing a highly scalable <strong>metrics monitoring and alerting system<\/strong>, which is critical for ensuring high availability and reliability.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<p>A metrics monitoring system can mean a lot of different things - eg you don't want to design a logs aggregation system, when the interviewer is interested in infra metrics only.<\/p>\n<p>Let's try to understand the problem first:\n - C: Who are we building the system for? An in-house monitoring system for a big tech company or a SaaS like DataDog?\n - I: We are building for internal use only.\n - C: Which metrics do we want to collect?\n - I: Operational system metrics - CPU load, Memory, Data disk space. But also high-level metrics like requests per second. Business metrics are not in scope.\n - C: What is the scale of the infrastructure we're monitoring?\n - I: 100mil daily active users, 1000 server pools, 100 machines per pool\n - C: How long should we keep the data?\n - I: Let's assume 1y retention.\n - C: May we reduce metrics data resolution for long-term storage?\n - I: Keep newly received metrics for 7 days. Roll them up to 1m resolution for next 30 days. Further roll them up to 1h resolution after 30 days.\n - C: What are the supported alert channels?\n - I: Email, phone, PagerDuty or webhooks.\n - C: Do we need to collect logs such as error or access logs?\n - I: No\n - C: Do we need to support distributed system tracing?\n - I: No<\/p>\n<h3><strong>High-level requirements and assumptions<\/strong><\/h3>\n<p>The infrastructure being monitored is large-scale:\n - 100mil DAU\n - 1000 server pools * 100 machines * ~100 metrics per machine -&gt; ~10mil metrics\n - 1-year data retention\n - Data retention policy - raw for 7d, 1-minute resolution for 30d, 1h resolution for 1y<\/p>\n<p>A variety of metrics can be monitored:\n - CPU load\n - Request count\n - Memory usage\n - Message count in message queues<\/p>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>Scalability<\/strong>: System should be scalable to accommodate more metrics and alerts<\/li>\n<li><strong>Low latency<\/strong>: System needs to have low query latency for dashboards and alerts<\/li>\n<li><strong>Reliability<\/strong>: System should be highly reliable to avoid missing critical alerts<\/li>\n<li><strong>Flexibility<\/strong>: System should be able to easily integrate new technologies in the future<\/li>\n<\/ul>\n<p>What requirements are out of scope?\n - <strong>Log monitoring<\/strong>: the ELK stack is very popular for this use-case\n - <strong>Distributed system tracing<\/strong>: this refers to collecting data about a request lifecycle as it flows through multiple services within the system<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3><strong>Fundamentals<\/strong><\/h3>\n<p>There are five core components involved in a metrics monitoring and alerting system:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-monitoring-core-components.png\" alt=\"metrics-monitoring-core-components\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Data collection<\/strong>: collect metrics data from different sources<\/li>\n<li><strong>Data transmission<\/strong>: transfer data from sources to the metrics monitoring system<\/li>\n<li><strong>Data storage<\/strong>: organize and store incoming data<\/li>\n<li><strong>Alerting<\/strong>: Analyze incoming data, detect anomalies and generate alerts<\/li>\n<li><strong>Visualization<\/strong>: Present data in graphs, charts, etc<\/li>\n<\/ul>\n<h3><strong>Data model<\/strong><\/h3>\n<p>Metrics data is usually recorded as a time-series, which contains a set of values with timestamps.\nThe series can be identified by name and an optional set of tags.<\/p>\n<p>Example 1 - What is the CPU load on production server instance i631 at 20:00?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-example-1.png\" alt=\"metrics-example-1\" width=\"500\" />\n<\/div>\n\n<p>The data can be identified by the following table:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-example-1-data.png\" alt=\"metrics-example-1-data\" width=\"500\" />\n<\/div>\n\n<p>The time series is identified by the metric name, labels and a single point in at a specific time.<\/p>\n<p>Example 2 - What is the average CPU load across all web servers in the us-west region for the last 10min?<\/p>\n<pre><code>CPU.load host=webserver01,region=us-west 1613707265 50\n\nCPU.load host=webserver01,region=us-west 1613707265 62\n\nCPU.load host=webserver02,region=us-west 1613707265 43\n\nCPU.load host=webserver02,region=us-west 1613707265 53\n\n...\n\nCPU.load host=webserver01,region=us-west 1613707265 76\n\nCPU.load host=webserver01,region=us-west 1613707265 83\n<\/code><\/pre>\n<p>This is an example data we might pull from storage to answer that question.\nThe average CPU load can be calculated by averaging the values in the last column of the rows.<\/p>\n<p>The format shown above is called the line protocol and is used by many popular monitoring software in the market - eg Prometheus, OpenTSDB.<\/p>\n<p>What every time series consists of:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/time-series-data-example.png\" alt=\"time-series-data-example\" width=\"500\" />\n<\/div>\n\n<p>A good way to visualize how data looks like:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/time-series-data-viz.png\" alt=\"time-series-data-viz\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>The x axis is the time<\/li>\n<li>the y axis is the dimension you're querying - eg metric name, tag, etc.<\/li>\n<\/ul>\n<p>The data access pattern is write-heavy and spiky reads as we collect a lot of metrics, but they are infrequently accessed, although in bursts when eg there are ongoing incidents.<\/p>\n<p>The data storage system is the heart of this design. \n - It is not recommended to use a general-purpose database for this problem, although you could achieve good scale \\w expert-level tuning.\n - Using a NoSQL database can work in theory, but it is hard to devise a scalable schema for effectively storing and querying time-series data.<\/p>\n<p>There are many databases, specifically tailored for storing time-series data. Many of them support custom query interfaces which allow for effective querying of time-series data.\n - OpenTSDB is a distributed time-series database, but it is based on Hadoop and HBase. If you don't have that infrastructure provisioned, it would be hard to use this tech.\n - Twitter uses MetricsDB, while Amazon offers Timestream.\n - The two most popular time-series databases are InfluxDB and Prometheus. \n - They are designed to store large volumes of time-series data. Both of them are based on in-memory cache + on-disk storage.<\/p>\n<p>Example scale of InfluxDB - more than 250k writes per second when provisioned with 8 cores and 32gb RAM:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/influxdb-scale.png\" alt=\"influxdb-scale\" width=\"500\" />\n<\/div>\n\n<p>It is not expected for you to understand the internals of a metrics database as it is niche knowledge. You might be asked only if you've mentioned it on your resume.<\/p>\n<p>For the purposes of the interview, it is sufficient to understand that metrics are time-series data and to be aware of popular time-series databases, like InfluxDB.<\/p>\n<p>One nice feature of time-series databases is the efficient aggregation and analysis of large amounts of time-series data by labels.\nInfluxDB, for example, builds indexes for each label.<\/p>\n<p>It is critical, however, to keep the cardinality of labels low - ie, not using too many unique labels.<\/p>\n<h3><strong>High-level Design<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/high-level-design.png\" alt=\"high-level-design\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Metrics source<\/strong>: can be application servers, SQL databases, message queues, etc.<\/li>\n<li><strong>Metrics collector<\/strong>: Gathers metrics data and writes to time-series database<\/li>\n<li><strong>Time-series database<\/strong>: stores metrics as time-series. Provides a custom query interface for analyzing large amounts of metrics.<\/li>\n<li><strong>Query service<\/strong>: Makes it easy to query and retrieve data from the time-series DB. Could be replaced entirely by the DB's interface if it's sufficiently powerful.<\/li>\n<li><strong>Alerting system<\/strong>: Sends alert notifications to various alerting destinations.<\/li>\n<li><strong>Visualization system<\/strong>: Shows metrics in the form of graphs/charts.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>Let's deep dive into several of the more interesting parts of the system.<\/p>\n<h3><strong>Metrics collection<\/strong><\/h3>\n<p>For metrics collection, occasional data loss is not critical. It's acceptable for clients to fire and forget.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection.png\" alt=\"metrics-collection\" width=\"500\" />\n<\/div>\n\n<p>There are two ways to implement metrics collection - pull or push.<\/p>\n<p>Here's how the pull model might look like:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/pull-model-example.png\" alt=\"pull-model-example\" width=\"500\" />\n<\/div>\n\n<p>For this solution, the metrics collector needs to maintain an up-to-date list of services and metrics endpoints.\nWe can use Zookeeper or etcd for that purpose - service discovery.<\/p>\n<p>Service discovery contains contains configuration rules about when and where to collect metrics from:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/service-discovery-example.png\" alt=\"service-discovery-example\" width=\"500\" />\n<\/div>\n\n<p>Here's a detailed explanation of the metrics collection flow:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection-flow.png\" alt=\"metrics-collection-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Metrics collector fetches configuration metadata from service discovery. This includes pulling interval, IP addresses, timeout &amp; retry params.<\/li>\n<li>Metrics collector pulls metrics data via a pre-defined http endpoint (eg <code>/metrics<\/code>). This is typically done by a client library.<\/li>\n<li>Alternatively, the metrics collector can register a change event notification with the service discovery to be notified once the service endpoint changes.<\/li>\n<li>Another option is for the metrics collector to periodically poll for metrics endpoint configuration changes.<\/li>\n<\/ul>\n<p>At our scale, a single metrics collector is not enough. There must be multiple instances. \nHowever, there must also be some kind of synchronization among them so that two collectors don't collect the same metrics twice.<\/p>\n<p>One solution for this is to position collectors and servers on a consistent hash ring and associate a set of servers with a single collector only:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/consistent-hash-ring.png\" alt=\"consistent-hash-ring\" width=\"500\" />\n<\/div>\n\n<p>With the push model, on the other hand, services push their metrics to the metrics collector proactively:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/push-model-example.png\" alt=\"push-model-example\" width=\"500\" />\n<\/div>\n\n<p>In this approach, typically a collection agent is installed alongside service instances. \nThe agent collects metrics from the server and pushes them to the metrics collector.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collector-agent.png\" alt=\"metrics-collector-agent\" width=\"500\" />\n<\/div>\n\n<p>With this model, we can potentially aggregate metrics before sending them to the collector, which reduces the volume of data processed by the collector.<\/p>\n<p>On the flip side, metrics collector can reject push requests as it can't handle the load. \nIt is important, hence, to add the collector to an auto-scaling group behind a load balancer.<\/p>\n<p>so which one is better? There are trade-offs between both approaches and different systems use different approaches:\n - Prometheus uses a pull architecture\n - Amazon Cloud Watch and Graphite use a push architecture<\/p>\n<p>Here are some of the main differences between push and pull:\n|                                        | Pull                                                                                                                                                                                                    | Push                                                                                                                                                                                                                                    |\n|----------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Easy debugging                         | The /metrics endpoint on application servers used for pulling metrics can be used to view metrics at any time. You can even do this on your laptop. Pull wins.                                          | If the metrics collector doesn't receive metrics, the problem might be caused by network issues.                                                                                                                                        |\n| Health check                           | If an application server doesn't respond to the pull, you can quickly figure out if an application server is down. Pull wins.                                                                           | If the metrics collector doesn't receive metrics, the problem might be caused by network issues.                                                                                                                                        |\n| Short-lived jobs                       |                                                                                                                                                                                                         | Some of the batch jobs might be short-lived and don't last long enough to be pulled. Push wins. This can be fixed by introducing push gateways for the pull model [22].                                                                 |\n| Firewall or complicated network setups | Having servers pulling metrics requires all metric endpoints to be reachable. This is potentially problematic in multiple data center setups. It might require a more elaborate network infrastructure. | If the metrics collector is set up with a load balancer and an auto-scaling group, it is possible to receive data from anywhere. Push wins.                                                                                             |\n| Performance                            | Pull methods typically use TCP.                                                                                                                                                                         | Push methods typically use UDP. This means the push method provides lower-latency transports of metrics. The counterargument here is that the effort of establishing a TCP connection is small compared to sending the metrics payload. |\n| Data authenticity                      | Application servers to collect metrics from are defined in config files in advance. Metrics gathered from those servers are guaranteed to be authentic.                                                 | Any kind of client can push metrics to the metrics collector. This can be fixed by whitelisting servers from which to accept metrics, or by requiring authentication.                                                                   |<\/p>\n<p>There is no clear winner. A large organization probably needs to support both. There might not be a way to install a push agent in the first place.<\/p>\n<h3><strong>Scale the metrics transmission pipeline<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-transmission-pipeline.png\" alt=\"metrics-transmission-pipeline\" width=\"500\" />\n<\/div>\n\n<p>The metrics collector is provisioned in an auto-scaling group, regardless if we use the push or pull model.<\/p>\n<p>There is a chance of data loss if the time-series DB is down, however. To mitigate this, we'll provision a queuing mechanism:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/queuing-mechanism.png\" alt=\"queuing-mechanism\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Metrics collectors push metrics data into kafka<\/li>\n<li>Consumers or stream processing services such as Apache Storm, Flink or Spark process the data and push it to the time-series DB<\/li>\n<\/ul>\n<p>This approach has several advantages:\n - Kafka is used as a highly-reliable and scalable distributed message platform\n - It decouples data collection and data processing from one another\n - It can prevent data loss by retaining the data in Kafka<\/p>\n<p>Kafka can be configured with one partition per metric name, so that consumers can aggregate data by metric names.\nTo scale this, we can further partition by tags/labels and categorize/prioritize metrics to be collected first.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection-kafka.png\" alt=\"metrics-collection-kafka\" width=\"500\" />\n<\/div>\n\n<p>The main downside of using Kafka for this problem is the maintenance/operation overhead.\nAn alternative is to use a large-scale ingestion system like <a href=\"https://www.vldb.org/pvldb/vol8/p1816-teller.pdf\">Gorilla<\/a>.\nIt can be argued that using that would be as scalable as using Kafka for queuing.<\/p>\n<h3><strong>Where aggregations can happen<\/strong><\/h3>\n<p>Metrics can be aggregated at several places. There are trade-offs between different choices:\n - <strong>Collection agent<\/strong>: client-side collection agent only supports simple aggregation logic. Eg collect a counter for 1m and send it to the metrics collector.\n - <strong>Ingestion pipeline<\/strong>: To aggregate data before writing to the DB, we need a stream processing engine like Flink. This reduces write volume, but we lose data precision as we don't store raw data.\n - <strong>Query side<\/strong>: We can aggregate data when we run queries via our visualization system. There is no data loss, but queries can be slow due to a lot of data processing.<\/p>\n<h3><strong>Query Service<\/strong><\/h3>\n<p>Having a separate query service from the time-series DB decouples the visualization and alerting system from the database, which enables us to decouple the DB from clients and change it at will.<\/p>\n<p>We can add a Cache layer here to reduce the load to the time-series database:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/cache-layer-query-service.png\" alt=\"cache-layer-query-service\" width=\"500\" />\n<\/div>\n\n<p>We can also avoid adding a query service altogether as most visualization and alerting systems have powerful plugins to integrate with most time-series databases.\nWith a well-chosen time-series DB, we might not need to introduce our own caching layer as well.<\/p>\n<p>Most time-series DBs don't support SQL simply because it is ineffective for querying time-series data. Here's an example SQL query for computing an exponential moving average:<\/p>\n<pre><code>select id,\n       temp,\n       avg(temp) over (partition by group_nr order by time_read) as rolling_avg\nfrom (\n  select id,\n         temp,\n         time_read,\n         interval_group,\n         id - row_number() over (partition by interval_group order by time_read) as group_nr\n  from (\n    select id,\n    time_read,\n    &quot;epoch&quot;::timestamp + &quot;900 seconds&quot;::interval * (extract(epoch from time_read)::int4 / 900) as interval_group,\n    temp\n    from readings\n  ) t1\n) t2\norder by time_read;\n<\/code><\/pre>\n<p>Here's the same query in Flux - query language used in InfluxDB:<\/p>\n<pre><code>from(db:&quot;telegraf&quot;)\n  |&gt; range(start:-1h)\n  |&gt; filter(fn: (r) =&gt; r._measurement == &quot;foo&quot;)\n  |&gt; exponentialMovingAverage(size:-10s)\n<\/code><\/pre>\n<h3><strong>Storage layer<\/strong><\/h3>\n<p>It is important to choose the time-series database carefully.<\/p>\n<p>According to research published by Facebook, ~85% of queries to the operational store were for data from the past 26h.<\/p>\n<p>If we choose a database, which harnesses this property, it could have significant impact on system performance. InfluxDB is one such option.<\/p>\n<p>Regardless of the database we choose, there are some optimizations we might employ.<\/p>\n<p>Data encoding and compression can significantly reduce the size of data. Those features are usually built into a good time-series database.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/double-delta-encoding.png\" alt=\"double-delta-encoding\" width=\"500\" />\n<\/div>\n\n<p>In the above example, instead of storing full timestamps, we can store timestamp deltas.<\/p>\n<p>Another technique we can employ is down-sampling - converting high-resolution data to low-resolution in order to reduce disk usage.<\/p>\n<p>We can use that for old data and make the rules configurable by data scientists, eg:\n - 7d - no down-sampling\n - 30d - down-sample to 1min\n - 1y - down-sample to 1h<\/p>\n<p>For example, here's a 10-second resolution metrics table:\n| metric | timestamp            | hostname | Metric_value |\n|--------|----------------------|----------|--------------|\n| cpu    | 2021-10-24T19:00:00Z | host-a   | 10           |\n| cpu    | 2021-10-24T19:00:10Z | host-a   | 16           |\n| cpu    | 2021-10-24T19:00:20Z | host-a   | 20           |\n| cpu    | 2021-10-24T19:00:30Z | host-a   | 30           |\n| cpu    | 2021-10-24T19:00:40Z | host-a   | 20           |\n| cpu    | 2021-10-24T19:00:50Z | host-a   | 30           |<\/p>\n<p>down-sampled to 30-second resolution:\n| metric | timestamp            | hostname | Metric_value (avg) |\n|--------|----------------------|----------|--------------------|\n| cpu    | 2021-10-24T19:00:00Z | host-a   | 19                 |\n| cpu    | 2021-10-24T19:00:30Z | host-a   | 25                 |<\/p>\n<p>Finally, we can also use cold storage to use old data, which is no longer used. The financial cost for cold storage is much lower.<\/p>\n<h3><strong>Alerting system<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/alerting-system.png\" alt=\"alerting-system\" width=\"500\" />\n<\/div>\n\n<p>Configuration is loaded to cache servers. Rules are typically defined in YAML format. Here's an example:<\/p>\n<pre><code>- name: instance_down\n  rules:\n\n  # Alert for any instance that is unreachable for &gt;5 minutes.\n  - alert: instance_down\n    expr: up == 0\n    for: 5m\n    labels:\n      severity: page\n<\/code><\/pre>\n<p>The alert manager fetches alert configurations from cache. Based on configuration rules, it also calls the query service at a predefined interval.\nIf a rule is met, an alert event is created.<\/p>\n<p>Other responsibilities of the alert manager are:\n - Filtering, merging and deduplicating alerts. Eg if an alert of a single instance is triggered multiple times, only one alert event is generated.\n - Access control - it is important to restrict alert-management operations to certain individuals only\n - Retry - the manager ensures that the alert is propagated at least once.<\/p>\n<p>The alert store is a key-value database, like Cassandra, which keeps the state of all alerts. It ensures a notification is sent at least once.\nOnce an alert is triggered, it is published to Kafka.<\/p>\n<p>Finally, alert consumers pull alerts data from Kafka and send notifications over to different channels - Email, text message, PagerDuty, webhooks.<\/p>\n<p>In the real-world, there are many off-the-shelf solutions for alerting systems. It is difficult to justify building your own system in-house.<\/p>\n<h3><strong>Visualization system<\/strong><\/h3>\n<p>The visualization system shows metrics and alerts over a time period. Here's an dashboard built with Grafana:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/grafana-dashboard.png\" alt=\"grafana-dashboard\" width=\"500\" />\n<\/div>\n\n<p>A high-quality visualization system is very hard to build. It is hard to justify not using an off-the-shelf solution like Grafana.<\/p>\n<hr />\n<h2>Step 4: Wrap up<\/h2>\n<p>Here's our final design:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/final-design.png\" alt=\"final-design\" width=\"500\" />\n<\/div>", "zh": "\n<h2>引言<\/h2>\n<p>本章聚焦于设计一个高度可扩展的<strong>指标监控与告警系统<\/strong>，它对于保障高可用性和可靠性至关重要。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<p>指标监控系统可以指代很多不同的东西 —— 例如，当面试官只关心基础设施指标时，你就不该去设计一个日志聚合系统。<\/p>\n<p>让我们先试着理解问题：\n - C：我们为谁构建这个系统？是一家大型科技公司的内部监控系统，还是像 DataDog 这样的 SaaS 服务？\n - I：我们仅为内部使用而构建。\n - C：我们想采集哪些指标？\n - I：操作系统指标 —— CPU 负载、内存、数据磁盘空间。但也包括像每秒请求数这样的高层级指标。业务指标不在范围内。\n - C：我们监控的基础设施规模有多大？\n - I：1 亿日活跃用户、1000 个服务器池、每个池 100 台机器。\n - C：数据应该保留多久？\n - I：假设保留 1 年。\n - C：对于长期存储，我们可以降低指标数据的分辨率吗？\n - I：新接收的指标保留 7 天。接下来的 30 天汇总（roll up）为 1 分钟分辨率。30 天后进一步汇总为 1 小时分辨率。\n - C：支持哪些告警渠道？\n - I：电子邮件、电话、PagerDuty 或 webhooks。\n - C：我们需要采集错误日志或访问日志之类的日志吗？\n - I：不需要。\n - C：我们需要支持分布式系统链路追踪吗？\n - I：不需要。<\/p>\n<h3><strong>高层级需求与假设<\/strong><\/h3>\n<p>被监控的基础设施是大规模的：\n - 1 亿 DAU\n - 1000 个服务器池 × 100 台机器 × 每台机器约 100 个指标 → 约 1000 万个指标\n - 数据保留 1 年\n - 数据保留策略 —— 原始数据保留 7 天、1 分钟分辨率保留 30 天、1 小时分辨率保留 1 年<\/p>\n<p>可以监控各种各样的指标：\n - CPU 负载\n - 请求计数\n - 内存使用量\n - 消息队列中的消息数<\/p>\n<h3><strong>非功能性需求<\/strong><\/h3>\n<ul>\n<li><strong>可扩展性（Scalability）<\/strong>：系统应可扩展，以容纳更多指标和告警。<\/li>\n<li><strong>低延迟（Low latency）<\/strong>：系统在仪表盘查询和告警查询上需要有低延迟。<\/li>\n<li><strong>可靠性（Reliability）<\/strong>：系统应高度可靠，避免遗漏关键告警。<\/li>\n<li><strong>灵活性（Flexibility）<\/strong>：系统未来应能轻松集成新技术。<\/li>\n<\/ul>\n<p>哪些需求不在范围内？\n - <strong>日志监控<\/strong>：ELK 技术栈在这个用例下非常流行。\n - <strong>分布式系统链路追踪<\/strong>：指的是在一个请求流经系统内多个服务的过程中，采集其完整生命周期的数据。<\/p>\n<hr />\n<h2>第 2 步：提出高层级设计并获得认可<\/h2>\n<h3><strong>基础概念<\/strong><\/h3>\n<p>指标监控与告警系统涉及五个核心组件：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-monitoring-core-components.png\" alt=\"指标监控核心组件\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>数据采集<\/strong>：从不同来源采集指标数据。<\/li>\n<li><strong>数据传输<\/strong>：把数据从来源传输到指标监控系统。<\/li>\n<li><strong>数据存储<\/strong>：组织并存储接收到的数据。<\/li>\n<li><strong>告警<\/strong>：分析接收到的数据、检测异常并生成告警。<\/li>\n<li><strong>可视化<\/strong>：用图形、图表等方式展示数据。<\/li>\n<\/ul>\n<h3><strong>数据模型<\/strong><\/h3>\n<p>指标数据通常以时序（time-series）形式记录，包含一系列带时间戳的值。\n该序列可以由名称和一组可选的标签（tags）来标识。<\/p>\n<p>示例 1 —— 在 20:00 时，生产服务器实例 i631 上的 CPU 负载是多少？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-example-1.png\" alt=\"指标示例 1\" width=\"500\" />\n<\/div>\n\n<p>该数据可由下表标识：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-example-1-data.png\" alt=\"指标示例 1 的数据\" width=\"500\" />\n<\/div>\n\n<p>该时序由指标名称、标签以及某个特定时间点上的单个数据点来标识。<\/p>\n<p>示例 2 —— 过去 10 分钟内，us-west 区域所有 Web 服务器的平均 CPU 负载是多少？<\/p>\n<pre><code>CPU.load host=webserver01,region=us-west 1613707265 50\n\nCPU.load host=webserver01,region=us-west 1613707265 62\n\nCPU.load host=webserver02,region=us-west 1613707265 43\n\nCPU.load host=webserver02,region=us-west 1613707265 53\n\n...\n\nCPU.load host=webserver01,region=us-west 1613707265 76\n\nCPU.load host=webserver01,region=us-west 1613707265 83\n<\/code><\/pre>\n<p>这是我们为回答该问题而可能从存储中取出的示例数据。\n平均 CPU 负载可以通过对各行最后一列的值求平均来计算。<\/p>\n<p>上面展示的格式被称为行协议（line protocol），市场上许多流行的监控软件都在使用它 —— 例如 Prometheus、OpenTSDB。<\/p>\n<p>每一条时序由什么组成：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/time-series-data-example.png\" alt=\"时序数据示例\" width=\"500\" />\n<\/div>\n\n<p>一个很好的数据可视化方式：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/time-series-data-viz.png\" alt=\"时序数据可视化\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>x 轴是时间。<\/li>\n<li>y 轴是你正在查询的维度 —— 例如指标名称、标签等。<\/li>\n<\/ul>\n<p>数据访问模式是写多读少，且读呈突发状：我们采集了大量指标，但它们并不经常被访问，不过在出现正在处理的事故等情况下会突发式访问。<\/p>\n<p>数据存储系统是本设计的核心。\n - 不建议为这个问题使用通用数据库，尽管凭借专家级调优你也能达到不错的规模。\n - 使用 NoSQL 数据库在理论上可行，但很难设计出可扩展的 schema，来高效存储和查询时序数据。<\/p>\n<p>有许多数据库是专门为存储时序数据而定制的。其中许多都支持自定义查询接口，可以高效地查询时序数据。\n - OpenTSDB 是一个分布式时序数据库，但它基于 Hadoop 和 HBase。如果你没有预先准备好那套基础设施，就很难使用这项技术。\n - Twitter 使用 MetricsDB，而 Amazon 提供 Timestream。\n - 最流行的两个时序数据库是 InfluxDB 和 Prometheus。\n - 它们都是为存储大规模时序数据而设计的。两者都基于「内存缓存 + 磁盘存储」。<\/p>\n<p>InfluxDB 的一个规模示例 —— 在配备 8 核 CPU 和 32GB 内存的配置下，每秒可写入超过 25 万次：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/influxdb-scale.png\" alt=\"InfluxDB 规模\" width=\"500\" />\n<\/div>\n\n<p>并不要求你理解指标数据库的内部原理，因为那属于冷门知识。只有当你在简历上提到过它时，才可能被问到。<\/p>\n<p>就面试而言，理解「指标就是时序数据」并了解像 InfluxDB 这样流行的时序数据库就足够了。<\/p>\n<p>时序数据库的一个不错特性是能够按标签对大量时序数据进行高效聚合与分析。\n例如，InfluxDB 会为每个标签建立索引。<\/p>\n<p>然而，关键在于保持标签的低基数（cardinality）—— 即不要使用太多唯一标签。<\/p>\n<h3><strong>高层级设计<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/high-level-design.png\" alt=\"高层级设计\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>指标来源（Metrics source）<\/strong>：可以是应用服务器、SQL 数据库、消息队列等。<\/li>\n<li><strong>指标采集器（Metrics collector）<\/strong>：采集指标数据并写入时序数据库。<\/li>\n<li><strong>时序数据库（Time-series database）<\/strong>：把指标存储为时序。提供自定义查询接口，用于分析大量指标。<\/li>\n<li><strong>查询服务（Query service）<\/strong>：让从时序 DB 中查询和检索数据变得容易。如果 DB 自身的接口足够强大，查询服务可以完全被其取代。<\/li>\n<li><strong>告警系统（Alerting system）<\/strong>：向各种告警目的地发送告警通知。<\/li>\n<li><strong>可视化系统（Visualization system）<\/strong>：以图形/图表的形式展示指标。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>让我们深入探讨系统中几个更有意思的部分。<\/p>\n<h3><strong>指标采集<\/strong><\/h3>\n<p>对于指标采集，偶尔的数据丢失并不关键。客户端采用「发后即忘」（fire and forget）是可以接受的。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection.png\" alt=\"指标采集\" width=\"500\" />\n<\/div>\n\n<p>指标采集有两种实现方式 —— 拉取（pull）或推送（push）。<\/p>\n<p>下面是拉取模型可能的样子：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/pull-model-example.png\" alt=\"拉取模型示例\" width=\"500\" />\n<\/div>\n\n<p>对于这种方案，指标采集器需要维护一份最新的服务列表和指标端点列表。\n为此我们可以使用 ZooKeeper 或 etcd —— 即服务发现（service discovery）。<\/p>\n<p>服务发现包含关于「何时、从何处采集指标」的配置规则：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/service-discovery-example.png\" alt=\"服务发现示例\" width=\"500\" />\n<\/div>\n\n<p>下面是指标采集流程的详细说明：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection-flow.png\" alt=\"指标采集流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>指标采集器从服务发现拉取配置元数据。这包括拉取间隔、IP 地址、超时与重试参数。<\/li>\n<li>指标采集器通过预定义的 http 端点（例如 <code>/metrics<\/code>）拉取指标数据。这通常由客户端库完成。<\/li>\n<li>另一种方式是，指标采集器向服务发现注册变更事件通知，以便在服务端点发生变化时收到通知。<\/li>\n<li>还有一种方式是，指标采集器定期轮询指标端点的配置变更。<\/li>\n<\/ul>\n<p>在我们的规模下，单个指标采集器是不够的。必须有多个实例。\n然而，它们之间也必须有某种同步机制，以避免两个采集器把同一批指标采集两遍。<\/p>\n<p>一个解决方案是把采集器和服务器放在一致性哈希环（consistent hash ring）上，并让一组服务器只归属给一个采集器：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/consistent-hash-ring.png\" alt=\"一致性哈希环\" width=\"500\" />\n<\/div>\n\n<p>而在推送模型下，服务会主动把自己的指标推送给指标采集器：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/push-model-example.png\" alt=\"推送模型示例\" width=\"500\" />\n<\/div>\n\n<p>在这种方式中，通常会在服务实例旁边安装一个采集代理（collection agent）。\n该代理从服务器采集指标，并把它们推送给指标采集器。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collector-agent.png\" alt=\"指标采集器代理\" width=\"500\" />\n<\/div>\n\n<p>在这个模型下，我们有可能在把指标发给采集器之前先做聚合，从而减少采集器处理的数据量。<\/p>\n<p>另一方面，指标采集器在扛不住负载时可以拒绝推送请求。\n因此，把采集器放到负载均衡器后面的自动扩缩容组（auto-scaling group）中非常重要。<\/p>\n<p>那么哪一种更好呢？两种方案各有权衡，不同的系统采用不同的方式：\n - Prometheus 采用拉取架构。\n - Amazon CloudWatch 和 Graphite 采用推送架构。<\/p>\n<p>下面是推送与拉取之间的一些主要差异：\n|                                        | 拉取（Pull）                                                                                                                                                                                                    | 推送（Push）                                                                                                                                                                                                                                    |\n|----------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| 易于调试                         | 应用服务器上用于拉取指标的 <code>/metrics<\/code> 端点可随时用来查看指标。你甚至可以在自己的笔记本上做这件事。拉取胜出。                                          | 如果指标采集器没收到指标，问题可能出在网络上。                                                                                                                                        |\n| 健康检查                           | 如果某台应用服务器不响应拉取，你可以快速判断出它是否宕机。拉取胜出。                                                                           | 如果指标采集器没收到指标，问题可能出在网络上。                                                                                                                                        |\n| 短生命周期任务                       |                                                                                                                                                                                                         | 有些批处理任务生命周期很短，存活时间短到来不及被拉取。推送胜出。对拉取模型而言，可以通过引入推送网关（push gateway）来解决这个问题 [22]。                                                                 |\n| 防火墙或复杂网络设置 | 让服务器拉取指标要求所有指标端点都可达。这在多数据中心设置下可能有问题。可能需要更复杂的网络基础设施。 | 如果指标采集器搭配负载均衡器和自动扩缩容组搭建，则可以从任何地方接收数据。推送胜出。                                                                                             |\n| 性能                            | 拉取方式通常使用 TCP。                                                                                                                                                                         | 推送方式通常使用 UDP。这意味着推送方式能以更低延迟传输指标。反方观点是：与发送指标负载相比，建立 TCP 连接的开销很小。 |\n| 数据真实性                      | 从哪些应用服务器采集指标是在配置文件中预先定义好的。从这些服务器采集到的指标保证是真实可信的。                                                 | 任何客户端都可以向指标采集器推送指标。可以通过设置白名单（只接受白名单服务器的指标）或要求认证来解决。                                                                   |<\/p>\n<p>没有明确的赢家。一个大型组织很可能需要同时支持两种。而且一开始可能根本就没法安装推送代理。<\/p>\n<h3><strong>扩展指标传输管道<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-transmission-pipeline.png\" alt=\"指标传输管道\" width=\"500\" />\n<\/div>\n\n<p>无论使用推送还是拉取模型，指标采集器都部署在一个自动扩缩容组中。<\/p>\n<p>然而，如果时序 DB 宕机，仍有数据丢失的可能。为缓解这一点，我们会部署一个排队机制：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/queuing-mechanism.png\" alt=\"排队机制\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>指标采集器把指标数据推送到 kafka。<\/li>\n<li>消费者或流处理服务（如 Apache Storm、Flink 或 Spark）处理数据，并把它推送到时序 DB。<\/li>\n<\/ul>\n<p>这种方式有几个优点：\n - Kafka 被用作高可靠、可扩展的分布式消息平台。\n - 它把数据采集与数据处理解耦。\n - 它可以通过在 Kafka 中保留数据来防止数据丢失。<\/p>\n<p>Kafka 可以配置为每个指标名一个分区，这样消费者就可以按指标名聚合数据。\n要进一步扩展，我们可以再按标签/标签集（tags/labels）做分区，并对指标分类、排定优先级，优先采集最重要的指标。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/metrics-collection-kafka.png\" alt=\"指标采集 Kafka\" width=\"500\" />\n<\/div>\n\n<p>在这个问题上使用 Kafka 的主要缺点是维护/运营开销。\n一个替代方案是使用像 <a href=\"https://www.vldb.org/pvldb/vol8/p1816-teller.pdf\">Gorilla<\/a> 这样的大规模摄入系统。\n可以论证，使用它所能达到的可扩展性，与使用 Kafka 做排队是相当的。<\/p>\n<h3><strong>聚合可以发生在哪里<\/strong><\/h3>\n<p>指标可以在几个地方聚合。不同选择之间各有权衡：\n - <strong>采集代理（Collection agent）<\/strong>：客户端采集代理只支持简单的聚合逻辑。例如对一个计数器采集 1 分钟，再发给指标采集器。\n - <strong>摄入管道（Ingestion pipeline）<\/strong>：要在写入 DB 之前聚合数据，我们需要像 Flink 这样的流处理引擎。这减少了写入量，但由于不存储原始数据，我们会损失数据精度。\n - <strong>查询侧（Query side）<\/strong>：我们可以在通过可视化系统运行查询时聚合数据。不会丢失数据，但由于要处理大量数据，查询可能较慢。<\/p>\n<h3><strong>查询服务<\/strong><\/h3>\n<p>让查询服务与时序 DB 相互独立，可以把可视化与告警系统从数据库解耦出来，从而让我们可以把 DB 与客户端解耦、并随意更换它。<\/p>\n<p>我们可以在这里加一层缓存，以减轻时序数据库的负载：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/cache-layer-query-service.png\" alt=\"查询服务的缓存层\" width=\"500\" />\n<\/div>\n\n<p>我们也可以完全不单独引入查询服务，因为大多数可视化和告警系统都有强大的插件，可以与大多数时序数据库集成。\n如果时序 DB 选得好，我们甚至可能不需要引入自己的缓存层。<\/p>\n<p>大多数时序 DB 不支持 SQL，原因很简单：SQL 查询时序数据效率低下。下面是一个计算指数移动平均（exponential moving average）的 SQL 查询示例：<\/p>\n<pre><code>select id,\n       temp,\n       avg(temp) over (partition by group_nr order by time_read) as rolling_avg\nfrom (\n  select id,\n         temp,\n         time_read,\n         interval_group,\n         id - row_number() over (partition by interval_group order by time_read) as group_nr\n  from (\n    select id,\n    time_read,\n    &quot;epoch&quot;::timestamp + &quot;900 seconds&quot;::interval * (extract(epoch from time_read)::int4 / 900) as interval_group,\n    temp\n    from readings\n  ) t1\n) t2\norder by time_read;\n<\/code><\/pre>\n<p>下面是同一个查询用 Flux（InfluxDB 使用的查询语言）表达的样子：<\/p>\n<pre><code>from(db:&quot;telegraf&quot;)\n  |&gt; range(start:-1h)\n  |&gt; filter(fn: (r) =&gt; r._measurement == &quot;foo&quot;)\n  |&gt; exponentialMovingAverage(size:-10s)\n<\/code><\/pre>\n<h3><strong>存储层<\/strong><\/h3>\n<p>谨慎选择时序数据库非常重要。<\/p>\n<p>根据 Facebook 发表的研究，对运维存储的查询中，约 85% 都是查询过去 26 小时内的数据。<\/p>\n<p>如果我们选择一个能利用这一特性的数据库，可能会对系统性能产生重大影响。InfluxDB 就是这样一个选择。<\/p>\n<p>无论选择哪个数据库，我们都可以采用一些优化手段。<\/p>\n<p>数据编码和压缩可以显著减小数据体积。这些特性通常内置在优秀的时序数据库中。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/double-delta-encoding.png\" alt=\"双差分编码\" width=\"500\" />\n<\/div>\n\n<p>在上面的例子中，我们不必存储完整时间戳，而可以存储时间戳的差值（delta）。<\/p>\n<p>另一个可以采用的技术是降采样（down-sampling）—— 把高分辨率数据转换为低分辨率，以减少磁盘占用。<\/p>\n<p>我们可以对旧数据使用降采样，并让规则由数据科学家配置，例如：\n - 7 天 —— 不降采样\n - 30 天 —— 降采样到 1 分钟\n - 1 年 —— 降采样到 1 小时<\/p>\n<p>例如，下面是一张 10 秒分辨率的指标表：\n| metric | timestamp            | hostname | Metric_value |\n|--------|----------------------|----------|--------------|\n| cpu    | 2021-10-24T19:00:00Z | host-a   | 10           |\n| cpu    | 2021-10-24T19:00:10Z | host-a   | 16           |\n| cpu    | 2021-10-24T19:00:20Z | host-a   | 20           |\n| cpu    | 2021-10-24T19:00:30Z | host-a   | 30           |\n| cpu    | 2021-10-24T19:00:40Z | host-a   | 20           |\n| cpu    | 2021-10-24T19:00:50Z | host-a   | 30           |<\/p>\n<p>降采样到 30 秒分辨率：\n| metric | timestamp            | hostname | Metric_value (avg) |\n|--------|----------------------|----------|--------------------|\n| cpu    | 2021-10-24T19:00:00Z | host-a   | 19                 |\n| cpu    | 2021-10-24T19:00:30Z | host-a   | 25                 |<\/p>\n<p>最后，我们还可以使用冷存储（cold storage）来存放不再使用的旧数据。冷存储的财务成本要低得多。<\/p>\n<h3><strong>告警系统<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/alerting-system.png\" alt=\"告警系统\" width=\"500\" />\n<\/div>\n\n<p>配置被加载到缓存服务器中。规则通常以 YAML 格式定义。下面是一个示例：<\/p>\n<pre><code>- name: instance_down\n  rules:\n\n  # Alert for any instance that is unreachable for &gt;5 minutes.\n  - alert: instance_down\n    expr: up == 0\n    for: 5m\n    labels:\n      severity: page\n<\/code><\/pre>\n<p>告警管理器（alert manager）从缓存中拉取告警配置。根据配置规则，它还会以预定义的间隔调用查询服务。\n如果某条规则被满足，就会创建一个告警事件。<\/p>\n<p>告警管理器的其他职责还有：\n - 过滤、合并和去重告警。例如，如果单个实例的告警被多次触发，只生成一个告警事件。\n - 访问控制 —— 把告警管理操作限制给特定人员非常重要。\n - 重试 —— 管理器保证告警至少被传递一次。<\/p>\n<p>告警存储是一个键值数据库（如 Cassandra），它保存所有告警的状态。它保证通知至少被发送一次。\n一旦告警被触发，就会被发布到 Kafka。<\/p>\n<p>最后，告警消费者从 Kafka 拉取告警数据，并通过不同渠道发送通知 —— 电子邮件、短信、PagerDuty、webhooks。<\/p>\n<p>在现实世界中，告警系统有许多现成的解决方案。很难论证为什么要自己从零搭建一个内部系统。<\/p>\n<h3><strong>可视化系统<\/strong><\/h3>\n<p>可视化系统展示一段时间内的指标和告警。下面是一个用 Grafana 搭建的仪表盘：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/grafana-dashboard.png\" alt=\"Grafana 仪表盘\" width=\"500\" />\n<\/div>\n\n<p>一个高质量的可视化系统非常难搭建。很难论证为什么不直接用像 Grafana 这样的现成方案。<\/p>\n<hr />\n<h2>第 4 步：收尾<\/h2>\n<p>下面是我们的最终设计：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"20. Metrics Monitoring and Alerting System/images/final-design.png\" alt=\"最终设计\" width=\"500\" />\n<\/div>", "enTitle": "Chapter 20: Metrics Monitoring and Alerting System", "zhTitle": "第 20 章：指标监控与告警系统", "short": "Metrics Monitoring and Alerting System", "num": "20"}, "21. Ad Click Event Aggregation": {"en": "\n<h2>Introduction<\/h2>\n<p><strong>Digital advertising<\/strong> is a big industry with the rise of Facebook, YouTube, TikTok, etc.<\/p>\n<p>Hence, tracking ad click events is important. In this chapter, we explore how to design an <strong>ad click event aggregation<\/strong> system at Facebook/Google scale.<\/p>\n<p>Digital advertising has a process called <strong>real-time bidding (RTB)<\/strong>, where digital advertising inventory is bought and sold:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/digital-advertising-example.png\" alt=\"digital-advertising-example\" width=\"500\" />\n<\/div>\n\n<p>Speed of RTB is important as it usually occurs within a second.\nData accuracy is also very important as it impacts how much money advertisers pay.<\/p>\n<p>Based on ad click event aggregations, advertisers can make decisions such as adjust target audience and keywords.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: What is the format of the input data?<\/li>\n<li>I: 1bil ad clicks per day and 2mil ads in total. Number of ad-click events grows 30% year-over-year.<\/li>\n<li>C: What are some of the most important queries our system needs to support?<\/li>\n<li>I: Top queries to take into consideration:<\/li>\n<li>Return number of click events for ad X in last Y minutes<\/li>\n<li>Return top 100 most clicked ads in the past 1min. Both parameters should be configurable. Aggregation occurs every minute.<\/li>\n<li>Support data filtering by <code>ip<\/code>, <code>user_id<\/code>, <code>country<\/code> for the above queries<\/li>\n<li>C: Do we need to worry about edge cases? Some of the ones I can think of:<\/li>\n<li>There might be events that arrive later than expected<\/li>\n<li>There might be duplicate events<\/li>\n<li>Different parts of the system might be down, so we need to consider system recovery<\/li>\n<li>I: That's a good list, take those into consideration<\/li>\n<li>C: What is the latency requirement?<\/li>\n<li>I: A few minutes of e2e latency for ad click aggregation. For RTB, it is less than a second. It is ok to have that latency for ad click aggregation as those are usually used for billing and reporting.<\/li>\n<\/ul>\n<h3><strong>Functional requirements<\/strong><\/h3>\n<ul>\n<li>Aggregate the number of clicks of <code>ad_id<\/code> in the last Y minutes<\/li>\n<li>Return top 100 most clicked <code>ad_id<\/code> every minute<\/li>\n<li>Support aggregation filtering by different attributes<\/li>\n<li>Dataset volume is at Facebook or Google scale<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li>Correctness of the aggregation result is important as it's used for RTB and ads billing<\/li>\n<li>Properly handle delayed or duplicate events<\/li>\n<li>Robustness - system should be resilient to partial failures<\/li>\n<li>Latency - a few minutes of e2e latency at most<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<ul>\n<li>1bil DAU<\/li>\n<li>Assuming user clicks 1 ad per day -&gt; 1bil ad clicks per day<\/li>\n<li>Ad click QPS = 10,000<\/li>\n<li>Peak QPS is 5 times the number = 50,000<\/li>\n<li>A single ad click occupies 0.1KB storage. Daily storage requirement is 100gb<\/li>\n<li>Monthly storage = 3tb<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>In this section, we discuss query API design, data model and high-level design.<\/p>\n<h3><strong>Query API Design<\/strong><\/h3>\n<p>The API is a contract between the client and the server. In our case, the client is the dashboard user - data scientist/analyst, advertiser, etc.<\/p>\n<p>Here's our functional requirements:\n - Aggregate the number of clicks of <code>ad_id<\/code> in the last Y minutes\n - Return top N most clicked <code>ad_id<\/code> in the last M minutes\n - Support aggregation filtering by different attributes<\/p>\n<p>We need two endpoints to achieve those requirements. Filtering can be done via query parameters on one of them.<\/p>\n<p><strong>Aggregate number of clicks of ad_id in the last M minutes<\/strong>:<\/p>\n<pre><code>GET /v1/ads/{:ad_id}/aggregated_count\n<\/code><\/pre>\n<p>Query parameters:\n - from - start minute. Default is now - 1 min\n - to - end minute. Default is now\n - filter - identifier for different filtering strategies. Eg 001 means \"non-US clicks\".<\/p>\n<p>Response:\n - ad_id - ad identifier\n - count - aggregated count between start and end minutes<\/p>\n<p><strong>Return top N most clicked ad_ids in the last M minutes<\/strong><\/p>\n<pre><code>GET /v1/ads/popular_ads\n<\/code><\/pre>\n<p>Query parameters:\n - count - top N most clicked ads\n - window - aggregation window size in minutes\n - filter - identifier for different filtering strategies<\/p>\n<p>Response:\n - list of ad_ids<\/p>\n<h3><strong>Data model<\/strong><\/h3>\n<p>In our system, we have raw and aggregated data.<\/p>\n<p>Raw data looks like this:<\/p>\n<pre><code>[AdClickEvent] ad001, 2021-01-01 00:00:01, user 1, 207.148.22.22, USA\n<\/code><\/pre>\n<p>Here's an example in a structured format:\n| ad_id | click_timestamp     | user  | ip            | country |\n|-------|---------------------|-------|---------------|---------|\n| ad001 | 2021-01-01 00:00:01 | user1 | 207.148.22.22 | USA     |\n| ad001 | 2021-01-01 00:00:02 | user1 | 207.148.22.22 | USA     |\n| ad002 | 2021-01-01 00:00:02 | user2 | 209.153.56.11 | USA     |<\/p>\n<p>Here's the aggregated version:\n| ad_id | click_minute | filter_id | count |\n|-------|--------------|-----------|-------|\n| ad001 | 202101010000 | 0012      | 2     |\n| ad001 | 202101010000 | 0023      | 3     |\n| ad001 | 202101010001 | 0012      | 1     |\n| ad001 | 202101010001 | 0023      | 6     |<\/p>\n<p>The <code>filter_id<\/code> helps us achieve our filtering requirements.\n| filter_id | region | IP        | user_id |\n|-----------|--------|-----------|---------|\n| 0012      | US     | *         | *       |\n| 0013      | *      | 123.1.2.3 | *       |<\/p>\n<p>To support quickly returning top N most clicked ads in the last M minutes, we'll also maintain this structure:\n| most_clicked_ads   |           |                                                  |\n|--------------------|-----------|--------------------------------------------------|\n| window_size        | integer   | The aggregation window size (M) in minutes       |\n| update_time_minute | timestamp | Last updated timestamp (in 1-minute granularity) |\n| most_clicked_ads   | array     | List of ad IDs in JSON format.                   |<\/p>\n<p>What are some pros and cons between storing raw data and storing aggregated data?\n - Raw data enables using the full data set and supports data filtering and recalculation\n - On the other hand, aggregated data allows us to have a smaller data set and a faster query\n - Raw data means having a larger data store and a slower query\n - Aggregated data, however, is derived data, hence there is some data loss.<\/p>\n<p>In our design, we'll use a combination of both approaches:\n - It's a good idea to keep the raw data around for debugging. If there is some bug in aggregation, we can discover the bug and backfill.\n - Aggregated data should be stored as well for faster query performance.\n - Raw data can be stored in cold storage to avoid extra storage costs.<\/p>\n<p>When it comes to the database, there are several factors to take into consideration:\n - What does the data look like? Is it relational, document or blob?\n - Is the workload read-heavy, write-heavy or both?\n - Are transactions needed?\n - Do the queries rely on OLAP functions like SUM and COUNT?<\/p>\n<p>For the raw data, we can see that the average QPS is 10k and peak QPS is 50k, so the system is write-heavy.\nOn the other hand, read traffic is low as raw data is mostly used as backup if anything goes wrong.<\/p>\n<p>Relational databases can do the job, but it can be challenging to scale the writes. \nAlternatively, we can use Cassandra or InfluxDB which have better native support for heavy write loads.<\/p>\n<p>Another option is to use Amazon S3 with a columnar data format like ORC, Parquet or AVRO. Since this setup is unfamiliar, we'll stick to Cassandra.<\/p>\n<p>For aggregated data, the workload is both read and write heavy as aggregated data is constantly queried for dashboards and alerts.\nIt is also write-heavy as data is aggregated and written every minute by the aggregation service. \nHence, we'll use the same data store (Cassandra) here as well.<\/p>\n<h3><strong>High-level design<\/strong><\/h3>\n<p>Here's how our system looks like:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/high-level-design-1.png\" alt=\"high-level-design-1\" width=\"500\" />\n<\/div>\n\n<p>Data flows as an unbounded data stream on both inputs and outputs.<\/p>\n<p>In order to avoid having a synchronous sink, where a consumer crashing can cause the whole system to stall, \nwe'll leverage asynchronous processing using message queues (Kafka) to decouple consumers and producers.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/high-level-design-2.png\" alt=\"high-level-design-2\" width=\"500\" />\n<\/div>\n\n<p>The first message queue stores ad click event data:\n| ad_id | click_timestamp | user_id | ip | country |\n|-------|-----------------|---------|----|---------|<\/p>\n<p>The second message queue contains ad click counts, aggregated per-minute:\n| ad_id | click_minute | count |\n|-------|--------------|-------|<\/p>\n<p>As well as top N clicked ads aggregated per minute:\n| update_time_minute | most_clicked_ads |\n|--------------------|------------------|<\/p>\n<p>The second message queue is there in order to achieve end to end exactly-once atomic commit semantics:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/atomic-commit.png\" alt=\"atomic-commit\" width=\"500\" />\n<\/div>\n\n<p>For the aggregation service, using the MapReduce framework is a good option:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/ad-count-map-reduce.png\" alt=\"ad-count-map-reduce\" width=\"500\" />\n<\/div>\n\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/top-100-map-reduce.png\" alt=\"top-100-map-reduce\" width=\"500\" />\n<\/div>\n\n<p>Each node is responsible for one single task and it sends the processing result to the downstream node.<\/p>\n<p>The map node is responsible for reading from the data source, then filtering and transforming the data.<\/p>\n<p>For example, the map node can allocate data across different aggregation nodes based on the <code>ad_id<\/code>:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/map-node.png\" alt=\"map-node\" width=\"500\" />\n<\/div>\n\n<p>Alternatively, we can distribute ads across Kafka partitions and let the aggregation nodes subscribe directly within a consumer group.\nHowever, the mapping node enables us to sanitize or transform the data before subsequent processing.<\/p>\n<p>Another reason might be that we don't have control over how data is produced, \nso events related to the same <code>ad_id<\/code> might go on different partitions.<\/p>\n<p>The aggregate node counts ad click events by <code>ad_id<\/code> in-memory every minute.<\/p>\n<p>The reduce node collects aggregated results from aggregate node and produces the final result:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/reduce-node.png\" alt=\"reduce-node\" width=\"500\" />\n<\/div>\n\n<p>This DAG model uses the MapReduce paradigm. It takes big data and leverages parallel distributed computing to turn it into regular-sized data.<\/p>\n<p>In the DAG model, intermediate data is stored in-memory and different nodes communicate with each other using TCP or shared memory.<\/p>\n<p>Let's explore how this model can now help us to achieve our various use-cases.<\/p>\n<p><strong>Use-case 1 - aggregate the number of clicks<\/strong>:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/use-case-1.png\" alt=\"use-case-1\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Ads are partitioned using <code>ad_id % 3<\/code><\/li>\n<\/ul>\n<p><strong>Use-case 2 - return top N most clicked ads<\/strong>:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/use-case-2.png\" alt=\"use-case-2\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>In this case, we're aggregating the top 3 ads, but this can be extended to top N ads easily<\/li>\n<li>Each node maintains a heap data structure for fast retrieval of top N ads<\/li>\n<\/ul>\n<p><strong>Use-case 3 - data filtering<\/strong>:\nTo support fast data filtering, we can predefine filtering criterias and pre-aggregate based on it:\n| ad_id | click_minute | country | count |\n|-------|--------------|---------|-------|\n| ad001 | 202101010001 | USA     | 100   |\n| ad001 | 202101010001 | GPB     | 200   |\n| ad001 | 202101010001 | others  | 3000  |\n| ad002 | 202101010001 | USA     | 10    |\n| ad002 | 202101010001 | GPB     | 25    |\n| ad002 | 202101010001 | others  | 12    |<\/p>\n<p>This technique is called the <strong>star schema<\/strong> and is widely used in data warehouses.\nThe filtering fields are called <strong>dimensions<\/strong>.<\/p>\n<p>This approach has the following benefits:\n - Simple to undertand and build\n - Current aggregation service can be reused to create more dimensions in the star schema.\n - Accessing data based on filtering criteria is fast as results are pre-calculated<\/p>\n<p>A limitation of this approach is that it creates many more buckets and records, especially when we have lots of filtering criterias.<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>Let's dive deeper into some of the more interesting topics.<\/p>\n<h3><strong>Streaming vs. Batching<\/strong><\/h3>\n<p>The high-level archi
