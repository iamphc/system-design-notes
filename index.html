"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/snapshot-approach.png\" alt=\"快照方案\" width=\"500\" />\n<\/div>\n\n<h3><strong>可靠的高性能事件溯源<\/strong><\/h3>\n<p>到目前为止做的所有优化都很好，但它们让我们的服务变成了有状态服务。为了可靠性，我们需要引入某种形式的复制。<\/p>\n<p>在此之前，我们应该分析系统中哪些数据需要高可靠性：\n * 状态和快照总是可以通过事件列表重新生成。因此我们只需要保证事件列表的可靠性。\n * 有人可能认为我们总能从命令列表重新生成事件列表，但这不对，因为命令是非确定性的。\n * 结论：我们只需要为事件列表保证高可靠性。<\/p>\n<p>为了实现事件的高可靠性，我们需要把事件列表复制到多个节点上。我们需要保证：\n * 不丢失数据\n * 日志文件内数据的相对顺序在各副本之间保持一致<\/p>\n<p>为实现这一点，我们可以使用共识算法，例如 Raft。<\/p>\n<p>使用 Raft 时，有一个活跃的 leader 和若干被动的 follower。如果 leader 宕机，某个 follower 会接替。只要超过一半的节点存活，系统就能继续运行。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/raft-replication.png\" alt=\"Raft 复制\" width=\"500\" />\n<\/div>\n\n<p>使用这种方案，所有节点都基于事件列表更新状态。Raft 保证 leader 和 follower 拥有相同的事件列表。<\/p>\n<h3><strong>分布式事件溯源<\/strong><\/h3>\n<p>到目前为止，我们已经设计出一个单节点性能高且可靠的系统。<\/p>\n<p>我们还必须解决一些局限：\n * 单个 Raft 组的容量有限。到一定阶段，我们需要对数据分片并实现分布式事务\n * 在 CQRS 架构中，请求/响应流程较慢。客户端需要定期轮询系统，才能知道自己的钱包何时更新<\/p>\n<p>轮询不是实时的，因此用户可能要过一段时间才能得知余额更新。另外，如果轮询频率过高，还可能压垮查询服务：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/polling-approach.png\" alt=\"轮询方案\" width=\"500\" />\n<\/div>\n\n<p>为缓解系统负载，我们可以引入一个反向代理，由它代表用户发送命令并代用户轮询响应：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/reverse-proxy.png\" alt=\"反向代理\" width=\"500\" />\n<\/div>\n\n<p>这样我们可以用单个请求为多个用户拉取数据，从而减轻系统负载，但它仍然没有解决实时接收的问题。<\/p>\n<p>最后一个可以做的改动是：让只读状态机在响应就绪后把响应推回给反向代理。这能让用户感觉更新是实时发生的：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/push-state-machines.png\" alt=\"推送式状态机\" width=\"500\" />\n<\/div>\n\n<p>最后，为了让系统进一步扩展，我们可以把系统分片成多个 Raft 组，并在其上用一个协调者（orchestrator）通过 TC/C 或 Saga 实现分布式事务：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/sharded-raft-groups.png\" alt=\"分片的 Raft 组\" width=\"500\" />\n<\/div>\n\n<p>下面是最终系统中一笔余额转账请求的生命周期示例：\n * 用户 A 向 Saga 协调者发送一个分布式事务，包含两个操作——<code>A-1<\/code> 和 <code>C+1<\/code>\n * Saga 协调者在阶段状态表中创建一条记录，以追踪该事务的状态\n * 协调者确定需要向哪些分区发送命令\n * 分区 1 的 Raft leader 收到 <code>A-1<\/code> 命令，校验它，把它转换成事件，并在 Raft 组内其他节点上复制\n * 事件结果被同步到只读状态机，后者把响应推回给协调者\n * 协调者创建一条记录表明该操作成功，然后继续执行下一个操作——<code>C+1<\/code>\n * 下一个操作的执行方式与第一个类似——确定分区、发送命令、执行、只读状态机推回响应\n * 协调者创建一条记录表明操作 2 也成功，最终把结果告知客户端<\/p>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>我们设计的演进过程如下：\n * 最初我们用内存版 Redis 的方案。这个方案的问题在于它不是持久存储。\n * 接着我们改用关系数据库，并在其上通过 2PC、TC/C 或分布式 Saga 执行分布式事务。\n * 然后，为了让所有操作都可审计，我们引入了事件溯源。\n * 一开始我们用外部数据库和队列把数据存到外部存储，但那样性能不佳。\n * 于是我们改用本地文件存储，利用追加写操作的性能优势；同时用缓存优化读路径。\n * 上一个方案虽然性能好，但不持久。因此我们引入了带复制的 Raft 共识，以避免单点故障。\n * 我们还引入了带反向代理的 CQRS，代表用户管理事务的生命周期。\n * 最后，我们把数据分片到多个 Raft 组上，并通过分布式事务机制——TC/C 或分布式 Saga——对它们进行编排。<\/p>", "enTitle": "Chapter 27: Digital Wallet", "zhTitle": "第 27 章：数字钱包", "short": "Digital Wallet", "num": "27"}, "28. Stock Exchange": {"en": "\n<h2>Introduction<\/h2>\n<p>We'll design an <strong>electronic stock exchange<\/strong> in this chapter.<\/p>\n<p>Its basic function is to efficiently match buyers and sellers.<\/p>\n<p>Major stock exchanges are <strong>NYSE<\/strong>, <strong>NASDAQ<\/strong>, among others.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/world-stock-exchanges.png\" alt=\"world-stock-exchanges\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design scope<\/h2>\n<ul>\n<li>C: Which securities are we going to trade? Stocks, options or futures?<\/li>\n<li>I: Only stocks for simplicity<\/li>\n<li>C: Which order types are supported - place, cancel, replace? What about limit, market, conditional orders?<\/li>\n<li>I: We need to support placing and canceling an order. We need to only consider limit orders for the order type.<\/li>\n<li>C: Does the system need to support after hours trading?<\/li>\n<li>I: No, just normal trading hours<\/li>\n<li>C: Could you describe the exchange's basic functions?<\/li>\n<li>I: Clients can place or cancel limit orders and receive matched trades in real-time. They should be able to see the order book in real time.<\/li>\n<li>C: What's the scale of the exchange?<\/li>\n<li>I: Tens of thousands of users trading at the same time and ~100 symbols. Billions of orders per day. We need to also support risk checks for compliance.<\/li>\n<li>C: What kind of risk checks?<\/li>\n<li>I: Let's do simple risk checks - eg limiting a user to trade only 1mil apple stocks in a day<\/li>\n<li>C: How about user wallet engagement?<\/li>\n<li>I: We need to ensure clients have sufficient funds before placing orders. Funds meant for pending orders need to be withheld until order is finalized.<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<p>The scale mentioned by the interviewer hints that we are to design a small to medium scale exchange.\nWe need to also ensure flexibility to support more symbols and users in the future.<\/p>\n<p>Other non-functional requirements:\n * Availability - At least 99.99%. Downtime can harm reputation\n * Fault tolerance - fault tolerance and a fast recovery mechanism are needed to limit the impact of a production incident\n * Latency - Round-trip latency should be in the ms level with focus on 99th percentile. Persistently high 99p latency causes bad experience for a handful or users.\n * Security - We should have an account management system. For legal compliance, we need to support KYC to verify user identity. We should also protect against DDoS for public resources.<\/p>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<ul>\n<li>100 symbols, 1bil orders per day<\/li>\n<li>Normal trading hours are from 09:30 to 16:00 (6.5h)<\/li>\n<li>QPS = 1bil / 6.5 / 3600 = 43000<\/li>\n<li>Peak QPS = 5*QPS = 215000<\/li>\n<li>Trading volume is significantly higher when the market opens<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3><strong>Business Knowledge 101<\/strong><\/h3>\n<p>Let's discuss some basic concepts, related to an exchange.<\/p>\n<p>A broker mediates interactions between an exchange and end users - Robinhood, Fidelity, etc.<\/p>\n<p>Institutional clients trade in large quantities using specialized trading software. They need specialized treatment.\nEg order splitting when trading in large volumes to avoid impacting the market.<\/p>\n<p>Types of orders:\n * Limit - buy or sell at a fixed price. It might not find a match immediately or it might be partially matched.\n * Market - doesn't specify a price. Executed at the current market price immediately.<\/p>\n<p>Prices:\n * Bid - highest price a buyer is willing to buy a stock\n * Ask - lowest price a seller is willing to sell a stock<\/p>\n<p>The US market has three tiers of price quotes - L1, L2, L3.<\/p>\n<p>L1 market data contains best bid/ask prices and quantities:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l1-price.png\" alt=\"l1-price\" width=\"500\" />\n<\/div>\n\n<p>L2 includes more price levels:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l2-price.png\" alt=\"l2-price\" width=\"500\" />\n<\/div>\n\n<p>L3 shows levels and queued quantity at each level:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l3-price.png\" alt=\"l3-price\" width=\"500\" />\n<\/div>\n\n<p>A candlestick shows the market open and close price, as well as the highest and lowest prices in the given interval:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/candlestick.png\" alt=\"candlestick\" width=\"500\" />\n<\/div>\n\n<p>FIX is a protocol for exchanging securities transaction information, used by most vendors. Example securities transaction:<\/p>\n<pre><code>8=FIX.4.2 | 9=176 | 35=8 | 49=PHLX | 56=PERS | 52=20071123-05:30:00.000 | 11=ATOMNOCCC9990900 | 20=3 | 150=E | 39=E | 55=MSFT | 167=CS | 54=1 | 38=15 | 40=2 | 44=15 | 58=PHLX EQUITY TESTING | 59=0 | 47=C | 32=0 | 31=0 | 151=15 | 14=0 | 6=0 | 10=128 |\n<\/code><\/pre>\n<h3><strong>High-level design<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/high-level-design.png\" alt=\"high-level-design\" width=\"500\" />\n<\/div>\n\n<p>Trade flow:\n * Client places order via trading interface\n * Broker sends the order to the exchange\n * Order enters exchange through client gateway, which validates, rate limits, authenticates, etc. Order is forwarded to order manager.\n * Order manager performs risk checks based on rules set by the risk manager\n * After passing risk checks, order manager verifies there are sufficient funds in the wallet for the order\n * Order is sent to matching engine. When match is found, matching engine emits two executions (called fills) for buy and sell. Both orders are sequenced so that they're deterministic.\n * Executions are returned to the client.<\/p>\n<p>Market data flow (M1-M3):\n * matching engine generates a stream of executions, sent to the market data publisher\n * Market data publisher constructs the candlestick charts and sends them to the data service\n * Market data is stored in specialized storage for real-time analytics. Brokers connect to the data service for timely market data.<\/p>\n<p>Reporter flow (R1-R2):\n * reporter collects all necessary reporting fields from orders and executions and writes them to DB\n * reporting fields - client_id, price, quantity, order_type, filled_quantity, remaining_quantity<\/p>\n<p>Trading flow is on the critical path, whereas the rest of the flows are not, hence, latency requirements differ between them.<\/p>\n<h4>Trading flow<\/h4>\n<p>The trading flow is on the critical path, hence, it should be highly optimized for low latency.<\/p>\n<p>The matching engine is at its heart, also called the cross engine. Primary responsibilities:\n * Maintain the order book for each symbol - a list of buy/sell orders for a symbol.\n * Match buy and sell orders - a match results in two executions (fills), with one each for the buy and sell sides. This function must be fast and accurate\n * Distribute the execution stream as market data\n * Matches must be produced in a deterministic order. Foundational for high availability<\/p>\n<p>Next is the sequencer - it is the key component making the matching engine deterministic by stamping each inbound order and outbound fill with a sequence ID.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/sequencer.png\" alt=\"sequencer\" width=\"500\" />\n<\/div>\n\n<p>We stamp inbound orders and outbound fills for several reasons:\n * timeliness and fairness\n * fast recovery/replay\n * exactly-once guarantee<\/p>\n<p>Conceptually, we could use Kafka as our sequencer since it's effectively an inbound and outbound message queue. However, we're going to implement it ourselves in order to achieve lower latency.<\/p>\n<p>The order manager manages the orders state. It also interacts with the matching engine - sending orders and receiving fills.<\/p>\n<p>The order manager's responsibilities:\n * Sends orders for risk checks - eg verifying user's trade volume is less than 1mil\n * Checks the order against the user wallet and verifies there are sufficient funds to execute it\n * It sends the order to the sequencer and on to the matching engine. To reduce bandwidth, only necessary order information is passed to the matching engine\n * Executions (fills) are received back from the sequencer, where they are then send to the brokers via the client gateway<\/p>\n<p>The main challenge with implementing the order manager is the state transition management. Event sourcing is one viable solution (discussed in deep dive).<\/p>\n<p>Finally, the client gateway receives orders from users and sends them to the order manager. Its responsibilities:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/client-gateway.png\" alt=\"client-gateway\" width=\"500\" />\n<\/div>\n\n<p>Since the client gateway is on the critical path, it should stay lightweight.<\/p>\n<p>There can be multiple client gateways for different clients. Eg a colo engine is a trading engine server, rented by the broker in the exchange's data center:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/client-gateways.png\" alt=\"client-gateways\" width=\"500\" />\n<\/div>\n\n<h4>Market data flow<\/h4>\n<p>The market data publisher receives executions from the matching engine and builds the order book/candlestick charts from the execution stream.<\/p>\n<p>That data is sent to the data service, which is responsible for showing the aggregated data to subscribers:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/market-data.png\" alt=\"market-data\" width=\"500\" />\n<\/div>\n\n<h4>Reporting flow<\/h4>\n<p>The reporter is not on the critical path, but it is an important component nevertheless.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/reporting-flow.png\" alt=\"reporting-flow\" width=\"500\" />\n<\/div>\n\n<p>It is responsible for trading history, tax reporting, compliance reporting, settlements, etc.\nLatency is not a critical requirement for the reporting flow. Accuracy and compliance are more important.<\/p>\n<h3><strong>API Design<\/strong><\/h3>\n<p>Clients interact with the stock exchange via the brokers to place orders, view executions, market data, download historical data for analysis, etc.<\/p>\n<p>We use a RESTful API for communication between the client gateway and the brokers.<\/p>\n<p>For institutional clients, a proprietary protocol is used to satisfy their low-latency requirements.<\/p>\n<p>Create order:<\/p>\n<pre><code>POST /v1/order\n<\/code><\/pre>\n<p>Parameters:\n * symbol - the stock symbol. String\n * side - buy or sell. String\n * price - the price of the limit order. Long\n * orderType - limit or market (we only support limit orders in our design). String\n * quantity - the quantity of the order. Long<\/p>\n<p>Response:\n * id - the ID of the order. Long\n * creationTime - the system creation time of the order. Long\n * filledQuantity - the quantity that has been successfully executed. Long\n * remainingQuantity - the quantity still to be executed. Long\n * status - new/canceled/filled. String\n * rest of the attributes are the same as the input parameters<\/p>\n<p>Get execution:<\/p>\n<pre><code>GET /execution?symbol={:symbol}&amp;orderId={:orderId}&amp;startTime={:startTime}&amp;endTime={:endTime}\n<\/code><\/pre>\n<p>Parameters:\n * symbol - the stock symbol. String\n * orderId - the ID of the order. Optional. String\n * startTime - query start time in epoch [11]. Long\n * endTime - query end time in epoch. Long<\/p>\n<p>Response:\n * executions - array with each execution in scope (see attributes below). Array\n * id - the ID of the execution. Long\n * orderId - the ID of the order. Long\n * symbol - the stock symbol. String\n * side - buy or sell. String\n * price - the price of the execution. Long\n * orderType - limit or market. String\n * quantity - the filled quantity. Long<\/p>\n<p>Get order book:<\/p>\n<pre><code>GET /marketdata/orderBook/L2?symbol={:symbol}&amp;depth={:depth}\n<\/code><\/pre>\n<p>Parameters:\n * symbol - the stock symbol. String\n * depth - order book depth per side. Int<\/p>\n<p>Response:\n * bids - array with price and size. Array\n * asks - array with price and size. Array<\/p>\n<p>get candlesticks:<\/p>\n<pre><code>GET /marketdata/candles?symbol={:symbol}&amp;resolution={:resolution}&amp;startTime={:startTime}&amp;endTime={:endTime}\n<\/code><\/pre>\n<p>Parameters:\n * symbol - the stock symbol. String\n * resolution - window length of the candlestick chart in seconds. Long\n * startTime - start time of the window in epoch. Long\n * endTime - end time of the window in epoch. Long<\/p>\n<p>Response:\n * candles - array with each candlestick data (attributes listed below). Array\n * open - open price of each candlestick. Double\n * close - close price of each candlestick. Double\n * high - high price of each candlestick. Double\n * low - low price of each candlestick. Double<\/p>\n<h3><strong>Data models<\/strong><\/h3>\n<p>There are three main types of data in our exchange:\n * Product, order, execution\n * order book\n * candlestick chart<\/p>\n<h4>Product, order, execution<\/h4>\n<p>Products describe the attributes of a traded symbol - product type, trading symbol, UI display symbol, etc.<\/p>\n<p>This data doesn't change frequently, it is primarily used for rendering in a UI.<\/p>\n<p>An order represents an instruction for a buy/sell order. Executions are outbound matched result.<\/p>\n<p>Here's the data model:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/product-order-execution-data-model.png\" alt=\"product-order-execution-data-model\" width=\"500\" />\n<\/div>\n\n<p>We encounter orders and executions in all of our three flows:\n * in the critical path, they are processed in-memory for high performance. They are stored and recovered from the sequencer.\n * The reporter writes orders and executions to the database for reporting use-cases\n * Executions are forwarded to market data to reconstruct the order book and candlestick chart<\/p>\n<h4>Order book<\/h4>\n<p>The order book is a list of buy/sell orders for an instrument, organized by price level.<\/p>\n<p>An efficient data structure for this model, needs to satisfy:\n * constant lookup time - getting volume at price level or between price levels\n * fast add/execute/cancel operations\n * query best bid/ask price\n * iterate through price levels<\/p>\n<p>Example order book execution:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/order-book-execution.png\" alt=\"order-book-execution\" width=\"500\" />\n<\/div>\n\n<p>After fulfilling this large order, the price increases as the bid/ask spread widens.<\/p>\n<p>Example order book implementation in pseudo code:<\/p>\n<pre><code>class PriceLevel{\n    private Price limitPrice;\n    private long totalVolume;\n    private List&lt;Order&gt; orders;\n}\n\nclass Book&lt;Side&gt; {\n    private Side side;\n    private Map&lt;Price, PriceLevel&gt; limitMap;\n}\n\nclass OrderBook {\n    private Book&lt;Buy&gt; buyBook;\n    private Book&lt;Sell&gt; sellBook;\n    private PriceLevel bestBid;\n    private PriceLevel bestOffer;\n    private Map&lt;OrderID, Order&gt; orderMap;\n}\n<\/code><\/pre>\n<p>For a more efficient implementation, we can use a doubly-linked list instead of a standard list:\n * Placing a new order is O(1), because we're adding an order to the tail of the list.\n * Matching an order is O(1), because we are deleting an order from the head\n * Canceling an order means deleting an order from the order book. We utilize <code>orderMap<\/code> for O(1) lookup and O(1) delete (due to the <code>Order<\/code> having a reference to the previous element in the list).<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/order-book-impl.png\" alt=\"order-book-impl\" width=\"500\" />\n<\/div>\n\n<p>This data structure is also used in the market data services to reconstruct the order book.<\/p>\n<h4>Candlestick chart<\/h4>\n<p>The candlestick data is calcualated within the market data services based on processing orders in a time interval:<\/p>\n<pre><code>class Candlestick {\n    private long openPrice;\n    private long closePrice;\n    private long highPrice;\n    private long lowPrice;\n    private long volume;\n    private long timestamp;\n    private int interval;\n}\n\nclass CandlestickChart {\n    private LinkedList&lt;Candlestick&gt; sticks;\n}\n<\/code><\/pre>\n<p>Some optimizations to avoid consuming too much memory:\n * Use pre-allocated ring buffers to hold sticks to reduce the allocation number\n * Limit the number of sticks in memory and persist the rest to disk<\/p>\n<p>We'll use an in-memory columnar database (eg KDB) for real-time analytics. After market close, data is persisted in historical database.<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>One interesting thing to be aware of about modern exchanges is that unlike most other software, they typically run everything on one gigantic server.<\/p>\n<p>Let's explore the details.<\/p>\n<h3><strong>Performance<\/strong><\/h3>\n<p>For an exchange, it is very important to have good overall latency for all percentiles.<\/p>\n<p>How can we reduce latency?\n * Reduce the number of tasks on the critical path\n * Shorten the time spent on each task by reducing network/disk usage and/or reducing task execution time<\/p>\n<p>To achieve the first goal, we're stripped the critical path from all extraneous responsibility, even logging is removed to achieve optimal latency.<\/p>\n<p>If we follow the original design, there are several bottlenecks - network latency between services and disk usage of the sequencer.<\/p>\n<p>With such a design we can achieve tens of milliseconds end to end latency. We want to achieve tens of microseconds instead.<\/p>\n<p>Hence, we'll put everything on one server and processes are going to communicate via mmap as an event store:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/mmap-bus.png\" alt=\"mmap-bus\" width=\"500\" />\n<\/div>\n\n<p>Another optimization is using an application loop (while loop executing mission-critical tasks), pinned to the same CPU to avoid context switching:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/application-loop.png\" alt=\"application-loop\" width=\"500\" />\n<\/div>\n\n<p>Another side effect of using an application loop is that there is no lock contention - multiple threads fighting for the same resource.<\/p>\n<p>Let's now explore how mmap works - it is a UNIX syscall, which maps a file on disk to an application's memory.<\/p>\n<p>One trick we can use is creating the file in <code>/dev/shm<\/code>, which stands for \"shared memory\". Hence, we have no disk access at all.<\/p>\n<h3><strong>Event sourcing<\/strong><\/h3>\n<p>Event sourcing is discussed in-depth in the <a href=\"../chapter28\">digital wallet chapter<\/a>. Reference it for all the details.<\/p>\n<p>In a nutshell, instead of storing current states, we store immutable state transitions:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/event-sourcing.png\" alt=\"event-sourcing\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>On the left - traditional schema<\/li>\n<li>On the right - event source schema<\/li>\n<\/ul>\n<p>Here's how our design looks like thus far:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/design-so-far.png\" alt=\"design-so-far\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>external domain interacts with our client gateway using the FIX protocol<\/li>\n<li>Order manager receives the new order event, validates it and adds it to its internal state. Order is then sent to matching core<\/li>\n<li>If order is matched, the <code>OrderFilledEvent<\/code> is generated and sent over mmap<\/li>\n<li>Other components subscribe to the event store and do their part of the processing<\/li>\n<\/ul>\n<p>One additional optimizations - all components hold a copy of the order manager, which is packaged as a library to avoid extra calls for managing orders<\/p>\n<p>The sequencer in this design, changes to not be an event store, but be a single writer, sequencing events before forwarding them to the event store:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/sequencer-deep-dive.png\" alt=\"sequencer-deep-dive\" width=\"500\" />\n<\/div>\n\n<h3><strong>High availability<\/strong><\/h3>\n<p>We aim for 99.99% availability - only 8.64s of downtime per day.<\/p>\n<p>To achieve that, we have to identify single-point-of-failures in the exchange architecture:\n * setup backup instances of critical services (eg matching engine) which are on stand-by\n * aggressively automate failure detection and failover to the backup instance<\/p>\n<p>Stateless services such as the client gateway can easily be horizontally scaled by adding more servers.<\/p>\n<p>For stateful components, we can process inbound events, but not publish outbound events if we're not the leader:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/leader-election.png\" alt=\"leader-election\" width=\"500\" />\n<\/div>\n\n<p>To detect the primary replica being down, we can send heartbeats to detect that its non-functional.<\/p>\n<p>This mechanism only works within the boundary of a single server. \nIf we want to extend it, we can setup an entire server as hot/warm replica and failover in case of failure.<\/p>\n<p>To replicate the event store across the replicas, we can use reliable UDP for faster communication.<\/p>\n<h3><strong>Fault tolerance<\/strong><\/h3>\n<p>What if even the warm instances go down? It is a low probability event but we should be ready for it.<\/p>\n<p>Large tech companies tackle this problem by replicating core data to data centers in multiple cities to mitigate eg natural disasters.<\/p>\n<p>Questions to consider:\n * If the primary instance is down, how and when do we failover to the backup instance?\n * How do we choose the leader among the backup instances?\n * What is the recovery time needed (RTO - recovery time objective)?\n * What functionalities need to be recovered? Can our system operate under degraded conditions?<\/p>\n<p>How to address these:\n * System can be down due to a bug (affecting primary and replicas), we can use chaos engineering to surface edge-cases and disastrous outcomes like these\n * Initially though, we could perform failovers manually until we gather sufficient knowledge about the system's failure modes\n * leader-election can be used (eg Raft) to determine which replica becomes the leader in the event of the primary going down<\/p>\n<p>Example of how replication works across different servers:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/replication-across-servers.png\" alt=\"replication-across-servers\" width=\"500\" />\n<\/div>\n\n<p>Example leader-election terms:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/leader-election-terms.png\" alt=\"leader-election-terms\" width=\"500\" />\n<\/div>\n\n<p>For details on how Raft works, <a href=\"https://thesecretlivesofdata.com/raft/\">check this out<\/a><\/p>\n<p>Finally, we need to also consider loss tolerance - how much data can we lose before things get critical?\nThis will determine how often we backup our data.<\/p>\n<p>For a stock exchange, data loss is unacceptable, so we have to backup data often and rely on raft's replication to reduce probability of data loss.<\/p>\n<h3><strong>Matching algorithms<\/strong><\/h3>\n<p>Slight detour on how matching works via pseudo code:<\/p>\n<pre><code>Context handleOrder(OrderBook orderBook, OrderEvent orderEvent) {\n    if (orderEvent.getSequenceId() != nextSequence) {\n        return Error(OUT_OF_ORDER, nextSequence);\n    }\n\n    if (!validateOrder(symbol, price, quantity)) {\n        return ERROR(INVALID_ORDER, orderEvent);\n    }\n\n    Order order = createOrderFromEvent(orderEvent);\n    switch (msgType):\n        case NEW:\n            return handleNew(orderBook, order);\n        case CANCEL:\n            return handleCancel(orderBook, order);\n        default:\n            return ERROR(INVALID_MSG_TYPE, msgType);\n\n}\n\nContext handleNew(OrderBook orderBook, Order order) {\n    if (BUY.equals(order.side)) {\n        return match(orderBook.sellBook, order);\n    } else {\n        return match(orderBook.buyBook, order);\n    }\n}\n\nContext handleCancel(OrderBook orderBook, Order order) {\n    if (!orderBook.orderMap.contains(order.orderId)) {\n        return ERROR(CANNOT_CANCEL_ALREADY_MATCHED, order);\n    }\n\n    removeOrder(order);\n    setOrderStatus(order, CANCELED);\n    return SUCCESS(CANCEL_SUCCESS, order);\n}\n\nContext match(OrderBook book, Order order) {\n    Quantity leavesQuantity = order.quantity - order.matchedQuantity;\n    Iterator&lt;Order&gt; limitIter = book.limitMap.get(order.price).orders;\n    while (limitIter.hasNext() &amp;&amp; leavesQuantity &gt; 0) {\n        Quantity matched = min(limitIter.next.quantity, order.quantity);\n        order.matchedQuantity += matched;\n        leavesQuantity = order.quantity - order.matchedQuantity;\n        remove(limitIter.next);\n        generateMatchedFill();\n    }\n    return SUCCESS(MATCH_SUCCESS, order);\n}\n<\/code><\/pre>\n<p>This matching algorithm uses the FIFO algorithm for determining which orders at a price level to match.<\/p>\n<h3><strong>Determinism<\/strong><\/h3>\n<p>Functional determinism is guaranteed via the sequencer technique we used.<\/p>\n<p>The actual time when the event happens doesn't matter:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/determinism.png\" alt=\"determinism\" width=\"500\" />\n<\/div>\n\n<p>Latency determinism is something we have to track. We can calculate it based on monitoring 99 or 99.99 percentile latency.<\/p>\n<p>Things which can cause latency spikes are garbage collector events in eg Java.<\/p>\n<h3><strong>Market data publisher optimizations<\/strong><\/h3>\n<p>The market data publisher receives matched results from the matching engine and rebuilds the order book and candlestick charts based on them.<\/p>\n<p>We only keep part of the candlesticks as we don't have infinite memory. Clients can choose how much granular info they want. More granular info might require a higher price:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/market-data-publisher.png\" alt=\"market-data-publisher\" width=\"500\" />\n<\/div>\n\n<p>A ring buffer (aka circular buffer) is a fixed-size queue with the head connected to the tail. The space is preallocated to avoid allocations. The data structure is also lock-free.<\/p>\n<p>Another technique to optimize the ring buffer is padding, which ensures the sequence number is never in a cache line with anything else.<\/p>\n<h3><strong>Distribution fairness of market data and multicast<\/strong><\/h3>\n<p>We need to ensure subscribers receive the data at the same time since if one receives data before another, that gives them crucial market insight, which they can use to manipulate the market.<\/p>\n<p>To achieve this, we can use multicast using reliable UDP when publishing data to subscribers.<\/p>\n<p>Data can be transported via the internet in three ways:\n * Unicast - one source, one destination\n * Broadcast - one source to entire subnetwork\n * Multicast - one source to a set of hosts on different subnetworks<\/p>\n<p>In theory, by using multicast, all subscribers should receive the data at the same time.<\/p>\n<p>UDP, however, is unreliable and the data might not reach everyone. It can be enhanced with retransmissions, however.<\/p>\n<h3><strong>Colocation<\/strong><\/h3>\n<p>Exchanges offer brokers the ability to colocate their servers in the same data center as the exchange.<\/p>\n<p>This reduces the latency drastically and can be considered a VIP service.<\/p>\n<h3><strong>Network Security<\/strong><\/h3>\n<p>DDoS is a challenge for exchanges as there are some internet-facing services. Here's our options:\n * Isolate public services and data from private services, so DDoS attacks don't impact the most important clients\n * Use a caching layer to store data which is infrequently updated\n * Harden URLs against DDoS, eg prefer <code>https://my.website.com/data/recent<\/code> vs. <code>https://my.website.com/data?from=123&amp;to=456<\/code>, because the former is more cacheable\n * Effective allowlist/blocklist mechanism is needed.\n * Rate limiting can be used to mitigate DDoS<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Other interesting notes:\n * not all exchanges rely on putting everything on one big server, but some still do\n * modern exchanges rely more on cloud infrastructure and also on automatic market makers (AMM) to avoid maintaining an order book<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>本章将设计一个<strong>电子化证券交易所（electronic stock exchange）<\/strong>。<\/p>\n<p>它的基本功能是高效地撮合买家和卖家。<\/p>\n<p>主要的证券交易所有 <strong>NYSE<\/strong>、<strong>NASDAQ<\/strong> 等。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/world-stock-exchanges.png\" alt=\"全球证券交易所\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<ul>\n<li>C：我们要交易哪些证券？股票、期权还是期货？<\/li>\n<li>I：为简单起见，只做股票<\/li>\n<li>C：支持哪些订单类型——下单、撤单、改单？限价单、市价单、条件单呢？<\/li>\n<li>I：我们需要支持下单和撤单。订单类型只需考虑限价单。<\/li>\n<li>C：系统需要支持盘后交易吗？<\/li>\n<li>I：不需要，只做正常交易时段<\/li>\n<li>C：你能描述一下交易所的基本功能吗？<\/li>\n<li>I：客户可以下单或撤销限价单，并实时收到撮合成交。他们还应该能实时看到订单簿。<\/li>\n<li>C：交易所的规模有多大？<\/li>\n<li>I：同时有数万用户在交易，约 100 个标的（symbol）。每天数十亿笔订单。我们还需要支持合规方面的风险检查。<\/li>\n<li>C：什么样的风险检查？<\/li>\n<li>I：做简单的风险检查——例如限制一个用户一天内只能交易 100 万股苹果股票。<\/li>\n<li>C：用户钱包的资金联动怎么考虑？<\/li>\n<li>I：我们需要确保客户在下单前有足够资金。用于未完成订单的资金需要被冻结，直到订单最终确定。<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<p>面试官提到的规模暗示我们要设计一个中小型交易所。\n我们还需要保证灵活性，以便未来支持更多标的和用户。<\/p>\n<p>其他非功能需求：\n * 可用性——至少 99.99%。停机时间会损害声誉\n * 容错性——需要容错能力和快速恢复机制，以限制生产事故的影响\n * 延迟——往返延迟应在毫秒级，并重点关注第 99 百分位。持续偏高的 99 分位延迟会给一小部分用户带来糟糕体验\n * 安全性——我们应该有一个账户管理系统。出于法律合规，我们需要支持 KYC 来验证用户身份。我们还应针对 DDoS 保护公共资源。<\/p>\n<h3><strong>粗略估算<\/strong><\/h3>\n<ul>\n<li>100 个标的，每天 10 亿笔订单<\/li>\n<li>正常交易时段为 09:30 到 16:00（6.5 小时）<\/li>\n<li>QPS = 1bil / 6.5 / 3600 = 43000<\/li>\n<li>峰值 QPS = 5*QPS = 215000<\/li>\n<li>开盘时交易量会显著升高<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<h3><strong>业务知识入门（Business Knowledge 101）<\/strong><\/h3>\n<p>先来讨论一些与交易所相关的基本概念。<\/p>\n<p>经纪商（broker）在交易所和终端用户之间牵线搭桥——例如 Robinhood、Fidelity 等。<\/p>\n<p>机构客户使用专用交易软件进行大额交易。它们需要特殊对待。\n例如大额交易时拆单，以避免冲击市场。<\/p>\n<p>订单类型：\n * 限价单（Limit）——以固定价格买入或卖出。它可能不会立刻成交，也可能部分成交。\n * 市价单（Market）——不指定价格。立即按当前市场价格成交。<\/p>\n<p>价格：\n * 买价（Bid）——买家愿意买入一只股票的最高价格\n * 卖价（Ask）——卖家愿意卖出一只股票的最低价格<\/p>\n<p>美国市场有三层行情报价——L1、L2、L3。<\/p>\n<p>L1 行情数据包含最优买/卖价和数量：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l1-price.png\" alt=\"L1 行情\" width=\"500\" />\n<\/div>\n\n<p>L2 包含更多价格档位：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l2-price.png\" alt=\"L2 行情\" width=\"500\" />\n<\/div>\n\n<p>L3 展示各档位以及每个档位排队的数量：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/l3-price.png\" alt=\"L3 行情\" width=\"500\" />\n<\/div>\n\n<p>K 线（candlestick）展示某个时间区间内的开盘价、收盘价以及最高价和最低价：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/candlestick.png\" alt=\"K 线图\" width=\"500\" />\n<\/div>\n\n<p>FIX 是一种用于交换证券交易信息的协议，大多数厂商都在使用。证券交易报文示例：<\/p>\n<pre><code>8=FIX.4.2 | 9=176 | 35=8 | 49=PHLX | 56=PERS | 52=20071123-05:30:00.000 | 11=ATOMNOCCC9990900 | 20=3 | 150=E | 39=E | 55=MSFT | 167=CS | 54=1 | 38=15 | 40=2 | 44=15 | 58=PHLX EQUITY TESTING | 59=0 | 47=C | 32=0 | 31=0 | 151=15 | 14=0 | 6=0 | 10=128 |\n<\/code><\/pre>\n<h3><strong>高层设计<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/high-level-design.png\" alt=\"高层设计\" width=\"500\" />\n<\/div>\n\n<p>交易流程：\n * 客户通过交易接口下单\n * 经纪商把订单发送到交易所\n * 订单通过客户端网关进入交易所，网关负责校验、限流、认证等。订单被转发给订单管理器。\n * 订单管理器根据风险管理器设定的规则执行风险检查\n * 通过风险检查后，订单管理器核实钱包中有足够资金来支付该订单\n * 订单被发送到撮合引擎。找到撮合匹配后，撮合引擎为买方和卖方各产生一条成交（execution，也叫 fill）。两个订单都会被排序，以保证确定性。\n * 成交结果返回给客户。<\/p>\n<p>行情数据流（M1-M3）：\n * 撮合引擎产生成交流，发送给行情发布器\n * 行情发布器构建 K 线图，并把它们发送给数据服务\n * 行情数据存储在专门的存储中，用于实时分析。经纪商连接到数据服务以获取及时行情。<\/p>\n<p>报送流程（R1-R2）：\n * 报送器从订单和成交中收集所有必要的报文字段，并写入数据库\n * 报文字段——client_id、price、quantity、order_type、filled_quantity、remaining_quantity<\/p>\n<p>交易流程位于关键路径上，而其他流程不在关键路径上，因此它们的延迟要求不同。<\/p>\n<h4>交易流程<\/h4>\n<p>交易流程位于关键路径上，因此它必须为低延迟而高度优化。<\/p>\n<p>撮合引擎是其核心，也称为交叉引擎（cross engine）。主要职责：\n * 维护每个标的的订单簿——一个标的的买入/卖出订单列表\n * 撮合买入和卖出订单——一次撮合产生两条成交（fill），买卖双方各一条。这个函数必须快速且准确\n * 把成交流作为行情数据分发出去\n * 撮合必须按确定性顺序产生。这是高可用的基础<\/p>\n<p>接下来是排序器（sequencer）——它是让撮合引擎具有确定性的关键组件，通过为每一个入站订单和出站成交打上序列 ID。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/sequencer.png\" alt=\"排序器\" width=\"500\" />\n<\/div>\n\n<p>我们为入站订单和出站成交打上序列，有以下几个原因：\n * 时效性与公平性\n * 快速恢复/重放\n * 恰好一次保证<\/p>\n<p>从概念上讲，我们可以用 Kafka 作为排序器，因为它实际上就是一个入站和出站消息队列。但为了实现更低的延迟，我们打算自己实现它。<\/p>\n<p>订单管理器管理订单状态。它还与撮合引擎交互——发送订单、接收成交。<\/p>\n<p>订单管理器的职责：\n * 把订单送去做风险检查——例如核实用户的交易量小于 100 万\n * 对照用户钱包检查订单，确认有足够资金执行\n * 它把订单发送给排序器，再送往撮合引擎。为减少带宽，只有必要的订单信息被传给撮合引擎\n * 成交（fill）从排序器接收回来，然后通过客户端网关发送给各经纪商<\/p>\n<p>实现订单管理器的主要挑战是状态流转管理。事件溯源是一种可行方案（在深入设计中讨论）。<\/p>\n<p>最后，客户端网关接收来自用户的订单，并把它们发送给订单管理器。它的职责：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/client-gateway.png\" alt=\"客户端网关\" width=\"500\" />\n<\/div>\n\n<p>由于客户端网关位于关键路径上，它应该保持轻量。<\/p>\n<p>不同客户可以有多个客户端网关。例如 colo 引擎是一台交易引擎服务器，由经纪商租用在交易所的数据中心内：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/client-gateways.png\" alt=\"多个客户端网关\" width=\"500\" />\n<\/div>\n\n<h4>行情数据流<\/h4>\n<p>行情发布器从撮合引擎接收成交，并基于成交流构建订单簿/K 线图。<\/p>\n<p>这些数据被发送给数据服务，数据服务负责向订阅者展示聚合后的数据：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/market-data.png\" alt=\"行情数据\" width=\"500\" />\n<\/div>\n\n<h4>报送流程<\/h4>\n<p>报送器不在关键路径上，但仍然是一个重要组件。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/reporting-flow.png\" alt=\"报送流程\" width=\"500\" />\n<\/div>\n\n<p>它负责交易历史、税务报送、合规报送、结算等。报送流程对延迟没有严格要求，准确性和合规性更重要。<\/p>\n<h3><strong>API 设计<\/strong><\/h3>\n<p>客户通过经纪商与证券交易所交互，用于下单、查看成交、行情数据、下载历史数据做分析等。<\/p>\n<p>客户端网关与经纪商之间使用 RESTful API 通信。<\/p>\n<p>对于机构客户，使用私有协议来满足其低延迟要求。<\/p>\n<p>创建订单：<\/p>\n<pre><code>POST /v1/order\n<\/code><\/pre>\n<p>参数：\n * symbol——股票标的。String\n * side——买入或卖出。String\n * price——限价单的价格。Long\n * orderType——限价或市价（我们的设计只支持限价单）。String\n * quantity——订单数量。Long<\/p>\n<p>响应：\n * id——订单的 ID。Long\n * creationTime——订单的系统创建时间。Long\n * filledQuantity——已成功执行的数量。Long\n * remainingQuantity——尚待执行的数量。Long\n * status——new/canceled/filled。String\n * 其余属性与输入参数相同<\/p>\n<p>获取成交：<\/p>\n<pre><code>GET /execution?symbol={:symbol}&amp;orderId={:orderId}&amp;startTime={:startTime}&amp;endTime={:endTime}\n<\/code><\/pre>\n<p>参数：\n * symbol——股票标的。String\n * orderId——订单的 ID。可选。String\n * startTime——查询起始时间，epoch [11]。Long\n * endTime——查询结束时间，epoch。Long<\/p>\n<p>响应：\n * executions——数组，包含范围内的每条成交（属性见下）。Array\n * id——成交的 ID。Long\n * orderId——订单的 ID。Long\n * symbol——股票标的。String\n * side——买入或卖出。String\n * price——成交价。Long\n * orderType——限价或市价。String\n * quantity——成交量。Long<\/p>\n<p>获取订单簿：<\/p>\n<pre><code>GET /marketdata/orderBook/L2?symbol={:symbol}&amp;depth={:depth}\n<\/code><\/pre>\n<p>参数：\n * symbol——股票标的。String\n * depth——每侧的订单簿深度。Int<\/p>\n<p>响应：\n * bids——数组，包含价格和挂单量。Array\n * asks——数组，包含价格和挂单量。Array<\/p>\n<p>获取 K 线：<\/p>\n<pre><code>GET /marketdata/candles?symbol={:symbol}&amp;resolution={:resolution}&amp;startTime={:startTime}&amp;endTime={:endTime}\n<\/code><\/pre>\n<p>参数：\n * symbol——股票标的。String\n * resolution——K 线窗口长度，单位秒。Long\n * startTime——窗口开始时间，epoch。Long\n * endTime——窗口结束时间，epoch。Long<\/p>\n<p>响应：\n * candles——数组，包含每条 K 线数据（属性见下）。Array\n * open——每条 K 线的开盘价。Double\n * close——每条 K 线的收盘价。Double\n * high——每条 K 线的最高价。Double\n * low——每条 K 线的最低价。Double<\/p>\n<h3><strong>数据模型<\/strong><\/h3>\n<p>我们的交易所中有三类主要数据：\n * 产品、订单、成交\n * 订单簿\n * K 线图<\/p>\n<h4>产品、订单、成交<\/h4>\n<p>产品描述一个交易标的的属性——产品类型、交易代码、UI 展示代码等。<\/p>\n<p>这类数据不常变化，主要用于 UI 渲染。<\/p>\n<p>订单表示一条买入/卖出指令。成交是出站的撮合结果。<\/p>\n<p>数据模型如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/product-order-execution-data-model.png\" alt=\"产品-订单-成交数据模型\" width=\"500\" />\n<\/div>\n\n<p>我们在三个流程中都会遇到订单和成交：\n * 在关键路径上，它们在内存中处理以获得高性能。它们被持久化到排序器中并可从中恢复。\n * 报送器把订单和成交写入数据库，用于报送场景\n * 成交被转发给行情数据侧，用于重建订单簿和 K 线图<\/p>\n<h4>订单簿<\/h4>\n<p>订单簿是一个交易工具的买入/卖出订单列表，按价格档位组织。<\/p>\n<p>一个高效的数据结构需要满足：\n * 常数时间查找——获取某价格档位或价格档位之间的挂单量\n * 快速的添加/成交/取消操作\n * 查询最优买/卖价\n * 遍历各价格档位<\/p>\n<p>订单簿执行示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/order-book-execution.png\" alt=\"订单簿执行示例\" width=\"500\" />\n<\/div>\n\n<p>完成这笔大额订单后，由于买卖价差扩大，价格上升。<\/p>\n<p>订单簿实现的伪代码示例：<\/p>\n<pre><code>class PriceLevel{\n    private Price limitPrice;\n    private long totalVolume;\n    private List&lt;Order&gt; orders;\n}\n\nclass Book&lt;Side&gt; {\n    private Side side;\n    private Map&lt;Price, PriceLevel&gt; limitMap;\n}\n\nclass OrderBook {\n    private Book&lt;Buy&gt; buyBook;\n    private Book&lt;Sell&gt; sellBook;\n    private PriceLevel bestBid;\n    private PriceLevel bestOffer;\n    private Map&lt;OrderID, Order&gt; orderMap;\n}\n<\/code><\/pre>\n<p>为了更高效地实现，我们可以用双向链表代替标准列表：\n * 下新订单是 O(1)，因为我们把订单加到列表尾部。\n * 撮合订单是 O(1)，因为我们从头部删除订单。\n * 取消订单意味着从订单簿中删除订单。我们利用 <code>orderMap<\/code> 实现 O(1) 查找和 O(1) 删除（因为 <code>Order<\/code> 持有列表中前一个元素的引用）。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/order-book-impl.png\" alt=\"订单簿实现\" width=\"500\" />\n<\/div>\n\n<p>这个数据结构也被用在行情数据服务中，用于重建订单簿。<\/p>\n<h4>K 线图<\/h4>\n<p>K 线数据是在行情数据服务中，基于一个时间区间内处理的订单计算出来的：<\/p>\n<pre><code>class Candlestick {\n    private long openPrice;\n    private long closePrice;\n    private long highPrice;\n    private long lowPrice;\n    private long volume;\n    private long timestamp;\n    private int interval;\n}\n\nclass CandlestickChart {\n    private LinkedList&lt;Candlestick&gt; sticks;\n}\n<\/code><\/pre>\n<p>一些避免占用过多内存的优化：\n * 使用预分配的环形缓冲区持有 K 线，以减少分配次数\n * 限制内存中的 K 线数量，其余持久化到磁盘<\/p>\n<p>我们将使用内存列式数据库（例如 KDB）做实时分析。收盘后，数据持久化到历史数据库。<\/p>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>关于现代交易所，有一个值得注意的有趣事实：与大多数其他软件不同，它们通常把所有组件都跑在一台巨型服务器上。<\/p>\n<p>我们来深入探讨细节。<\/p>\n<h3><strong>性能<\/strong><\/h3>\n<p>对交易所而言，所有百分位上的整体延迟都很重要。<\/p>\n<p>如何降低延迟？\n * 减少关键路径上的任务数量\n * 通过减少网络/磁盘使用和/或缩短任务执行时间，来缩短每个任务耗时<\/p>\n<p>为了实现第一个目标，我们把关键路径上所有无关的职责都剥离掉，甚至连日志都移除，以获得最优延迟。<\/p>\n<p>如果沿用最初的设计，会有几个瓶颈——服务间的网络延迟和排序器的磁盘使用。<\/p>\n<p>这样的设计我们只能做到几十毫秒的端到端延迟，而我们想要的是几十微秒。<\/p>\n<p>因此，我们把所有组件放在一台服务器上，进程之间通过 mmap 作为事件存储来通信：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/mmap-bus.png\" alt=\"mmap 总线\" width=\"500\" />\n<\/div>\n\n<p>另一个优化是使用应用主循环（while 循环执行关键任务），并把它绑定到同一个 CPU 上，避免上下文切换：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/application-loop.png\" alt=\"应用主循环\" width=\"500\" />\n<\/div>\n\n<p>使用应用主循环的另一个附带好处是没有锁竞争——即多个线程争抢同一资源。<\/p>\n<p>现在来看看 mmap 的工作原理——它是一个 UNIX 系统调用，把磁盘上的文件映射到应用的内存中。<\/p>\n<p>一个小技巧是把文件创建在 <code>/dev/shm<\/code> 中，它代表「共享内存」。这样我们就完全没有磁盘访问了。<\/p>\n<h3><strong>事件溯源<\/strong><\/h3>\n<p>事件溯源在<a href=\"../chapter28\">数字钱包章节<\/a>中有深入讨论。所有细节请参考该章。<\/p>\n<p>简而言之，我们不存储当前状态，而是存储不可变的状态流转：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/event-sourcing.png\" alt=\"事件溯源\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>左侧——传统模式<\/li>\n<li>右侧——事件溯源模式<\/li>\n<\/ul>\n<p>到目前为止，我们的设计如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/design-so-far.png\" alt=\"迄今的设计\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>外部域通过 FIX 协议与我们的客户端网关交互<\/li>\n<li>订单管理器接收新订单事件，校验它，并把它加入内部状态。然后订单被发送到撮合核心。<\/li>\n<li>如果订单被撮合，<code>OrderFilledEvent<\/code> 被生成并通过 mmap 发送<\/li>\n<li>其他组件订阅事件存储，各自完成自己的处理<\/li>\n<\/ul>\n<p>另一个优化——所有组件都持有一份订单管理器的副本，订单管理器被打包成一个库，以避免管理订单时的额外调用。<\/p>\n<p>在这个设计中，排序器不再是事件存储，而是一个单写者，在把事件转发到事件存储之前先对其排序：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/sequencer-deep-dive.png\" alt=\"深入排序器\" width=\"500\" />\n<\/div>\n\n<h3><strong>高可用性<\/strong><\/h3>\n<p>我们的目标是 99.99% 可用性——每天只有 8.64 秒停机时间。<\/p>\n<p>为实现这一点，我们必须识别交易所架构中的单点故障：\n * 为关键服务（例如撮合引擎）设置处于待命状态的备用实例\n * 大力推进故障检测自动化和到备用实例的故障转移<\/p>\n<p>无状态服务（如客户端网关）可以通过增加服务器轻松地水平扩展。<\/p>\n<p>对于有状态组件，如果我们不是 leader，就可以处理入站事件，但不能发布出站事件：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/leader-election.png\" alt=\"leader 选举\" width=\"500\" />\n<\/div>\n\n<p>为检测主副本是否宕机，我们可以发送心跳来检测它是否失效。<\/p>\n<p>这个机制只在单台服务器的边界内有效。如果想扩展，可以把整台服务器设置为热/温副本，并在故障时故障转移。<\/p>\n<p>为了在副本之间复制事件存储，我们可以使用可靠 UDP 以获得更快的通信。<\/p>\n<h3><strong>容错性<\/strong><\/h3>\n<p>如果连温备实例都宕机了怎么办？这是低概率事件，但我们应该做好准备。<\/p>\n<p>大型科技公司通过把核心数据复制到多个城市的数据中心来应对这个问题，以缓解例如自然灾害的影响。<\/p>\n<p>需要考虑的问题：\n * 如果主实例宕机，我们如何以及何时故障转移到备用实例？\n * 我们如何在备用实例中选择 leader？\n * 需要多长的恢复时间（RTO——恢复时间目标）？\n * 需要恢复哪些功能？我们的系统能否在降级状态下运行？<\/p>\n<p>如何应对这些问题：\n * 系统可能因 bug 而宕机（影响主实例和副本），我们可以使用混沌工程来暴露这类边缘情况和灾难性后果\n * 不过一开始，我们可以手动执行故障转移，直到积累了足够多关于系统故障模式的知识\n * 可以使用 leader 选举（例如 Raft）来确定主实例宕机后由哪个副本成为 leader<\/p>\n<p>跨不同服务器的复制工作方式示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/replication-across-servers.png\" alt=\"跨服务器复制\" width=\"500\" />\n<\/div>\n\n<p>leader 选举术语示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/leader-election-terms.png\" alt=\"leader 选举术语\" width=\"500\" />\n<\/div>\n\n<p>关于 Raft 的工作原理详情，<a href=\"https://thesecretlivesofdata.com/raft/\">点这里查看<\/a><\/p>\n<p>最后，我们还需要考虑丢失容忍度——在情况变得危急之前我们能丢失多少数据？这将决定我们多久备份一次数据。<\/p>\n<p>对证券交易所而言，数据丢失是不可接受的，因此我们必须频繁备份数据，并依靠 Raft 的复制来降低数据丢失概率。<\/p>\n<h3><strong>撮合算法<\/strong><\/h3>\n<p>稍作偏离，用伪代码看一下撮合如何工作：<\/p>\n<pre><code>Context handleOrder(OrderBook orderBook, OrderEvent orderEvent) {\n    if (orderEvent.getSequenceId() != nextSequence) {\n        return Error(OUT_OF_ORDER, nextSequence);\n    }\n\n    if (!validateOrder(symbol, price, quantity)) {\n        return ERROR(INVALID_ORDER, orderEvent);\n    }\n\n    Order order = createOrderFromEvent(orderEvent);\n    switch (msgType):\n        case NEW:\n            return handleNew(orderBook, order);\n        case CANCEL:\n            return handleCancel(orderBook, order);\n        default:\n            return ERROR(INVALID_MSG_TYPE, msgType);\n\n}\n\nContext handleNew(OrderBook orderBook, Order order) {\n    if (BUY.equals(order.side)) {\n        return match(orderBook.sellBook, order);\n    } else {\n        return match(orderBook.buyBook, order);\n    }\n}\n\nContext handleCancel(OrderBook orderBook, Order order) {\n    if (!orderBook.orderMap.contains(order.orderId)) {\n        return ERROR(CANNOT_CANCEL_ALREADY_MATCHED, order);\n    }\n\n    removeOrder(order);\n    setOrderStatus(order, CANCELED);\n    return SUCCESS(CANCEL_SUCCESS, order);\n}\n\nContext match(OrderBook book, Order order) {\n    Quantity leavesQuantity = order.quantity - order.matchedQuantity;\n    Iterator&lt;Order&gt; limitIter = book.limitMap.get(order.price).orders;\n    while (limitIter.hasNext() &amp;&amp; leavesQuantity &gt; 0) {\n        Quantity matched = min(limitIter.next.quantity, order.quantity);\n        order.matchedQuantity += matched;\n        leavesQuantity = order.quantity - order.matchedQuantity;\n        remove(limitIter.next);\n        generateMatchedFill();\n    }\n    return SUCCESS(MATCH_SUCCESS, order);\n}\n<\/code><\/pre>\n<p>这个撮合算法使用 FIFO 算法来决定同一价格档位中先撮合哪些订单。<\/p>\n<h3><strong>确定性<\/strong><\/h3>\n<p>功能确定性通过我们使用的排序器技术来保证。<\/p>\n<p>事件实际发生的时间并不重要：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/determinism.png\" alt=\"确定性\" width=\"500\" />\n<\/div>\n\n<p>延迟确定性则是我们必须跟踪的。我们可以通过监控第 99 或 99.99 百分位延迟来计算它。<\/p>\n<p>可能导致延迟尖峰的事情，例如 Java 中的垃圾回收事件。<\/p>\n<h3><strong>行情发布器优化<\/strong><\/h3>\n<p>行情发布器从撮合引擎接收撮合结果，并基于它们重建订单簿和 K 线图。<\/p>\n<p>由于内存有限，我们只保留一部分 K 线。客户可以选择想要多细粒度的信息：更细粒度的信息可能需要更高的价格：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"28. Stock Exchange/images/market-data-publisher.png\" alt=\"行情发布器\" width=\"500\" />\n<\/div>\n\n<p>环形缓冲区（ring buffer，也称循环队列）是一个固定大小队列，头尾相连。空间预分配以避免运行时分配。该数据结构也是无锁的。<\/p>\n<p>优化环形缓冲区的另一个技巧是填充（padding），它确保序列号永远不会与其他数据落在同一个缓存行中。<\/p>\n<h3><strong>行情分发公平性与组播<\/strong><\/h3>\n<p>我们需要确保订阅者同时收到数据，因为如果一个订阅者比另一个先收到数据，它就获得了关键的市场情报，并可能用来操纵市场。<\/p>\n<p>为实现这一点，我们在向订阅者发布数据时，可以使用基于可靠 UDP 的组播（multicast）。<\/p>\n<p>数据在互联网上的传输方式有三种：\n * 单播（Unicast）——一个源，一个目的地\n * 广播（Broadcast）——一个源，发到整个子网\n * 组播（Multicast）——一个源，发到不同子网上的一组主机<\/p>\n<p>理论上，使用组播后，所有订阅者应该同时收到数据。<\/p>\n<p>然而 UDP 不可靠，数据可能无法送达所有人。不过可以通过重传来增强它。<\/p>\n<h3><strong>主机托管（Colocation）<\/strong><\/h3>\n<p>交易所为经纪商提供在交易所同一数据中心托管其服务器的服务。<\/p>\n<p>这能大幅降低延迟，可以被视为一项 VIP 服务。<\/p>\n<h3><strong>网络安全<\/strong><\/h3>\n<p>由于有一些面向公网的服务，DDoS 对交易所是一个挑战。我们的选项：\n * 把公共服务和数据与私有服务隔离，使 DDoS 攻击不会影响最重要的客户\n * 使用缓存层存储不常更新的数据\n * 加固 URL 以防 DDoS，例如优先使用 <code>https://my.website.com/data/recent<\/code> 而不是 <code>https://my.website.com/data?from=123&amp;to=456<\/code>，因为前者更容易被缓存\n * 需要有效的白名单/黑名单机制\n * 可以使用限流来缓解 DDoS<\/p>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>其他有趣的备注：\n * 并非所有交易所都把所有东西放在一台大服务器上，但确实有一些仍然这样做\n * 现代交易所更多地依赖云基础设施，也依赖自动做市商（AMM），以避免维护订单簿<\/p>", "enTitle": "Chapter 28: Stock Exchange", "zhTitle": "第 28 章：证券交易所", "short": "Stock Exchange", "num": "28"}};
const KEYS = Object.keys(NOTES);
const HAS_ZH = true;

let lang;
try{ lang = localStorage.getItem('sd-lang') || (HAS_ZH ? 'zh' : 'en'); }catch(e){ lang = HAS_ZH ? 'zh' : 'en'; }
if(lang!=='en' && lang!=='zh') lang = HAS_ZH ? 'zh' : 'en';
if(lang==='zh' && !HAS_ZH) lang = 'en';

let ch = KEYS[0];
const $ = id => document.getElementById(id);
const els = {
  title:$('chTitle'), other:$('chOther'), num:$('chNum'), content:$('content'),
  list:$('chList'), count:$('chCount'), prev:$('prevBtn'), next:$('nextBtn'),
  prevLabel:$('prevLabel'), nextLabel:$('nextLabel'), prevTitle:$('prevTitle'), nextTitle:$('nextTitle'),
  search:$('searchInput'), progress:$('progressBar'), menu:$('menuBtn'), sidebar:$('sidebar'), mask:$('drawerMask')
};
const T = { en:{prev:'PREV',next:'NEXT',empty:'No matching chapters',num:k=>'CHAPTER '+k,num2:''},
            zh:{prev:'上一章',next:'下一章',empty:'没有匹配的章节',num:k=>'第 '+k+' 章',num2:''} };
const fallbackNote = '<div class="lang-note">中文版翻译尚未生成，此处暂显示英文原文。</div>';

function current(){ return NOTES[ch]; }
function idx(){ return KEYS.indexOf(ch); }

function renderList(filter){
  const q = (filter||'').trim().toLowerCase();
  const items = KEYS.filter(k=>{
    if(!q) return true;
    const n = NOTES[k];
    return (n.short+' '+n.enTitle+' '+(n.zhTitle||'')).toLowerCase().indexOf(q) > -1;
  });
  els.list.innerHTML = items.length ? items.map(k=>{
    const n = NOTES[k];
    const active = k===ch;
    return '<button class="ch-item'+(active?' active':'')+'" data-ch="'+k+'" type="button" aria-current="'+(active?'page':'false')+'">'
      +'<span class="ch-no">'+n.num+'</span>'
      +'<span class="ch-names"><span class="nm-en">'+n.short+'</span><span class="nm-zh">'+(n.zhTitle||'')+'</span></span>'
      +'</button>';
  }).join('') : '<div class="ch-empty">'+T[lang].empty+'</div>';
  els.count.textContent = items.length + ' / ' + KEYS.length;
}

function render(){
  const n = current();
  const ttl = lang==='zh' ? (n.zhTitle || n.enTitle) : n.enTitle;
  const other = lang==='zh' ? n.enTitle : (n.zhTitle || n.enTitle);
  els.title.textContent = ttl;
  els.other.textContent = other;
  els.num.textContent = T[lang].num(n.num);
  els.content.innerHTML = (lang==='zh' && n.zh) ? n.zh : (lang==='zh' && !n.zh ? fallbackNote + n.en : n.en);
  document.body.setAttribute('data-lang', lang);
  document.title = ttl + ' · System Design Interview Notes';
  renderList();

  const i = idx();
  els.prev.disabled = i<=0;
  els.next.disabled = i>=KEYS.length-1;
  if(i>0){ els.prevTitle.textContent = NOTES[KEYS[i-1]].short; }else{ els.prevTitle.textContent=''; }
  if(i<KEYS.length-1){ els.nextTitle.textContent = NOTES[KEYS[i+1]].short; }else{ els.nextTitle.textContent=''; }

  // 高亮当前语言按钮
  document.querySelectorAll('.lang-btn').forEach(b=>{
    const on = b.getAttribute('data-lang')===lang;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on?'true':'false');
  });
  window.scrollTo(0,0);
  closeDrawer();
}

function closeDrawer(){ els.sidebar.classList.remove('open'); els.mask.classList.remove('show'); }
function openDrawer(){ els.sidebar.classList.add('open'); els.mask.classList.add('show'); }

function goto(key){
  if(!NOTES[key]) return;
  const target = encodeURIComponent(key);
  if(location.hash === '#'+target){ ch = key; render(); }
  else location.hash = target;
}

// 语言切换
document.querySelectorAll('.lang-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const v = b.getAttribute('data-lang');
    if(v===lang) return;
    lang = v;
    try{ localStorage.setItem('sd-lang', v); }catch(e){}
    render();
  });
});

// 章节列表（事件委托）
els.list.addEventListener('click', e=>{
  const btn = e.target.closest('.ch-item');
  if(btn) goto(btn.getAttribute('data-ch'));
});

// 搜索
els.search.addEventListener('input', ()=>renderList(els.search.value));

// 路由
function readHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  return NOTES[h] ? h : null;
}
window.addEventListener('hashchange', ()=>{ const h = readHash(); if(h && h!==ch){ ch = h; render(); } });

// 翻页
els.prev.addEventListener('click', ()=>{ if(idx()>0) goto(KEYS[idx()-1]); });
els.next.addEventListener('click', ()=>{ if(idx()<KEYS.length-1) goto(KEYS[idx()+1]); });
document.addEventListener('keydown', e=>{
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.key==='ArrowLeft' && idx()>0) goto(KEYS[idx()-1]);
  if(e.key==='ArrowRight' && idx()<KEYS.length-1) goto(KEYS[idx()+1]);
});

// 抽屉
els.menu.addEventListener('click', ()=>{ els.sidebar.classList.contains('open') ? closeDrawer() : openDrawer(); });
els.mask.addEventListener('click', closeDrawer);

// 阅读进度
window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const pct = h.scrollHeight > h.clientHeight ? (h.scrollTop/(h.scrollHeight-h.clientHeight)) : 0;
  els.progress.style.width = (pct*100).toFixed(2)+'%';
},{passive:true});

// 初始渲染
const h = readHash();
if(h) ch = h;
render();
</script>
</body>
</html>
