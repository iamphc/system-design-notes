t store<\/strong> - Object store (eg Amazon S3), suitable for storing large files.<\/li>\n<li><strong>Distributed cache<\/strong> - We can cache recent emails in Redis to improve UX.<\/li>\n<li><strong>Search store<\/strong> - distributed document store, used for supporting full-text searches.<\/li>\n<\/ul>\n<p>Here's what the email sending flow looks like:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/email-sending-flow.png\" alt=\"email-sending-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>User writes an email and presses \"send\". Email is sent to load balancer.<\/li>\n<li>Load balancer rate limits excessive mail sends and routes to one of the web servers.<\/li>\n<li>Web servers do basic email validation (eg email size) and short-circuits outbound flow if domain is same as sender. But does spam check first.<\/li>\n<li>If basic validation passes, email is sent to message queue (attachment is referenced from object store)<\/li>\n<li>If basic validation fails, email is sent to error queue<\/li>\n<li>SMTP outgoing workers pull messages from outgoing queue, do spam/virus checks and route to destination mail server.<\/li>\n<li>Email is stored in the \"Sent Emails\" folder<\/li>\n<\/ul>\n<p>We need to also monitor size of outgoing message queue. Growing too large might indicate a problem:\n- Recipient's mail server is unavailable. We can retry sending the email at a later time using exponential backoff.\n- Not enough consumers to handle the load, we might have to scale the consumers.<\/p>\n<p>Here's the email receiving flow:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/email-receiving-flkow.png\" alt=\"email-receiving-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Incoming emails arrive at the SMTP load balancer. Mails are distributed to SMTP servers, where mail acceptance policy is done (eg invalid emails are directly discarded).<\/li>\n<li>If attachment of email is too large, we can put it in object store (s3).<\/li>\n<li>Mail processing workers do preliminary checks, after which mails are forwarded to storage, cache, object store and real-time servers.<\/li>\n<li>Offline users get their new emails once they come back online via HTTP API.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>Let's now go deeper into some of the components.<\/p>\n<h3><strong>Metadata database<\/strong><\/h3>\n<p>Here are some of the characteristics of email metadata:\n- headers are usually small and frequently accessed\n- Body size ranges from small to big, but is typically read once\n- Most mail operations are isolated to a single user - eg fetching email, marking as read, searching.\n- Data recency impacts data usage. Users typically read only recent emails\n- Data has high-reliability requirements. Data loss is unacceptable.<\/p>\n<p>At gmail/outlook scale, the database is typically custom made to reduce input/output operations per second (IOPS).<\/p>\n<p>Let's consider what database options we have:\n- <strong>Relational database<\/strong> - we can build indexes for headers and body, but these DBs are typically optimized for small chunks of data.\n- <strong>Distributed object store<\/strong> - this can be a good option for backup storage, but can't efficiently support searching/marking as read/etc.\n- <strong>NoSQL<\/strong> - Google BigTable is used by gmail, but it's not open-sourced.<\/p>\n<p>Based on above analysis, very few existing solutions seems to fit our needs perfectly.\nIn an interview setting, it's infeasible to design a new distributed database solution, but important to mention characteristics:\n- Single column can be a single-digit MB\n- Strong data consistency\n- Designed to reduce disk I/O\n- Highly available and fault tolerant\n- Should be easy to create incremental backups<\/p>\n<p>In order to partition the data, we can use the <code>user_id<\/code> as a partition key, so that one user's data is stored on a single shard.\nThis prohibits us from sharing an email with multiple users, but this is not a requirement for this interview.<\/p>\n<p>Let's define the tables:\n- Primary key consists of partition key (data distribution) and clustering key (sorting data)\n- Queries we need to support - get all folders for a user, display all emails for a folder, create/get/delete an email, fetch read/unread email, get conversation threads (bonus)<\/p>\n<p>Legend for tables to follow:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/legend.png\" alt=\"legend\" width=\"500\" />\n<\/div>\n\n<p>Here is the folders table:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/folders-table.png\" alt=\"folders-table\" width=\"500\" />\n<\/div>\n\n<p>emails table:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/emails-table.png\" alt=\"emails-table\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>email_id is timeuuid which allows sorting based on timestamp when email was created<\/li>\n<\/ul>\n<p>Attachments are stored in a separate table, identified by filename:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/attachments.png\" alt=\"attachments\" width=\"500\" />\n<\/div>\n\n<p>Supporting fetchin read/unread emails is easy in a traditional relational database, but not in Cassandra, since filtering on non-partition/clustering key is prohibited.\nOne workaround to fetch all emails in a folder and filter in-memory, but that doesn't work well for a big-enough application.<\/p>\n<p>What we can do is denormalize the emails table into read/unread emails tables:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/read-unread-emails.png\" alt=\"read-unread-emails\" width=\"500\" />\n<\/div>\n\n<p>In order to support conversation threads, we can include some headers, which mail clients interpret and use to reconstruct a conversation thread:<\/p>\n<pre><code>{\n  &quot;headers&quot; {\n     &quot;Message-Id&quot;: &quot;&lt;7BA04B2A-430C-4D12-8B57-862103C34501@gmail.com&gt;&quot;,\n     &quot;In-Reply-To&quot;: &quot;&lt;CAEWTXuPfN=LzECjDJtgY9Vu03kgFvJnJUSHTt6TW@gmail.com&gt;&quot;,\n     &quot;References&quot;: [&quot;&lt;7BA04B2A-430C-4D12-8B57-862103C34501@gmail.com&gt;&quot;]\n  }\n}\n<\/code><\/pre>\n<p>Finally, we'll trade availability for consistency for our distributed database, since it is a hard requirement for this problem.<\/p>\n<p>Hence, in the event of a failover or network parititon, sync/update actions will be briefly unavailable to impacted users.<\/p>\n<h3><strong>Email deliverability<\/strong><\/h3>\n<p>It is easy to setup a server to send emails, but getting the email to a receiver's inbox is hard, due to spam-protection algorithms.<\/p>\n<p>If we just setup a new mail server and start sending mails through it, our emails will probably end up in the spam folder.<\/p>\n<p>Here's what we can do to prevent that:\n- <strong>Dedicated IPs<\/strong> - use dedicated IPs for sending emails, otherwise, recipient servers will not trust you.\n- <strong>Classify emails<\/strong> - avoid sending marketing emails from the same servers to prevent more important email to be classified as spam\n- <strong>Warm up your IP address<\/strong> slowly to build a good reputation with big email providers. It takes 2 to 6 weeks to warm up a new IP\n- <strong>Ban spammers<\/strong> quickly to not deteriorate your reputation\n- <strong>Feedback processing<\/strong> - setup a feedback loop with ISPs to keep track of complaint rate and ban spam accounts quickly.\n- <strong>Email authentication<\/strong> - use common techniques to combat phishing such as Sender Policy Framework, DomainKeys Identified Mail, etc.<\/p>\n<p>You don't need to remember all of this. Just know that building a good mail server requires a lot of domain knowledge.<\/p>\n<h3><strong>Search<\/strong><\/h3>\n<p>Searching includes doing a full-text search based on email contents or more advanced queries based on from, to, subject, unread, etc filters.<\/p>\n<p>One characteristic of email search is that it is local to the user and it has more writes than reads, because we need to re-index it on each operation, but users rarely use the search tab.<\/p>\n<p>Let's compare google search with email search:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Scope<\/th>\n<th>Sorting<\/th>\n<th>Accuracy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google search<\/td>\n<td>The whole internet<\/td>\n<td>Sort by relevance<\/td>\n<td>Indexing takes some time, so not instant results.<\/td>\n<\/tr>\n<tr>\n<td>Email search<\/td>\n<td>User's own email box<\/td>\n<td>Sort by attributes eg time, date, etc<\/td>\n<td>Indexing should be quick and results accurate.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>To achieve this search functionality, one option is to use an Elasticsearch cluster. We can use <code>user_id<\/code> as the partition key to group data under the same node:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/elasticsearch.png\" alt=\"elasticsearch\" width=\"500\" />\n<\/div>\n\n<p>Mutating operations are async via Kafka in order to decouple services from the reindexing flow.\nActually searching for data happens synchronously.<\/p>\n<p>Elasticsearch is one of the most popular search-engine databases and supports full-text search for emails very well.<\/p>\n<p>Alternatively, we can attempt to develop our own custom search solution to meet our specific requirements.<\/p>\n<p>Designing such a system is out of scope. One of the core challenges when building it is to optimize it for write-heavy workloads.<\/p>\n<p>To achieve that, we can use Log-Structured Merge-Trees (LSM) to structure the index data on disk. Write path is optimized for sequential writes only.\nThis technique is used in Cassandra, BigTable and RocksDB.<\/p>\n<p>Its core idea is to store data in-memory until a predefined threshold is reached, after which it is merged in the next layer (disk):<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/lsm-tree.png\" alt=\"lsm-tree\" width=\"500\" />\n<\/div>\n\n<p>Main trade-offs between the two approaches:\n- Elasticsearch scales to some extent, whereas a custom search engine can be fine-tuned for the email use-case, allowing it to scale further.\n- Elasticsearch is a separate service we need to maintain, alongside the metadata store. A custom solution can be the datastore itself.\n- Elasticsearch is an off-the-shelf solution, whereas the custom search engine would require significant engineering effort to build.<\/p>\n<h3><strong>Scalability and availability<\/strong><\/h3>\n<p>Since individual user operations don't collide with other users, most components can be independently scaled.<\/p>\n<p>To ensure high availability, we can also use a multi-DC setup with leader-folower failover in case of failures:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/multi-dc-example.png\" alt=\"multi-dc-example\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Additional talking points:\n- <strong>Fault tolerance<\/strong> - Many parts of the system could fail. It is worthwhile how we'd handle node failures.\n- <strong>Compliance<\/strong> - PII needs to be stored in a reasonable way, given Europe's GDPR laws.\n- <strong>Security<\/strong> - email encryption, phishing protection, safe browsing, etc.\n- <strong>Optimizations<\/strong> - eg preventing duplication of the same attachments, sent multiple times by different users.<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>本章我们将设计一个<strong>分布式电子邮件服务<\/strong>，类似于 <strong>Gmail<\/strong>。<\/p>\n<p>2020 年，<strong>Gmail<\/strong> 有 18 亿活跃用户，而 <strong>Outlook<\/strong> 在全球有 4 亿用户。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<ul>\n<li>C：有多少用户使用这个系统？<\/li>\n<li>I：10 亿用户。<\/li>\n<li>C：我认为以下功能很重要 —— 认证、发送/接收邮件、拉取邮件、过滤邮件、搜索邮件、反垃圾邮件保护。<\/li>\n<li>I：这份清单不错。认证的事现在先不用管。<\/li>\n<li>C：用户如何连接到邮件服务器？<\/li>\n<li>I：通常，邮件客户端通过 SMTP、POP、IMAP 连接，但这个问题我们用 HTTP。<\/li>\n<li>C：邮件可以带附件吗？<\/li>\n<li>I：可以。<\/li>\n<\/ul>\n<h3><strong>非功能性需求<\/strong><\/h3>\n<ul>\n<li><strong>可靠性（Reliability）<\/strong> —— 我们不应该丢数据。<\/li>\n<li><strong>可用性（Availability）<\/strong> —— 我们应该使用复制来防止单点故障。我们还应能容忍部分系统故障。<\/li>\n<li><strong>可扩展性（Scalability）<\/strong> —— 随着用户群增长，我们的系统应能应付。<\/li>\n<li><strong>灵活性与可扩展性（Flexibility and extensibility）<\/strong> —— 系统应灵活、易于用新功能扩展。这也是我们选择 HTTP 而非 SMTP/其他邮件协议的原因之一。<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-envelope estimation）<\/strong><\/h3>\n<ul>\n<li><strong>10 亿用户<\/strong>。<\/li>\n<li>假设每人每天发 10 封邮件 → <strong>每秒 10 万封邮件<\/strong>。<\/li>\n<li>假设每人每天收 40 封邮件，每封邮件平均有 50kb 元数据 → <strong>每年 730pb 存储<\/strong>。<\/li>\n<li>假设 20% 的邮件带存储型附件，平均大小 500kb → <strong>每年 1460pb<\/strong>。<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：提出高层级设计并获得认可<\/h2>\n<h3><strong>电子邮件基础知识 101<\/strong><\/h3>\n<p>收发邮件有多种协议：\n- <strong>SMTP<\/strong> —— 把邮件从一台服务器发送到另一台服务器的标准协议。\n- <strong>POP<\/strong> —— 把邮件从远程邮件服务器接收并下载到本地客户端的标准协议。一旦取回，邮件就从远程服务器删除。\n- <strong>IMAP<\/strong> —— 与 POP 类似，用于从远程服务器接收和下载邮件，但它会把邮件保留在服务端。\n- <strong>HTTPS<\/strong> —— 严格说不是邮件协议，但可用于基于 Web 的邮件客户端。<\/p>\n<p>除了邮件协议之外，我们还需要为邮件服务器配置一些 DNS 记录 —— MX 记录：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/dns-lookup.png\" alt=\"DNS 查询\" width=\"500\" />\n<\/div>\n\n<p>邮件附件以 base64 编码发送，大多数邮件服务通常有 25mb 的大小上限。\n这个值是可配置的，个人账户与企业账户之间各不相同。<\/p>\n<h3><strong>传统邮件服务器<\/strong><\/h3>\n<p>当用户数量有限、都连接到单台服务器时，传统邮件服务器运转良好。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/traditional-mail-server.png\" alt=\"传统邮件服务器\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Alice 登录她的 Outlook 邮箱并点击「发送」。邮件被发送到 Outlook 邮件服务器。通信走 SMTP。<\/li>\n<li>Outlook 服务器查询 DNS 找到 gmail.com 的 MX 记录，并把邮件转交到他们的服务器。通信走 SMTP。<\/li>\n<li>Bob 通过 IMAP/POP 从他的 gmail 服务器拉取邮件。<\/li>\n<\/ul>\n<p>在传统邮件服务器中，邮件存储在本地文件系统上。每封邮件都是一个单独的文件。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/local-dir-storage.png\" alt=\"本地目录存储\" width=\"500\" />\n<\/div>\n\n<p>随着规模增长，磁盘 I/O 成了瓶颈。而且它也不满足我们对高可用性和可靠性的要求。\n磁盘可能损坏，服务器可能宕机。<\/p>\n<h3><strong>分布式邮件服务器<\/strong><\/h3>\n<p>分布式邮件服务器专为支持现代用例、解决现代可扩展性问题而设计。<\/p>\n<p>这些服务器仍然可以为原生邮件客户端支持 IMAP/POP，并为跨服务器的邮件交换支持 SMTP。<\/p>\n<p>但对于功能丰富的 Web 邮件客户端，通常在 HTTP 之上使用 RESTful API。<\/p>\n<p>API 示例：\n- <code>POST /v1/messages<\/code> - 向 To、Cc、Bcc 头部中的收件人发送一条消息。\n- <code>GET /v1/folders<\/code> - 返回一个邮件账户的所有文件夹。<\/p>\n<p>响应示例：<\/p>\n<pre><code>[{id: string        Unique folder identifier.\n  name: string      Name of the folder.\n                    According to RFC6154 [9], the default folders can be one of\n                    the following: All, Archive, Drafts, Flagged, Junk, Sent,\n                    and Trash.\n  user_id: string   Reference to the account owner\n}]\n<\/code><\/pre>\n<ul>\n<li><code>GET /v1/folders/{:folder_id}/messages<\/code> - 分页返回某文件夹下的所有消息。<\/li>\n<li><code>GET /v1/messages/{:message_id}<\/code> - 获取某条消息的全部信息。<\/li>\n<\/ul>\n<p>响应示例：<\/p>\n<pre><code>{\n  user_id: string                      // Reference to the account owner.\n  from: {name: string, email: string}  // &lt;name, email&gt; pair of the sender.\n  to: [{name: string, email: string}]  // A list of &lt;name, email&gt; paris\n  subject: string                      // Subject of an email\n  body: string                         //  Message body\n  is_read: boolean                     //  Indicate if a message is read or not.\n}\n<\/code><\/pre>\n<p>下面是分布式邮件服务器的高层级设计：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/high-level-architecture.png\" alt=\"高层级架构\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Webmail<\/strong> —— 用户用网页浏览器收发邮件。<\/li>\n<li><strong>Web 服务器（Web servers）<\/strong>：面向公网的请求/响应服务，用于管理登录、注册、用户资料等。<\/li>\n<li><strong>实时服务器（Real-time servers）<\/strong> —— 用于把新邮件更新实时推送给客户端。我们使用 websockets 做实时通信，但对不支持它的旧浏览器回退到长轮询（long-polling）。<\/li>\n<li><strong>元数据数据库（Metadata db）<\/strong> —— 存储邮件元数据，如主题、正文、发件人、收件人等。<\/li>\n<li><strong>附件存储（Attachment store）<\/strong> —— 对象存储（如 Amazon S3），适合存储大文件。<\/li>\n<li><strong>分布式缓存（Distributed cache）<\/strong> —— 我们可以把最近的邮件缓存在 Redis 中，以改善用户体验。<\/li>\n<li><strong>搜索存储（Search store）<\/strong> —— 分布式文档存储，用于支持全文搜索。<\/li>\n<\/ul>\n<p>下面是邮件发送流程的样子：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/email-sending-flow.png\" alt=\"邮件发送流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>用户写好邮件并点击「发送」。邮件被发送到负载均衡器。<\/li>\n<li>负载均衡器对过量发信做限流，并把请求路由到某台 Web 服务器。<\/li>\n<li>Web 服务器做基本的邮件校验（如邮件大小），如果收件域名与发件人相同，则短路外发流程。但会先做垃圾邮件检查。<\/li>\n<li>如果基本校验通过，邮件被发送到消息队列（附件从对象存储引用）。<\/li>\n<li>如果基本校验失败，邮件被发送到错误队列。<\/li>\n<li>SMTP 外发 worker 从外发队列拉取消息，做垃圾邮件/病毒检查，并路由到目标邮件服务器。<\/li>\n<li>邮件被存入「已发送邮件」文件夹。<\/li>\n<\/ul>\n<p>我们还需要监控外发消息队列的大小。队列增长过大可能预示着问题：\n- 收件人的邮件服务器不可用。我们可以稍后用指数退避（exponential backoff）重试发送。\n- 消费者不足以处理负载，我们可能需要扩展消费者。<\/p>\n<p>下面是邮件接收流程：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/email-receiving-flkow.png\" alt=\"邮件接收流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>入站邮件到达 SMTP 负载均衡器。邮件被分发到各 SMTP 服务器，在那里执行邮件接收策略（例如无效邮件直接丢弃）。<\/li>\n<li>如果邮件附件过大，我们可以把它放进对象存储（s3）。<\/li>\n<li>邮件处理 worker 做初步检查，之后邮件被转发到存储、缓存、对象存储和实时服务器。<\/li>\n<li>离线用户在重新上线后，通过 HTTP API 取回自己的新邮件。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>现在让我们更深入地探讨其中一些组件。<\/p>\n<h3><strong>元数据数据库<\/strong><\/h3>\n<p>下面是邮件元数据的一些特征：\n- 头部通常很小，且被频繁访问。\n- 正文大小从小到大都有，但通常只读一次。\n- 大多数邮件操作都隔离在单个用户范围内 —— 例如拉取邮件、标记为已读、搜索。\n- 数据的新近度影响数据使用。用户通常只看最近的邮件。\n- 数据有很高的可靠性要求。数据丢失是不可接受的。<\/p>\n<p>在 gmail/outlook 这样的规模下，数据库通常是定制打造的，以降低每秒输入/输出操作数（IOPS）。<\/p>\n<p>让我们看看有哪些数据库可选：\n- <strong>关系型数据库<\/strong> —— 我们可以为头部和正文建索引，但这类 DB 通常是为小块数据优化的。\n- <strong>分布式对象存储<\/strong> —— 它可以作为备份存储的不错选择，但无法高效支持搜索/标记已读等操作。\n- <strong>NoSQL<\/strong> —— Google BigTable 被 gmail 使用，但它没有开源。<\/p>\n<p>基于以上分析，现有方案中似乎很少有能完美满足我们需求的。\n在面试场景下，设计一套新的分布式数据库方案是不现实的，但重要的是要提到这些特征：\n- 单列可以是个位数 MB 量级。\n- 强数据一致性。\n- 为减少磁盘 I/O 而设计。\n- 高可用、容错。\n- 应易于做增量备份。<\/p>\n<p>为了对数据分区，我们可以用 <code>user_id<\/code> 作为分区键，这样一个用户的数据就存储在单个分片上。\n这会让我们无法把一封邮件分享给多个用户，但这不在本次面试的要求内。<\/p>\n<p>让我们定义这些表：\n- 主键由分区键（数据分布）和聚簇键（数据排序）组成。\n- 我们需要支持的查询 —— 获取某用户的所有文件夹、展示某文件夹的所有邮件、创建/获取/删除一封邮件、拉取已读/未读邮件、获取会话线程（加分项）。<\/p>\n<p>后面这些表的图例（legend）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/legend.png\" alt=\"图例\" width=\"500\" />\n<\/div>\n\n<p>下面是 folders 表：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/folders-table.png\" alt=\"folders 表\" width=\"500\" />\n<\/div>\n\n<p>emails 表：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/emails-table.png\" alt=\"emails 表\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>email_id 是 timeuuid，允许按邮件创建时的时间戳排序。<\/li>\n<\/ul>\n<p>附件存在单独的表中，以文件名标识：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/attachments.png\" alt=\"附件\" width=\"500\" />\n<\/div>\n\n<p>在传统关系型数据库中支持拉取已读/未读邮件很容易，但在 Cassandra 中不行，因为禁止对非分区/聚簇键做过滤。\n一个变通办法是取出某文件夹中的所有邮件再在内存中过滤，但这对于足够大的应用并不奏效。<\/p>\n<p>我们可以做的是把 emails 表反规范化（denormalize）成已读/未读邮件表：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/read-unread-emails.png\" alt=\"已读未读邮件\" width=\"500\" />\n<\/div>\n\n<p>为了支持会话线程（conversation threads），我们可以加入一些头部，邮件客户端会解析并用它们重建会话线程：<\/p>\n<pre><code>{\n  &quot;headers&quot; {\n     &quot;Message-Id&quot;: &quot;&lt;7BA04B2A-430C-4D12-8B57-862103C34501@gmail.com&gt;&quot;,\n     &quot;In-Reply-To&quot;: &quot;&lt;CAEWTXuPfN=LzECjDJtgY9Vu03kgFvJnJUSHTt6TW@gmail.com&gt;&quot;,\n     &quot;References&quot;: [&quot;&lt;7BA04B2A-430C-4D12-8B57-862103C34501@gmail.com&gt;&quot;]\n  }\n}\n<\/code><\/pre>\n<p>最后，我们的分布式数据库会用可用性来换取一致性，因为一致性是这个问题的硬性要求。<\/p>\n<p>因此，在发生故障转移（failover）或网络分区时，受影响用户的同步/更新操作会短暂不可用。<\/p>\n<h3><strong>邮件可送达性（Email deliverability）<\/strong><\/h3>\n<p>搭建一台发邮件的服务器很容易，但要让邮件进入收件人的收件箱却很难，因为有反垃圾邮件算法。<\/p>\n<p>如果我们只是搭一台新邮件服务器就开始通过它发信，我们的邮件很可能会落到垃圾邮件文件夹里。<\/p>\n<p>下面是我们可以采取的预防措施：\n- <strong>专用 IP（Dedicated IPs）<\/strong> —— 使用专用 IP 发邮件，否则收件方服务器不会信任你。\n- <strong>给邮件分类（Classify emails）<\/strong> —— 避免从同一批服务器发送营销邮件，以免更重要的邮件被归类为垃圾邮件。\n- <strong>慢慢预热你的 IP 地址（Warm up your IP address）<\/strong>，以在大型邮件提供商那里建立良好声誉。预热一个新 IP 需要 2 到 6 周。\n- <strong>迅速封禁垃圾邮件发送者<\/strong>，以免损害你的声誉。\n- <strong>反馈处理（Feedback processing）<\/strong> —— 与 ISP 建立反馈闭环，跟踪投诉率并迅速封禁垃圾账户。\n- <strong>邮件认证（Email authentication）<\/strong> —— 使用常见技术对抗钓鱼，如发件人策略框架（SPF）、域名密钥识别邮件（DKIM）等。<\/p>\n<p>这些你都不必记住。只需知道：搭建一台好的邮件服务器需要大量领域知识。<\/p>\n<h3><strong>搜索（Search）<\/strong><\/h3>\n<p>搜索包括基于邮件内容做全文搜索，或基于发件人、收件人、主题、未读等过滤条件做更高级的查询。<\/p>\n<p>邮件搜索的一个特点是：它是用户本地的，而且写多于读，因为每次操作后我们都要重建索引，但用户很少使用搜索标签页。<\/p>\n<p>让我们把谷歌搜索与邮件搜索做个比较：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>范围（Scope）<\/th>\n<th>排序（Sorting）<\/th>\n<th>准确性（Accuracy）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>谷歌搜索<\/td>\n<td>整个互联网<\/td>\n<td>按相关性排序<\/td>\n<td>建索引需要一些时间，因此不是即时结果。<\/td>\n<\/tr>\n<tr>\n<td>邮件搜索<\/td>\n<td>用户自己的邮箱<\/td>\n<td>按属性排序，如时间、日期等<\/td>\n<td>建索引应该快，结果要准确。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>要实现这个搜索功能，一个选择是使用 Elasticsearch 集群。我们可以用 <code>user_id<\/code> 作为分区键，把数据归到同一节点下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/elasticsearch.png\" alt=\"Elasticsearch\" width=\"500\" />\n<\/div>\n\n<p>变更操作通过 Kafka 异步进行，以便把服务与重建索引流程解耦。\n真正的数据搜索是同步发生的。<\/p>\n<p>Elasticsearch 是最流行的搜索引擎数据库之一，对邮件的全文搜索支持得很好。<\/p>\n<p>另一条路是，我们可以尝试开发自己的定制搜索方案，以满足特定需求。<\/p>\n<p>设计这样一个系统不在范围内。自建时的核心挑战之一，就是针对写多读少的工作负载做优化。<\/p>\n<p>要做到这一点，我们可以使用 LSM 树（Log-Structured Merge-Trees）在磁盘上组织索引数据。写入路径只针对顺序写入做优化。\n这项技术被用于 Cassandra、BigTable 和 RocksDB。<\/p>\n<p>它的核心思想是：先在内存中存储数据，直到达到预定义阈值，然后把它合并到下一层（磁盘）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/lsm-tree.png\" alt=\"LSM 树\" width=\"500\" />\n<\/div>\n\n<p>两种方式之间的主要权衡：\n- Elasticsearch 能扩展到一定程度，而定制搜索引擎可以针对邮件用例做微调，从而扩展得更远。\n- Elasticsearch 是一个需要与元数据存储一起维护的独立服务。定制方案则可以就是数据存储本身。\n- Elasticsearch 是现成方案，而定制搜索引擎需要大量工程投入来构建。<\/p>\n<h3><strong>可扩展性与可用性<\/strong><\/h3>\n<p>由于单个用户的操作不会与其他用户冲突，大多数组件都可以独立扩展。<\/p>\n<p>为了确保高可用性，我们还可以采用多数据中心（multi-DC）设置，在故障时用主从（leader-follower）故障转移：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/multi-dc-example.png\" alt=\"多数据中心示例\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 4 步：收尾<\/h2>\n<p>其他可谈的点：\n- <strong>容错（Fault tolerance）<\/strong> —— 系统的许多部分都可能故障。值得讨论我们会如何处理节点故障。\n- <strong>合规（Compliance）<\/strong> —— 考虑到欧洲的 GDPR 法律，个人身份信息（PII）需要以合理方式存储。\n- <strong>安全（Security）<\/strong> —— 邮件加密、反钓鱼、安全浏览等。\n- <strong>优化（Optimizations）<\/strong> —— 例如防止同一附件被不同用户重复发送时重复存储。<\/p>", "enTitle": "Chapter 23: Distributed Email Service", "zhTitle": "第 23 章：分布式电子邮件服务", "short": "Distributed Email Service", "num": "23"}, "24. S3-like Object Storage": {"en": "\n<h2>Introduction<\/h2>\n<p>In this chapter, we'll be designing an <strong>object storage<\/strong> service, similar to <strong>Amazon S3<\/strong>.<\/p>\n<p>Storage systems fall into three broad categories:\n- <strong>Block storage<\/strong>\n- <strong>File storage<\/strong>\n- <strong>Object storage<\/strong><\/p>\n<p><strong>Block storage<\/strong> are devices, which came out in 1960s. HDDs and SSDs are such examples.\nThese devices are typically physically attached to a server, although they can also be network-attached via high-speed network protocols.\nServers can format the raw blocks and use them as a file system or it can hand control of them to servers directly.<\/p>\n<p><strong>File storage<\/strong> is built on top of block storage. It provides a higher level of abstraction, making it easier to manage folders and files.<\/p>\n<p><strong>Object storage<\/strong> sacrifices performance for high durability, vast scale and low cost.\nIt targets \"cold\" data and is mainly used for archival and backup.\nThere is no hierarchical directory structure, all data is stored as objects in a flat structure.\nIt is relatively slow compared to other storage types. Most cloud providers have an object storage offering - Amazon S3, Google GCS, etc.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/storage-comparison.png\" alt=\"storage-comparison\" width=\"500\" />\n<\/div>\n\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Block Storage<\/th>\n<th>File Storage<\/th>\n<th>Object Storage<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mutable Content<\/td>\n<td>Y<\/td>\n<td>Y<\/td>\n<td>N (has object versioning）<\/td>\n<\/tr>\n<tr>\n<td>Cost<\/td>\n<td>High<\/td>\n<td>Medium to high<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>Medium to high, very high<\/td>\n<td>Medium to high<\/td>\n<td>Low to medium<\/td>\n<\/tr>\n<tr>\n<td>Consistency<\/td>\n<td>Strong consistency<\/td>\n<td>Strong consistency<\/td>\n<td>Strong consistency [5]<\/td>\n<\/tr>\n<tr>\n<td>Data access<\/td>\n<td>SAS/iSCSI/FC<\/td>\n<td>Standard file access, CIFS/SMB, and NFS<\/td>\n<td>RESTful API<\/td>\n<\/tr>\n<tr>\n<td>Scalability<\/td>\n<td>Medium scalability<\/td>\n<td>High scalability<\/td>\n<td>Vast scalability<\/td>\n<\/tr>\n<tr>\n<td>Good for<\/td>\n<td>Virtual machines (VM), databases<\/td>\n<td>General-purpose file system access<\/td>\n<td>Binary data, unstructured data<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Some terminology, related to object storage:\n- <strong>Bucket<\/strong> - logical container for objects. Name is globally unique.\n- <strong>Object<\/strong> - An individual piece of data, stored in a bucket. Contains object data and metadata.\n- <strong>Versioning<\/strong> - A feature keeping multiple variants of an object in the same bucket.\n- <strong>Uniform Resource Identifier (URI)<\/strong> - each resource is uniquely identified by a URI.\n- <strong>Service-level Agreement (SLA)<\/strong> - contract between service provider and client.<\/p>\n<p>Amazon S3 Standard-Infrequent Access storage class SLAs:\n- Durability of 99.999999999% across multiple Availability Zones\n- Data is resilient in the event of entire Availability Zone being destroyed\n- Designed for 99.9% availability<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: Which features should be included?<\/li>\n<li>I: Bucket creation, Object upload/download, versioning, Listing objects in a bucket<\/li>\n<li>C: What is the typical data size?<\/li>\n<li>I: We need to store both massive objects and small objects efficiently<\/li>\n<li>C: How much data do we store in a year?<\/li>\n<li>I: 100 petabytes<\/li>\n<li>C: Can we assume 6 nines of data durbility (99.9999%) and service availability of 4 nines (99.99%)?<\/li>\n<li>I: Yes, sounds reasonable<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>100 PB of data<\/strong><\/li>\n<li><strong>6 nines of data durability<\/strong><\/li>\n<li><strong>4 nines of service availability<\/strong><\/li>\n<li>Storage efficiency. Reduce storage cost while maintaining high reliability and performance<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<p>Object storage is likely to have bottlenecks in disk capacity or IO per second (IOPS).<\/p>\n<p>Assumptions:\n- we have 20% small (less than 1mb), 60% mid-size (1-64mb) and 20% large objects (greater than 64mb),\n- One hard disk (SATA, 7200rpm) is capable of doing 100-150 random seeks per second (100-150 IOPS)<\/p>\n<p>Given the assumptions, we can estimate the total number of objects the system can persist.\n- Let's use median size per object type to simplify calculation - 0.5mb for small, 32mb for medium, 200mb for large.\n- Given 100PB of storage (10^11 MB) and 40% of storage usage results in 0.68bil objects\n- If we assume metadata is 1kb, then we need 0.68tb space to store metadata info<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>Let's explore some interesting properties of object storage before diving into the design:\n- <strong>Object immutability<\/strong> - objects in object storage are immutable (not the case in other storage systems). We may delete them or replace them, but no update.\n- <strong>Key-value store<\/strong> - an object URI is its key and we can get its contents by making an HTTP call\n- <strong>Write once, read many times<\/strong> - data access pattern is writing once and reading many times. According to some Linkedin research, 95% of operations are reads\n- Support both small and large objects<\/p>\n<p>Design philosophy of object storage is similar to UNIX - when we save a file, it creates the filename in a data structure, called inode and file data is stored in different disk locations.\nThe inode contains a list of file block pointers, which point to different locations on disk.<\/p>\n<p>When accessing a file, we first fetch its metadata from the inode, prior to fetching the file contents.<\/p>\n<p>Object storage works similarly - metadata store is used for file information, but contents are stored on disk:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/object-store-vs-unix.png\" alt=\"object-store-vs-unix\" width=\"500\" />\n<\/div>\n\n<p>By separating metadata from file contents, we can scale the different stores independently:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/bucket-and-object.png\" alt=\"bucket-and-object\" width=\"500\" />\n<\/div>\n\n<h3><strong>High-level design<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/high-level-design.png\" alt=\"high-level-design\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Load balancer<\/strong> - distributes API requests across service replicas<\/li>\n<li><strong>API service<\/strong> - Stateless server, orchestrating calls to metadata and object store, as well as IAM service.<\/li>\n<li><strong>Identity and access management (IAM)<\/strong> - central place for auth, authz, access control.<\/li>\n<li><strong>Data store<\/strong> - stores and retrieves actual data. Operations are based on object ID (UUID).<\/li>\n<li><strong>Metadata store<\/strong> - stores object metadata<\/li>\n<\/ul>\n<h3><strong>Uploading an object<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/uploading-object.png\" alt=\"uploading-object\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Create a bucket named \"bucket-to-share\" via HTTP PUT request<\/li>\n<li>API service calls IAM to ensure user is authorized and has write permissions<\/li>\n<li>API service calls metadata store to create a bucket entry. Once created, success response is returned.<\/li>\n<li>After bucket is created, HTTP PUT is sent to create an object named \"script.txt\"<\/li>\n<li>API service verifies user identity and ensures user has write permissions<\/li>\n<li>Once validation passes, object payload is sent via HTTP PUT to the data store. Data store persists it and returns a UUID.<\/li>\n<li>API service calls metadata store to create a new entry with object_id, bucket_id and bucket_name, among other metadata.<\/li>\n<\/ul>\n<p>Example object upload request:<\/p>\n<pre><code>PUT /bucket-to-share/script.txt HTTP/1.1\nHost: foo.s3example.org\nDate: Sun, 12 Sept 2021 17:51:00 GMT\nAuthorization: authorization string\nContent-Type: text/plain\nContent-Length: 4567\nx-amz-meta-author: Alex\n\n[4567 bytes of object data]\n<\/code><\/pre>\n<h3><strong>Downloading an object<\/strong><\/h3>\n<p>Buckets have no directory hierarchy, buy we can create a logical hierarchy by concatenating bucket name and object name to simulate a folder structure.<\/p>\n<p>Example GET request for fetching an object:<\/p>\n<pre><code>GET /bucket-to-share/script.txt HTTP/1.1\nHost: foo.s3example.org\nDate: Sun, 12 Sept 2021 18:30:01 GMT\nAuthorization: authorization string\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/download-object.png\" alt=\"download-object\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Client sends an HTTP GET request to the load balancer, ie <code>GET /bucket-to-share/script.txt<\/code><\/li>\n<li>API service queries IAM to verify the user has correct permissions to read the bucket<\/li>\n<li>Once validated, UUID of object is retrieved from metadata store<\/li>\n<li>Object payload is retrieved from data store based on UUID and returned to the client<\/li>\n<\/ul>\n<hr />\n<p>// sprint 1<\/p>\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3><strong>Data store<\/strong><\/h3>\n<p>Here's how the API service interacts with the data store:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-store-interactions.png\" alt=\"data-store-interactions\" width=\"500\" />\n<\/div>\n\n<p>The data store's main components:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-store-main-components.png\" alt=\"data-store-main-components\" width=\"500\" />\n<\/div>\n\n<p>The data routing service provides a RESTful or gRPC API to access the data node cluster.\nIt is a stateless service, which scales by adding more servers.<\/p>\n<p>It's main responsibilities are:\n- querying the placement service to get the best data node to store data\n- reading data from data nodes and returning it to the API service\n- Writing data to data nodes<\/p>\n<p>The placement service determines which data nodes should store an object.\nIt maintains a virtual cluster map, which determines the physical topology of a cluster.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/virtual-cluster-map.png\" alt=\"virtual-cluster-map\" width=\"500\" />\n<\/div>\n\n<p>The service also sends heartbeats to all data nodes to determine if they should be removed from the virtual cluster.<\/p>\n<p>Since this is a critical service, it is recommended to maintain a cluster of 5 or 7 replicas, synchronized via Paxos or Raft consensus algorithms.\nEg a 7 node cluster can tolerate 3 nodes failing.<\/p>\n<p>Data nodes store the actual object data.\nReliability and durability is ensured by replicating data to multiple data nodes.<\/p>\n<p>Each data node has a daemon running, which sends heartbeats to the placement service.<\/p>\n<p>The heartbeat includes:\n- How many disk drives (HDD or SSD) does the data node manage?\n- How much data is stored on each drive?<\/p>\n<h4>Data persistence flow<\/h4>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-persistence-flow.png\" alt=\"data-persistence-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>API service forwards the object data to data store<\/li>\n<li>Data routing service sends the data to the primary data node<\/li>\n<li>Primary data node saves the data locally and replicates it to two secondary data nodes. Response is sent after successful replication.<\/li>\n<li>The UUID of the object is returned to the API service.<\/li>\n<\/ul>\n<p>Caveats:\n- Given an object UUID, it's replication group is deterministically chosen by using consistent hashing\n- In step 4, the primary data node replicates the object data before returning a response. This favors strong consistency over higher latency.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/consistency-vs-latency.png\" alt=\"consistency-vs-latency\" width=\"500\" />\n<\/div>\n\n<h4>How data is organized<\/h4>\n<p>One simple approach to managing data is to store each object in a separate file.<\/p>\n<p>This works, but is not performant with many small files in a file system:\n- Data blocks on HDD are wasted, because every file uses the whole block size. Typical block size is 4kb.\n- Many files means many inodes. Operating systems don't deal well with too many inodes and there is also a max inode limit.<\/p>\n<p>These issues can be addressed by merging many small files into bigger ones via a write-ahead log (WAL). Once the file reaches its capacity (typically a few GB), a new file is created:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/wal-optimization.png\" alt=\"wal-optimization\" width=\"500\" />\n<\/div>\n\n<p>The downside of this approach is that write access to the file needs to be serialized. Multiple cores accessing the same file must wait for each other.\nTo fix this, we can confine files to specific cores to avoid lock contention.<\/p>\n<h4>Object lookup<\/h4>\n<p>To support storing multiple objects in the same file, we need to maintain a table, which tells the data node:\n- <code>object_id<\/code>\n- <code>filename<\/code> where object is stored\n- <code>file_offset<\/code> where object starts\n- <code>object_size<\/code><\/p>\n<p>We can deploy this table in a file-based db like RocksDB or a traditional relational database.\nSince the access pattern is low write+high read, a relational database works better.<\/p>\n<p>How should we deploy it?\nWe could deploy the db and scale it separately in a cluster, accessed by all data nodes.<\/p>\n<p>Downsides:\n- we'd need to aggressively scale the cluster to serve all requests\n- there's additional network latency between data node and db cluster<\/p>\n<p>An alternative is to take advantage of the fact that data nodes are only interested to data related to them,\nso we can deploy the relational db within the data node itself.<\/p>\n<p>SQLite is a good option as it's a lightweight file-based relational database.<\/p>\n<h4>Updated data persistence flow<\/h4>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/updated-data-persistence-flow.png\" alt=\"updated-data-persistence-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>API Service sends a request to save a new object<\/li>\n<li>Data node service appends the new object at the end of a file, named \"/data/c\"<\/li>\n<li>A new record for the object is inserted into the object mapping table<\/li>\n<\/ul>\n<h4>Durability<\/h4>\n<p>Data durability is an important requirement in our design. In order to achieve 6 nines of durability, every failure case needs to be properly examined.<\/p>\n<p>First problem to address is hardware failures. We can achieve that by replicating data nodes to minimize probability of failure.\nBut in addition to that, we also ought to replicate across different failure domains (cross-rack, cross-dc, separate networks, etc).\nA critical event can cause multiple hardware failures within the same domain:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/failure-domain-isolation.png\" alt=\"failure-domain-isolation\" width=\"500\" />\n<\/div>\n\n<p>Assuming annual failure rate of a typical HDD is 0.81%, making three copies gives us 6 nines of durability.<\/p>\n<p>Replicating the data nodes like that grants us the durability we want, but we could also leverage erasure coding to reduce storage costs.<\/p>\n<p>Erasure coding enables us to use parity bits, which allow us to reconstruct lost bits in the event of a failure:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding.png\" alt=\"erasure-coding\" width=\"500\" />\n<\/div>\n\n<p>Imagine those bits are data nodes. If two of them go down, they can be recovered using the remaining four ones.<\/p>\n<p>There are different erasure coding schemes. In our case, we could use 8+4 erasure coding, split across different failure domains to maximize reliability:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding-across-failure-domains.png\" alt=\"erasure-coding-across-failure-domains\" width=\"500\" />\n<\/div>\n\n<p>Erasure coding enables us to achieve a much lower storage cost (50% improvement) at the expense of access speed due to the data routing service having to collect data from multiple locations:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding-vs-replication.png\" alt=\"erasure-coding-vs-replication\" width=\"500\" />\n<\/div>\n\n<p>Other caveats:\n- Replication requires 200% storage overhead (in case of 3 replicas) vs. 50% via erasure coding\n- Erasure coding <a href=\"https://github.com/Backblaze/erasure-coding-durability\">gives us 11 nines of durability<\/a> vs 6 nines via replication\n- Erasure coding requires more computation to calculate and store parities<\/p>\n<p>In sum, replication is more useful for latency-sensitive applications, whereas erasure coding is attractive for storage cost efficiency and durability.\nErasure coding is also much harder to implement.<\/p>\n<h4>Correctness verification<\/h4>\n<p>If a disk fails entirely, then the failure is easy to detect. This is less straightforward in the event part of the disk memory gets corrupted.<\/p>\n<p>To detect this, we can use checksums - a hash of the file contents, which can be used to verify the file's integrity.<\/p>\n<p>In our case, we'll store checksums for each file and each object:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/checksums-for-correctness.png\" alt=\"checksums-for-correctness\" width=\"500\" />\n<\/div>\n\n<p>In the case of erasure coding (8+4), we'll need to fetch each of the 8 pieces of data separately and verify each of their checksums.<\/p>\n<p>// sprint 2<\/p>\n<h3><strong>Metadata data model<\/strong><\/h3>\n<p>Table schemas:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/metadata-data-model.png\" alt=\"metadata-data-model\" width=\"500\" />\n<\/div>\n\n<p>Queries we need to support:\n- Find an object ID by name\n- Insert/delete object based on name\n- List objects in a bucket sharing the same prefix<\/p>\n<p>There is usually a limit on the number of buckets a user can create, hence, the size of the buckets table is small and can fit into a single db server.\nBut we still need to scale the server for read throughput.<\/p>\n<p>The object table will probably not fit into a single database server, though. Hence, we can scale the table via sharding:\n- Sharding by bucket_id will lead to hotspot issues as a bucket can have billions of objects\n- Sharding by bucket_id makes the load more evenly distributed, but our queries will be slow\n- We choose sharding by <code>hash(bucket_name, object_name)<\/code> since most queries are based on the object/bucket name.<\/p>\n<p>Even with this sharding scheme, though, listing objects in a bucket will be slow.<\/p>\n<h3><strong>Listing objects in a bucket<\/strong><\/h3>\n<p>In a single database, listing an object based on its prefix (looks like a directory) works like this:<\/p>\n<pre><code>SELECT * FROM object WHERE bucket_id = &quot;123&quot; AND object_name LIKE `abc/%`\n<\/code><\/pre>\n<p>This is challenging to fulfill when the database is sharded. To achieve it, we can run the query on every shard and aggregate the results in-memory.\nThis makes pagination challenging though, since different shards contain a different result size and we need to maintain separate limit/offset for each.<\/p>\n<p>We can leverage the fact that typically object stores are not optimized for listing objects, so we can sacrifice listing performance.\nWe can also create a denormalized table for listing objects, sharded by bucket ID.\nThat would make our listing query sufficiently fast as it's isolated to a single database instance.<\/p>\n<h3><strong>Object versioning<\/strong><\/h3>\n<p>Versioning works by having another <code>object_version<\/code> column which is of type TIMEUUID, enabling us to sort records based on it.<\/p>\n<p>Each new version produces a new <code>object_id<\/code>:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/object-versioning.png\" alt=\"object-versioning\" width=\"500\" />\n<\/div>\n\n<p>Deleting an object creates a new version with a special <code>object_id<\/code> indicating that the object was deleted. Queries for it return 404:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/deleting-versioned-object.png\" alt=\"deleting-versioned-object\" width=\"500\" />\n<\/div>\n\n<h3><strong>Optimizing uploads of large files<\/strong><\/h3>\n<p>Uploading large files can be optimized by using multipart uploads - splitting a big file into several chunks, uploaded independently:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/multipart-upload.png\" alt=\"multipart-upload\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Client calls service to initiate a multipart upload<\/li>\n<li>Data store returns an upload ID which uniquely identifies the upload<\/li>\n<li>Client splits the large file into several chunks, uploaded independently using the upload id<\/li>\n<li>When a chunk is uploaded, the data store returns an etag, which is a md5 checksum, identifying that upload chunk<\/li>\n<li>After all parts are uploaded, client sends a complete multipart upload request, which includes upload_id, part numbers and all etags<\/li>\n<li>Data store reassembles the object from its parts. The process can take a few minutes. After that, success response is returned to the client.<\/li>\n<\/ul>\n<p>Old parts, which are no longer useful can be removed at this point. We can introduce a garbage collector to deal with it.<\/p>\n<h3><strong>Garbage collection<\/strong><\/h3>\n<p>Garbage collection is the process of reclaiming storage space, which is no longer used. There are a few ways data becomes garbage:\n- <strong>lazy object deletion<\/strong> - object is marked as deleted without actually getting deleted\n- <strong>orphan data<\/strong> - eg an upload failed mid-flight and old parts need to be deleted\n- <strong>corrupted data<\/strong> - data which failed checksum verification<\/p>\n<p>The garbage collector is also responsible for reclaiming unused space in replicas.\nWith replication, data is deleted from both primaries and replicas. With erasure coding (8+4), data is deleted from all 12 nodes.<\/p>\n<p>To facilitate the deletion, we'll use a process called compaction:\n- Garbage collector copies objects which are not deleted from \"data/b\" to \"data/d\"\n- <code>object_mapping<\/code> table is updated once copying is complete using a database transaction\n- To avoid making too many small files, compaction is done on files which grow beyond a certain threshold<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/compaction.png\" alt=\"compaction\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Things we covered:\n- Designing an S3-like object storage\n- Comparing differences between object, block and file storages\n- Covered uploading, downloading, listing, versioning of objects in a bucket\n- Deep dived in the design - data store and metadata store, replication and erasure coding, multipart uploads, sharding<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>在本章中，我们将设计一个<strong>对象存储（object storage）<\/strong>服务，类似于 <strong>Amazon S3<\/strong>。<\/p>\n<p>存储系统大致分为三大类：\n- <strong>块存储（Block storage）<\/strong>\n- <strong>文件存储（File storage）<\/strong>\n- <strong>对象存储（Object storage）<\/strong><\/p>\n<p><strong>块存储<\/strong>是一类设备，出现于 1960 年代。HDD 和 SSD 就是这样的例子。\n这些设备通常物理连接到服务器，不过它们也可以通过高速网络协议以网络方式连接。\n服务器可以格式化这些原始数据块，并将其用作文件系统，或者直接将控制权交给服务器。<\/p>\n<p><strong>文件存储<\/strong>构建在块存储之上。它提供了更高层次的抽象，使文件夹和文件更易于管理。<\/p>\n<p><strong>对象存储<\/strong>以牺牲性能为代价，换取高持久性、超大规模和低成本。\n它面向「冷」数据，主要用于归档和备份。\n它没有分层目录结构，所有数据都以对象的形式存储在扁平结构中。\n与其他存储类型相比，它相对较慢。大多数云服务商都提供对象存储产品——Amazon S3、Google GCS 等。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/storage-comparison.png\" alt=\"存储方式比较\" width=\"500\" />\n<\/div>\n\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>块存储<\/th>\n<th>文件存储<\/th>\n<th>对象存储<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>内容可修改性<\/td>\n<td>Y<\/td>\n<td>Y<\/td>\n<td>N（支持对象版本管理）<\/td>\n<\/tr>\n<tr>\n<td>成本<\/td>\n<td>高<\/td>\n<td>中到高<\/td>\n<td>低<\/td>\n<\/tr>\n<tr>\n<td>性能<\/td>\n<td>中到高，非常高<\/td>\n<td>中到高<\/td>\n<td>低到中<\/td>\n<\/tr>\n<tr>\n<td>一致性<\/td>\n<td>强一致性<\/td>\n<td>强一致性<\/td>\n<td>强一致性 [5]<\/td>\n<\/tr>\n<tr>\n<td>数据访问<\/td>\n<td>SAS/iSCSI/FC<\/td>\n<td>标准文件访问，CIFS/SMB 和 NFS<\/td>\n<td>RESTful API<\/td>\n<\/tr>\n<tr>\n<td>可扩展性<\/td>\n<td>中等可扩展性<\/td>\n<td>高可扩展性<\/td>\n<td>超大规模可扩展性<\/td>\n<\/tr>\n<tr>\n<td>适用场景<\/td>\n<td>虚拟机（VM）、数据库<\/td>\n<td>通用文件系统访问<\/td>\n<td>二进制数据、非结构化数据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>一些与对象存储相关的术语：\n- <strong>存储桶（Bucket）<\/strong>——对象的逻辑容器。名称全局唯一。\n- <strong>对象（Object）<\/strong>——存储在存储桶中的单个数据单元。包含对象数据和元数据（metadata）。\n- <strong>版本管理（Versioning）<\/strong>——在同一存储桶中保留一个对象的多个版本的功能。\n- <strong>统一资源标识符（Uniform Resource Identifier，URI）<\/strong>——每个资源都由一个 URI 唯一标识。\n- <strong>服务等级协议（Service-level Agreement，SLA）<\/strong>——服务提供者与客户端之间的契约。<\/p>\n<p>Amazon S3 低频访问（Standard-Infrequent Access）存储类的 SLA：\n- 跨多个可用区（Availability Zone）持久性达 99.999999999%\n- 在整个可用区被摧毁的情况下，数据仍具韧性\n- 设计可用性为 99.9%<\/p>\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<ul>\n<li>候选人（C）：应该包含哪些功能？<\/li>\n<li>面试官（I）：存储桶创建、对象上传/下载、版本管理、列出存储桶中的对象<\/li>\n<li>候选人（C）：典型的数据大小是多少？<\/li>\n<li>面试官（I）：我们需要高效地存储超大对象和小对象<\/li>\n<li>候选人（C）：我们一年存储多少数据？<\/li>\n<li>面试官（I）：100 PB<\/li>\n<li>候选人（C）：我们可以假设数据持久性达到六个九（99.9999%）、服务可用性达到四个九（99.99%）吗？<\/li>\n<li>面试官（I）：可以，听起来合理<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li><strong>100 PB 数据<\/strong><\/li>\n<li><strong>六个九的数据持久性<\/strong><\/li>\n<li><strong>四个九的服务可用性<\/strong><\/li>\n<li>存储效率。在保持高可靠性和高性能的同时降低存储成本<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-envelope estimation）<\/strong><\/h3>\n<p>对象存储的瓶颈很可能出现在磁盘容量或每秒输入输出操作数（IOPS）上。<\/p>\n<p>假设：\n- 我们有 20% 的小对象（小于 1MB）、60% 的中等对象（1-64MB）和 20% 的大对象（大于 64MB），\n- 一块硬盘（SATA，7200rpm）每秒能够进行 100-150 次随机寻道（100-150 IOPS）<\/p>\n<p>根据这些假设，我们可以估算系统能够持久化的对象总数。\n- 让我们使用每种对象类型的中位数大小来简化计算——小对象 0.5MB，中对象 32MB，大对象 200MB。\n- 给定 100PB 存储（10^11 MB），按 40% 的存储使用率计算，得到 6.8 亿个对象\n- 如果假设元数据为 1KB，那么我们需要 0.68TB 的空间来存储元数据信息<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<p>在深入设计之前，让我们先探讨对象存储的一些有意思的特性：\n- <strong>对象不可变性（Object immutability）<\/strong>——对象存储中的对象是不可变的（其他存储系统并非如此）。我们可以删除或替换它们，但不能更新。\n- <strong>键值存储（Key-value store）<\/strong>——对象 URI 就是它的键，我们可以通过发起一次 HTTP 调用来获取其内容\n- <strong>一次写入、多次读取（Write once, read many times）<\/strong>——数据访问模式是写入一次、读取多次。根据 LinkedIn 的一些研究，95% 的操作是读取\n- 同时支持小对象和大对象<\/p>\n<p>对象存储的设计哲学与 UNIX 类似——当我们保存文件时，它会在一个称为 inode 的数据结构中创建文件名，而文件数据则存储在不同的磁盘位置。\ninode 包含一个文件块指针列表，这些指针指向磁盘上的不同位置。<\/p>\n<p>访问文件时，我们首先从 inode 获取其元数据，然后再获取文件内容。<\/p>\n<p>对象存储的工作方式类似——元数据存储用于保存文件信息，而内容则存储在磁盘上：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/object-store-vs-unix.png\" alt=\"对象存储与 UNIX 对比\" width=\"500\" />\n<\/div>\n\n<p>通过将元数据与文件内容分离，我们可以独立地扩展不同的存储：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/bucket-and-object.png\" alt=\"存储桶与对象\" width=\"500\" />\n<\/div>\n\n<h3><strong>高层设计<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/high-level-design.png\" alt=\"高层设计\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>负载均衡器（Load balancer）<\/strong>——将 API 请求分发到各个服务副本<\/li>\n<li><strong>API 服务（API service）<\/strong>——无状态服务器，协调对元数据存储、对象存储以及 IAM 服务的调用。<\/li>\n<li><strong>身份与访问管理（Identity and access management，IAM）<\/strong>——认证（auth）、授权（authz）、访问控制的中心位置。<\/li>\n<li><strong>数据存储（Data store）<\/strong>——存储和检索实际数据。操作基于对象 ID（UUID）。<\/li>\n<li><strong>元数据存储（Metadata store）<\/strong>——存储对象元数据<\/li>\n<\/ul>\n<h3><strong>上传对象（Uploading an object）<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/uploading-object.png\" alt=\"上传对象\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>通过 HTTP PUT 请求创建一个名为「bucket-to-share」的存储桶<\/li>\n<li>API 服务调用 IAM 以确认用户已授权并具有写权限<\/li>\n<li>API 服务调用元数据存储创建一条存储桶记录。创建成功后，返回成功响应。<\/li>\n<li>存储桶创建后，发送 HTTP PUT 以创建一个名为「script.txt」的对象<\/li>\n<li>API 服务验证用户身份，并确认用户具有写权限<\/li>\n<li>验证通过后，对象负载（payload）通过 HTTP PUT 发送到数据存储。数据存储将其持久化，并返回一个 UUID。<\/li>\n<li>API 服务调用元数据存储，创建一条包含 object_id、bucket_name 以及其他元数据的新记录。<\/li>\n<\/ul>\n<p>对象上传请求示例：<\/p>\n<pre><code>PUT /bucket-to-share/script.txt HTTP/1.1\nHost: foo.s3example.org\nDate: Sun, 12 Sept 2021 17:51:00 GMT\nAuthorization: authorization string\nContent-Type: text/plain\nContent-Length: 4567\nx-amz-meta-author: Alex\n\n[4567 bytes of object data]\n<\/code><\/pre>\n<h3><strong>下载对象（Downloading an object）<\/strong><\/h3>\n<p>存储桶没有目录层级，但我们可以通过拼接存储桶名和对象名来创建逻辑层级，以模拟文件夹结构。<\/p>\n<p>获取对象的 GET 请求示例：<\/p>\n<pre><code>GET /bucket-to-share/script.txt HTTP/1.1\nHost: foo.s3example.org\nDate: Sun, 12 Sept 2021 18:30:01 GMT\nAuthorization: authorization string\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/download-object.png\" alt=\"下载对象\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>客户端向负载均衡器发送 HTTP GET 请求，即 <code>GET /bucket-to-share/script.txt<\/code><\/li>\n<li>API 服务查询 IAM，以验证用户具有读取该存储桶的正确权限<\/li>\n<li>验证通过后，从元数据存储中检索对象的 UUID<\/li>\n<li>根据 UUID 从数据存储中检索对象负载，并返回给客户端<\/li>\n<\/ul>\n<hr />\n<p>// sprint 1<\/p>\n<h2>第 3 步：深入设计<\/h2>\n<h3><strong>数据存储（Data store）<\/strong><\/h3>\n<p>下面是 API 服务与数据存储交互的方式：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-store-interactions.png\" alt=\"数据存储交互\" width=\"500\" />\n<\/div>\n\n<p>数据存储的主要组件：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-store-main-components.png\" alt=\"数据存储主要组件\" width=\"500\" />\n<\/div>\n\n<p>数据路由服务（data routing service）提供 RESTful 或 gRPC API，用于访问数据节点集群。\n它是一个无状态服务，通过添加更多服务器来扩展。<\/p>\n<p>它的主要职责是：\n- 查询放置服务（placement service），以获得存储数据的最佳数据节点\n- 从数据节点读取数据并返回给 API 服务\n- 将数据写入数据节点<\/p>\n<p>放置服务决定哪些数据节点应该存储某个对象。\n它维护一张虚拟集群映射（virtual cluster map），该映射决定了集群的物理拓扑。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/virtual-cluster-map.png\" alt=\"虚拟集群映射\" width=\"500\" />\n<\/div>\n\n<p>该服务还向所有数据节点发送心跳（heartbeat），以判断它们是否应从虚拟集群中移除。<\/p>\n<p>由于这是一个关键服务，建议维护一个由 5 或 7 个副本组成的集群，通过 Paxos 或 Raft 共识算法进行同步。\n例如，一个 7 节点集群可以容忍 3 个节点故障。<\/p>\n<p>数据节点存储实际的对象数据。\n通过将数据复制到多个数据节点来确保可靠性和持久性。<\/p>\n<p>每个数据节点都运行一个守护进程（daemon），它向放置服务发送心跳。<\/p>\n<p>心跳包含：\n- 该数据节点管理多少个磁盘驱动器（HDD 或 SSD）？\n- 每个驱动器上存储了多少数据？<\/p>\n<h4>数据持久化流程<\/h4>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/data-persistence-flow.png\" alt=\"数据持久化流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>API 服务将对象数据转发给数据存储<\/li>\n<li>数据路由服务将数据发送到主数据节点（primary data node）<\/li>\n<li>主数据节点在本地保存数据，并将其复制到两个从数据节点（secondary data nodes）。复制成功后发送响应。<\/li>\n<li>对象的 UUID 返回给 API 服务。<\/li>\n<\/ul>\n<p>注意事项：\n- 给定一个对象 UUID，它的复制组是通过一致性哈希（consistent hashing）确定性地选择的\n- 在第 4 步中，主数据节点在返回响应之前复制对象数据。这优先保证了强一致性，而不是更低的延迟。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/consistency-vs-latency.png\" alt=\"一致性与延迟权衡\" width=\"500\" />\n<\/div>\n\n<h4>数据如何组织<\/h4>\n<p>管理数据的一种简单方法是将每个对象存储在单独的文件中。<\/p>\n<p>这可行，但在文件系统中有大量小文件时性能不佳：\n- HDD 上的数据块被浪费了，因为每个文件都占用整个块大小。典型的块大小是 4KB。\n- 文件多意味着 inode 多。操作系统对过多 inode 的处理能力不佳，而且还有 inode 数量上限。<\/p>\n<p>这些问题可以通过预写日志（write-ahead log，WAL）将许多小文件合并成大文件来解决。一旦文件达到其容量（通常为几 GB），就创建一个新文件：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/wal-optimization.png\" alt=\"WAL 优化\" width=\"500\" />\n<\/div>\n\n<p>这种方法的缺点是对文件的写访问必须串行化（serialized）。多个核心访问同一个文件时必须相互等待。\n为了解决这个问题，我们可以将文件限定到特定的核心，以避免锁竞争（lock contention）。<\/p>\n<h4>对象查找<\/h4>\n<p>为了支持在同一文件中存储多个对象，我们需要维护一张表，它告诉数据节点：\n- <code>object_id<\/code>\n- 对象存储的 <code>filename<\/code>\n- 对象起始位置的 <code>file_offset<\/code>\n- <code>object_size<\/code><\/p>\n<p>我们可以把这张表部署在基于文件的数据库中，如 RocksDB，或传统的关系型数据库中。\n由于访问模式是低写入 + 高读取，关系型数据库更合适。<\/p>\n<p>我们该如何部署它？\n我们可以部署这个数据库，并在一个集群中单独扩展它，供所有数据节点访问。<\/p>\n<p>缺点：\n- 我们需要积极地扩展集群来服务所有请求\n- 数据节点与数据库集群之间存在额外的网络延迟<\/p>\n<p>另一种方法是利用这样一个事实：数据节点只关心与自己相关的数据，\n因此我们可以将关系型数据库部署在数据节点内部。<\/p>\n<p>SQLite 是一个不错的选择，因为它是一个轻量级的基于文件的关系型数据库。<\/p>\n<h4>更新后的数据持久化流程<\/h4>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/updated-data-persistence-flow.png\" alt=\"更新后的数据持久化流程\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>API 服务发送保存新对象的请求<\/li>\n<li>数据节点服务将新对象追加到一个名为「/data/c」的文件末尾<\/li>\n<li>为该对象在对象映射表中插入一条新记录<\/li>\n<\/ul>\n<h4>持久性（Durability）<\/h4>\n<p>数据持久性是我们设计中的一项重要需求。为了实现六个九的持久性，每一种故障情况都需要妥善考察。<\/p>\n<p>首先要解决的问题是硬件故障。我们可以通过复制数据节点来最大限度地降低故障概率。\n但除此之外，我们还应该跨不同的故障域（failure domain）进行复制（跨机架、跨数据中心、独立网络等）。\n一个关键事件可能导致同一域内多个硬件同时故障：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/failure-domain-isolation.png\" alt=\"故障域隔离\" width=\"500\" />\n<\/div>\n\n<p>假设一块典型 HDD 的年故障率为 0.81%，制作三个副本就能让我们获得六个九的持久性。<\/p>\n<p>这样复制数据节点为我们提供了所需的持久性，但我们也可以利用纠删码（erasure coding）来降低存储成本。<\/p>\n<p>纠删码使我们能够使用奇偶校验位（parity bits），在发生故障时重建丢失的数据位：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding.png\" alt=\"纠删码\" width=\"500\" />\n<\/div>\n\n<p>想象这些位就是数据节点。如果其中两个宕机，就可以用剩下的四个来恢复它们。<\/p>\n<p>纠删码有不同的方案。在我们的场景中，可以使用 8+4 纠删码，分布到不同的故障域中，以最大化可靠性：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding-across-failure-domains.png\" alt=\"跨故障域的纠删码\" width=\"500\" />\n<\/div>\n\n<p>纠删码使我们能够以低得多的存储成本（提升 50%）实现目标，代价是访问速度变慢，因为数据路由服务必须从多个位置收集数据：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/erasure-coding-vs-replication.png\" alt=\"纠删码与复制对比\" width=\"500\" />\n<\/div>\n\n<p>其他注意事项：\n- 复制需要 200% 的存储开销（3 副本的情况下），而纠删码只需 50%\n- 纠删码<a href=\"https://github.com/Backblaze/erasure-coding-durability\">为我们提供 11 个九的持久性<\/a>，而复制只有 6 个九\n- 纠删码需要更多计算来计算和存储奇偶校验<\/p>\n<p>总之，复制更适合对延迟敏感的应用，而纠删码在存储成本效率和持久性方面更具吸引力。\n纠删码的实现也要困难得多。<\/p>\n<h4>正确性校验<\/h4>\n<p>如果磁盘完全故障，那么故障很容易检测。但如果磁盘内存的一部分损坏，就没那么直接了。<\/p>\n<p>为了检测这种情况，我们可以使用校验和（checksum）——文件内容的哈希，可用于验证文件的完整性。<\/p>\n<p>在我们的场景中，我们会为每个文件和每个对象存储校验和：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/checksums-for-correctness.png\" alt=\"用于正确性校验的校验和\" width=\"500\" />\n<\/div>\n\n<p>在使用纠删码（8+4）的情况下，我们需要分别获取 8 份数据，并验证每份的校验和。<\/p>\n<p>// sprint 2<\/p>\n<h3><strong>元数据数据模型<\/strong><\/h3>\n<p>表结构：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/metadata-data-model.png\" alt=\"元数据数据模型\" width=\"500\" />\n<\/div>\n\n<p>我们需要支持的查询：\n- 按名称查找对象 ID\n- 根据名称插入/删除对象\n- 列出存储桶中具有相同前缀的对象<\/p>\n<p>用户可创建的存储桶数量通常有限制，因此 buckets 表的规模很小，可以放进单台数据库服务器。\n但我们仍然需要为读吞吐量扩展这台服务器。<\/p>\n<p>不过，object 表可能无法放进单台数据库服务器。因此，我们可以通过分片（sharding）来扩展这张表：\n- 按 bucket_id 分片会导致热点问题，因为一个存储桶可能有数十亿个对象\n- 按 bucket_id 分片能让负载更均匀地分布，但我们的查询会变慢\n- 我们选择按 <code>hash(bucket_name, object_name)<\/code> 分片，因为大多数查询都是基于对象/存储桶名称的。<\/p>\n<p>不过，即使采用这种分片方案，列出存储桶中的对象仍然会很慢。<\/p>\n<h3><strong>列出存储桶中的对象<\/strong><\/h3>\n<p>在单个数据库中，基于前缀（看起来像目录）列出对象的工作方式如下：<\/p>\n<pre><code>SELECT * FROM object WHERE bucket_id = &quot;123&quot; AND object_name LIKE `abc/%`\n<\/code><\/pre>\n<p>当数据库被分片时，实现这一点具有挑战性。要实现它，我们可以在每个分片上运行该查询，并在内存中聚合结果。\n但这会让分页变得具有挑战性，因为不同分片包含的结果大小不同，我们需要为每个分片维护独立的 limit/offset。<\/p>\n<p>我们可以利用这样一个事实：对象存储通常并未针对列出对象做优化，因此我们可以牺牲列出性能。\n我们还可以创建一张反规范化（denormalized）表来列出对象，按存储桶 ID 分片。\n这会让我们的列出查询足够快，因为它被隔离在单个数据库实例中。<\/p>\n<h3><strong>对象版本管理（Object versioning）<\/strong><\/h3>\n<p>版本管理通过增加一个 <code>object_version<\/code> 列来实现，该列类型为 TIMEUUID，使我们能够据此对记录排序。<\/p>\n<p>每个新版本都会产生一个新的 <code>object_id<\/code>：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/object-versioning.png\" alt=\"对象版本管理\" width=\"500\" />\n<\/div>\n\n<p>删除对象会创建一个新版本，该版本带有一个特殊的 <code>object_id<\/code>，表明对象已被删除。查询它会返回 404：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/deleting-versioned-object.png\" alt=\"删除带版本的对象\" width=\"500\" />\n<\/div>\n\n<h3><strong>优化大文件上传<\/strong><\/h3>\n<p>上传大文件可以通过使用分片上传（multipart upload）来优化——将一个大文件拆分成多个数据块（chunk），独立上传：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/multipart-upload.png\" alt=\"分片上传\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>客户端调用服务以发起一次分片上传<\/li>\n<li>数据存储返回一个上传 ID，唯一标识此次上传<\/li>\n<li>客户端将大文件拆分成多个数据块，使用上传 ID 独立上传<\/li>\n<li>上传完一个数据块后，数据存储返回一个 etag，它是一个 md5 校验和，标识该上传数据块<\/li>\n<li>所有部分上传完成后，客户端发送一个完成分片上传请求，其中包含 upload_id、各部分编号和所有 etag<\/li>\n<li>数据存储从各部分重组对象。这个过程可能需要几分钟。之后，成功响应返回给客户端。<\/li>\n<\/ul>\n<p>此时可以移除不再有用的旧部分。我们可以引入一个垃圾回收器（garbage collector）来处理。<\/p>\n<h3><strong>垃圾回收（Garbage collection）<\/strong><\/h3>\n<p>垃圾回收是回收不再使用的存储空间的过程。数据变成垃圾有几种方式：\n- <strong>惰性对象删除（lazy object deletion）<\/strong>——对象被标记为已删除，但并未真正删除\n- <strong>孤儿数据（orphan data）<\/strong>——例如上传中途失败，旧的部分需要删除\n- <strong>损坏数据（corrupted data）<\/strong>——未通过校验和验证的数据<\/p>\n<p>垃圾回收器还负责回收副本中未使用的空间。使用复制时，数据会从主节点和副本中删除。使用纠删码（8+4）时，数据会从全部 12 个节点中删除。<\/p>\n<p>为了便于删除，我们将使用一个称为压缩（compaction）的过程：\n- 垃圾回收器将未删除的对象从「data/b」复制到「data/d」\n- 复制完成后，使用一个数据库事务更新 <code>object_mapping<\/code> 表\n- 为避免产生过多小文件，只对增长超过某个阈值的文件进行压缩<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"24. S3-like Object Storage/images/compaction.png\" alt=\"压缩\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>我们涵盖的内容：\n- 设计一个类 S3 的对象存储\n- 比较对象存储、块存储和文件存储之间的差异\n- 涵盖存储桶中对象的上传、下载、列出、版本管理\n- 深入设计——数据存储与元数据存储、复制与纠删码、分片上传、分片<\/p>", "enTitle": "Chapter 24: S3-like Object Storage", "zhTitle": "第 24 章：类 S3 对象存储（S3-like Object Storage）", "short": "S3-like Object Storage", "num": "24"}, "25. Real-time Gaming Leaderboard": {"en": "\n<h2>Introduction<\/h2>\n<p>We are going to design a <strong>leaderboard<\/strong> for an online mobile game:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard.png\" alt=\"leaderboard\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: How is the score calculated for the leaderboard?<\/li>\n<li>I: User gets a point whenever they win a match.<\/li>\n<li>C: Are all players included in the leaderboard?<\/li>\n<li>I: Yes<\/li>\n<li>C: Is there a time segment, associated with the leaderboard?<\/li>\n<li>I: Each month, a new tournament starts which starts a new leaderboard.<\/li>\n<li>C: Can we assume we only care about top 10 users?<\/li>\n<li>I: We want to display top 10 users, along with position of specific user. If time permits, we can discuss showing users around particular user in the leaderboard.<\/li>\n<li>C: How many users are in a tournament?<\/li>\n<li>I: 5mil DAU and 25mil MAU<\/li>\n<li>C: How many matches are played on average during a tournament?<\/li>\n<li>I: Each player plays 10 matches per day on average<\/li>\n<li>C: How do we determine the rank if two players have the same score?<\/li>\n<li>I: Their rank is the same in that case. If time permits, we can discuss breaking ties.<\/li>\n<li>C: Does the leaderboard need to be real-time?<\/li>\n<li>I: Yes, we want to present real-time results or as close as possible to real-time. It is not okay to present batched result history.<\/li>\n<\/ul>\n<h3><strong>Functional requirements<\/strong><\/h3>\n<ul>\n<li>Display top 10 players on leaderboard<\/li>\n<li>Show a user's specific rank<\/li>\n<li>Display users which are four places above and below given user (bonus)<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li>Real-time updates on scores<\/li>\n<li>Score update is reflected on the leaderboard in real-time<\/li>\n<li>General scalability, availability, reliability<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<p>With 50mil DAU, if the game has an even distribution of players during a 24h period, we'd have an average of 50 users per second.\nHowever, since distribution is typically uneven, we can estimate that the peak online users would be 250 users per second.<\/p>\n<p>QPS for users scoring a point - given 10 games per day on average, 50 users/s * 10 = 500 QPS. Peak QPS = 2500.<\/p>\n<p>QPS for fetching the top 10 leaderboard - assuming users open that once a day on average, QPS is 50.<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3><strong>API Design<\/strong><\/h3>\n<p>The first API we need is one to update a user's score:<\/p>\n<pre><code>POST /v1/scores\n<\/code><\/pre>\n<p>This API takes two params - <code>user_id<\/code> and <code>points<\/code> scored for winning a game.<\/p>\n<p>This API should only be accessible to game servers, not end clients.<\/p>\n<p>Next one is for getting the top 10 players of the leaderboard:<\/p>\n<pre><code>GET /v1/scores\n<\/code><\/pre>\n<p>Example response:<\/p>\n<pre><code>{\n  &quot;data&quot;: [\n    {\n      &quot;user_id&quot;: &quot;user_id1&quot;,\n      &quot;user_name&quot;: &quot;alice&quot;,\n      &quot;rank&quot;: 1,\n      &quot;score&quot;: 12543\n    },\n    {\n      &quot;user_id&quot;: &quot;user_id2&quot;,\n      &quot;user_name&quot;: &quot;bob&quot;,\n      &quot;rank&quot;: 2,\n      &quot;score&quot;: 11500\n    }\n  ],\n  ...\n  &quot;total&quot;: 10\n}\n<\/code><\/pre>\n<p>You can also get the score of a particular user:<\/p>\n<pre><code>GET /v1/scores/{:user_id}\n<\/code><\/pre>\n<p>Example response:<\/p>\n<pre><code>{\n    &quot;user_info&quot;: {\n        &quot;user_id&quot;: &quot;user5&quot;,\n        &quot;score&quot;: 1000,\n        &quot;rank&quot;: 6,\n    }\n}\n<\/code><\/pre>\n<h3><strong>High-level architecture<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/high-level-architecture.png\" alt=\"high-level-architecture\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>When a player wins a game, client sends a request to the game service<\/li>\n<li>Game service validates if win is valid and calls the leaderboard service to update the player's score<\/li>\n<li>Leaderboard service updates the user's score in the leaderboard store<\/li>\n<li>Player makes a call to leaderboard service to fetch leaderboard data, eg top 10 players and given player's rank<\/li>\n<\/ul>\n<p>An alternative design which was considered is the client updating their score directly within the leaderboard service:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/alternative-design.png\" alt=\"alternative-design\" width=\"500\" />\n<\/div>\n\n<p>This option is not secure as it's susceptible to man-in-the-middle attacks. Players can put a proxy and change their score as they please.<\/p>\n<p>One additional caveat is that for games, where the game logic is managed by the server, cliets don't need to call the server explicitly to record their win.\nServers do it automatically for them based on the game logic.<\/p>\n<p>One additional consideration is whether we should put a message queue between the game server and the leaderboard service. This would be useful if other services are interested in game results, but that is not an explicit requirement in the interview so far, hence it's not included in the design:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/message-queue-based-comm.png\" alt=\"message-queue-based-comm\" width=\"500\" />\n<\/div>\n\n<h3><strong>Data models<\/strong><\/h3>\n<p>Let's discuss the options we have for storing leaderboard data - relational DBs, Redis, NoSQL.<\/p>\n<p>The NoSQL solution is discussed in the deep dive section.<\/p>\n<h4>Relational database solution<\/h4>\n<p>If the scale doesn't matter and we don't have that many users, a relational DB serves our quite well.<\/p>\n<p>We can start from a simple leaderboard table, one for each month (personal note - this doesn't make sense. You can just add a <code>month<\/code> column and avoid the headache of maintaining new tables each month):<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard-table.png\" alt=\"leaderboard-table\" width=\"500\" />\n<\/div>\n\n<p>There is additional data to include in there, but that is irrelevant to the queries we'd run, so it's omitted.<\/p>\n<p>What happens when a user wins a point?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-wins-point.png\" alt=\"user-wins-point\" width=\"500\" />\n<\/div>\n\n<p>If a user doesn't exist in the table yet, we need to insert them first:<\/p>\n<pre><code>INSERT INTO leaderboard (user_id, score) VALUES ('mary1934', 1);\n<\/code><\/pre>\n<p>On subsequent calls, we'd just update their score:<\/p>\n<pre><code>UPDATE leaderboard set score=score + 1 where user_id='mary1934';\n<\/code><\/pre>\n<p>How do we find the top players of a leaderboard?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/find-leaderboard-position.png\" alt=\"find-leaderboard-position\" width=\"500\" />\n<\/div>\n\n<p>We can run the following query:<\/p>\n<pre><code>SELECT (@rownum := @rownum + 1) AS rank, user_id, score\nFROM leaderboard\nORDER BY score DESC;\n<\/code><\/pre>\n<p>This is not performant though as it makes a table scan to order all records in the database table.<\/p>\n<p>We can optimize it by adding an index on <code>score<\/code> and using the <code>LIMIT<\/code> operation to avoid scanning everything:<\/p>\n<pre><code>SELECT (@rownum := @rownum + 1) AS rank, user_id, score\nFROM leaderboard\nORDER BY score DESC\nLIMIT 10;\n<\/code><\/pre>\n<p>This approach, however, doesn't scale well if the user is not at the top of the leaderboard and you'd want to locate their rank.<\/p>\n<h4>Redis solution<\/h4>\n<p>We want to find a solution, which works well even for millions of players without having to fallback on complex database queries.<\/p>\n<p>Redis is an in-memory data store, which is fast as it works in-memory and has a suitable data structure to serve our needs - sorted set.<\/p>\n<p>A sorted set is a data structure similar to sets in programming languages, which allows you to keep a data structure sorted by a given criteria.\nInternally, it is implemented using a hash-map to maintain mapping between key (user_id) and value (score) and a skip list which maps scores to users in sorted order:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/sorted-set.png\" alt=\"sorted-set\" width=\"500\" />\n<\/div>\n\n<p>How does a skip list work?\n- It is a linked list which allows for fast search\n- It consists of a sorted linked list and multi-level indexes<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/skip-list.png\" alt=\"skip-list\" width=\"500\" />\n<\/div>\n\n<p>This structure enables us to quickly search for specific values when the data set is large enough.\nIn the example below (64 nodes), it requires traversing 62 nodes in a base linked list to find the given value and 11 nodes in the skip-list case:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/skip-list-performance.png\" alt=\"skip-list-performance\" width=\"500\" />\n<\/div>\n\n<p>Sorted sets are more performant than relational databases as the data is kept sorted at all times at the price of O(logN) add and find operation.<\/p>\n<p>In contract, here's an example nested query we need to run to find the rank of a given user in a relational DB:<\/p>\n<pre><code>SELECT *,(SELECT COUNT(*) FROM leaderboard lb2\nWHERE lb2.score &gt;= lb1.score) RANK\nFROM leaderboard lb1\nWHERE lb1.user_id = {:user_id};\n<\/code><\/pre>\n<p>What operations do we need to operate our leaderboard in Redis?\n- <strong>ZADD<\/strong> - insert the user into the set if they don't exist. Otherwise, update the score. O(logN) time complexity.\n- <strong>ZINCRBY<\/strong> - increment the score of a user by given amount. If user doesn't exist, score starts at zero. O(logN) time complexity.\n- <strong>ZRANGE/ZREVRANGE<\/strong> - fetch a range of users, sorted by their score. We can specify order (ASC/DESC), offset and result size. O(logN+M) time complexity where M is result size.\n- <strong>ZRANK/ZREVRANK<\/strong> - Fetch the position (rank) of given user in ASC/DESC order. O(logN) time complexity.<\/p>\n<p>What happens when a user scores a point?<\/p>\n<pre><code>ZINCRBY leaderboard_feb_2021 1 'mary1934'\n<\/code><\/pre>\n<p>There's a new leaderboard created every month while old ones are moved to historical storage.<\/p>\n<p>What happens when a user fetches top 10 players?<\/p>\n<pre><code>ZREVRANGE leaderboard_feb_2021 0 9 WITHSCORES\n<\/code><\/pre>\n<p>Example result:<\/p>\n<pre><code>[(user2,score2),(user1,score1),(user5,score5)...]\n<\/code><\/pre>\n<p>What about user fetching their leaderboard position?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard-position-of-user.png\" alt=\"leaderboard-position-of-user\" width=\"500\" />\n<\/div>\n\n<p>This can be easily achieved by the following query, given that we know a user's leaderboard position:<\/p>\n<pre><code>ZREVRANGE leaderboard_feb_2021 357 365\n<\/code><\/pre>\n<p>A user's position can be fetched using <code>ZREVRANK &lt;user-id&gt;<\/code>.<\/p>\n<p>Let's explore what our storage requirements are:\n- Assuming worst-case scenario of all 25mil MAU participating in the game for a given month\n- ID is 24-character string and score is 16-bit integer, we need 26 bytes * 25mil = ~650MB of storage\n- Even if we double the storage cost due to the overhead of the skip list, this would still easily fit in a modern redis cluster<\/p>\n<p>Another non-functional requirement to consider is supporting 2500 updates per second. This is well within a single Redis server's capabilities.<\/p>\n<p>Additional caveats:\n- We can spin up a Redis replica to avoid losing data when a redis server crashes\n- We can still leverage Redis persistence to not lose data in the event of a crash\n- We'll need two supporting tables in MySQL to fetch user details such as username, display name, etc as well as store when eg a user won a game\n- The second table in MySQL can be used to reconstruct leaderboard when there is an infrastructure failure\n- As a small performance optimization, we could cache the user details of top 10 players as they'd be frequently accessed<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3><strong>To use a cloud provider or not<\/strong><\/h3>\n<p>We can either choose to deploy and manage our own services or use a cloud provider to manage them for us.<\/p>\n<p>If we choose to manage the services our selves, we'll use redis for leaderboard data, mysql for user profile and potentially a cache for user profile if we want to scale the database:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/manage-services-ourselves.png\" alt=\"manage-services-ourselves\" width=\"500\" />\n<\/div>\n\n<p>Alternatively, we could use cloud offerings to manage a lot of the services for us. For example, we can use AWS API Gateway to route API calls to AWS Lambda functions:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/api-gateway-mapping.png\" alt=\"api-gateway-mapping\" width=\"500\" />\n<\/div>\n\n<p>AWS Lambda enables us to run code without managing or provisioning servers ourselves. It runs only when needed and scales automatically.<\/p>\n<p>Exmaple user scoring a point:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-scoring-point-lambda.png\" alt=\"user-scoring-point-lambda\" width=\"500\" />\n<\/div>\n\n<p>Example user retrieving leaderboard:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-retrieve-leaderboard.png\" alt=\"user-retrieve-leaderboard\" width=\"500\" />\n<\/div>\n\n<p>Lambdas are an implementation of a serverless architecture. We don't need to manage scaling and environment setup.<\/p>\n<p>Author recommends going with this approach if we build the game from the ground up.<\/p>\n<h3><strong>Scaling Redis<\/strong><\/h3>\n<p>With 5mil DAU, we can get away with a single Redis instance from both a storage and QPS perspective.<\/p>\n<p>However, if we imagine userbase grows 10x to 500mil DAU, then we'd need 65gb for storage and QPS goes to 250k.<\/p>\n<p>Such scale would require sharding.<\/p>\n<p>One way to achieve it is by range-partitioning the data:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/range-partition.png\" alt=\"range-partition\" width=\"500\" />\n<\/div>\n\n<p>In this example, we'll shard based on user's score. We'll maintain the mapping between user_id and shard in application code.\nWe can do that either via MySQL or another cache for the mapping itself.<\/p>\n<p>To fetch the top 10 players, we'd query the shard with the highest scores (<code>[900-1000]<\/code>).<\/p>\n<p>To fetch a user's rank, we'll need to calculate the rank within the user's shard and add up all users with higher scores in other shards.\nThe latter is a O(1) operation as total records per shard can quickly be accessed via the info keyspace command.<\/p>\n<p>Alternatively, we can use hash partitioning via Redis Cluster. It is a proxy which distributes data across redis nodes based on partitioning similar to consistent hashing, but not exactly the same:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/hash-partition.png\" alt=\"hash-partition\" width=\"500\" />\n<\/div>\n\n<p>Calculating the top 10 players is challenging with this setup. We'll need to get the top 10 players of each shard and merge the results in the application:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/top-10-players-calculation.png\" alt=\"top-10-players-calculation\" width=\"500\" />\n<\/div>\n\n<p>There are some limitations with the hash partitioning:\n- If we need to fetch top K users, where K is high, latency can increase as we'll need to fetch a lot of data from all the shards\n- Latency increases as the number of partitions grows\n- There is no straightforward approach to determine a user's rank<\/p>\n<p>Due to all this, the author leans towards using fixed partitions for this problem.<\/p>\n<p>Other caveats:\n- A best practice is to allocate twice as much memory as required for write-heavy redis nodes to accommodate snapshots if required\n- We can use a tool called Redis-benchmark to track the performance of a redis setup and make data-driven decisions<\/p>\n<h3><strong>Alternative solution: NoSQL<\/strong><\/h3>\n<p>An alternative solution to consider is using an appropriate NoSQL database optimized for:\n- heavy writes\n- effectively sorting items within the same partition by score<\/p>\n<p>DynamoDB, Cassandra or MongoDB are all good fits.<\/p>\n<p>In this chapter, the author has decided to use DynamoDB. It is a fully-managed NoSQL database, which offers reliable performance and great scalability.\nIt also enables usage of global secondary indexes when we need to query fields not part of the primary key.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/dynamo-db.png\" alt=\"dynamo-db\" width=\"500\" />\n<\/div>\n\n<p>Let's start from a table for storing a leaderboard for a chess game:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-1.png\" alt=\"chess-game-leaderboard-table-1\" width=\"500\" />\n<\/div>\n\n<p>This works well, but doesn't scale well if we need to query anything by score. Hence, we can put the score as a sort key:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-2.png\" alt=\"chess-game-leaderboard-table-2\" width=\"500\" />\n<\/div>\n\n<p>Another problem with this design is that we're partitioning by month. This leads to a hotspot partition as the latest month will be unevenly accessed compared
