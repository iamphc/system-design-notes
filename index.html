tecture we proposed is a type of stream processing system. \nHere's a comparison between three types of systems:\n|                         | Services (Online system)      | Batch system (offline system)                          | Streaming system (near real-time system)     |\n|-------------------------|-------------------------------|--------------------------------------------------------|----------------------------------------------|\n| Responsiveness          | Respond to the client quickly | No response to the client needed                       | No response to the client needed             |\n| Input                   | User requests                 | Bounded input with finite size. A large amount of data | Input has no boundary (infinite streams)     |\n| Output                  | Responses to clients          | Materialized views, aggregated metrics, etc.           | Materialized views, aggregated metrics, etc. |\n| Performance measurement | Availability, latency         | Throughput                                             | Throughput, latency                          |\n| Example                 | Online shopping               | MapReduce                                              | Flink [13]                                   |<\/p>\n<p>In our design, we used a mixture of batching and streaming. <\/p>\n<p>We used streaming for processing data as it arrives and generates aggregated results in near real-time.\nWe used batching, on the other hand, for historical data backup.<\/p>\n<p>A system which contains two processing paths - batch and streaming, simultaneously, this architecture is called lambda.\nA disadvantage is that you have two processing paths with two different codebases to maintain.<\/p>\n<p>Kappa is an alternative architecture, which combines batch and stream processing in one processing path.\nThe key idea is to use a single stream processing engine.<\/p>\n<p>Lambda architecture:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/lambda-architecture.png\" alt=\"lambda-architecture\" width=\"500\" />\n<\/div>\n\n<p>Kappa architecture:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/kappa-architecture.png\" alt=\"kappa-architecture\" width=\"500\" />\n<\/div>\n\n<p>Our high-level design uses Kappa architecture as reprocessing of historical data also goes through the aggregation service.<\/p>\n<p>Whenever we have to recalculate aggregated data due to eg a major bug in aggregation logic, we can recalculate the aggregation from the raw data we store.\n - Recalculation service retrieves data from raw storage. This is a batch job.\n - Retrieved data is sent to a dedicated aggregation service, so that the real-time processing aggregation service is not impacted.\n - Aggregated results are sent to the second message queue, after which we update the results in the aggregation database.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/recalculation-example.png\" alt=\"recalculation-example\" width=\"500\" />\n<\/div>\n\n<h3><strong>Time<\/strong><\/h3>\n<p>We need a timestamp to perform aggregation. It can be generated in two places:\n - event time - when ad click occurs\n - Processing time - system time when the server processes the event<\/p>\n<p>Due to the usage of async processing (message queues) and network delays, there can be significant difference between event time and processing time.\n - If we use processing time, aggregation results can be inaccurate\n - If we use event time, we have to deal with delayed events<\/p>\n<p>There is no perfect solution, we need to consider trade-offs:\n|                 | Pros                                  | Cons                                                                                 |\n|-----------------|---------------------------------------|--------------------------------------------------------------------------------------|\n| Event time      | Aggregation results are more accurate | Clients might have the wrong time or timestamp might be generated by malicious users |\n| Processing time | Server timestamp is more reliable     | The timestamp is not accurate if event is late                                       |<\/p>\n<p>Since data accuracy is important, we'll use the event time for aggregation.<\/p>\n<p>To mitigate the issue of delayed events, a technique called \"watermark\" can be leveraged.<\/p>\n<p>In the example below, event 2 misses the window where it needs to be aggregated:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/watermark-technique.png\" alt=\"watermark-technique\" width=\"500\" />\n<\/div>\n\n<p>However, if we purposefully extend the aggregation window, we can reduce the likelihood of missed events.\nThe extended part of a window is called a \"watermark\":<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/watermark-2.png\" alt=\"watermark-2\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Short watermark increases likelihood of missed events, but reduces latency<\/li>\n<li>Longer watermark reduces likelihood of missed events, but increases latency<\/li>\n<\/ul>\n<p>There is always likelihood of missed events, regardless of the watermark's size. But there is no use in optimizing for such low-probability events.<\/p>\n<p>We can instead resolve such inconsistencies by doing end-of-day reconciliation.<\/p>\n<h3><strong>Aggregation window<\/strong><\/h3>\n<p>There are four types of window functions:\n - Tumbling (fixed) window\n - Hopping window\n - Sliding window\n - Session window<\/p>\n<p>In our design, we leverage a tumbling window for ad click aggregations:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/tumbling-window.png\" alt=\"tumbling-window\" width=\"500\" />\n<\/div>\n\n<p>As well as a sliding window for the top N clicked ads in M minutes aggregation:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/sliding-window.png\" alt=\"sliding-window\" width=\"500\" />\n<\/div>\n\n<h3><strong>Delivery guarantees<\/strong><\/h3>\n<p>Since the data we're aggregating is going to be used for billing, data accuracy is a priority.<\/p>\n<p>Hence, we need to discuss:\n - How to avoid processing duplicate events\n - How to ensure all events are processed<\/p>\n<p>There are three delivery guarantees we can use - at-most-once, at-least-once and exactly once.<\/p>\n<p>In most circumstances, at-least-once is sufficient when a small amount of duplicates is acceptable.\nThis is not the case for our system, though, as a difference in small percent can result in millions of dollars of discrepancy.\nHence, we'll need to use exactly-once delivery semantics.<\/p>\n<h3><strong>Data deduplication<\/strong><\/h3>\n<p>One of the most common data quality issues is duplicated data.<\/p>\n<p>It can come from a wide range of sources:\n - Client-side - a client might resend the same event multiple times. Duplicated events sent with malicious intent are best handled by a risk engine.\n - Server outage - An aggregation service node goes down in the middle of aggregation and the upstream service hasn't received an acknowledgment so event is resent.<\/p>\n<p>Here's an example of data duplication occurring due to failure to acknowledge an event on the last hop:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example.png\" alt=\"data-duplication-example\" width=\"500\" />\n<\/div>\n\n<p>In this example, offset 100 will be processed and sent downstream multiple times.<\/p>\n<p>One option to try and mitigate this is to store the last seen offset in HDFS/S3, but this risks the result never reaching downstream:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example-2.png\" alt=\"data-duplication-example-2\" width=\"500\" />\n<\/div>\n\n<p>Finally, we can store the offset while interacting with downstream atomically. To achieve this, we need to implement a distributed transaction:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example-3.png\" alt=\"data-duplication-example-3\" width=\"500\" />\n<\/div>\n\n<p><strong>Personal side-note<\/strong>: Alternatively, if the downstream system handles the aggregation result idempotently, there is no need for a distributed transaction.<\/p>\n<h3><strong>Scale the system<\/strong><\/h3>\n<p>Let's discuss how we scale the system as it grows.<\/p>\n<p>We have three independent components - message queue, aggregation service and database.\nSince they are decoupled, we can scale them independently.<\/p>\n<p>How do we scale the message queue:\n - We don't put a limit on producers, so they can be scaled easily\n - Consumers can be scaled by assigning them to consumer groups and increasing the number of consumers.\n - For this to work, we also need to ensure there are enough partitions created preemptively\n - Also, consumer rebalancing can take a while when there are thousands of consumers so it is recommended to do it off peak hours\n - We could also consider partitioning the topic by geography, eg <code>topic_na<\/code>, <code>topic_eu<\/code>, etc.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/scale-consumers.png\" alt=\"scale-consumers\" width=\"500\" />\n<\/div>\n\n<p>How do we scale the aggregation service:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/aggregation-service-scaling.png\" alt=\"aggregation-service-scaling\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>The map-reduce nodes can easily be scaled by adding more nodes<\/li>\n<li>The throughput of the aggregation service can be scaled by by utilising multi-threading<\/li>\n<li>Alternatively, we can leverage resource providers such as Apache YARN to utilize multi-processing<\/li>\n<li>Option 1 is easier, but option 2 is more widely used in practice as it's more scalable<\/li>\n<li>Here's the multi-threading example:<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/multi-threading-example.png\" alt=\"multi-threading-example\" width=\"500\" />\n<\/div>\n\n<p>How do we scale the database:\n - If we use Cassandra, it natively supports horizontal scaling utilizing consistent hashing\n - If a new node is added to the cluster, data automatically gets rebalanced across all (virtual) nodes\n - With this approach, no manual (re)sharding is required<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/cassandra-scalability.png\" alt=\"cassandra-scalability\" width=\"500\" />\n<\/div>\n\n<p>Another scalability issue to consider is the hotspot issue - what if an ad is more popular and gets more attention than others?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/hotspot-issue.png\" alt=\"hotspot-issue\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>In the above example, aggregation service nodes can apply for extra resources via the resource manager<\/li>\n<li>The resource manager allocates more resources, so the original node isn't overloaded<\/li>\n<li>The original node splits the events into 3 groups and each of the aggregation nodes handles 100 events<\/li>\n<li>Result is written back to the original aggregation node<\/li>\n<\/ul>\n<p>Alternative, more sophisticated ways to handle the hotspot problem:\n - Global-Local Aggregation\n - Split Distinct Aggregation<\/p>\n<h3><strong>Fault Tolerance<\/strong><\/h3>\n<p>Within the aggregation nodes, we are processing data in-memory. If a node goes down, the processed data is lost.<\/p>\n<p>We can leverage consumer offsets in kafka to continue from where we left off once another node picks up the slack.\nHowever, there is additional intermediary state we need to maintain, as we're aggregating the top N ads in M minutes.<\/p>\n<p>We can make snapshots at a particular minute for the on-going aggregation:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/fault-tolerance-example.png\" alt=\"fault-tolerance-example\" width=\"500\" />\n<\/div>\n\n<p>If a node goes down, the new node can read the latest committed consumer offset, as well as the latest snapshot to continue the job:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/fault-tolerance-recovery-example.png\" alt=\"fault-tolerance-recovery-example\" width=\"500\" />\n<\/div>\n\n<h3><strong>Data monitoring and correctness<\/strong><\/h3>\n<p>As the data we're aggregating is critical as it's used for billing, it is very important to have rigorous monitoring in place in order to ensure correctness.<\/p>\n<p>Some metrics we might want to monitor:\n - <strong>Latency<\/strong>: Timestamps of different events can be tracked in order to understand the e2e latency of the system\n - <strong>Message queue size<\/strong>: If there is a sudden increase in queue size, we need to add more aggregation nodes. As Kafka is implemented via a distributed commit log, we need to keep track of records-lag metrics instead.\n - <strong>System resources on aggregation nodes<\/strong>: CPU, disk, JVM, etc.<\/p>\n<p>We also need to implement a reconciliation flow which is a batch job, running at the end of the day. \nIt calculates the aggregated results from the raw data and compares them against the actual data stored in the aggregation database:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/reconciliation-flow.png\" alt=\"reconciliation-flow\" width=\"500\" />\n<\/div>\n\n<h3><strong>Alternative design<\/strong><\/h3>\n<p>In a generalist system design interview, you are not expected to know the internals of specialized software used in big data processing.<\/p>\n<p>Explaining the thought process and discussing trade-offs is more important than knowing specific tools, which is why the chapter covers a generic solution.<\/p>\n<p>An alternative design, which leverages off-the-shelf tooling, is to store ad click data in Hive with an ElasticSearch layer on top built for faster queries.<\/p>\n<p>Aggregation is typically done in OLAP databases such as ClickHouse or Druid.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/alternative-design.png\" alt=\"alternative-design\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 4: Wrap up<\/h2>\n<p>Things we covered:\n - Data model and API Design\n - Using MapReduce to aggregate ad click events\n - Scaling the message queue, aggregation service and database\n - Mitigating the hotspot issue\n - Monitoring the system continuously\n - Using reconciliation to ensure correctness\n - Fault tolerance<\/p>\n<p>The ad click event aggregation is a typical big data processing system.<\/p>\n<p>It would be easier to understand and design it if you have prior knowledge of related technologies:\n - Apache Kafka\n - Apache Spark\n - Apache Flink<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>随着 Facebook、YouTube、TikTok 等平台的崛起，<strong>数字广告<\/strong>已成为一个庞大的产业。<\/p>\n<p>因此，跟踪广告点击事件十分重要。在本章中，我们探讨如何设计一个达到 Facebook/Google 规模的<strong>广告点击事件聚合<\/strong>系统。<\/p>\n<p>数字广告中有一个称为<strong>实时竞价（real-time bidding，RTB）<\/strong>的流程，数字广告库存（inventory）通过它进行买卖：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/digital-advertising-example.png\" alt=\"数字广告示例\" width=\"500\" />\n<\/div>\n\n<p>RTB 的速度很重要，因为它通常需要在一秒内完成。\n数据准确性也非常重要，因为它直接影响广告商支付的金额。<\/p>\n<p>基于广告点击事件聚合结果，广告商可以做出诸如调整目标受众和关键词之类的决策。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<ul>\n<li>候选人（C）：输入数据的格式是什么？<\/li>\n<li>面试官（I）：每天 10 亿次广告点击，总计 200 万个广告。广告点击事件数量每年同比增长 30%。<\/li>\n<li>候选人（C）：我们的系统需要支持的最重要的查询有哪些？<\/li>\n<li>面试官（I）：需要重点考虑的查询：<\/li>\n<li>返回过去 Y 分钟内广告 X 的点击事件数量<\/li>\n<li>返回过去 1 分钟内点击量最高的前 100 个广告。两个参数都应可配置。聚合每分钟执行一次。<\/li>\n<li>支持按 <code>ip<\/code>、<code>user_id<\/code>、<code>country<\/code> 对上述查询进行数据过滤<\/li>\n<li>候选人（C）：我们需要考虑边界情况吗？我能想到的一些：<\/li>\n<li>可能会有事件晚于预期时间到达<\/li>\n<li>可能会有重复事件<\/li>\n<li>系统的不同部分可能宕机，因此我们需要考虑系统恢复<\/li>\n<li>面试官（I）：这个清单不错，把这些都考虑进去<\/li>\n<li>候选人（C）：延迟要求是多少？<\/li>\n<li>面试官（I）：广告点击聚合的端到端（e2e）延迟为几分钟。对于 RTB，则要求小于一秒。广告点击聚合有这样的延迟是可以接受的，因为它们通常用于计费和报表。<\/li>\n<\/ul>\n<h3><strong>功能需求<\/strong><\/h3>\n<ul>\n<li>聚合过去 Y 分钟内 <code>ad_id<\/code> 的点击次数<\/li>\n<li>每分钟返回点击量最高的前 100 个 <code>ad_id<\/code><\/li>\n<li>支持按不同属性进行聚合过滤<\/li>\n<li>数据规模达到 Facebook 或 Google 级别<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li>聚合结果的正确性很重要，因为它用于 RTB 和广告计费<\/li>\n<li>妥善处理延迟到达或重复的事件<\/li>\n<li>健壮性——系统应能抵御部分故障<\/li>\n<li>延迟——端到端延迟最多几分钟<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-envelope estimation）<\/strong><\/h3>\n<ul>\n<li>10 亿 DAU<\/li>\n<li>假设每个用户每天点击 1 个广告 → 每天 10 亿次广告点击<\/li>\n<li>广告点击 QPS = 10,000<\/li>\n<li>峰值 QPS 是该数值的 5 倍 = 50,000<\/li>\n<li>单次广告点击占用 0.1KB 存储。每日存储需求为 100GB<\/li>\n<li>每月存储 = 3TB<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<p>在本节中，我们讨论查询 API 设计、数据模型和高层设计。<\/p>\n<h3><strong>查询 API 设计<\/strong><\/h3>\n<p>API 是客户端与服务器之间的契约。在我们的场景中，客户端是看板（dashboard）的使用者——数据科学家/分析师、广告商等。<\/p>\n<p>以下是我们的功能需求：\n - 聚合过去 Y 分钟内 <code>ad_id<\/code> 的点击次数\n - 返回过去 M 分钟内点击量最高的前 N 个 <code>ad_id<\/code>\n - 支持按不同属性进行聚合过滤<\/p>\n<p>我们需要两个端点来实现这些需求。其中一个端点可以通过查询参数来完成过滤。<\/p>\n<p><strong>聚合过去 M 分钟内 ad_id 的点击次数<\/strong>：<\/p>\n<pre><code>GET /v1/ads/{:ad_id}/aggregated_count\n<\/code><\/pre>\n<p>查询参数：\n - from——起始分钟。默认为现在 - 1 分钟\n - to——结束分钟。默认为现在\n - filter——不同过滤策略的标识符。例如 001 表示「非美国点击」。<\/p>\n<p>响应：\n - ad_id——广告标识符\n - count——起始与结束分钟之间的聚合计数<\/p>\n<p><strong>返回过去 M 分钟内点击量最高的前 N 个 ad_id<\/strong><\/p>\n<pre><code>GET /v1/ads/popular_ads\n<\/code><\/pre>\n<p>查询参数：\n - count——点击量最高的前 N 个广告\n - window——聚合窗口大小，单位为分钟\n - filter——不同过滤策略的标识符<\/p>\n<p>响应：\n - ad_id 列表<\/p>\n<h3><strong>数据模型<\/strong><\/h3>\n<p>在我们的系统中，既有原始数据，也有聚合数据。<\/p>\n<p>原始数据如下所示：<\/p>\n<pre><code>[AdClickEvent] ad001, 2021-01-01 00:00:01, user 1, 207.148.22.22, USA\n<\/code><\/pre>\n<p>下面是结构化格式的示例：\n| ad_id | click_timestamp     | user  | ip            | country |\n|-------|---------------------|-------|---------------|---------|\n| ad001 | 2021-01-01 00:00:01 | user1 | 207.148.22.22 | USA     |\n| ad001 | 2021-01-01 00:00:02 | user1 | 207.148.22.22 | USA     |\n| ad002 | 2021-01-01 00:00:02 | user2 | 209.153.56.11 | USA     |<\/p>\n<p>下面是聚合后的版本：\n| ad_id | click_minute | filter_id | count |\n|-------|--------------|-----------|-------|\n| ad001 | 202101010000 | 0012      | 2     |\n| ad001 | 202101010000 | 0023      | 3     |\n| ad001 | 202101010001 | 0012      | 1     |\n| ad001 | 202101010001 | 0023      | 6     |<\/p>\n<p><code>filter_id<\/code> 帮助我们实现过滤需求。\n| filter_id | region | IP        | user_id |\n|-----------|--------|-----------|---------|\n| 0012      | US     | *         | *       |\n| 0013      | *      | 123.1.2.3 | *       |<\/p>\n<p>为了支持快速返回过去 M 分钟内点击量最高的前 N 个广告，我们还会维护如下结构：\n| most_clicked_ads   |           |                                                  |\n|--------------------|-----------|--------------------------------------------------|\n| window_size        | integer   | 聚合窗口大小（M），单位为分钟                     |\n| update_time_minute | timestamp | 最后更新时间戳（以 1 分钟为粒度）                 |\n| most_clicked_ads   | array     | 广告 ID 列表，JSON 格式。                        |<\/p>\n<p>存储原始数据与存储聚合数据各有哪些优缺点？\n - 原始数据能够使用完整数据集，并支持数据过滤和重新计算\n - 另一方面，聚合数据让我们拥有更小的数据集和更快的查询\n - 原始数据意味着更大的数据存储和更慢的查询\n - 然而，聚合数据是派生数据，因此会有一定的数据损失。<\/p>\n<p>在我们的设计中，将结合使用这两种方式：\n - 保留原始数据用于调试是个好主意。如果聚合过程中出现 bug，我们可以发现该 bug 并进行回填（backfill）。\n - 聚合数据也应存储，以获得更快的查询性能。\n - 原始数据可以存储在冷存储（cold storage）中，以避免额外的存储成本。<\/p>\n<p>在数据库选择方面，有几个因素需要考虑：\n - 数据是什么样的？是关系型、文档型还是 blob？\n - 工作负载是读多、写多还是读写都多？\n - 是否需要事务？\n - 查询是否依赖 OLAP 函数，如 SUM 和 COUNT？<\/p>\n<p>对于原始数据，我们可以看到平均 QPS 为 10k，峰值 QPS 为 50k，因此系统是写密集型（write-heavy）的。\n另一方面，读流量很低，因为原始数据主要在出现问题时用作备份。<\/p>\n<p>关系型数据库可以胜任这项工作，但扩展写入能力可能具有挑战性。\n或者，我们可以使用 Cassandra 或 InfluxDB，它们对重写入负载有更好的原生支持。<\/p>\n<p>另一种选择是使用 Amazon S3，并采用列式数据格式，如 ORC、Parquet 或 AVRO。由于这种方案我们不太熟悉，我们将继续使用 Cassandra。<\/p>\n<p>对于聚合数据，工作负载既是读密集型也是写密集型，因为聚合数据会被持续查询以用于看板和告警。\n它也是写密集型的，因为聚合服务每分钟都会对数据进行聚合并写入。\n因此，这里我们也使用相同的数据存储（Cassandra）。<\/p>\n<h3><strong>高层设计<\/strong><\/h3>\n<p>我们的系统如下所示：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/high-level-design-1.png\" alt=\"高层设计 1\" width=\"500\" />\n<\/div>\n\n<p>数据在输入和输出两端都以无界数据流（unbounded data stream）的形式流动。<\/p>\n<p>为了避免采用同步的数据落点（sink）——即某个消费者崩溃可能导致整个系统停滞——\n我们将利用消息队列（Kafka）进行异步处理，以解耦消费者和生产者。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/high-level-design-2.png\" alt=\"高层设计 2\" width=\"500\" />\n<\/div>\n\n<p>第一个消息队列存储广告点击事件数据：\n| ad_id | click_timestamp | user_id | ip | country |\n|-------|-----------------|---------|----|---------|<\/p>\n<p>第二个消息队列包含按分钟聚合的广告点击计数：\n| ad_id | click_minute | count |\n|-------|--------------|-------|<\/p>\n<p>以及按分钟聚合的点击量最高的前 N 个广告：\n| update_time_minute | most_clicked_ads |\n|--------------------|------------------|<\/p>\n<p>第二个消息队列的存在是为了实现端到端的恰好一次（exactly-once）原子提交语义：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/atomic-commit.png\" alt=\"原子提交\" width=\"500\" />\n<\/div>\n\n<p>对于聚合服务，使用 MapReduce 框架是一个不错的选择：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/ad-count-map-reduce.png\" alt=\"广告计数 MapReduce\" width=\"500\" />\n<\/div>\n\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/top-100-map-reduce.png\" alt=\"前 100 名 MapReduce\" width=\"500\" />\n<\/div>\n\n<p>每个节点负责单个任务，并将处理结果发送给下游节点。<\/p>\n<p>map 节点负责从数据源读取数据，然后对数据进行过滤和转换。<\/p>\n<p>例如，map 节点可以根据 <code>ad_id<\/code> 将数据分配到不同的聚合节点：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/map-node.png\" alt=\"map 节点\" width=\"500\" />\n<\/div>\n\n<p>或者，我们可以将广告分布到 Kafka 分区中，让聚合节点在一个消费者组（consumer group）内直接订阅。\n然而，映射（mapping）节点使我们能够在后续处理之前对数据进行清洗（sanitize）或转换。<\/p>\n<p>另一个原因可能是我们无法控制数据的产生方式，\n因此与同一个 <code>ad_id<\/code> 相关的事件可能会进入不同的分区。<\/p>\n<p>聚合（aggregate）节点每分钟在内存中按 <code>ad_id<\/code> 统计广告点击事件数量。<\/p>\n<p>reduce 节点从聚合节点收集聚合结果，并生成最终结果：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/reduce-node.png\" alt=\"reduce 节点\" width=\"500\" />\n<\/div>\n\n<p>这个 DAG 模型采用 MapReduce 范式。它接收大数据，并利用并行分布式计算将其转化为常规规模的数据。<\/p>\n<p>在 DAG 模型中，中间数据存储在内存中，不同节点之间通过 TCP 或共享内存进行通信。<\/p>\n<p>让我们看看这个模型现在如何帮助我们实现各种用例。<\/p>\n<p><strong>用例 1——聚合点击次数<\/strong>：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/use-case-1.png\" alt=\"用例 1\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>广告使用 <code>ad_id % 3<\/code> 进行分区<\/li>\n<\/ul>\n<p><strong>用例 2——返回点击量最高的前 N 个广告<\/strong>：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/use-case-2.png\" alt=\"用例 2\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>在本例中，我们聚合的是前 3 个广告，但这可以很容易地扩展到前 N 个广告<\/li>\n<li>每个节点维护一个堆（heap）数据结构，以便快速检索前 N 个广告<\/li>\n<\/ul>\n<p><strong>用例 3——数据过滤<\/strong>：\n为了支持快速数据过滤，我们可以预定义过滤条件，并基于此进行预聚合：\n| ad_id | click_minute | country | count |\n|-------|--------------|---------|-------|\n| ad001 | 202101010001 | USA     | 100   |\n| ad001 | 202101010001 | GPB     | 200   |\n| ad001 | 202101010001 | others  | 3000  |\n| ad002 | 202101010001 | USA     | 10    |\n| ad002 | 202101010001 | GPB     | 25    |\n| ad002 | 202101010001 | others  | 12    |<\/p>\n<p>这种技术称为<strong>星型模式（star schema）<\/strong>，广泛应用于数据仓库中。\n这些过滤字段称为<strong>维度（dimensions）<\/strong>。<\/p>\n<p>这种方法有以下优点：\n - 易于理解和构建\n - 可以复用现有的聚合服务，在星型模式中创建更多维度。\n - 基于过滤条件访问数据速度很快，因为结果是预先计算好的<\/p>\n<p>这种方法的一个局限是它会产生多得多的存储桶（bucket）和记录，尤其是在我们有大量过滤条件时。<\/p>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>让我们更深入地探讨一些更有意思的主题。<\/p>\n<h3><strong>流处理与批处理（Streaming vs. Batching）<\/strong><\/h3>\n<p>我们提出的高层架构是一类流处理系统。\n下面是三种系统之间的比较：\n|                         | 服务（在线系统）             | 批处理系统（离线系统）                                  | 流处理系统（近实时系统）                       |\n|-------------------------|-------------------------------|--------------------------------------------------------|----------------------------------------------|\n| 响应性                  | 快速响应客户端                | 无需响应客户端                                          | 无需响应客户端                                |\n| 输入                    | 用户请求                      | 有界输入，规模有限。数据量大                            | 输入无边界（无限流）                          |\n| 输出                    | 对客户端的响应                | 物化视图、聚合指标等                                    | 物化视图、聚合指标等                          |\n| 性能度量                | 可用性、延迟                  | 吞吐量                                                  | 吞吐量、延迟                                  |\n| 示例                    | 在线购物                      | MapReduce                                              | Flink [13]                                    |<\/p>\n<p>在我们的设计中，混合使用了批处理和流处理。<\/p>\n<p>我们使用流处理来处理到达的数据，并近实时地生成聚合结果。\n另一方面，我们使用批处理进行历史数据备份。<\/p>\n<p>一个系统同时包含两条处理路径——批处理和流处理——这种架构称为 Lambda。\n它的一个缺点是你有两条处理路径，需要维护两套不同的代码库。<\/p>\n<p>Kappa 是另一种架构，它将批处理和流处理合并到同一条处理路径中。\n其核心思想是使用单一的流处理引擎。<\/p>\n<p>Lambda 架构：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/lambda-architecture.png\" alt=\"Lambda 架构\" width=\"500\" />\n<\/div>\n\n<p>Kappa 架构：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/kappa-architecture.png\" alt=\"Kappa 架构\" width=\"500\" />\n<\/div>\n\n<p>我们的高层设计采用 Kappa 架构，因为历史数据的重新处理也会经过聚合服务。<\/p>\n<p>每当我们需要重新计算聚合数据时（例如由于聚合逻辑中的重大 bug），我们可以从存储的原始数据重新计算聚合。\n - 重新计算服务从原始存储中检索数据。这是一个批处理作业。\n - 检索到的数据被发送到一个专用的聚合服务，这样实时处理的聚合服务就不会受到影响。\n - 聚合结果被发送到第二个消息队列，之后我们更新聚合数据库中的结果。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/recalculation-example.png\" alt=\"重新计算示例\" width=\"500\" />\n<\/div>\n\n<h3><strong>时间（Time）<\/strong><\/h3>\n<p>我们需要一个时间戳来执行聚合。它可以在两个地方生成：\n - 事件时间（event time）——广告点击发生时\n - 处理时间（processing time）——服务器处理事件时的系统时间<\/p>\n<p>由于使用了异步处理（消息队列）和网络延迟，事件时间与处理时间之间可能存在显著差异。\n - 如果我们使用处理时间，聚合结果可能不准确\n - 如果我们使用事件时间，我们就必须处理延迟到达的事件<\/p>\n<p>没有完美的解决方案，我们需要权衡取舍：\n|                 | 优点                                  | 缺点                                                                                 |\n|-----------------|---------------------------------------|--------------------------------------------------------------------------------------|\n| 事件时间        | 聚合结果更准确                        | 客户端可能时间不正确，或时间戳可能由恶意用户生成                                      |\n| 处理时间        | 服务器时间戳更可靠                    | 如果事件迟到，时间戳就不准确                                                          |<\/p>\n<p>由于数据准确性很重要，我们将使用事件时间进行聚合。<\/p>\n<p>为了缓解延迟事件的问题，可以利用一种称为「水位线（watermark）」的技术。<\/p>\n<p>在下面的示例中，事件 2 错过了它本应被聚合的窗口：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/watermark-technique.png\" alt=\"水位线技术\" width=\"500\" />\n<\/div>\n\n<p>然而，如果我们有意识地延长聚合窗口，就可以降低事件被错过的可能性。\n窗口延长的部分称为「水位线（watermark）」：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/watermark-2.png\" alt=\"水位线 2\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>短水位线会增加事件被错过的可能性，但会降低延迟<\/li>\n<li>长水位线会降低事件被错过的可能性，但会增加延迟<\/li>\n<\/ul>\n<p>无论水位线多大，事件被错过的可能性始终存在。但为这种低概率事件做优化并没有意义。<\/p>\n<p>我们可以改为通过日终对账（end-of-day reconciliation）来解决这类不一致问题。<\/p>\n<h3><strong>聚合窗口（Aggregation window）<\/strong><\/h3>\n<p>窗口函数有四种类型：\n - 滚动窗口（tumbling，固定窗口）\n - 跳跃窗口（hopping window）\n - 滑动窗口（sliding window）\n - 会话窗口（session window）<\/p>\n<p>在我们的设计中，我们对广告点击聚合使用滚动窗口：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/tumbling-window.png\" alt=\"滚动窗口\" width=\"500\" />\n<\/div>\n\n<p>以及对 M 分钟内点击量最高的前 N 个广告聚合使用滑动窗口：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/sliding-window.png\" alt=\"滑动窗口\" width=\"500\" />\n<\/div>\n\n<h3><strong>投递保证（Delivery guarantees）<\/strong><\/h3>\n<p>由于我们聚合的数据将用于计费，数据准确性是首要任务。<\/p>\n<p>因此，我们需要讨论：\n - 如何避免处理重复事件\n - 如何确保所有事件都被处理<\/p>\n<p>我们可以使用三种投递保证——至多一次（at-most-once）、至少一次（at-least-once）和恰好一次（exactly once）。<\/p>\n<p>在大多数情况下，当可以接受少量重复时，至少一次就足够了。\n但我们的系统并非如此，因为即使是很小百分比的差异也可能导致数百万美元的出入。\n因此，我们需要使用恰好一次（exactly-once）投递语义。<\/p>\n<h3><strong>数据去重（Data deduplication）<\/strong><\/h3>\n<p>最常见的数据质量问题之一就是重复数据。<\/p>\n<p>它可能来自多种来源：\n - 客户端——客户端可能会多次重发同一事件。带有恶意意图发送的重复事件，最好由风险引擎（risk engine）处理。\n - 服务器宕机——聚合服务节点在聚合过程中宕机，上游服务尚未收到确认（acknowledgment），因此事件被重发。<\/p>\n<p>下面是一个由于最后一跳（last hop）未确认事件而导致数据重复的示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example.png\" alt=\"数据重复示例\" width=\"500\" />\n<\/div>\n\n<p>在本例中，偏移量（offset）100 会被处理并多次发送到下游。<\/p>\n<p>一种缓解方法是将最后处理过的偏移量存储在 HDFS/S3 中，但这会导致结果可能永远无法到达下游：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example-2.png\" alt=\"数据重复示例 2\" width=\"500\" />\n<\/div>\n\n<p>最后，我们可以在与下游交互时原子地存储偏移量。要实现这一点，我们需要实现一个分布式事务：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/data-duplication-example-3.png\" alt=\"数据重复示例 3\" width=\"500\" />\n<\/div>\n\n<p><strong>作者侧注<\/strong>：或者，如果下游系统以幂等（idempotent）方式处理聚合结果，就不需要分布式事务了。<\/p>\n<h3><strong>系统扩展（Scale the system）<\/strong><\/h3>\n<p>让我们讨论如何随着系统的增长对其进行扩展。<\/p>\n<p>我们有三个独立组件——消息队列、聚合服务和数据库。\n由于它们是解耦的，我们可以独立地扩展它们。<\/p>\n<p>如何扩展消息队列：\n - 我们不对生产者数量设限，因此生产者可以很容易地扩展\n - 消费者可以通过将它们分配到消费者组并增加消费者数量来扩展。\n - 为此，我们还需要确保预先创建了足够的分区\n - 此外，当有成千上万个消费者时，消费者再平衡（rebalancing）可能需要一段时间，因此建议在非高峰时段进行\n - 我们还可以考虑按地理位置对 topic 进行分区，例如 <code>topic_na<\/code>、<code>topic_eu<\/code> 等<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/scale-consumers.png\" alt=\"扩展消费者\" width=\"500\" />\n<\/div>\n\n<p>如何扩展聚合服务：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/aggregation-service-scaling.png\" alt=\"聚合服务扩展\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>map-reduce 节点可以通过添加更多节点轻松扩展<\/li>\n<li>聚合服务的吞吐量可以通过利用多线程（multi-threading）来扩展<\/li>\n<li>或者，我们可以利用 Apache YARN 等资源提供者来利用多进程（multi-processing）<\/li>\n<li>方案 1 更简单，但方案 2 在实践中应用更广泛，因为它的可扩展性更好<\/li>\n<li>下面是多线程的示例：<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/multi-threading-example.png\" alt=\"多线程示例\" width=\"500\" />\n<\/div>\n\n<p>如何扩展数据库：\n - 如果我们使用 Cassandra，它利用一致性哈希（consistent hashing）原生支持水平扩展\n - 如果向集群添加新节点，数据会自动在所有（虚拟）节点之间重新平衡\n - 通过这种方式，无需手动（重新）分片<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/cassandra-scalability.png\" alt=\"Cassandra 可扩展性\" width=\"500\" />\n<\/div>\n\n<p>另一个需要考虑的可扩展性问题是热点（hotspot）问题——如果某个广告比其他广告更受欢迎、获得更多关注怎么办？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/hotspot-issue.png\" alt=\"热点问题\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>在上面的示例中，聚合服务节点可以通过资源管理器申请额外资源<\/li>\n<li>资源管理器分配更多资源，这样原节点就不会过载<\/li>\n<li>原节点将事件分成 3 组，每个聚合节点处理 100 个事件<\/li>\n<li>结果写回原聚合节点<\/li>\n<\/ul>\n<p>处理热点问题的其他更复杂的方法：\n - 全局-本地聚合（Global-Local Aggregation）\n - 拆分去重聚合（Split Distinct Aggregation）<\/p>\n<h3><strong>容错（Fault Tolerance）<\/strong><\/h3>\n<p>在聚合节点内部，我们在内存中处理数据。如果节点宕机，已处理的数据就会丢失。<\/p>\n<p>一旦另一个节点接替工作，我们可以利用 Kafka 中的消费者偏移量从中断处继续处理。\n然而，我们还需要维护额外的中间状态，因为我们在聚合 M 分钟内的前 N 个广告。<\/p>\n<p>我们可以在特定分钟点对正在进行的聚合做快照（snapshot）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/fault-tolerance-example.png\" alt=\"容错示例\" width=\"500\" />\n<\/div>\n\n<p>如果节点宕机，新节点可以读取最新已提交的消费者偏移量以及最新的快照来继续作业：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/fault-tolerance-recovery-example.png\" alt=\"容错恢复示例\" width=\"500\" />\n<\/div>\n\n<h3><strong>数据监控与正确性<\/strong><\/h3>\n<p>由于我们聚合的数据至关重要（用于计费），因此建立严格的监控以确保正确性非常重要。<\/p>\n<p>我们可能需要监控的一些指标：\n - <strong>延迟（Latency）<\/strong>：可以跟踪不同事件的时间戳，以了解系统的端到端延迟\n - <strong>消息队列大小<\/strong>：如果队列大小突然增加，我们需要添加更多聚合节点。由于 Kafka 是通过分布式提交日志（commit log）实现的，我们需要改为跟踪 records-lag 指标。\n - <strong>聚合节点上的系统资源<\/strong>：CPU、磁盘、JVM 等。<\/p>\n<p>我们还需要实现一个对账流程（reconciliation flow），它是一个批处理作业，在日终运行。\n它从原始数据计算聚合结果，并将其与聚合数据库中存储的实际数据进行比较：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/reconciliation-flow.png\" alt=\"对账流程\" width=\"500\" />\n<\/div>\n\n<h3><strong>备选设计（Alternative design）<\/strong><\/h3>\n<p>在通用的系统设计面试中，并不要求你了解大数据处理所用专用软件的内部实现。<\/p>\n<p>解释思考过程并讨论权衡取舍，比了解具体工具更重要，这也是本章介绍通用解决方案的原因。<\/p>\n<p>另一种利用现成工具的设计是，将广告点击数据存储在 Hive 中，并在其上构建一层 ElasticSearch，以实现更快的查询。<\/p>\n<p>聚合通常在 OLAP 数据库中完成，如 ClickHouse 或 Druid。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"21. Ad Click Event Aggregation/images/alternative-design.png\" alt=\"备选设计\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>我们涵盖的内容：\n - 数据模型与 API 设计\n - 使用 MapReduce 聚合广告点击事件\n - 扩展消息队列、聚合服务和数据库\n - 缓解热点问题\n - 持续监控系统\n - 使用对账确保正确性\n - 容错<\/p>\n<p>广告点击事件聚合是一个典型的大数据处理系统。<\/p>\n<p>如果你具备相关技术的先验知识，会更容易理解和设计它：\n - Apache Kafka\n - Apache Spark\n - Apache Flink<\/p>", "enTitle": "Chapter 21: Ad Click Event Aggregation", "zhTitle": "第 21 章：广告点击事件聚合", "short": "Ad Click Event Aggregation", "num": "21"}, "22. Hotel Reservation System": {"en": "\n<h2>Introduction<\/h2>\n<p>In this chapter, we're designing a <strong>hotel reservation system<\/strong>, similar to Marriott International.<\/p>\n<p>Applicable to other types of systems as well - Airbnb, flight reservation, movie ticket booking.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<p>Before diving into designing the system, we should ask the interviewer questions to clarify the scope:\n - C: What is the scale of the system?\n - I: We're building a website for a hotel chain \\w 5000 hotels and 1mil rooms\n - C: Do customers pay when they make a reservation or when they arrive at the hotel?\n - I: They pay in full when making reservations.\n - C: Do customers book hotel rooms through the website only? Do we have to support other reservation options such as phone calls?\n - I: They make bookings through the website or app only.\n - C: Can customers cancel reservations?\n - I: Yes\n - C: Other things to consider?\n - I: Yes, we allow overbooking by 10%. Hotel will sell more rooms than there actually are. Hotels do this in anticipation that clients will cancel bookings.\n - C: Since not much time, we'll focus on - show hotel-related page, hotel-room details page, reserve a room, admin panel, support overbooking.\n - I: Sounds good.\n - I: One more thing - hotel prices change all the time. Assume a hotel room's price changes every day.\n - C: OK.<\/p>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li>Support high concurrency - there might be a lot of customers trying to book the same hotel during peak season.<\/li>\n<li>Moderate latency - it's ideal to have low latency when a user makes a reservation, but it's acceptable if the system takes a few seconds to process it.<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<ul>\n<li>5000 hotels and 1mil rooms in total<\/li>\n<li>Assume 70% of rooms are occupied and average stay duration is 3 days<\/li>\n<li>Estimated daily reservations - 1mil * 0.7 / 3 = ~240k reservations per day<\/li>\n<li>Reservations per second - 240k / 10^5 seconds in a day = ~3. Average reservation TPS is low.<\/li>\n<\/ul>\n<p>Let's estimate the QPS. If we assume that there are three steps to reach the reservation page and there is a 10% conversion rate per page,\nwe can estimate that if there are 3 reservations, then there must be 30 views of reservation page and 300 views of hotel room detail page.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/qps-estimation.png\" alt=\"qps-estimation\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>We'll explore - API Design, Data model, high-level design.<\/p>\n<h3><strong>API Design<\/strong><\/h3>\n<p>This API Design focuses on the core endpoints (using RESTful practices), we'll need in order to support a hotel reservation system.<\/p>\n<p>A fully-fledged system would require a more extensive API with support for searching for rooms based on lots of criteria, but we won't be focusing on that in this section.\nReason is that they aren't technically challenging, so they're out of scope.<\/p>\n<p><strong>Hotel-related API<\/strong>\n - <code>GET /v1/hotels/{id}<\/code> - get detailed info about a hotel\n - <code>POST /v1/hotels<\/code> - add a new hotel. Only available to ops\n - <code>PUT /v1/hotels/{id}<\/code> - update hotel info. Only available to ops\n - <code>DELETE /v1/hotels/{id}<\/code> - delete a hotel. API is only available to ops<\/p>\n<p><strong>Room-related API<\/strong>\n - <code>GET /v1/hotels/{id}/rooms/{id}<\/code> - get detailed information about a room\n - <code>POST /v1/hotels/{id}/rooms<\/code> - Add a room. Only available to ops\n - <code>PUT /v1/hotels/{id}/rooms/{id}<\/code> - Update room info. Only available to ops\n - <code>DELETE /v1/hotels/{id}/rooms/{id}<\/code> - Delete a room. Only available to ops<\/p>\n<p><strong>Reservation-related API<\/strong>\n - <code>GET /v1/reservations<\/code> - get reservation history of current user\n - <code>GET /v1/reservations/{id}<\/code> - get detailed info about a reservation\n - <code>POST /v1/reservations<\/code> - make a new reservation\n - <code>DELETE /v1/reservations/{id}<\/code> - cancel a reservation<\/p>\n<p>Here's an example request to make a reservation:<\/p>\n<pre><code>{\n  &quot;startDate&quot;:&quot;2021-04-28&quot;,\n  &quot;endDate&quot;:&quot;2021-04-30&quot;,\n  &quot;hotelID&quot;:&quot;245&quot;,\n  &quot;roomID&quot;:&quot;U12354673389&quot;,\n  &quot;reservationID&quot;:&quot;13422445&quot;\n}\n<\/code><\/pre>\n<p>Note that the <code>reservationID<\/code> is an idempotency key to avoid double booking. Details explained in <a href=\"#concurrency-issues\">concurrency section<\/a><\/p>\n<h3><strong>Data model<\/strong><\/h3>\n<p>Before we choose what database to use, let's consider our access patterns.<\/p>\n<p>We need to support the following queries:\n - View detailed info about a hotel\n - Find available types of rooms given a date range\n - Record a reservation\n - Look up a reservation or past history of reservations<\/p>\n<p>From our estimations, we know the scale of the system is not large, but we need to prepare for traffic surges.<\/p>\n<p>Given this knowledge, we'll choose a relational database because:\n - Relational DBs work well with read-heavy and less write-heavy systems.\n - NoSQL databases are normally optimized for writes, but we know we won't have many as only a fraction of users who visit the site make a reservation.\n - Relational DBs provide ACID guarantees. These are important for such a system as without them, we won't be able to prevent problems such as negative balance, double charge, etc.\n - Relational DBs can easily model the data as the structure is very clear.<\/p>\n<p>Here is our schema design:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/schema-design.png\" alt=\"schema-design\" width=\"500\" />\n<\/div>\n\n<p>Most fields are self-explanatory. Only field worth mentioning is the <code>status<\/code> field which represents the state machine of a given room:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/status-state-machine.png\" alt=\"status-state-machine\" width=\"500\" />\n<\/div>\n\n<p>This data model works well for a system like Airbnb, but not for hotels where users don't reserve a particular room but a room type.\nThey reserve a type of room and a room number is chosen at the point of reservation.<\/p>\n<p>This shortcoming will be addressed in the <a href=\"#improved-data-model\">Improved Data Model<\/a> section.<\/p>\n<h3><strong>High-level Design<\/strong><\/h3>\n<p>We've chosen a microservice architecture for this design. It has gained great popularity in recent years:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/high-level-design.png\" alt=\"high-level-design\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Users<\/strong>: book a hotel room on their phone or computer<\/li>\n<li><strong>Admin<\/strong>: perform administrative functions such as refunding/cancelling a payment, etc<\/li>\n<li><strong>CDN<\/strong>: caches static resources such as JS bundles, images, videos, etc<\/li>\n<li><strong>Public API Gateway<\/strong>: fully-managed service which supports rate limiting, authentication, etc.<\/li>\n<li><strong>Internal APIs<\/strong>: only visible to authorized personnel. Usually protected by a VPN.<\/li>\n<li><strong>Hotel service<\/strong>: provides detailed information about hotels and rooms. Hotel and room data is static, so it can be cached aggressively.<\/li>\n<li><strong>Rate service<\/strong>: provides room rates for different future dates. An interesting note about this domain is that prices depend on how full a hotel is at a given day.<\/li>\n<li><strong>Reservation service<\/strong>: receives reservation requests and reserves hotel rooms. Also tracks room inventory as reservations are made/cancelled.<\/li>\n<li><strong>Payment service<\/strong>: processes payments and updates reservation statuses on success.<\/li>\n<li><strong>Hotel management service<\/strong>: available to authorized personnel only. Allows certain administrative functions for managing and viewing reservations, hotels, etc.<\/li>\n<\/ul>\n<p>Inter-service communication can be facilitated via a RPC framework, such as gRPC.<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>Let's dive deeper into:\n - Improved data model\n - Concurrency issues\n - Scalability\n - Resolving data inconsistency in microservices<\/p>\n<h3><strong>Improved data model<\/strong><\/h3>\n<p>As mentioned in a previous section, we need to amend our API and schema to enable reserving a type of room vs. a particular one.<\/p>\n<p>For the reservation API, we no longer reserve a <code>roomID<\/code>, but we reserve a <code>roomTypeID<\/code>:<\/p>\n<pre><code>POST /v1/reservations\n{\n  &quot;startDate&quot;:&quot;2021-04-28&quot;,\n  &quot;endDate&quot;:&quot;2021-04-30&quot;,\n  &quot;hotelID&quot;:&quot;245&quot;,\n  &quot;roomTypeID&quot;:&quot;12354673389&quot;,\n  &quot;roomCount&quot;:&quot;3&quot;,\n  &quot;reservationID&quot;:&quot;13422445&quot;\n}\n<\/code><\/pre>\n<p>Here's the updated schema:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/updated-schema.png\" alt=\"updated-schema\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>room<\/strong>: contains information about a room<\/li>\n<li><strong>room_type_rate<\/strong>: contains information about prices for a given room type<\/li>\n<li><strong>reservation<\/strong>: records guest reservation data<\/li>\n<li><strong>room_type_inventory<\/strong>: stores inventory data about hotel rooms. <\/li>\n<\/ul>\n<p>Let's take a look at the <code>room_type_inventory<\/code> columns as that table is more interesting:\n - <strong>hotel_id<\/strong>: id of hotel\n - <strong>room_type_id<\/strong>: id of a room type\n - <strong>date<\/strong>: a single date\n - <strong>total_inventory<\/strong>: total number of rooms minus those that are temporarily taken off the inventory.\n - <strong>total_reserved<\/strong>: total number of rooms booked for given (hotel_id, room_type_id, date)<\/p>\n<p>There are alternative ways to design this table, but having one room per (hotel_id, room_type_id, date) enables easy \nreservation management and easier queries.<\/p>\n<p>The rows in the table are pre-populated using a daily CRON job.<\/p>\n<p>Sample data:\n| hotel_id | room_type_id | date       | total_inventory | total_reserved |\n|----------|--------------|------------|-----------------|----------------|\n| 211      | 1001         | 2021-06-01 | 100             | 80             |\n| 211      | 1001         | 2021-06-02 | 100             | 82             |\n| 211      | 1001         | 2021-06-03 | 100             | 86             |\n| 211      | 1001         | ...        | ...             |                |\n| 211      | 1001         | 2023-05-31 | 100             | 0              |\n| 211      | 1002         | 2021-06-01 | 200             | 16             |\n| 2210     | 101          | 2021-06-01 | 30              | 23             |\n| 2210     | 101          | 2021-06-02 | 30              | 25             |<\/p>\n<p>Sample SQL query to check the availability of a type of room:<\/p>\n<pre><code>SELECT date, total_inventory, total_reserved\nFROM room_type_inventory\nWHERE room_type_id = ${roomTypeId} AND hotel_id = ${hotelId}\nAND date between ${startDate} and ${endDate}\n<\/code><\/pre>\n<p>How to check availability for a specified number of rooms using that data (note that we support overbooking):<\/p>\n<pre><code>if (total_reserved + ${numberOfRoomsToReserve}) &lt;= 110% * total_inventory\n<\/code><\/pre>\n<p>Now let's do some estimation about the storage volume.\n - We have 5000 hotels.\n - Each hotel has 20 types of rooms.\n - 5000 * 20 * 2 (years) * 365 (days) = 73mil rows<\/p>\n<p>73 million rows is not a lot of data and a single database server can handle it.\nIt makes sense, however, to setup read replication (potentially across different zones) to enable high availability.<\/p>\n<p>Follow-up question - if reservation data is too large for a single database, what would you do?\n - Store only current and future reservation data. Reservation history can be moved to cold storage.\n - Database sharding - we can shard our data by <code>hash(hotel_id) % servers_cnt<\/code> as we always select the <code>hotel_id<\/code> in our queries.<\/p>\n<h3><strong>Concurrency issues<\/strong><\/h3>\n<p>Another important problem to address is double booking.<\/p>\n<p>There are two issues to address:\n - Same user clicks on \"book\" twice\n - Multiple users try to book a room at the same time<\/p>\n<p>Here's a visualization of the first problem:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/double-booking-single-user.png\" alt=\"double-booking-single-user\" width=\"500\" />\n<\/div>\n\n<p>There are two approaches to solving this problem:\n - Client-side handling - front-end can disable the book button once clicked. If a user disabled javascript, however, they won't see the button becoming grayed out.\n - Idemptent API - Add an idempotency key to the API, which enables a user to execute an action once, regardless of how many times the endpoint is invoked:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/idempotency.png\" alt=\"idempotency\" width=\"500\" />\n<\/div>\n\n<p>Here's how this flow works:\n - A reservation order is generated once you're in the process of filling in your details and making a booking. The reservation order is generated using a globally unique identifier.\n - Submit reservation 1 using the <code>reservation_id<\/code> generated in the previous step.\n - If \"complete booking\" is clicked a second time, the same <code>reservation_id<\/code> is sent and the backend detects that this is a duplicate reservation.\n - The duplication is avoided by making the <code>reservation_id<\/code> column have a unique constraint, preventing multiple records with that id being stored in the DB.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/unique-constraint-violation.png\" alt=\"unique-constraint-violation\" width=\"500\" />\n<\/div>\n\n<p>What if there are multiple users making the same reservation?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/double-booking-multiple-users.png\" alt=\"double-booking-multiple-users\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Let's assume the transaction isolation level is not serializable<\/li>\n<li>User 1 and 2 attempt to book the same room at the same time.<\/li>\n<li>Transaction 1 checks if there are enough rooms - there are<\/li>\n<li>Transaction 2 check if there are enough rooms - there are<\/li>\n<li>Transaction 2 reserves the room and updates the inventory<\/li>\n<li>Transaction 1 also reserves the room as it still sees there are 99 <code>total_reserved<\/code> rooms out of 100.<\/li>\n<li>Both transactions successfully commit the changes<\/li>\n<\/ul>\n<p>This problem can be solved using some form of locking mechanism:\n - Pessimistic locking\n - Optimistic locking\n - Database constraints<\/p>\n<p>Here's the SQL we use to reserve a room:<\/p>\n<pre><code class=\"language-sql\"># step 1: check room inventory\nSELECT date, total_inventory, total_reserved\nFROM room_type_inventory\nWHERE room_type_id = ${roomTypeId} AND hotel_id = ${hotelId}\nAND date between ${startDate} and ${endDate}\n\n# For every entry returned from step 1\nif((total_reserved + ${numberOfRoomsToReserve}) &gt; 110% * total_inventory) {\n  Rollback\n}\n\n# step 2: reserve rooms\nUPDATE room_type_inventory\nSET total_reserved = total_reserved + ${numberOfRoomsToReserve}\nWHERE room_type_id = ${roomTypeId}\nAND date between ${startDate} and ${endDate}\n\nCommit\n<\/code><\/pre>\n<h4>Option 1: Pessimistic locking<\/h4>\n<p>Pessimistic locking prevents simultaneous updates by putting a lock on a record while it's being updated.<\/p>\n<p>This can be done in MySQL by using the <code>SELECT... FOR UPDATE<\/code> query, which locks the rows selected by the query until the transaction is committed.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/pessimistic-locking.png\" alt=\"pessimistic-locking\" width=\"500\" />\n<\/div>\n\n<p>Pros:\n - Prevents applications from updating data that is being changed\n - Easy to implement and avoids conflict by serializing updates. Useful when there is heavy data contention.<\/p>\n<p>Cons:\n - Deadlocks may occur when multiple resources are locked.\n - This approach is not scalable - if transaction is locked for too long, this has impact on all other transactions trying to access the resource.\n - The impact is severe when the query selects a lot of resources and the transaction is long-lived.<\/p>\n<p>The author doesn't recommend this approach due to its scalability issues.<\/p>\n<h4>Option 2: Optimistic locking<\/h4>\n<p>Optimistic locking allows multiple users to attempt to update a record at the same time.<\/p>\n<p>There are two common ways to implement it - version numbers and timestamps. Version numbers are recommended as server clocks can be inaccurate.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/optimistic-locking.png\" alt=\"optimistic-locking\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>A new <code>version<\/code> column is added to the database table<\/li>\n<li>Before a user modifies a database row, the version number is read<\/li>\n<li>When the user updates the row, the version number is increased by 1 and written back to the database<\/li>\n<li>Database validation prevents the insert if the new version number doesn't exceed the previous one<\/li>\n<\/ul>\n<p>Optimistic locking is usually faster than pessimistic locking as we're not locking the database. \nIts performance tends to degrade when concurrency is high, however, as that leads to a lot of rollbacks.<\/p>\n<p>Pros:\n - It prevents applications from editing stale data\n - We don't need to acquire a lock in the database\n - Preferred option when data contention is low, ie rarely are there update conflicts<\/p>\n<p>Cons:\n - Performance is poor when data contention is high<\/p>\n<p>Optimistic locking is a good option for our system as reservation QPS is not extremely high.<\/p>\n<h4>Option 3: Database constraints<\/h4>\n<p>This approach is very similar to optimistic locking, but the guardrails are implemented using a database constraint:<\/p>\n<pre><code>CONSTRAINT `check_room_count` CHECK((`total_inventory - total_reserved` &gt;= 0))\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/database-constraint.png\" alt=\"database-constraint\" width=\"500\" />\n<\/div>\n\n<p>Pros:\n - Easy to implement\n - Works well when data contention is small<\/p>\n<p>Cons:\n - Similar to optimistic locking, performs poorly when data contention is high\n - Database constraints cannot be easily version-controlled like application code\n - Not all databases support constraints<\/p>\n<p>This is another good option for a hotel reservation system due to its ease of implementation.<\/p>\n<h3><strong>Scalability<\/strong><\/h3>\n<p>Usually, the load of a hotel reservation system is not high. <\/p>\n<p>However, the interviewer might ask you how you'd handle a situation where the system gets adopted for a larger, popular travel site such as booking.com\nIn that case, QPS can be 1000 times larger.<\/p>\n<p>When there is such a situation, it is important to understand where our bottlenecks are. All the services are stateless, so they can be easily scaled via replication.<\/p>\n<p>The database, however, is stateful and it's not as obvious how it can get scaled.<\/p>\n<p>One way to scale it is by implementing database sharding - we can split the data across multiple databases, where each of them contain a portion of the data.<\/p>\n<p>We can shard based on <code>hotel_id<\/code> as all queries filter based on it. \nAssuming, QPS is 30,000, after sharding the database in 16 shards, each shard handles 1875 QPS, which is within a single MySQL cluster's load capacity.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/database-sharding.png\" alt=\"database-sharding\" width=\"500\" />\n<\/div>\n\n<p>We can also utilize caching for room inventory and reservations via Redis. We can set TTL so that old data can expire for days which are past.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/inventory-cache.png\" alt=\"inventory-cache\" width=\"500\" />\n<\/div>\n\n<p>The way we store an inventory is based on the <code>hotel_id<\/code>, <code>room_type_id<\/code> and <code>date<\/code>:<\/p>\n<pre><code>key: hotelID_roomTypeID_{date}\nvalue: the number of available rooms for the given hotel ID, room type ID and date.\n<\/code><\/pre>\n<p>Data consistency happens async and is managed by using a CDC streaming mechanism - database changes are read and applied to a separate system.\nDebezium is a popular option for synchronizing database changes with Redis.<\/p>\n<p>Using such a mechanism, there is a possibility that the cache and database are inconsistent for some time.\nThis is fine in our case because the database will prevent us from making an invalid reservation.<\/p>\n<p>This will cause some issue on the UI as a user would have to refresh the page to see that \"there are no more rooms left\", \nbut that is something which can happen regardless of this issue if eg a person hesitates a lot before making a reservation.<\/p>\n<p>Caching pros:\n - Reduced database load\n - High performance, as Redis manages data in-memory<\/p>\n<p>Caching cons:\n - Maintaining data consistency between cache and DB is hard. We need to consider how the inconsistency impacts user experience.<\/p>\n<h3><strong>Data consistency among services<\/strong><\/h3>\n<p>A monolithic application enables us to use a shared relational database for ensuring data consistency.<\/p>\n<p>In our microservice design, we chose a hybrid approach where some services are separate, \nbut the reservation and inventory APIs are handled by the same servicefor the reservation and inventory APIs.<\/p>\n<p>This is done because we want to leverage the relational database's ACID guarantees to ensure consistency.<\/p>\n<p>However, the interviewer might challenge this approach as it's not a pure microservice architecture, where each service has a dedicated database:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/microservices-vs-monolith.png\" alt=\"microservices-vs-monolith\" width=\"500\" />\n<\/div>\n\n<p>This can lead to consistency issues. In a monolithic server, we can leverage a relational DBs transaction capabilities to implement atomic operations:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/atomicity-monolith.png\" alt=\"atomicity-monolith\" width=\"500\" />\n<\/div>\n\n<p>It's more challenging, however, to guarantee this atomicity when the operation spans across multiple services:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/microservice-non-atomic-operation.png\" alt=\"microservice-non-atomic-operation\" width=\"500\" />\n<\/div>\n\n<p>There are some well-known techniques to handle these data inconsistencies:\n - <strong>Two-phase commit<\/strong>: a database protocol which guarantees atomic transaction commit across multiple nodes. \n   It's not performant, though, since a single node lag leads to all nodes blocking the operation.\n - <strong>Saga<\/strong>: a sequence of local transactions, where compensating transactions are triggered if any of the steps in a workflow fail. This is an eventually consistent approach.<\/p>\n<p>It's worth noting that addressing data inconsistencies across microservices is a challenging problem, which raise the system complexity.\nIt is good to consider whether the cost is worth it, given our more pragmatic approach of encapsulating dependent operations within the same relational database.<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>We presented a design for a hotel reservation system.<\/p>\n<p>These are the steps we went through:\n - Gathering requirements and doing back-of-the-envelope calculations to understand the system's scale\n - We presented the API Design, Data Model and system architecture in the high-level design\n - In the deep dive, we explored alternative database schema designs as requirements changed\n - We discussed race conditions and proposed solutions - pessimistic/optimistic locking, database constraints\n - Ways to scale the system via database sharding and caching\n - Finally we addressed how to handle data consistency issues across multiple microservices<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>在本章中，我们要设计一个<strong>酒店预订系统<\/strong>，类似于万豪国际（Marriott International）。<\/p>\n<p>它同样适用于其他类型的系统 —— Airbnb、机票预订、电影票预订。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<p>在深入设计系统之前，我们应该先向面试官提问以澄清范围：\n - C：系统的规模有多大？\n - I：我们正在为一家拥有 5000 家酒店、100 万间客房的连锁酒店建一个网站。\n - C：客户是在预订时付款，还是入住酒店时付款？\n - I：他们在预订时全额付款。\n - C：客户只能通过网站预订客房吗？我们是否必须支持其他预订渠道，比如电话？\n - I：他们只能通过网站或 App 预订。\n - C：客户可以取消预订吗？\n - I：可以。\n - C：还有其他需要考虑的事情吗？\n - I：有，我们允许超订（overbooking）10%。酒店会卖出比实际数量更多的房间。酒店这么做是预料到客户会取消预订。\n - C：由于时间不多，我们将聚焦于 —— 展示酒店相关页面、酒店房间详情页、预订房间、管理后台面板、支持超订。\n - I：听起来不错。\n - I：还有一件事 —— 酒店价格一直在变动。假设一间客房的价格每天都会变。\n - C：好的。<\/p>\n<h3><strong>非功能性需求<\/strong><\/h3>\n<ul>\n<li>支持高并发 —— 在旺季，可能有很多客户试图预订同一家酒店。<\/li>\n<li>中等延迟 —— 理想情况下用户预订时延迟要低，但如果系统处理需要几秒钟也是可以接受的。<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-envelope estimation）<\/strong><\/h3>\n<ul>\n<li>共 5000 家酒店、100 万间客房。<\/li>\n<li>假设 70% 的客房被占用，平均入住时长为 3 天。<\/li>\n<li>预估每日预订量 —— 100 万 × 0.7 / 3 = 每天约 24 万次预订。<\/li>\n<li>每秒预订数 —— 24 万 / 一天中的 10^5 秒 = 约 3。平均预订 TPS 很低。<\/li>\n<\/ul>\n<p>让我们估算一下 QPS。如果假设到达预订页面需要经过三个步骤，且每个页面的转化率为 10%，\n我们可以估算出：如果有 3 笔预订，那么预订页面一定被浏览了 30 次，酒店房间详情页被浏览了 300 次。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/qps-estimation.png\" alt=\"QPS 估算\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 2 步：提出高层级设计并获得认可<\/h2>\n<p>我们将探讨 —— API 设计、数据模型、高层级设计。<\/p>\n<h3><strong>API 设计<\/strong><\/h3>\n<p>本 API 设计聚焦于为支撑酒店预订系统所必需的核心端点（采用 RESTful 风格）。<\/p>\n<p>一个完整的系统需要更庞大的 API，支持基于大量条件搜索房间，但本节不聚焦于此。\n原因是它们在技术上没有挑战性，因此不在范围内。<\/p>\n<p><strong>酒店相关 API<\/strong>\n - <code>GET /v1/hotels/{id}<\/code> - 获取某家酒店的详细信息\n - <code>POST /v1/hotels<\/code> - 新增一家酒店。仅运维可用\n - <code>PUT /v1/hotels/{id}<\/code> - 更新酒店信息。仅运维可用\n - <code>DELETE /v1/hotels/{id}<\/code> - 删除一家酒店。该 API 仅运维可用<\/p>\n<p><strong>房间相关 API<\/strong>\n - <code>GET /v1/hotels/{id}/rooms/{id}<\/code> - 获取某间客房的详细信息\n - <code>POST /v1/hotels/{id}/rooms<\/code> - 新增一间客房。仅运维可用\n - <code>PUT /v1/hotels/{id}/rooms/{id}<\/code> - 更新客房信息。仅运维可用\n - <code>DELETE /v1/hotels/{id}/rooms/{id}<\/code> - 删除一间客房。仅运维可用<\/p>\n<p><strong>预订相关 API<\/strong>\n - <code>GET /v1/reservations<\/code> - 获取当前用户的预订历史\n - <code>GET /v1/reservations/{id}<\/code> - 获取某笔预订的详细信息\n - <code>POST /v1/reservations<\/code> - 发起一笔新预订\n - <code>DELETE /v1/reservations/{id}<\/code> - 取消一笔预订<\/p>\n<p>下面是一个发起预订的请求示例：<\/p>\n<pre><code>{\n  &quot;startDate&quot;:&quot;2021-04-28&quot;,\n  &quot;endDate&quot;:&quot;2021-04-30&quot;,\n  &quot;hotelID&quot;:&quot;245&quot;,\n  &quot;roomID&quot;:&quot;U12354673389&quot;,\n  &quot;reservationID&quot;:&quot;13422445&quot;\n}\n<\/code><\/pre>\n<p>注意，<code>reservationID<\/code> 是一个幂等键（idempotency key），用于避免重复预订。细节在<a href=\"#concurrency-issues\">并发问题一节<\/a>中说明。<\/p>\n<h3><strong>数据模型<\/strong><\/h3>\n<p>在选择使用哪种数据库之前，让我们先考虑一下我们的访问模式。<\/p>\n<p>我们需要支持以下查询：\n - 查看某家酒店的详细信息\n - 给定一个日期范围，找出可预订的房型\n - 记录一笔预订\n - 查询某笔预订或过去的预订历史<\/p>\n<p>从我们的估算可知，系统规模并不大，但我们需要为流量激增做好准备。<\/p>\n<p>基于这些认识，我们将选择关系型数据库，原因是：\n - 关系型数据库在「读多写少」的系统中表现良好。\n - NoSQL 数据库通常为写而优化，但我们知道写入不会很多，因为访问网站的用户中只有一小部分会下单预订。\n - 关系型数据库提供 ACID 保证。这对这类系统很重要，因为没有它们，我们将无法防止负余额、重复扣款等问题。\n - 关系型数据库可以很容易地对数据建模，因为结构非常清晰。<\/p>\n<p>下面是我们的 schema 设计：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/schema-design.png\" alt=\"Schema 设计\" width=\"500\" />\n<\/div>\n\n<p>大部分字段都不言自明。唯一值得一提的是 <code>status<\/code> 字段，它表示某间客房的状态机：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/status-state-machine.png\" alt=\"状态状态机\" width=\"500\" />\n<\/div>\n\n<p>这个数据模型对 Airbnb 这样的系统很适用，但不适用于酒店 —— 在酒店里，用户预订的不是某一间特定客房，而是一个房型。\n他们预订的是一种房型，具体房号是在预订时才选定的。<\/p>\n<p>这个不足将在<a href=\"#improved-data-model\">改进的数据模型<\/a>一节中解决。<\/p>\n<h3><strong>高层级设计<\/strong><\/h3>\n<p>本设计我们选择了微服务架构。近年来它非常流行：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/high-level-design.png\" alt=\"高层级设计\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>用户（Users）<\/strong>：在手机或电脑上预订酒店客房。<\/li>\n<li><strong>管理员（Admin）<\/strong>：执行管理职能，如退款/取消支付等。<\/li>\n<li><strong>CDN<\/strong>：缓存静态资源，如 JS 包、图片、视频等。<\/li>\n<li><strong>公共 API 网关（Public API Gateway）<\/strong>：全托管服务，支持限流、认证等。<\/li>\n<li><strong>内部 API（Internal APIs）<\/strong>：仅对授权人员可见。通常由 VPN 保护。<\/li>\n<li><strong>酒店服务（Hotel service）<\/strong>：提供酒店和客房的详细信息。酒店和客房数据是静态的，可以激进地缓存。<\/li>\n<li><strong>价格服务（Rate service）<\/strong>：提供未来不同日期的房价。这个领域一个有趣的点是：价格取决于某一天酒店的满房程度。<\/li>\n<li><strong>预订服务（Reservation service）<\/strong>：接收预订请求并预订酒店客房。同时随着预订的下单/取消来跟踪客房库存。<\/li>\n<li><strong>支付服务（Payment service）<\/strong>：处理支付，并在成功后更新预订状态。<\/li>\n<li><strong>酒店管理服务（Hotel management service）<\/strong>：仅授权人员可用。允许某些管理职能，用于管理和查看预订、酒店等。<\/li>\n<\/ul>\n<p>服务间通信可以通过 RPC 框架来完成，例如 gRPC。<\/p>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>让我们更深入地探讨：\n - 改进的数据模型\n - 并发问题\n - 可扩展性\n - 解决微服务中的数据不一致<\/p>\n<h3><strong>改进的数据模型<\/strong><\/h3>\n<p>如前一节所述，我们需要修改 API 和 schema，以支持「预订一个房型」而非「预订某一间特定客房」。<\/p>\n<p>对于预订 API，我们不再预订 <code>roomID<\/code>，而是预订 <code>roomTypeID<\/code>：<\/p>\n<pre><code>POST /v1/reservations\n{\n  &quot;startDate&quot;:&quot;2021-04-28&quot;,\n  &quot;endDate&quot;:&quot;2021-04-30&quot;,\n  &quot;hotelID&quot;:&quot;245&quot;,\n  &quot;roomTypeID&quot;:&quot;12354673389&quot;,\n  &quot;roomCount&quot;:&quot;3&quot;,\n  &quot;reservationID&quot;:&quot;13422445&quot;\n}\n<\/code><\/pre>\n<p>下面是更新后的 schema：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/updated-schema.png\" alt=\"更新后的 schema\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>room<\/strong>：包含一间客房的信息。<\/li>\n<li><strong>room_type_rate<\/strong>：包含某房型价格的信息。<\/li>\n<li><strong>reservation<\/strong>：记录客人的预订数据。<\/li>\n<li><strong>room_type_inventory<\/strong>：存储酒店客房的库存数据。<\/li>\n<\/ul>\n<p>让我们看看 <code>room_type_inventory<\/code> 的列，因为那张表更有意思：\n - <strong>hotel_id<\/strong>：酒店 id。\n - <strong>room_type_id<\/strong>：房型 id。\n - <strong>date<\/strong>：某一个日期。\n - <strong>total_inventory<\/strong>：客房总数减去那些被临时从库存中下架的房间。\n - <strong>total_reserved<\/strong>：在给定 (hotel_id, room_type_id, date) 下已被预订的房间总数。<\/p>\n<p>这张表还有其他设计方式，但让每个 (hotel_id, room_type_id, date) 对应一行客房，可以让预订管理更轻松、查询更容易。<\/p>\n<p>表中的行是通过一个每日运行的 CRON 任务预先填充的。<\/p>\n<p>示例数据：\n| hotel_id | room_type_id | date       | total_inventory | total_reserved |\n|----------|--------------|------------|-----------------|----------------|\n| 211      | 1001         | 2021-06-01 | 100             | 80             |\n| 211      | 1001         | 2021-06-02 | 100             | 82             |\n| 211      | 1001         | 2021-06-03 | 100             | 86             |\n| 211      | 1001         | ...        | ...             |                |\n| 211      | 1001         | 2023-05-31 | 100             | 0              |\n| 211      | 1002         | 2021-06-01 | 200             | 16             |\n| 2210     | 101          | 2021-06-01 | 30              | 23             |\n| 2210     | 101          | 2021-06-02 | 30              | 25             |<\/p>\n<p>下面是一个检查某房型是否可预订的示例 SQL 查询：<\/p>\n<pre><code>SELECT date, total_inventory, total_reserved\nFROM room_type_inventory\nWHERE room_type_id = ${roomTypeId} AND hotel_id = ${hotelId}\nAND date between ${startDate} and ${endDate}\n<\/code><\/pre>\n<p>如何用这些数据检查指定数量的房间是否可订（注意我们支持超订）：<\/p>\n<pre><code>if (total_reserved + ${numberOfRoomsToReserve}) &lt;= 110% * total_inventory\n<\/code><\/pre>\n<p>现在让我们对存储量做一些估算。\n - 我们有 5000 家酒店。\n - 每家酒店有 20 种房型。\n - 5000 × 20 × 2（年）× 365（天）= 7300 万行。<\/p>\n<p>7300 万行数据并不算多，单台数据库服务器就能处理。\n不过，设置读复制（可能跨不同可用区）以实现高可用性是有意义的。<\/p>\n<p>追问 —— 如果预订数据大到单台数据库都放不下，你会怎么做？\n - 只存储当前和未来的预订数据。预订历史可以迁移到冷存储。\n - 数据库分片（sharding）—— 我们可以按 <code>hash(hotel_id) % servers_cnt<\/code> 分片，因为我们的查询总是按 <code>hotel_id<\/code> 过滤。<\/p>\n<h3><strong>并发问题<\/strong><\/h3>\n<p>另一个需要解决的重要问题是重复预订（double booking）。<\/p>\n<p>有两个问题需要解决：\n - 同一个用户连续点了两次「预订」。\n - 多个用户同时试图预订同一间房。<\/p>\n<p>下面是第一个问题的可视化：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/double-booking-single-user.png\" alt=\"单用户重复预订\" width=\"500\" />\n<\/div>\n\n<p>解决这个问题有两种方式：\n - 客户端处理 —— 前端可以在点击一次后禁用预订按钮。但如果用户禁用了 javascript，他们就看不到按钮变灰。\n - 幂等 API —— 给 API 加一个幂等键，使用户无论调用该端点多少次，某个动作都只会被执行一次：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/idempotency.png\" alt=\"幂等性\" width=\"500\" />\n<\/div>\n\n<p>这个流程是这样工作的：\n - 当你开始填写信息并下单时，会生成一个预订订单。该预订订单使用全局唯一标识符生成。\n - 使用上一步生成的 <code>reservation_id<\/code> 提交预订 1。\n - 如果第二次点击「完成预订」，发送的是同一个 <code>reservation_id<\/code>，后端会检测出这是一笔重复预订。\n - 通过给 <code>reservation_id<\/code> 列加上唯一约束来避免重复，防止在 DB 中存储多条同 id 的记录。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/unique-constraint-violation.png\" alt=\"唯一约束冲突\" width=\"500\" />\n<\/div>\n\n<p>那如果是多个用户在做同一笔预订呢？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/double-booking-multiple-users.png\" alt=\"多用户重复预订\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>假设事务隔离级别不是可序列化（serializable）。<\/li>\n<li>用户 1 和用户 2 同时试图预订同一间房。<\/li>\n<li>事务 1 检查是否有足够房间 —— 有。<\/li>\n<li>事务 2 检查是否有足够房间 —— 有。<\/li>\n<li>事务 2 预订了该房间并更新库存。<\/li>\n<li>事务 1 也预订了该房间，因为它仍然看到 100 间中只订了 99 间 <code>total_reserved<\/code>。<\/li>\n<li>两个事务都成功提交了变更。<\/li>\n<\/ul>\n<p>这个问题可以用某种形式的锁机制来解决：\n - 悲观锁（Pessimistic locking）\n - 乐观锁（Optimistic locking）\n - 数据库约束（Database constraints）<\/p>\n<p>下面是我们用来预订房间的 SQL：<\/p>\n<pre><code class=\"language-sql\"># step 1: check room inventory\nSELECT date, total_inventory, total_reserved\nFROM room_type_inventory\nWHERE room_type_id = ${roomTypeId} AND hotel_id = ${hotelId}\nAND date between ${startDate} and ${endDate}\n\n# For every entry returned from step 1\nif((total_reserved + ${numberOfRoomsToReserve}) &gt; 110% * total_inventory) {\n  Rollback\n}\n\n# step 2: reserve rooms\nUPDATE room_type_inventory\nSET total_reserved = total_reserved + ${numberOfRoomsToReserve}\nWHERE room_type_id = ${roomTypeId}\nAND date between ${startDate} and ${endDate}\n\nCommit\n<\/code><\/pre>\n<h4>方案 1：悲观锁<\/h4>\n<p>悲观锁通过在记录被更新期间对其加锁，来防止并发更新。<\/p>\n<p>在 MySQL 中，可以使用 <code>SELECT... FOR UPDATE<\/code> 查询来做到这一点，它会把查询选中的行锁住，直到事务提交。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/pessimistic-locking.png\" alt=\"悲观锁\" width=\"500\" />\n<\/div>\n\n<p>优点：\n - 防止应用程序去更新正在被更改的数据。\n - 易于实现，通过把更新序列化来避免冲突。在数据竞争激烈时很有用。<\/p>\n<p>缺点：\n - 当锁定多个资源时可能发生死锁。\n - 这种方式不可扩展 —— 如果一个事务被锁太久，会影响所有其他试图访问该资源的事务。\n - 当查询选中大量资源且事务是长事务时，影响会很严重。<\/p>\n<p>由于可扩展性问题，作者不推荐这种方式。<\/p>\n<h4>方案 2：乐观锁<\/h4>\n<p>乐观锁允许多个用户同时尝试更新同一条记录。<\/p>\n<p>常见的实现方式有两种 —— 版本号和时间戳。推荐使用版本号，因为服务器时钟可能不准确。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/optimistic-locking.png\" alt=\"乐观锁\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>在数据库表中新增一个 <code>version<\/code> 列。<\/li>\n<li>用户修改某一行之前，先读取版本号。<\/li>\n<li>用户更新该行时，把版本号加 1 并写回数据库。<\/li>\n<li>如果新版本号没有大于旧版本号，数据库校验会阻止这次写入。<\/li>\n<\/ul>\n<p>乐观锁通常比悲观锁更快，因为我们没有锁定数据库。\n不过，当并发很高时它的性能会下降，因为那会导致大量回滚。<\/p>\n<p>优点：\n - 它防止应用程序编辑陈旧数据。\n - 我们不需要在数据库中获取锁。\n - 当数据竞争较低（即很少发生更新冲突）时，是首选方案。<\/p>\n<p>缺点：\n - 当数据竞争较高时性能较差。<\/p>\n<p>乐观锁对我们的系统是个不错的选择，因为预订 QPS 并不是非常高。<\/p>\n<h4>方案 3：数据库约束<\/h4>\n<p>这种方式与乐观锁非常相似，但防护栏是用数据库约束来实现的：<\/p>\n<pre><code>CONSTRAINT `check_room_count` CHECK((`total_inventory - total_reserved` &gt;= 0))\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/database-constraint.png\" alt=\"数据库约束\" width=\"500\" />\n<\/div>\n\n<p>优点：\n - 易于实现。\n - 当数据竞争较小时效果良好。<\/p>\n<p>缺点：\n - 与乐观锁类似，当数据竞争较高时性能较差。\n - 数据库约束不像应用代码那样容易做版本控制。\n - 并非所有数据库都支持约束。<\/p>\n<p>由于易于实现，这也是酒店预订系统的一个不错选择。<\/p>\n<h3><strong>可扩展性<\/strong><\/h3>\n<p>通常，酒店预订系统的负载并不高。<\/p>\n<p>然而，面试官可能会问你：如果这个系统被一个更大、更热门的旅行网站（如 booking.com）采用，你会怎么应对？\n那种情况下，QPS 可能是现在的 1000 倍。<\/p>\n<p>遇到这种情况时，重要的是搞清楚我们的瓶颈在哪里。所有服务都是无状态的，因此可以通过复制轻松扩展。<\/p>\n<p>而数据库是有状态的，如何扩展它并不那么显而易见。<\/p>\n<p>一种扩展方式是实现数据库分片 —— 我们可以把数据拆分到多个数据库中，每个数据库各存一部分数据。<\/p>\n<p>我们可以基于 <code>hotel_id<\/code> 分片，因为所有查询都是按它过滤的。\n假设 QPS 为 30000，把数据库分成 16 个分片后，每个分片处理 1875 QPS，在单个 MySQL 集群的负载能力之内。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/database-sharding.png\" alt=\"数据库分片\" width=\"500\" />\n<\/div>\n\n<p>我们还可以通过 Redis 对客房库存和预订做缓存。我们可以设置 TTL，让过期日期的旧数据自然失效。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/inventory-cache.png\" alt=\"库存缓存\" width=\"500\" />\n<\/div>\n\n<p>我们存储库存的方式是基于 <code>hotel_id<\/code>、<code>room_type_id<\/code> 和 <code>date<\/code>：<\/p>\n<pre><code>key: hotelID_roomTypeID_{date}\nvalue: the number of available rooms for the given hotel ID, room type ID and date.\n<\/code><\/pre>\n<p>数据一致性是异步发生的，通过 CDC 流式机制来管理 —— 读取数据库变更并应用到另一个独立系统。\nDebezium 是把数据库变更同步到 Redis 的一个流行选择。<\/p>\n<p>使用这种机制，缓存和数据库在一段时间内可能不一致。\n在我们的场景下这没问题，因为数据库会阻止我们做出无效的预订。<\/p>\n<p>这会在 UI 上造成一些问题：用户得刷新页面才能看到「房间已经订完了」，\n但即便没有这个问题，这种情况也可能发生 —— 比如一个人在预订前犹豫了很久。<\/p>\n<p>缓存的优点：\n - 降低数据库负载。\n - 高性能，因为 Redis 在内存中管理数据。<\/p>\n<p>缓存的缺点：\n - 维持缓存与 DB 之间的数据一致性很难。我们需要考虑这种不一致会如何影响用户体验。<\/p>\n<h3><strong>服务间的数据一致性<\/strong><\/h3>\n<p>单体应用让我们可以使用一个共享的关系型数据库来保证数据一致性。<\/p>\n<p>在我们的微服务设计中，我们选择了一种混合方式：有些服务是独立的，\n但预订和库存 API 由同一个服务处理。<\/p>\n<p>这样做是因为我们想利用关系型数据库的 ACID 保证来确保一致性。<\/p>\n<p>然而，面试官可能会质疑这种方式，因为它不是一个纯粹的微服务架构 —— 纯粹的架构里每个服务都有自己专用的数据库：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/microservices-vs-monolith.png\" alt=\"微服务 vs 单体\" width=\"500\" />\n<\/div>\n\n<p>这可能导致一致性问题。在单体服务器中，我们可以利用关系型 DB 的事务能力来实现原子操作：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/atomicity-monolith.png\" alt=\"单体的原子性\" width=\"500\" />\n<\/div>\n\n<p>然而，当操作跨多个服务时，要保证这种原子性就更具挑战性了：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"22. Hotel Reservation System/images/microservice-non-atomic-operation.png\" alt=\"微服务中的非原子操作\" width=\"500\" />\n<\/div>\n\n<p>有一些著名的技术可以处理这类数据不一致：\n - <strong>两阶段提交（Two-phase commit）<\/strong>：一种数据库协议，保证跨多个节点的事务原子提交。\n   但它性能不佳，因为只要有一个节点延迟，就会导致所有节点阻塞该操作。\n - <strong>Saga<\/strong>：一串本地事务，如果工作流中的任何一步失败，就触发补偿事务。这是一种最终一致性的方式。<\/p>\n<p>值得注意的是，解决跨微服务的数据不一致是一个富有挑战性的问题，它会抬高系统复杂度。\n考虑到我们更务实的做法 —— 把相互依赖的操作封装在同一个关系型数据库内 —— 值得权衡这样做的成本是否划算。<\/p>\n<hr />\n<h2>第 4 步：收尾<\/h2>\n<p>我们展示了一个酒店预订系统的设计。<\/p>\n<p>这些是我们走过的步骤：\n - 收集需求并做粗略估算，以理解系统规模。\n - 在高层级设计中展示了 API 设计、数据模型和系统架构。\n - 在深入设计中，我们随着需求变化探讨了备选的数据库 schema 设计。\n - 我们讨论了竞态条件并提出了解决方案 —— 悲观锁/乐观锁、数据库约束。\n - 通过数据库分片和缓存来扩展系统的方式。\n - 最后，我们讨论了如何处理多个微服务之间的数据一致性问题。<\/p>", "enTitle": "Chapter 22: Hotel Reservation System", "zhTitle": "第 22 章：酒店预订系统", "short": "Hotel Reservation System", "num": "22"}, "23. Distributed Email Service": {"en": "\n<h2>Introduction<\/h2>\n<p>We'll design a <strong>distributed email service<\/strong>, similar to <strong>Gmail<\/strong> in this chapter.<\/p>\n<p>In 2020, <strong>Gmail<\/strong> had 1.8bil active users, while <strong>Outlook<\/strong> had 400mil users worldwide.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: How many users use the system?<\/li>\n<li>I: 1bil users<\/li>\n<li>C: I think following features are important - auth, send/receive email, fetch email, filter emails, search email, anti-spam protection.<\/li>\n<li>I: Good list. Don't worry about auth for now.<\/li>\n<li>C: How do users connect \\w email servers?<\/li>\n<li>I: Typically, email clients connect via SMTP, POP, IMAP, but we'll use HTTP for this problem.<\/li>\n<li>C: Can emails have attachments?<\/li>\n<li>I: Yes<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>Reliability<\/strong> - we shouldn't lose data<\/li>\n<li><strong>Availability<\/strong> - We should use replication to prevent single points of failure. We should also tolerate partial system failures.<\/li>\n<li><strong>Scalability<\/strong> - As userbase grows, our system should be able to handle them.<\/li>\n<li><strong>Flexibility and extensibility<\/strong> - system should be flexible and easy to extend with new features. One of the reasons we chose HTTP over SMTP/other mail protocols.<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<ul>\n<li><strong>1bil users<\/strong><\/li>\n<li>Assuming one person sends 10 emails per day -&gt; <strong>100k emails per second<\/strong>.<\/li>\n<li>Assuming one person receives 40 emails per day and each email on average has 50kb metadata -&gt; <strong>730pb storage per year<\/strong>.<\/li>\n<li>Assuming 20% of emails have storage attachments and average size is 500kb -&gt; <strong>1,460pb per year<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3><strong>Email knowledge 101<\/strong><\/h3>\n<p>There are various protocols used for sending and receiving emails:\n- <strong>SMTP<\/strong> - standard protocol for sending emails from one server to another.\n- <strong>POP<\/strong> - standard protocol for receiving and downloading emails from a remote mail server to a local client. Once retrieved, emails are deleted from remote server.\n- <strong>IMAP<\/strong> - similar to POP, it is used for receiving and downloading emails from a remote server, but it keeps the emails on the server-side.\n- <strong>HTTPS<\/strong> - not technically an email protocol, but it can be used for web-based email clients.<\/p>\n<p>Apart from the mailing protocol, there are some DNS records we need to configure for our email server - the MX records:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/dns-lookup.png\" alt=\"dns-lookup\" width=\"500\" />\n<\/div>\n\n<p>Email attachments are sent base64-encoded and there is usually a size limit of 25mb on most mail services.\nThis is configurable and varies from individual to corporate accounts.<\/p>\n<h3><strong>Traditional mail servers<\/strong><\/h3>\n<p>Traditional mail servers work well when there are a limited number of users, connected to a single server.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/traditional-mail-server.png\" alt=\"traditional-mail-server\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Alice logs into her Outlook email and presses \"send\". Email is sent to Outlook mail server. Communication is via SMTP.<\/li>\n<li>Outlook server queries DNS to find MX record for gmail.com and transfers the email to their servers. Communication is via SMTP.<\/li>\n<li>Bob fetches emails from his gmail server via IMAP/POP.<\/li>\n<\/ul>\n<p>In traditional mail servers, emails were stored on the local file system. Every email was a separate file.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/local-dir-storage.png\" alt=\"local-dir-storage\" width=\"500\" />\n<\/div>\n\n<p>As the scale grew, disk I/O became a bottleneck. Also, it doesn't satisfy our high availability and reliability requirements.\nDisks can be damaged and server can go down.<\/p>\n<h3><strong>Distributed mail servers<\/strong><\/h3>\n<p>Distributed mail servers are designed to support modern use-cases and solve modern scalability issues.<\/p>\n<p>These servers can still support IMAP/POP for native email clients and SMTP for mail exchange across servers.<\/p>\n<p>But for rich web-based mail clients, a RESTful API over HTTP is typically used.<\/p>\n<p>Example APIs:\n- <code>POST /v1/messages<\/code> - sends a message to recipients in To, Cc, Bcc headers.\n- <code>GET /v1/folders<\/code> - returns all folders of an email account<\/p>\n<p>Example response:<\/p>\n<pre><code>[{id: string        Unique folder identifier.\n  name: string      Name of the folder.\n                    According to RFC6154 [9], the default folders can be one of\n                    the following: All, Archive, Drafts, Flagged, Junk, Sent,\n                    and Trash.\n  user_id: string   Reference to the account owner\n}]\n<\/code><\/pre>\n<ul>\n<li><code>GET /v1/folders/{:folder_id}/messages<\/code> - returns all messages under a folder \\w pagination<\/li>\n<li><code>GET /v1/messages/{:message_id}<\/code> - get all information about a particular message<\/li>\n<\/ul>\n<p>Example response:<\/p>\n<pre><code>{\n  user_id: string                      // Reference to the account owner.\n  from: {name: string, email: string}  // &lt;name, email&gt; pair of the sender.\n  to: [{name: string, email: string}]  // A list of &lt;name, email&gt; paris\n  subject: string                      // Subject of an email\n  body: string                         //  Message body\n  is_read: boolean                     //  Indicate if a message is read or not.\n}\n<\/code><\/pre>\n<p>Here's the high-level design of the distributed mail server:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"23. Distributed Email Service/images/high-level-architecture.png\" alt=\"high-level-architecture\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Webmail<\/strong> - users use web browsers to send/receive emails<\/li>\n<li><strong>Web servers<\/strong> - public-facing request/response services used to manage login, signup, user profile, etc.<\/li>\n<li><strong>Real-time servers<\/strong> - Used for pushing new email updates to clients in real-time. We use websockets for real-time communication but fallback to long-polling for older browsers that don't support them.<\/li>\n<li><strong>Metadata db<\/strong> - stores email metadata such as subject, body, from, to, etc.<\/li>\n<li><strong>Attachmen
