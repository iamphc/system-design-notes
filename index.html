>3. 一致性<\/h3>\n<p>由于数据在多个节点上都有副本，必须在各副本之间保持同步。\n- <strong>法定人数共识（Quorum Consensus）：<\/strong>\n  - <code>N<\/code>：副本总数。\n  - <code>W<\/code>：写法定人数（write quorum）大小。一次写操作要被视为成功，必须得到 W 个副本的确认。\n  - <code>R<\/code>：读法定人数（read quorum）大小。一次读操作要被视为成功，必须至少等待 R 个副本的响应。\n  - <strong>规则：<\/strong> <code>W + R &gt; N<\/code> 可保证强一致性。\n  - W、R、N 的配置是延迟与一致性之间的典型权衡。<\/p>\n<pre><code>&lt;p align=\"center\"&gt;\n&lt;img src=\"06. Key-Value Store/images/quorum-consensus.png\"   alt=\"法定人数共识\" width=\"400\"&gt;\n&lt;/p&gt;\n\n- 如果 R = 1 且 W = N，系统针对快速读做了优化。\n- 如果 W = 1 且 R = N，系统针对快速写做了优化。\n- 如果 W + R &gt; N，强一致性得到保证（通常 N = 3，W = R = 2）。\n- 如果 W + R &lt;= N，无法保证强一致性。\n<\/code><\/pre>\n<ul>\n<li><strong>一致性模型<\/strong>：<\/li>\n<li><strong>强一致性（Strong Consistency）：<\/strong> 读操作返回的值对应于最近一次更新写入的数据项结果。<\/li>\n<li><strong>弱一致性（Weak Consistency）：<\/strong> 随后的读操作可能看不到最新写入的值。<\/li>\n<li><strong>最终一致性（Eventual Consistency）：<\/strong> 只要时间足够长，所有更新都会被传播出去，所有副本最终达成一致。<\/li>\n<\/ul>\n<h3>4. 不一致的解决<\/h3>\n<p>复制带来了高可用性，但也导致副本之间出现不一致。版本化与向量锁用于解决不一致问题。\n- <strong>版本化（Versioning）：<\/strong> \n    - 使用<strong>矢量时钟（vector clock）<\/strong>跟踪数据版本并解决冲突。\n    - 版本化意味着把每一次数据修改都视为数据的一个新的不可变版本。\n        <div>\n        <img src=\"06. Key-Value Store/images/consistent-server.png\"   alt=\"一致哈希\" width=\"400\">\n        <img src=\"06. Key-Value Store/images/inconsistent-server.png\"   alt=\"不一致的服务器\" height=\"230\">\n        <\/div><\/p>\n<pre><code>- 服务器 1 修改了名称，服务器 2 也修改了名称。这两次修改是同时发生的。此时我们就有了相互冲突的值，称为版本 v1 和 v2。\n<\/code><\/pre>\n<ul>\n<li>\n<p><strong>矢量时钟（Vector Clock）<\/strong><\/p>\n<ol>\n<li>\n<p><strong>设定：<\/strong> 矢量时钟是与一个数据项关联的 [服务器, 版本] 对。它可用于判断\n    某个版本是先于、后于还是与其他版本相冲突。<\/p>\n<ul>\n<li>假设一个矢量时钟表示为 D([S1, v1], [S2, v2], …, [Sn, vn])，如果数据项 D 被写入服务器\nSi，系统必须执行以下任务之一。<\/li>\n<li>其中：<code>D<\/code> 是数据项。<code>Si<\/code> 是服务器标识符。<code>vi<\/code> 是数据在服务器 <code>Si<\/code> 上的版本计数。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>更新矢量时钟：<\/strong> 当某个数据项在某台服务器上被修改时：<\/p>\n<ul>\n<li>如果该服务器已在矢量时钟中，则其版本计数加一。<\/li>\n<li>否则，向矢量时钟中添加一个新条目。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>冲突检测：<\/strong><\/p>\n<ul>\n<li><strong>无冲突：<\/strong> 如果版本 X 中的所有计数都小于或等于版本 Y 中的对应计数，则 X 是 Y 的祖先。<\/li>\n<li><strong>存在冲突：<\/strong> 如果 Y 中至少有一个计数小于 X 中的对应计数，则这两个版本互为兄弟（sibling）。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>冲突解决：<\/strong> 当检测到冲突（兄弟版本）时，系统依靠应用特定的逻辑或客户端介入来调和数据。<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/vector-clock.png\"  alt=\"矢量时钟\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<\/ol>\n<\/li>\n<li>\n<p><strong>挑战：<\/strong><\/p>\n<\/li>\n<li>增加了客户端的复杂度。<\/li>\n<li>随着更新增多，矢量时钟的体积可能膨胀，需要采用裁剪策略来限制其大小。<\/li>\n<\/ul>\n<h3>5. 故障处理<\/h3>\n<h4>a. 故障检测<\/h4>\n<p>仅仅因为另一台服务器说某台服务器宕机了，就认定它宕机，这是不够的。通常，需要至少两个独立的信息来源才能把一台服务器标记为宕机。\n- <strong>Gossip 协议：<\/strong>\n    <div style=\"margin-left:3rem\">\n        <img src=\"06. Key-Value Store/images/gossip-protocol.png\"  alt=\"Gossip 协议\" width=\"600\">\n    <\/div><\/p>\n<pre><code>- 每个节点维护成员 ID 和心跳计数。\n- 每个节点周期性地递增自己的心跳计数。\n- 每个节点周期性地向一组随机节点发送心跳。\n- 如果某个成员的心跳在超过预定义的周期内没有增加，就认为该成员已离线。\n<\/code><\/pre>\n<h4>b. 临时故障<\/h4>\n<ul>\n<li>\n<p><strong>宽松法定人数（Sloppy Quorum）：<\/strong> 临时使用健康节点维持运行。\n        <p align=\"center\">\n        <img src=\"06. Key-Value Store/images/sloppy-quorum.png\"   alt=\"宽松法定人数\" width=\"400\">\n        <\/p><\/p>\n<ul>\n<li>检测到故障后，系统需要部署某些机制来确保可用性。<\/li>\n<li>系统不强制要求法定人数，而是在哈希环上为写操作选择最先遇到的 W 台健康服务器，为读操作选择最先遇到的 R 台健康服务器。<\/li>\n<li>离线服务器被忽略。如果某台服务器不可用，会由另一台服务器临时处理请求。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>暧昧指路（Hinted Handoff）：<\/strong> 离线服务器恢复后追平变更。<\/p>\n<ul>\n<li>当宕机的服务器重新上线时，变更会被推送回去，以达成数据一致性。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>c. 永久故障<\/h4>\n<ul>\n<li>\n<p>使用 <strong>Merkle 树（Merkle Tree）<\/strong>在副本之间高效同步。\n    <strong>Merkle 树<\/strong>（或称哈希树）是一种数据结构，用于在永久故障期间高效检测并解决副本之间的不一致。<\/p>\n<\/li>\n<li>\n<p>工作原理<\/p>\n<ol>\n<li>\n<p><strong>结构：<\/strong><\/p>\n<ul>\n<li><strong>叶节点（Leaf Nodes）<\/strong>存储各个数据块（block）的哈希。<\/li>\n<li><strong>非叶节点（Non-Leaf Nodes）<\/strong>存储其子节点的哈希。<\/li>\n<li><strong>根哈希（root hash）<\/strong>代表树中所有数据的综合状态。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>构建 Merkle 树：<\/strong><\/p>\n<ul>\n<li>\n<p><strong>第 1 步：<\/strong> 把键空间划分到各个存储桶（bucket）中。<\/p>\n<p><img src=\"06. Key-Value Store/images/key-bucket.png\"   alt=\"键存储桶\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>第 2 步：<\/strong> 使用均匀哈希对存储桶中的每个键求哈希。<\/p>\n<p><img src=\"06. Key-Value Store/images/hash-key-bucket.png\"   alt=\"键存储桶哈希\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>第 3 步：<\/strong> 为每个存储桶生成一个单一哈希。<\/p>\n<p><img src=\"06. Key-Value Store/images/hash-bucket.png\"   alt=\"存储桶哈希\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>第 4 步：<\/strong> 把各存储桶的哈希组合起来，计算更高层的哈希，最终得到根哈希。<\/p>\n<p><img src=\"06. Key-Value Store/images/merkel-tree.png\"   alt=\"Merkle 树\" width=\"500\"><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>同步：<\/strong><\/p>\n<ul>\n<li>要同步两个副本：<ul>\n<li>比较它们的根哈希。<\/li>\n<li>如果根哈希一致，说明两个副本是一致的。<\/li>\n<li>如果根哈希不一致，则递归比较子哈希，找出不一致的存储桶。<\/li>\n<\/ul>\n<\/li>\n<li>只同步不一致的数据。<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<li>\n<p>优点<\/p>\n<ul>\n<li><strong>高效：<\/strong> 只同步不一致的数据，减少数据传输。<\/li>\n<li><strong>可扩展：<\/strong> 对大型数据集同样有效，同步开销极小。<\/li>\n<li><strong>可靠：<\/strong> 确保各副本之间的数据一致性。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>6. 处理数据中心故障<\/h3>\n<ul>\n<li>把数据复制到多个数据中心，以确保故障期间仍可用。<\/li>\n<\/ul>\n<hr />\n<h2>写路径与读路径<\/h2>\n<h3>1. 写路径（基于 Cassandra 架构）<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"06. Key-Value Store/images/write-path.png\"   alt=\"写路径\" width=\"500\">\n<\/div>\n\n<ul>\n<li>把写入持久化到<strong>提交日志（commit log）<\/strong>中。<\/li>\n<li>把数据保存到<strong>内存缓存<\/strong>中。<\/li>\n<li>当缓存写满时，把数据刷写到磁盘上的 <strong>SSTable<\/strong>（有序字符串表，Sorted String Table）。<\/li>\n<\/ul>\n<h3>2. 读路径<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"06. Key-Value Store/images/read-path.png\"   alt=\"读路径\" width=\"500\">\n    <img src=\"06. Key-Value Store/images/read-path-without-cache.png\"   alt=\"无缓存读路径\" width=\"500\">\n<\/div>\n\n<ul>\n<li>先在<strong>内存缓存<\/strong>中查找数据。<\/li>\n<li>如果没有命中，则使用<strong>布隆过滤器（Bloom Filter）<\/strong>在 SSTable 中定位数据。<\/li>\n<li>取出并返回数据。<\/li>\n<\/ul>\n<hr />\n<h2>最终架构<\/h2>\n<p align=\"center\">\n<img src=\"06. Key-Value Store/images/final-architecture.png\"   alt=\"最终架构\" width=\"500\">\n<\/p>\n\n<ul>\n<li>客户端通过简单的 API 与键值存储通信：get(key) 和 put(key, value)。<\/li>\n<li>协调节点（coordinator）是一个在客户端与键值存储之间充当代理的节点。<\/li>\n<li>节点使用一致性哈希分布在一个环上。<\/li>\n<li>系统完全去中心化，因此节点的添加与移动可以自动完成。<\/li>\n<li>数据在多个节点上都有副本。<\/li>\n<li>由于每个节点承担相同的职责集合，因此不存在单点故障。<\/li>\n<\/ul>", "enTitle": "Chapter 6: Design a Key-Value Store", "zhTitle": "第 6 章：设计键值存储", "short": "Key-Value Store", "num": "06"}, "07. Unique-Id Generator": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter addresses the challenge of designing a <strong>unique ID generator<\/strong> for distributed systems. Traditional auto-increment keys are unsuitable in distributed environments due to scalability and synchronization challenges. The focus is on creating unique, sortable, 64-bit numerical IDs that meet the following requirements:\n- IDs must be <strong>unique<\/strong> and <strong>ordered by date<\/strong>.\n- IDs must fit within <strong>64 bits<\/strong>.\n- The system should generate <strong>over 10,000 IDs per second<\/strong>.<\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Basic Requirements<\/h3>\n<ul>\n<li>IDs must be unique and numerical and should fit in 64 bits.<\/li>\n<li>IDs increment with time but not strictly by <code>+1<\/code>.<\/li>\n<li>IDs should be sortable by date.<\/li>\n<li>System must handle high throughput (10,000 IDs/sec).<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: High-Level Design Options<\/h2>\n<h3>1. Multi-Master Replication<\/h3>\n<ul>\n<li>\n<p><strong>Approach:<\/strong> Use database <code>auto_increment<\/code> with step increments (e.g., <code>+k<\/code> for k servers).<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/multi-master.png\"  alt=\"Multi Master\" width=\"400\">\n<\/p><\/p>\n<\/li>\n<li>\n<p><strong>Drawbacks:<\/strong><\/p>\n<\/li>\n<li>Hard to scale across data centers.<\/li>\n<li>IDs do not always increase with time.<\/li>\n<li>Scaling issues when servers are added/removed.<\/li>\n<\/ul>\n<h3>2. UUID (Universally Unique Identifier)<\/h3>\n<ul>\n<li>\n<p><strong>Approach:<\/strong> <\/p>\n<ul>\n<li>Generate 128-bit unique identifiers independently on each server using UUID.<\/li>\n<li>\n<p>UUIDs can be generated independently without coordination between servers<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/uuid.png\"  alt=\"UUID generator\" width=\"600\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Advantages:<\/strong><\/p>\n<\/li>\n<li>No coordination needed between servers.<\/li>\n<li>Scales easily with web servers.<\/li>\n<li><strong>Drawbacks:<\/strong><\/li>\n<li>Exceeds 64-bit requirement.<\/li>\n<li>IDs are not sortable by time and may be non-numeric.<\/li>\n<\/ul>\n<h3>3. Ticket Server<\/h3>\n<ul>\n<li>\n<p><strong>Approach:<\/strong> Use a centralized database server to increment and assign IDs.<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/ticket-server.png\"  alt=\"UUID generator\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<li>\n<p><strong>Advantages:<\/strong><\/p>\n<\/li>\n<li>Simple to implement for small-scale systems.<\/li>\n<li>Generates numeric IDs.<\/li>\n<li><strong>Drawbacks:<\/strong><\/li>\n<li>Single point of failure.<\/li>\n<li>Synchronization challenges in multi-server setups.<\/li>\n<\/ul>\n<h3>4. Twitter Snowflake Approach<\/h3>\n<ul>\n<li>\n<p><strong>Approach:<\/strong> <\/p>\n<p><div style=\"margin-left:3rem\">\n  <img src=\"07. Unique-Id Generator/images/twitter-snowflake.png\"  alt=\"Snowflake approach\" width=\"500\">\n<\/div>\n<div style=\"margin-left:3rem\">\n  <img src=\"07. Unique-Id Generator/images/snowflake-id-breakdown.png\"  alt=\"Snowflake ID breakdow\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>Divide IDs into sections to ensure uniqueness and scalability.<\/li>\n<li><strong>Sign Bit (1 bit):<\/strong> Always <code>0<\/code>, potentially distinguishing signed and unsigned numbers.<\/li>\n<li><strong>Timestamp (41 bits):<\/strong> Milliseconds since a custom epoch (Twitter's default is <code>1288834974657<\/code>, equivalent to Nov 04, 2010, 01:42:54 UTC). Ensures IDs are time-ordered.<\/li>\n<li><strong>Datacenter ID (5 bits):<\/strong> Identifies up to <code>2^5 = 32<\/code> datacenters.<\/li>\n<li><strong>Machine ID (5 bits):<\/strong> Identifies up to <code>2^5 = 32<\/code> machines within each datacenter.<\/li>\n<li><strong>Sequence Number (12 bits):<\/strong> Tracks IDs generated on a machine within the same millisecond, supporting up to <code>2^12 = 4096<\/code> IDs per millisecond. The sequence resets to <code>0<\/code> every millisecond.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Advantages:<\/strong><\/p>\n<ul>\n<li><strong>Scalability:<\/strong> Handles 10,000+ IDs per second across multiple servers.<\/li>\n<li><strong>Time-Order:<\/strong> Ensures IDs are sortable by time.<\/li>\n<li><strong>Decentralization:<\/strong> No single point of failure.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Step 4: Additional Considerations<\/h2>\n<h3>1. Clock Synchronization<\/h3>\n<ul>\n<li><strong>Challenge:<\/strong> ID generation assumes synchronized clocks across servers.<\/li>\n<li><strong>Solution:<\/strong> Use <strong>Network Time Protocol (NTP)<\/strong> to minimize drift.<\/li>\n<\/ul>\n<h3>2. Section Length Tuning<\/h3>\n<ul>\n<li>Adjust section sizes (e.g., fewer sequence bits, more timestamp bits) based on use case.<\/li>\n<\/ul>\n<h3>3. High Availability<\/h3>\n<ul>\n<li>ID generators are mission-critical and must be fault-tolerant.<\/li>\n<li>Consider redundancy and failover mechanisms.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>本章讨论为分布式系统设计<strong>唯一 ID 生成器（unique ID generator）<\/strong>这一挑战。传统的自增主键在分布式环境中并不适用，因为会遇到可扩展性与同步方面的难题。我们的重点是创建唯一、可排序的 64 位数字 ID，并满足以下要求：\n- ID 必须<strong>唯一<\/strong>，并且<strong>按日期排序<\/strong>。\n- ID 必须能容纳在 <strong>64 位<\/strong>以内。\n- 系统每秒应能生成<strong>超过 10,000 个 ID<\/strong>。<\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>基本需求<\/h3>\n<ul>\n<li>ID 必须唯一、是数字，并且能容纳在 64 位以内。<\/li>\n<li>ID 随时间递增，但并不严格按 <code>+1<\/code> 递增。<\/li>\n<li>ID 应能按日期排序。<\/li>\n<li>系统必须处理高吞吐量（10,000 个 ID/秒）。<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：高层设计方案<\/h2>\n<h3>1. 多主复制<\/h3>\n<ul>\n<li>\n<p><strong>方案：<\/strong> 使用数据库的 <code>auto_increment<\/code>，按步长递增（例如 k 台服务器各取 <code>+k<\/code> 的步长）。<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/multi-master.png\"  alt=\"多主复制\" width=\"400\">\n<\/p><\/p>\n<\/li>\n<li>\n<p><strong>缺点：<\/strong><\/p>\n<\/li>\n<li>难以跨数据中心扩展。<\/li>\n<li>ID 并不总是随时间增大。<\/li>\n<li>增加/移除服务器时存在扩展问题。<\/li>\n<\/ul>\n<h3>2. UUID（通用唯一标识符）<\/h3>\n<ul>\n<li>\n<p><strong>方案：<\/strong> <\/p>\n<ul>\n<li>在每台服务器上独立生成 128 位的唯一标识符，使用 UUID。<\/li>\n<li>\n<p>各服务器之间无需协调即可独立生成 UUID。<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/uuid.png\"  alt=\"UUID 生成器\" width=\"600\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>优点：<\/strong><\/p>\n<\/li>\n<li>服务器之间无需协调。<\/li>\n<li>可随 Web 服务器轻松扩展。<\/li>\n<li><strong>缺点：<\/strong><\/li>\n<li>超过 64 位的要求。<\/li>\n<li>ID 不能按时间排序，而且可能不是数字。<\/li>\n<\/ul>\n<h3>3. 票据服务器（Ticket Server）<\/h3>\n<ul>\n<li>\n<p><strong>方案：<\/strong> 使用一台集中式数据库服务器来递增并分配 ID。<\/p>\n<p><p align=\"left\">\n<img src=\"07. Unique-Id Generator/images/ticket-server.png\"  alt=\"票据服务器\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<li>\n<p><strong>优点：<\/strong><\/p>\n<\/li>\n<li>对小规模系统来说实现简单。<\/li>\n<li>生成数字型 ID。<\/li>\n<li><strong>缺点：<\/strong><\/li>\n<li>单点故障。<\/li>\n<li>多服务器部署时存在同步难题。<\/li>\n<\/ul>\n<h3>4. Twitter Snowflake 方案<\/h3>\n<ul>\n<li>\n<p><strong>方案：<\/strong> <\/p>\n<p><div style=\"margin-left:3rem\">\n  <img src=\"07. Unique-Id Generator/images/twitter-snowflake.png\"  alt=\"Snowflake 方案\" width=\"500\">\n<\/div>\n<div style=\"margin-left:3rem\">\n  <img src=\"07. Unique-Id Generator/images/snowflake-id-breakdown.png\"  alt=\"Snowflake ID 结构分解\" width=\"500\">\n<\/div><\/p>\n<ul>\n<li>把 ID 划分为若干段，以保证唯一性与可扩展性。<\/li>\n<li><strong>符号位（1 bit）：<\/strong> 恒为 <code>0<\/code>，可用于区分有符号数与无符号数。<\/li>\n<li><strong>时间戳（41 bits）：<\/strong> 自自定义纪元（epoch）以来的毫秒数（Twitter 默认值为 <code>1288834974657<\/code>，对应 2010 年 11 月 4 日 01:42:54 UTC）。保证 ID 按时间有序。<\/li>\n<li><strong>数据中心 ID（5 bits）：<\/strong> 最多标识 <code>2^5 = 32<\/code> 个数据中心。<\/li>\n<li><strong>机器 ID（5 bits）：<\/strong> 在每个数据中心内最多标识 <code>2^5 = 32<\/code> 台机器。<\/li>\n<li><strong>序列号（12 bits）：<\/strong> 记录同一毫秒内在某台机器上生成的 ID，每毫秒最多支持 <code>2^12 = 4096<\/code> 个 ID。序列号每毫秒重置为 <code>0<\/code>。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>优点：<\/strong><\/p>\n<ul>\n<li><strong>可扩展性：<\/strong> 可在多台服务器上处理每秒 10,000+ 个 ID。<\/li>\n<li><strong>时间有序：<\/strong> 保证 ID 可按时间排序。<\/li>\n<li><strong>去中心化：<\/strong> 不存在单点故障。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>第 4 步：其他考量<\/h2>\n<h3>1. 时钟同步<\/h3>\n<ul>\n<li><strong>挑战：<\/strong> ID 生成假设各服务器之间时钟是同步的。<\/li>\n<li><strong>解决方案：<\/strong> 使用<strong>网络时间协议（NTP, Network Time Protocol）<\/strong>来最小化时钟漂移。<\/li>\n<\/ul>\n<h3>2. 各段长度调整<\/h3>\n<ul>\n<li>根据使用场景调整各段大小（例如减少序列号位数、增加时间戳位数）。<\/li>\n<\/ul>\n<h3>3. 高可用性<\/h3>\n<ul>\n<li>ID 生成器是关键任务组件，必须具备容错能力。<\/li>\n<li>考虑冗余与故障转移（failover）机制。<\/li>\n<\/ul>", "enTitle": "Chapter 7: Design a Unique ID Generator in Distributed Systems", "zhTitle": "第 7 章：设计分布式唯一 ID 生成器", "short": "Unique-Id Generator", "num": "07"}, "08. URL Shortener": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter discusses the design of a URL shortening service like TinyURL. The system's main goals include <strong>URL shortening<\/strong>, <strong>redirecting<\/strong>, and <strong>high scalability<\/strong> to handle large traffic volumes.<\/p>\n<h3>Requirements<\/h3>\n<ul>\n<li>Shortened URLs must be <strong>unique<\/strong> and as <strong>short as possible<\/strong>.<\/li>\n<li>Handle <strong>100 million URL generations per day<\/strong> with a 10-year support capacity.<\/li>\n<li>Support <strong>efficient read operations<\/strong> with a 10:1 read-to-write ratio.<\/li>\n<li>Store 365 billion records, requiring approximately <strong>365 TB<\/strong> of storage over 10 years.<\/li>\n<\/ul>\n<hr />\n<h2>Step 1: High-Level Design<\/h2>\n<h3>API Endpoints<\/h3>\n<ol>\n<li>\n<p><strong>URL Shortening:<\/strong><br />\n   - Endpoint: <code>POST api/v1/data/shorten<\/code><br />\n   - Parameters: <code>{longUrl: longURLString}<\/code><br />\n   - Returns: <code>shortURL<\/code><\/p>\n<\/li>\n<li>\n<p><strong>URL Redirecting:<\/strong><br />\n   - Endpoint: <code>GET api/v1/shortUrl<\/code><br />\n   - Returns: <code>longURL<\/code> for redirection.<\/p>\n<p><p align=\"center\">\n<img src=\"08. URL Shortener/images/url-redirection.png\" alt=\"URL Redirection\" width=\"600\">\n<\/p><\/p>\n<\/li>\n<\/ol>\n<h3>URL Redirection<\/h3>\n<ul>\n<li><strong>301 Redirect:<\/strong>  A 301 redirect shows that the requested URL is “permanently” moved to the long URL. The browser caches the response, and\nsubsequent requests for the same URL will not be sent to the URL shortening service.<\/li>\n<li><strong>302 Redirect:<\/strong> Temporary; useful for analytics like tracking clicks.<\/li>\n<\/ul>\n<h3>URL Shortening<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-shortening.png\" alt=\"URL Shortening\" width=\"400\">\n<\/p>\n\n<ul>\n<li>Use a <strong>hash function<\/strong> to generate a short URL, mapping long URLs to unique shortened versions.<\/li>\n<li>The hash function must satisfy the following requirements:<ul>\n<li>Each longURL must be hashed to one hashValue.<\/li>\n<li>Each hashValue can be mapped back to the longURL.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: Deep Dive into Design<\/h2>\n<h3>Data Model<\/h3>\n<p>Store <code>&lt;shortURL, longURL&gt;<\/code> mappings in a relational database to optimize memory usage. The table schema includes:\n- <code>id<\/code> (primary key),\n- <code>shortURL<\/code>,\n- <code>longURL<\/code>.<\/p>\n<pre><code>&lt;img src=\"08. URL Shortener/images/table-schema.png\" alt=\"Table Schema\" width=\"300\"&gt;\n<\/code><\/pre>\n<h3>Hash Function<\/h3>\n<h4>1. Base 62 Conversion:<\/h4>\n<ul>\n<li>Encodes numbers using characters <code>[0-9, a-z, A-Z]<\/code>, providing <strong>62 possible characters<\/strong>.<\/li>\n<li>Base conversion is another approach commonly used for URL shorteners. <\/li>\n<li>A unique id can be assigned to the short url and ID can be base 62 converted to get the short URL.<\/li>\n<li>A 7-character hash supports up to <strong>3.5 trillion unique URLs<\/strong>, enough for 365 billion URLs.<\/li>\n<\/ul>\n<p><strong>Example:<\/strong><br />\nConvert ID <code>2009215674938<\/code> to Base 62:\n- <code>2009215674938<\/code> → <code>zn9edcu<\/code>.<\/p>\n<h4>2. Hash + Collision Resolution:<\/h4>\n<ul>\n<li>\n<p>Use hash functions like CRC32, MD5, or SHA-1.<\/p>\n<p><img src=\"08. URL Shortener/images/hash-function.png\" alt=\"Hash Function\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p>One approach is to collect the first 7 characters of a hash value; however, this method can lead to hash collisions.<\/p>\n<\/li>\n<li>To resolve collisions,recursively append a new predefined string until no more collision but this can be expensive.<\/li>\n<li>\n<p>Resolve collisions with <strong>Bloom Filters<\/strong> for efficient lookup.<\/p>\n<p><p align=\"center\">\n<img src=\"08. URL Shortener/images/url-lookup.png\" alt=\"URL Lookup\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<h3>Comparison<\/h3>\n<ul>\n<li>\n<p><strong>Hash + Collision Resolution:<\/strong><\/p>\n<ul>\n<li>Fixed short URL length<\/li>\n<li>Does not need a unique ID generator<\/li>\n<li>Collision is possbile and needs resolution<\/li>\n<li>Not possible to find the next available short URL because it does not depend on ID<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Base 62 Conversion<\/strong><\/p>\n<ul>\n<li>The length is not fixed and goes up with ID<\/li>\n<li>It needs a unique ID generator<\/li>\n<li>Collision is not possbile<\/li>\n<li>Easy to find the next short URL if ID increments by 1 (Can be a security concern)<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>URL Shortening Flow<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-shortening-flow.png\" alt=\"URL Shortening\" width=\"500\">\n<\/p>\n\n<ol>\n<li>Check if <code>longURL<\/code> exists in the database.<\/li>\n<li>If found, return the existing <code>shortURL<\/code>.<\/li>\n<li>Otherwise:\n   - Generate a unique ID using a <strong>distributed ID generator<\/strong>.\n   - Convert the ID to <code>shortURL<\/code> using Base 62.\n   - Store the <code>&lt;id, shortURL, longURL&gt;<\/code> mapping in the database.<\/li>\n<\/ol>\n<hr />\n<h3>URL Redirecting Flow<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-redirecting-flow.png\" alt=\"URL Shortening\" width=\"600\">\n<\/p>\n\n<ol>\n<li>User clicks a <code>shortURL<\/code>.<\/li>\n<li>Query <code>&lt;shortURL, longURL&gt;<\/code> mapping:\n   - Check the <strong>cache<\/strong> first for faster access.\n   - If not in the cache, query the database.<\/li>\n<li>Redirect the user to <code>longURL<\/code>.<\/li>\n<\/ol>\n<hr />\n<h2>Additional Considerations<\/h2>\n<h3>Rate Limiter<\/h3>\n<ul>\n<li>Prevent abuse by setting limits on requests per IP.<\/li>\n<\/ul>\n<h3>Scalability<\/h3>\n<ol>\n<li><strong>Web Tier:<\/strong> Stateless, scalable by adding/removing web servers.<\/li>\n<li><strong>Database Tier:<\/strong> Use replication and sharding.<\/li>\n<\/ol>\n<h3>Analytics<\/h3>\n<ul>\n<li>Collect data like click rates, source, and timestamps for business insights.<\/li>\n<\/ul>\n<h3>High Availability and Reliability<\/h3>\n<ul>\n<li>Ensure consistent and reliable services using database replication and fault-tolerant design.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>本章讨论如何设计一个像 TinyURL 这样的 URL 缩短服务。系统的主要目标包括 <strong>URL 缩短<\/strong>、<strong>重定向<\/strong>以及<strong>高可扩展性<\/strong>，以承载巨大的流量。<\/p>\n<h3>需求<\/h3>\n<ul>\n<li>缩短后的 URL 必须<strong>唯一<\/strong>，并且尽可能<strong>短<\/strong>。<\/li>\n<li>每天处理 <strong>1 亿次 URL 生成<\/strong>，支持容量按 10 年规划。<\/li>\n<li>支持<strong>高效的读操作<\/strong>，读写比为 10:1。<\/li>\n<li>存储 3650 亿条记录，10 年下来约需要 <strong>365 TB<\/strong> 存储。<\/li>\n<\/ul>\n<hr />\n<h2>第 1 步：高层设计<\/h2>\n<h3>API 端点<\/h3>\n<ol>\n<li>\n<p><strong>URL 缩短：<\/strong><br />\n   - 端点：<code>POST api/v1/data/shorten<\/code><br />\n   - 参数：<code>{longUrl: longURLString}<\/code><br />\n   - 返回：<code>shortURL<\/code><\/p>\n<\/li>\n<li>\n<p><strong>URL 重定向：<\/strong><br />\n   - 端点：<code>GET api/v1/shortUrl<\/code><br />\n   - 返回：用于重定向的 <code>longURL<\/code>。<\/p>\n<p><p align=\"center\">\n<img src=\"08. URL Shortener/images/url-redirection.png\" alt=\"URL 重定向\" width=\"600\">\n<\/p><\/p>\n<\/li>\n<\/ol>\n<h3>URL 重定向<\/h3>\n<ul>\n<li><strong>301 重定向：<\/strong> 301 重定向表示所请求的 URL 被「永久」移动到了长 URL。浏览器会缓存该响应，后续对同一 URL 的请求将不再发送到 URL 缩短服务。<\/li>\n<li><strong>302 重定向：<\/strong> 临时的；便于做点击统计等分析。<\/li>\n<\/ul>\n<h3>URL 缩短<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-shortening.png\" alt=\"URL 缩短\" width=\"400\">\n<\/p>\n\n<ul>\n<li>使用<strong>哈希函数<\/strong>生成短 URL，把长 URL 映射为唯一的缩短版本。<\/li>\n<li>哈希函数必须满足以下要求：<ul>\n<li>每个 longURL 必须被哈希为一个 hashValue。<\/li>\n<li>每个 hashValue 都能映射回对应的 longURL。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：深入设计<\/h2>\n<h3>数据模型<\/h3>\n<p>把 <code>&lt;shortURL, longURL&gt;<\/code> 映射存储在关系型数据库中，以优化内存使用。表结构包含：\n- <code>id<\/code>（主键 primary key），\n- <code>shortURL<\/code>，\n- <code>longURL<\/code>。<\/p>\n<pre><code>&lt;img src=\"08. URL Shortener/images/table-schema.png\" alt=\"表结构\" width=\"300\"&gt;\n<\/code><\/pre>\n<h3>哈希函数<\/h3>\n<h4>1. Base 62 转换：<\/h4>\n<ul>\n<li>使用字符 <code>[0-9, a-z, A-Z]<\/code> 对数字编码，共提供 <strong>62 个可用字符<\/strong>。<\/li>\n<li>进制转换是 URL 缩短服务常用的另一种方法。<\/li>\n<li>可以为短 URL 分配一个唯一 ID，再把该 ID 做 Base 62 转换，得到短 URL。<\/li>\n<li>7 个字符的哈希最多支持 <strong>3.5 万亿个唯一 URL<\/strong>，足够应对 3650 亿个 URL。<\/li>\n<\/ul>\n<p><strong>示例：<\/strong><br />\n把 ID <code>2009215674938<\/code> 转换为 Base 62：\n- <code>2009215674938<\/code> → <code>zn9edcu<\/code>。<\/p>\n<h4>2. 哈希 + 冲突解决：<\/h4>\n<ul>\n<li>\n<p>使用 CRC32、MD5 或 SHA-1 等哈希函数。<\/p>\n<p><img src=\"08. URL Shortener/images/hash-function.png\" alt=\"哈希函数\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p>一种做法是取哈希值的前 7 个字符；然而这种方法可能导致哈希冲突。<\/p>\n<\/li>\n<li>为解决冲突，可以递归地追加一个新的预定义字符串，直到不再冲突，但这样做代价可能很高。<\/li>\n<li>\n<p>使用<strong>布隆过滤器（Bloom Filter）<\/strong>解决冲突，以实现高效查找。<\/p>\n<p><p align=\"center\">\n<img src=\"08. URL Shortener/images/url-lookup.png\" alt=\"URL 查找\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<h3>两种方案对比<\/h3>\n<ul>\n<li>\n<p><strong>哈希 + 冲突解决：<\/strong><\/p>\n<ul>\n<li>短 URL 长度固定<\/li>\n<li>不需要唯一 ID 生成器<\/li>\n<li>可能发生冲突，需要解决<\/li>\n<li>无法找到下一个可用的短 URL，因为它不依赖 ID<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Base 62 转换<\/strong><\/p>\n<ul>\n<li>长度不固定，会随 ID 增大而变长<\/li>\n<li>需要唯一 ID 生成器<\/li>\n<li>不会发生冲突<\/li>\n<li>如果 ID 按 1 递增，很容易推算出下一个短 URL（这可能是一个安全隐患）<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>URL 缩短流程<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-shortening-flow.png\" alt=\"URL 缩短流程\" width=\"500\">\n<\/p>\n\n<ol>\n<li>检查 <code>longURL<\/code> 是否已存在于数据库中。<\/li>\n<li>如果已存在，返回已有的 <code>shortURL<\/code>。<\/li>\n<li>否则：\n   - 使用<strong>分布式 ID 生成器<\/strong>生成唯一 ID。\n   - 用 Base 62 把 ID 转换为 <code>shortURL<\/code>。\n   - 把 <code>&lt;id, shortURL, longURL&gt;<\/code> 映射存入数据库。<\/li>\n<\/ol>\n<hr />\n<h3>URL 重定向流程<\/h3>\n<p align=\"center\">\n    <img src=\"08. URL Shortener/images/url-redirecting-flow.png\" alt=\"URL 重定向流程\" width=\"600\">\n<\/p>\n\n<ol>\n<li>用户点击某个 <code>shortURL<\/code>。<\/li>\n<li>查询 <code>&lt;shortURL, longURL&gt;<\/code> 映射：\n   - 先查<strong>缓存<\/strong>，以获得更快的访问。\n   - 如果缓存未命中，再查询数据库。<\/li>\n<li>把用户重定向到 <code>longURL<\/code>。<\/li>\n<\/ol>\n<hr />\n<h2>其他考量<\/h2>\n<h3>限流器<\/h3>\n<ul>\n<li>通过限制每个 IP 的请求数来防止滥用。<\/li>\n<\/ul>\n<h3>可扩展性<\/h3>\n<ol>\n<li><strong>Web 层：<\/strong> 无状态，可通过增减 Web 服务器来扩展。<\/li>\n<li><strong>数据库层：<\/strong> 使用复制与分片。<\/li>\n<\/ol>\n<h3>数据分析<\/h3>\n<ul>\n<li>收集点击率、来源、时间戳等数据，用于业务洞察。<\/li>\n<\/ul>\n<h3>高可用性与可靠性<\/h3>\n<ul>\n<li>通过数据库复制与容错设计，确保服务一致、可靠。<\/li>\n<\/ul>", "enTitle": "Chapter 8: Design a URL Shortener", "zhTitle": "第 8 章：设计 URL 缩短服务", "short": "URL Shortener", "num": "08"}, "09. Web Crawler": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>web crawler<\/strong>, also known as a spider or robot, is used to discover and collect web content, such as web pages, images, and videos. This chapter focuses on designing a scalable web crawler for <strong>search engine indexing<\/strong>.<\/p>\n<h3>Applications of Web Crawlers<\/h3>\n<ol>\n<li><strong>Search Engine Indexing:<\/strong> Collect web pages to create searchable indexes (e.g., Googlebot).<\/li>\n<li><strong>Web Archiving:<\/strong> Preserve web data for future use (e.g., US Library of Congress).<\/li>\n<li><strong>Web Mining:<\/strong> Extract knowledge from web data (e.g., financial analysis of shareholder reports).<\/li>\n<li><strong>Web Monitoring:<\/strong> Detect copyright or trademark infringements.<\/li>\n<\/ol>\n<h3>Design Challenges<\/h3>\n<p>A good web crawler must address:\n- <strong>Scalability:<\/strong> Handle billions of pages using parallelization.\n- <strong>Robustness:<\/strong> Manage bad HTML, crashes, and malicious links.\n- <strong>Politeness:<\/strong> Avoid overwhelming servers with too many requests.\n- <strong>Extensibility:<\/strong> Support new content types with minimal changes.<\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Requirements<\/h3>\n<ol>\n<li>Crawl <strong>1 billion web pages per month<\/strong> (400 pages/second, peak 800 QPS).<\/li>\n<li>Collect <strong>HTML-only content<\/strong>.<\/li>\n<li>Track new and updated pages.<\/li>\n<li>Ignore duplicate content.<\/li>\n<li>Store crawled data for <strong>5 years<\/strong>, requiring ~30 PB of storage.<\/li>\n<\/ol>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Components<\/h3>\n<p align=\"center\">\n<img src=\"09. Web Crawler/images/web-crawler-architecture.png\" alt=\"Web Crawler Architecture\" width=\"700\">\n<\/p>\n\n<ol>\n<li>\n<p><strong>Seed URLs:<\/strong> Starting points for the crawler.<\/p>\n<ul>\n<li>Need to selective as a good starting point that a crawler can utilize to traverse as many links as possible.<\/li>\n<li>Can be based on locality based on different popular website or based on topics.<\/li>\n<li>Strategies: Categorize by locality or topic (e.g., sports, healthcare).<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>URL Frontier:<\/strong> Stores URLs to be downloaded.\n   - Implemented as a <strong>FIFO queue<\/strong>.<\/p>\n<\/li>\n<li>\n<p><strong>HTML Downloader:<\/strong> Downloads web pages from URLs provided by the URL Frontier.<\/p>\n<\/li>\n<li>\n<p><strong>DNS Resolver:<\/strong> Converts URLs to IP addresses.<\/p>\n<\/li>\n<li>\n<p><strong>Content Parser:<\/strong> Validates and parses web pages.\n   - Discards malformed pages.<\/p>\n<\/li>\n<li>\n<p><strong>Content Seen?:<\/strong> Checks for duplicate content using hash comparisons (compare the hash values of the two web pages).<\/p>\n<\/li>\n<li>\n<p><strong>Content Storage:<\/strong> Stores HTML pages on disk (popular content in memory to reduce latency).<\/p>\n<\/li>\n<li>\n<p><strong>URL Extractor:<\/strong> Extracts new links from parsed pages.<\/p>\n<\/li>\n<li>\n<p><strong>URL Filter:<\/strong> Excludes blacklisted or erroneous URLs.<\/p>\n<\/li>\n<li>\n<p><strong>URL Seen?<\/strong> Tracks visited URLs to avoid duplication.<\/p>\n<\/li>\n<li>\n<p><strong>URL Storage:<\/strong> Stores already visited URLs.<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h3>Workflow<\/h3>\n<ol>\n<li>Add <strong>Seed URLs<\/strong> to the URL Frontier.<\/li>\n<li><strong>HTML Downloader<\/strong> fetches URLs and resolves their IPs via the DNS Resolver.<\/li>\n<li><strong>Content Parser<\/strong> validates and passes content to the \"Content Seen?\" component.<\/li>\n<li>If the content is new, extract links via the <strong>URL Extractor<\/strong>.<\/li>\n<li>Filter and add unique links to the URL Frontier.<\/li>\n<\/ol>\n<hr />\n<h2>Step 3: Deep Dive into Key Components<\/h2>\n<h3>DFS/BFS<\/h3>\n<ul>\n<li>The web can be though of as a directed graph where web pages are nodes and hyperlinks (URLs) as edges.<\/li>\n<li>BFS is usually used for graph traversal as the depth can be be very deep thus DFS is not ideal.<\/li>\n<li>Standard BFS does not take the priority of a URL into consideration, not every page has the same level of quality and importance.<\/li>\n<\/ul>\n<h3>URL Frontier<\/h3>\n<ul>\n<li>\n<p><strong>Politeness:<\/strong> <\/p>\n<ul>\n<li>Ensure only one request per host at a time. Add a dealy b/w two download tasks.<\/li>\n<li>Use a mapping from hostnames to queues and worker (download) threads.<\/li>\n<li>\n<p>Each downloader thread has a separate FIFO queue and only downloads URLs from that queue.<\/p>\n<p><img src=\"09. Web Crawler/images/politeness.png\" alt=\"Politeness\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Queue router:<\/strong> Ensures that each queue (b1, b2, … bn) only contains URLs from the same host.<\/p>\n<\/li>\n<li><strong>Mapping table:<\/strong> It maps each host to a queue.<\/li>\n<li><strong>Queue selector:<\/strong> Each worker thread is mapped to a FIFO queue, and it only downloads URLs from that queue. The queue selection logic is done by the Queue selector.<\/li>\n<li><strong>Worker thread 1 to N.<\/strong> A worker thread downloads web pages sequentially from the same host. A delay can be added between two download tasks.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Priority:<\/strong> <\/p>\n<ul>\n<li>\n<p>Assign higher priority to important pages (e.g., by PageRank or update frequency).<\/p>\n<p><img src=\"09. Web Crawler/images/prioritizer.png\" alt=\"Politeness\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Prioritizer:<\/strong> It takes URLs as input and computes the priorities.<\/p>\n<\/li>\n<li><strong>Queue f1 to fn:<\/strong> Each queue has an assigned priority. Queues with high priority are selected with higher probability.<\/li>\n<li><strong>Queue selector:<\/strong> Randomly choose a queue with a bias towards queues with higher priority.<\/li>\n<li><strong>Front queues:<\/strong> manage prioritization<\/li>\n<li><strong>Back queues:<\/strong> manage politeness<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Freshness:<\/strong> Recrawl based on update history or importance.<\/p>\n<\/li>\n<\/ul>\n<h3>HTML Downloader<\/h3>\n<ul>\n<li><strong>Robots.txt Compliance:<\/strong> Respect rules in robots.txt files.<\/li>\n<li><strong>Performance Optimizations:<\/strong>\n  1. Distributed crawling using multiple servers.\n  2. Use a <strong>DNS cache<\/strong> to avoid repeated lookups.\n  3. Geographically distribute crawl servers for faster downloads.\n  4. Use a short timeout to avoid slow or unresponsive servers.<\/li>\n<\/ul>\n<h3>Robustness<\/h3>\n<ol>\n<li><strong>Consistent Hashing:<\/strong> Distribute load among servers effectively.<\/li>\n<li><strong>Error Handling:<\/strong> Prevent system crashes from exceptions.<\/li>\n<li><strong>Data Validation:<\/strong> Ensure content integrity.<\/li>\n<\/ol>\n<h3>Extensibility<\/h3>\n<ul>\n<li>Add modules for new content types (e.g., PNG downloader, web monitor).<\/li>\n<li>\n<p>Example: Plug in a module to monitor web content for copyright violations.<\/p>\n<h2><img src=\"09. Web Crawler/images/extensibility.png\" alt=\"Politeness\" width=\"600\"><\/h2>\n<\/li>\n<\/ul>\n<h3>Avoiding Problematic Content<\/h3>\n<ol>\n<li><strong>Duplicate Content:<\/strong> Detect using hash comparisons.<\/li>\n<li><strong>Spider Traps:<\/strong> Avoid infinite loops with techniques like URL length limits.<\/li>\n<li><strong>Data Noise:<\/strong> Filter irrelevant content like ads or spam.<\/li>\n<\/ol>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<h3>Key Takeaways<\/h3>\n<ol>\n<li>Web crawlers must balance scalability, robustness, politeness, and extensibility.<\/li>\n<li><strong>Politeness<\/strong> prevents overloading servers, while <strong>priority<\/strong> ensures important pages are crawled first.<\/li>\n<li>Efficient storage and error handling are crucial for handling large-scale crawling.<\/li>\n<\/ol>\n<h3>Additional Considerations<\/h3>\n<ul>\n<li><strong>Server-Side Rendering:<\/strong> Handle dynamic content generated by JavaScript or AJAX.<\/li>\n<li><strong>Anti-Spam Measures:<\/strong> Exclude low-quality or irrelevant pages.<\/li>\n<li><strong>Database Sharding:<\/strong> Scale the data layer using replication and sharding.<\/li>\n<li><strong>Horizontal Scaling:<\/strong> Use stateless servers to scale crawl jobs efficiently.<\/li>\n<li><strong>Analytics:<\/strong> Collect and analyze data for insights.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p><strong>网络爬虫（web crawler）<\/strong>，也称蜘蛛（spider）或机器人（robot），用于发现并采集网页、图片、视频等网络内容。本章聚焦于为<strong>搜索引擎索引<\/strong>设计一个可扩展的网络爬虫。<\/p>\n<h3>网络爬虫的应用<\/h3>\n<ol>\n<li><strong>搜索引擎索引：<\/strong> 采集网页以创建可搜索的索引（例如 Googlebot）。<\/li>\n<li><strong>网页存档：<\/strong> 为将来使用而保存网络数据（例如美国国会图书馆）。<\/li>\n<li><strong>网络挖掘：<\/strong> 从网络数据中提取知识（例如对股东报告做财务分析）。<\/li>\n<li><strong>网络监控：<\/strong> 检测版权或商标侵权。<\/li>\n<\/ol>\n<h3>设计挑战<\/h3>\n<p>一个好的网络爬虫必须解决以下问题：\n- <strong>可扩展性：<\/strong> 通过并行化处理数十亿个页面。\n- <strong>健壮性：<\/strong> 应对糟糕的 HTML、崩溃和恶意链接。\n- <strong>友好性（politeness）：<\/strong> 避免因请求过多而压垮服务器。\n- <strong>可扩展性（extensibility）：<\/strong> 以最小改动支持新的内容类型。<\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>需求<\/h3>\n<ol>\n<li>每月爬取 <strong>10 亿个网页<\/strong>（400 页/秒，峰值 800 QPS）。<\/li>\n<li>只采集<strong>纯 HTML 内容<\/strong>。<\/li>\n<li>跟踪新增与更新的页面。<\/li>\n<li>忽略重复内容。<\/li>\n<li>爬取的数据保留 <strong>5 年<\/strong>，约需 30 PB 存储。<\/li>\n<\/ol>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>组件<\/h3>\n<p align=\"center\">\n<img src=\"09. Web Crawler/images/web-crawler-architecture.png\" alt=\"网络爬虫架构\" width=\"700\">\n<\/p>\n\n<ol>\n<li>\n<p><strong>种子 URL（Seed URLs）：<\/strong> 爬虫的起始入口。<\/p>\n<ul>\n<li>需要精选出一个好的起点，使爬虫能够借此遍历尽可能多的链接。<\/li>\n<li>可以基于不同热门网站的地域分布，或基于主题来选取。<\/li>\n<li>策略：按地域或主题分类（例如体育、医疗）。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>URL 队列（URL Frontier）：<\/strong> 存放待下载的 URL。\n   - 以 <strong>FIFO 队列<\/strong>的形式实现。<\/p>\n<\/li>\n<li>\n<p><strong>HTML 下载器（HTML Downloader）：<\/strong> 从 URL 队列提供的 URL 下载网页。<\/p>\n<\/li>\n<li>\n<p><strong>DNS 解析器（DNS Resolver）：<\/strong> 把 URL 转换为 IP 地址。<\/p>\n<\/li>\n<li>\n<p><strong>内容解析器（Content Parser）：<\/strong> 校验并解析网页。\n   - 丢弃格式错误的页面。<\/p>\n<\/li>\n<li>\n<p><strong>内容去重检查（Content Seen?）：<\/strong> 使用哈希比较检查重复内容（比较两个网页的哈希值）。<\/p>\n<\/li>\n<li>\n<p><strong>内容存储（Content Storage）：<\/strong> 把 HTML 页面存到磁盘上（热门内容放在内存中以降低延迟）。<\/p>\n<\/li>\n<li>\n<p><strong>URL 提取器（URL Extractor）：<\/strong> 从解析后的页面中提取新链接。<\/p>\n<\/li>\n<li>\n<p><strong>URL 过滤器（URL Filter）：<\/strong> 排除黑名单或错误的 URL。<\/p>\n<\/li>\n<li>\n<p><strong>URL 去重检查（URL Seen?）：<\/strong> 跟踪已访问过的 URL，避免重复。<\/p>\n<\/li>\n<li>\n<p><strong>URL 存储（URL Storage）：<\/strong> 存放已经访问过的 URL。<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h3>工作流程<\/h3>\n<ol>\n<li>把<strong>种子 URL<\/strong>加入 URL 队列。<\/li>\n<li><strong>HTML 下载器<\/strong>抓取 URL，并通过 DNS 解析器解析其 IP。<\/li>\n<li><strong>内容解析器<\/strong>校验内容，并把内容传给「内容去重检查」组件。<\/li>\n<li>如果内容是新的，则通过 <strong>URL 提取器<\/strong>提取链接。<\/li>\n<li>过滤后把不重复的链接加入 URL 队列。<\/li>\n<\/ol>\n<hr />\n<h2>第 3 步：关键组件深入剖析<\/h2>\n<h3>DFS/BFS<\/h3>\n<ul>\n<li>可以把 Web 看作一张有向图：网页是节点，超链接（URL）是边。<\/li>\n<li>图遍历通常使用 BFS（广度优先搜索），因为深度可能非常深，所以 DFS（深度优先搜索）并不理想。<\/li>\n<li>标准 BFS 不考虑 URL 的优先级，而并非每个页面的质量和重要性都相同。<\/li>\n<\/ul>\n<h3>URL 队列<\/h3>\n<ul>\n<li>\n<p><strong>友好性（Politeness）：<\/strong> <\/p>\n<ul>\n<li>确保同一时间对每个主机只发一个请求。在两次下载任务之间加入延迟。<\/li>\n<li>使用从主机名到队列和工作（下载）线程的映射。<\/li>\n<li>\n<p>每个下载线程有各自独立的 FIFO 队列，并且只从该队列下载 URL。<\/p>\n<p><img src=\"09. Web Crawler/images/politeness.png\" alt=\"友好抓取\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>队列路由器（Queue router）：<\/strong> 确保每个队列（b1, b2, … bn）只包含来自同一主机的 URL。<\/p>\n<\/li>\n<li><strong>映射表（Mapping table）：<\/strong> 它把每个主机映射到一个队列。<\/li>\n<li><strong>队列选择器（Queue selector）：<\/strong> 每个工作线程映射到一个 FIFO 队列，并且只从该队列下载 URL。队列的选择逻辑由队列选择器完成。<\/li>\n<li><strong>工作线程 1 到 N。<\/strong> 一个工作线程按顺序从同一主机下载网页。两次下载任务之间可以加入延迟。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>优先级（Priority）：<\/strong> <\/p>\n<ul>\n<li>\n<p>给重要页面分配更高优先级（例如按 PageRank 或更新频率）。<\/p>\n<p><img src=\"09. Web Crawler/images/prioritizer.png\" alt=\"优先级排序\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>优先级排序器（Prioritizer）：<\/strong> 它以 URL 为输入，计算优先级。<\/p>\n<\/li>\n<li><strong>队列 f1 到 fn：<\/strong> 每个队列都有一个分配好的优先级。高优先级的队列被选中的概率更高。<\/li>\n<li><strong>队列选择器：<\/strong> 有偏向地随机选择队列，优先选择高优先级队列。<\/li>\n<li><strong>前队列（Front queues）：<\/strong> 管理优先级。<\/li>\n<li><strong>后队列（Back queues）：<\/strong> 管理友好性。<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>新鲜度（Freshness）：<\/strong> 根据更新历史或重要性进行重新爬取。<\/p>\n<\/li>\n<\/ul>\n<h3>HTML 下载器<\/h3>\n<ul>\n<li><strong>遵守 robots.txt：<\/strong> 尊重 robots.txt 文件中的规则。<\/li>\n<li><strong>性能优化：<\/strong>\n  1. 使用多台服务器进行分布式爬取。\n  2. 使用 <strong>DNS 缓存<\/strong>，避免重复查询。\n  3. 按地理位置分布爬取服务器，以加快下载速度。\n  4. 使用较短的超时时间，避免被缓慢或无响应的服务器拖住。<\/li>\n<\/ul>\n<h3>健壮性<\/h3>\n<ol>\n<li><strong>一致性哈希：<\/strong> 在服务器之间有效地分发负载。<\/li>\n<li><strong>错误处理：<\/strong> 防止异常导致系统崩溃。<\/li>\n<li><strong>数据校验：<\/strong> 确保内容完整性。<\/li>\n<\/ol>\n<h3>可扩展性<\/h3>\n<ul>\n<li>为新的内容类型添加模块（例如 PNG 下载器、网页监控器）。<\/li>\n<li>\n<p>示例：插入一个模块来监控网页内容是否侵犯版权。<\/p>\n<h2><img src=\"09. Web Crawler/images/extensibility.png\" alt=\"可扩展性\" width=\"600\"><\/h2>\n<\/li>\n<\/ul>\n<h3>规避问题内容<\/h3>\n<ol>\n<li><strong>重复内容：<\/strong> 使用哈希比较来检测。<\/li>\n<li><strong>蜘蛛陷阱（Spider Traps）：<\/strong> 用 URL 长度限制等技术避免无限循环。<\/li>\n<li><strong>数据噪声：<\/strong> 过滤广告或垃圾内容等无关内容。<\/li>\n<\/ol>\n<hr />\n<h2>第 4 步：收尾总结<\/h2>\n<h3>关键要点<\/h3>\n<ol>\n<li>网络爬虫必须在可扩展性、健壮性、友好性与可扩展性之间取得平衡。<\/li>\n<li><strong>友好性<\/strong>防止压垮服务器，而<strong>优先级<\/strong>确保重要页面被优先爬取。<\/li>\n<li>高效的存储与错误处理对于处理大规模爬取至关重要。<\/li>\n<\/ol>\n<h3>其他考量<\/h3>\n<ul>\n<li><strong>服务端渲染：<\/strong> 处理由 JavaScript 或 AJAX 生成的动态内容。<\/li>\n<li><strong>反垃圾措施：<\/strong> 排除低质量或无关页面。<\/li>\n<li><strong>数据库分片：<\/strong> 使用复制与分片扩展数据层。<\/li>\n<li><strong>水平扩展：<\/strong> 使用无状态服务器高效扩展爬取任务。<\/li>\n<li><strong>数据分析：<\/strong> 采集并分析数据，以获取洞察。<\/li>\n<\/ul>", "enTitle": "Chapter 9: Design a Web Crawler", "zhTitle": "第 9 章：设计网络爬虫", "short": "Web Crawler", "num": "09"}, "10. Notification System": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>notification system<\/strong> is essential for modern applications, providing timely updates like product notifications, events, offers, and alerts. Notifications can be sent through:\n1. <strong>Push notifications<\/strong> (mobile or desktop),\n2. <strong>SMS messages<\/strong>, and\n3. <strong>Emails<\/strong>.<\/p>\n<p>The chapter focuses on designing a scalable system capable of sending millions of notifications daily.<\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Requirements<\/h3>\n<ul>\n<li><strong>Notification Types:<\/strong> Push notifications, SMS, and Emails.<\/li>\n<li><strong>Delivery:<\/strong> Soft real-time system with minimal delays.<\/li>\n<li><strong>Platforms:<\/strong> iOS, Android, and desktop.<\/li>\n<li><strong>Triggers:<\/strong> Notifications can be triggered by client applications or scheduled on servers.<\/li>\n<li><strong>Scale:<\/strong><\/li>\n<li><strong>Push Notifications:<\/strong> 10 million/day,<\/li>\n<li><strong>SMS:<\/strong> 1 million/day,<\/li>\n<li><strong>Emails:<\/strong> 5 million/day.<\/li>\n<li><strong>Opt-out Support:<\/strong> Users can disable specific notification types.<\/li>\n<\/ul>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Components<\/h3>\n<ol>\n<li>\n<p><strong>Notification Types:<\/strong>\n   - <strong>iOS Push Notifications:<\/strong> Use <strong>Apple Push Notification Service (APNS)<\/strong>.\n   - <strong>Android Push Notifications:<\/strong> Use <strong>Firebase Cloud Messaging (FCM)<\/strong>.\n   - <strong>SMS Messages:<\/strong> Third-party services like Twilio or Nexmo.\n   - <strong>Emails:<\/strong> Commercial email services like SendGrid or Mailchimp.<\/p>\n<\/li>\n<li>\n<p><strong>Contact Info Gathering:<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/contact-info-gathering.png\" alt=\"Contact Info Gathering\" width=\"500\">\n   <\/div>\n<\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>Collect device tokens, phone numbers, or email addresses during app installation or signup.<\/li>\n<li>Store contact info in the database:<ul>\n<li><strong>Device Tokens Table:<\/strong> For push notifications.<\/li>\n<li><strong>User Table:<\/strong> For emails and phone numbers.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ol start=\"3\">\n<li><strong>Notification Sending Flow:<\/strong><\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/high-level-design.png\" alt=\"High Level Design\" width=\"500\">\n   <\/div>\n\n<ul>\n<li><strong>Trigger Services:<\/strong><ul>\n<li>Generate events to initiate notifications (e.g., billing reminders, shipping updates).<\/li>\n<li>A service can be a micro-service, a cron job, or a distributed system that triggers notification sending events.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Notification Server:<\/strong> <ul>\n<li>Provide APIs for services to send notifications. <\/li>\n<li>Carry out basic validations to verify emails, phone numbers.<\/li>\n<li>Query the database or cache to fetch data needed to render a notification.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Third-Party Services:<\/strong> Deliver notifications to users.<\/li>\n<\/ul>\n<h3>Challenges in Initial Design<\/h3>\n<ul>\n<li><strong>Single Point of Failure (SPOF):<\/strong> One notification server can crash the entire system.<\/li>\n<li><strong>Scalability Issues:<\/strong> Hard to scale databases, caches, and processing components independently.<\/li>\n<li><strong>Performance Bottlenecks:<\/strong> High resource demands for sending notifications.<\/li>\n<\/ul>\n<h3>Improved Design<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/improved-design.png\" alt=\"Improved Design\" width=\"500\">\n   <\/div>\n\n<ul>\n<li>Move databases and caches out of the notification server.<\/li>\n<li>Introduce <strong>horizontal scaling<\/strong> with multiple notification servers.<\/li>\n<li>Use <strong>message queues<\/strong> to decouple system components.<\/li>\n<li>Message queues serve as buffers when high volumes of notifications are to be sent out.<\/li>\n<li>Add workers that pull notification events from message queues and send them to corresponding third party services.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Reliability<\/h3>\n<ol>\n<li><strong>Prevent Data Loss:<\/strong> \n <br />\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/data-loss.png\" alt=\"Data Loss\" width=\"400\">\n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>Persist notification data in a database and implement a retry mechanism. <\/li>\n<li>The Notification log database is included for data persistence.<\/li>\n<\/ul>\n<ol start=\"2\">\n<li><strong>Deduplication:<\/strong> \n   - Check event IDs to avoid sending duplicate notifications.\n   - When a notification event first arrives, check if it is seen before by checking the event ID.\nIf seen before discard it, otherwise send out the notification. <\/li>\n<\/ol>\n<h3>Additional Components<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/events-tracking.png\" alt=\"Events Tracking\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>Notification Templates:<\/strong> Preformatted templates for consistent and efficient notifications.<\/li>\n<li><strong>Notification Settings:<\/strong>\n   - Users can opt-in or opt-out for specific channels (push, SMS, or email).\n   - Stored in a dedicated notification settings table.<\/li>\n<li><strong>Rate Limiting:<\/strong> Cap the frequency of notifications sent to users.<\/li>\n<li><strong>Retry Mechanism:<\/strong> Retry sending notifications if third-party services fail.<\/li>\n<li><strong>Monitoring Queues:<\/strong> Track queued notifications to scale workers dynamically.<\/li>\n<li><strong>Event Tracking:<\/strong> Collect metrics like open rate, click rate, and engagement.<\/li>\n<\/ol>\n<h3>Security<\/h3>\n<ul>\n<li>Use <strong>AppKey<\/strong> and <strong>AppSecret<\/strong> to authenticate and secure APIs for push notifications.<\/li>\n<\/ul>\n<h3>Notification Flow<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/updated-design.png\" alt=\"Updated Design\" width=\"500\">\n   <\/div>\n\n<ol>\n<li>Trigger services call APIs to send notifications.<\/li>\n<li>Notification servers validate requests and fetch metadata from caches or databases.<\/li>\n<li>Notification events are sent to message queues.<\/li>\n<li>Workers process events and interact with third-party services.<\/li>\n<li>Third-party services deliver notifications to users.<\/li>\n<\/ol>\n<hr />\n<h2>Key Optimizations<\/h2>\n<ol>\n<li><strong>Horizontal Scaling:<\/strong> Add more notification servers for load distribution.<\/li>\n<li><strong>Message Queues:<\/strong> Decouple processing to handle high volumes.<\/li>\n<li><strong>Caching:<\/strong> Reduce latency by caching frequently accessed data.<\/li>\n<li><strong>Distributed Crawling:<\/strong> Optimize message delivery geographically for better performance.<\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p><strong>通知系统（notification system）<\/strong> 对现代应用至关重要，它能提供及时的更新，例如商品通知、活动、优惠和提醒。通知可以通过以下方式发送：\n1. <strong>推送通知（push notification）<\/strong>（移动端或桌面端），\n2. <strong>短信（SMS）<\/strong>，以及\n3. <strong>电子邮件（Email）<\/strong>。<\/p>\n<p>本章聚焦于设计一个可扩展的系统，使其能够每天发送数百万条通知。<\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>需求<\/h3>\n<ul>\n<li><strong>通知类型：<\/strong> 推送通知、短信和电子邮件。<\/li>\n<li><strong>投递：<\/strong> 软实时系统，延迟极低。<\/li>\n<li><strong>平台：<\/strong> iOS、Android 和桌面端。<\/li>\n<li><strong>触发方式：<\/strong> 通知可以由客户端应用触发，也可以在服务器上定时调度。<\/li>\n<li><strong>规模：<\/strong><\/li>\n<li><strong>推送通知：<\/strong> 1000 万条/天，<\/li>\n<li><strong>短信：<\/strong> 100 万条/天，<\/li>\n<li><strong>电子邮件：<\/strong> 500 万条/天。<\/li>\n<li><strong>退订支持：<\/strong> 用户可以禁用特定类型的通知。<\/li>\n<\/ul>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>组件<\/h3>\n<ol>\n<li>\n<p><strong>通知类型：<\/strong>\n   - <strong>iOS 推送通知：<\/strong> 使用 <strong>Apple 推送通知服务（APNS，Apple Push Notification Service）<\/strong>。\n   - <strong>Android 推送通知：<\/strong> 使用 <strong>Firebase 云消息服务（FCM，Firebase Cloud Messaging）<\/strong>。\n   - <strong>短信：<\/strong> 使用 Twilio 或 Nexmo 等第三方服务。\n   - <strong>电子邮件：<\/strong> 使用 SendGrid 或 Mailchimp 等商业邮件服务。<\/p>\n<\/li>\n<li>\n<p><strong>联系信息采集：<\/strong>\n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/contact-info-gathering.png\" alt=\"联系信息采集\" width=\"500\">\n   <\/div>\n<\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>在应用安装或注册时采集设备令牌（device token）、电话号码或电子邮件地址。<\/li>\n<li>将联系信息存入数据库：<ul>\n<li><strong>设备令牌表（Device Tokens Table）：<\/strong> 用于推送通知。<\/li>\n<li><strong>用户表（User Table）：<\/strong> 用于电子邮件和电话号码。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ol start=\"3\">\n<li><strong>通知发送流程：<\/strong><\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/high-level-design.png\" alt=\"高层设计\" width=\"500\">\n   <\/div>\n\n<ul>\n<li><strong>触发服务（Trigger Services）：<\/strong><ul>\n<li>生成事件以发起通知（例如账单提醒、物流更新）。<\/li>\n<li>一个服务可以是微服务、定时任务（cron job），或一个触发通知发送事件的分布式系统。<\/li>\n<\/ul>\n<\/li>\n<li><strong>通知服务器（Notification Server）：<\/strong> <ul>\n<li>提供 API 供各服务发送通知。 <\/li>\n<li>执行基本校验，以验证电子邮件和电话号码。<\/li>\n<li>查询数据库或缓存，获取渲染一条通知所需的数据。<\/li>\n<\/ul>\n<\/li>\n<li><strong>第三方服务：<\/strong> 将通知投递给用户。<\/li>\n<\/ul>\n<h3>初始设计中的挑战<\/h3>\n<ul>\n<li><strong>单点故障（SPOF）：<\/strong> 一台通知服务器崩溃就可能拖垮整个系统。<\/li>\n<li><strong>可扩展性问题：<\/strong> 难以独立地扩展数据库、缓存和处理组件。<\/li>\n<li><strong>性能瓶颈：<\/strong> 发送通知对资源的需求很高。<\/li>\n<\/ul>\n<h3>改进后的设计<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"10. Notification System/images/improved-design.png\" alt=\"改进后的设计\" width=\"500\">\n   <\/div>\n\n<ul>\n<li>将数据库和缓存移出通知服务器。<\/li>\n<li>引入<strong>水平扩展（horizontal scaling）<\/strong>，部署多台通知服务器。<\/li>\n<li>使用<strong>消息队列（message queue）<\/strong>来解耦系统组件。<\/li>\n<li>当需要大批量发送通知时，消息队列充当缓冲区。<\/li>\n<li>增加工作进程（worker），从消息队列中拉取通知事件，并将其发送到相应的第三方服务。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3>可靠性<\/h3>\n<ol>\n<li><strong>防止数据丢失：<\/strong> \n <br />\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/data-loss.png\" alt=\"数据丢失\" width=\"400\">\n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>将通知数据持久化到数据库，并实现重试机制。 <\/li>\n<li>通知日志数据库（Notification log database）用于数据持久化。<\/li>\n<\/ul>\n<ol start=\"2\">\n<li><strong>去重（Deduplication）：<\/strong> \n   - 检查事件 ID，避免发送重复通知。\n   - 当一个通知事件首次到达时，通过检查事件 ID 判断它是否之前已见过。若已见过则丢弃，否则发出该通知。 <\/li>\n<\/ol>\n<h3>附加组件<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/events-tracking.png\" alt=\"事件追踪\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>通知模板（Notification Templates）：<\/strong> 预先格式化好的模板，用于一致且高效地发送通知。<\/li>\n<li><strong>通知设置（Notification Settings）：<\/strong>\n   - 用户可以选择开启或关闭特定渠道（推送、短信或电子邮件）的通知。\n   - 存储在专门的通知设置表中。<\/li>\n<li><strong>限流（Rate Limiting）：<\/strong> 限制发送给用户的通知频率。<\/li>\n<li><strong>重试机制（Retry Mechanism）：<\/strong> 当第三方服务失败时重试发送通知。<\/li>\n<li><strong>监控队列（Monitoring Queues）：<\/strong> 跟踪队列中的通知，以动态扩展工作进程。<\/li>\n<li><strong>事件追踪（Event Tracking）：<\/strong> 采集打开率、点击率和参与度等指标。<\/li>\n<\/ol>\n<h3>安全性<\/h3>\n<ul>\n<li>使用 <strong>AppKey<\/strong> 和 <strong>AppSecret<\/strong> 进行认证，并保护推送通知的 API。<\/li>\n<\/ul>\n<h3>通知流程<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"10. Notification System/images/updated-design.png\" alt=\"更新后的设计\" width=\"500\">\n   <\/div>\n\n<ol>\n<li>触发服务调用 API 发送通知。<\/li>\n<li>通知服务器校验请求，并从缓存或数据库中获取元数据。<\/li>\n<li>通知事件被发送到消息队列。<\/li>\n<li>工作进程处理事件，并与第三方服务交互。<\/li>\n<li>第三方服务将通知投递给用户。<\/li>\n<\/ol>\n<hr />\n<h2>关键优化<\/h2>\n<ol>\n<li><strong>水平扩展：<\/strong> 增加更多通知服务器以分担负载。<\/li>\n<li><strong>消息队列：<\/strong> 解耦处理过程，以应对高并发量。<\/li>\n<li><strong>缓存：<\/strong> 缓存频繁访问的数据，以降低延迟。<\/li>\n<li><strong>分布式爬取：<\/strong> 在地理上优化消息投递，以获得更好的性能。<\/li>\n<\/ol>", "enTitle": "Chapter 10: Design a Notification System", "zhTitle": "第 10 章：设计通知系统", "short": "Notification System", "num": "10"}, "11. News Feed System": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>news feed system<\/strong> displays a constantly updating list of posts (status updates, photos, videos, and links) from a user’s connections. Examples include Facebook’s news feed, Instagram’s feed, and Twitter’s timeline. This chapter explores the design of a scalable news feed system.<\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Requirements<\/h3>\n<ol>\n<li><strong>Platform:<\/strong> The system supports both web and mobile apps.<\/li>\n<li><strong>Features:<\/strong>\n   - Users can publish posts.\n   - Users can view posts from friends in their news feed.<\/li>\n<li><strong>Sorting:<\/strong> Feeds are sorted in <strong>reverse chronological order<\/strong> for simplicity.<\/li>\n<li><strong>Scale:<\/strong>\n   - Users can have up to 5,000 friends.\n   - 10 million daily active users (DAU).\n   - Feeds may include text, images, and videos.<\/li>\n<\/ol>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Overview<\/h3>\n<p>The design includes two main flows:\n1. <strong>Feed Publishing:<\/strong> A user publishes a post, which is written to the database and propagated to their friends’ feeds.\n2. <strong>News Feed Building:<\/strong> A user retrieves their news feed by aggregating posts from friends in reverse chronological order.<\/p>\n<hr />\n<h3>News Feed APIs<\/h3>\n<ol>\n<li>\n<p><strong>Feed Publishing API:<\/strong>\n   - <strong>Endpoint:<\/strong> <code>POST /v1/me/feed<\/code>\n   - <strong>Params:<\/strong> <code>content<\/code> (post text) and <code>auth_token<\/code> (authentication).<\/p>\n<\/li>\n<li>\n<p><strong>News Feed Retrieval API:<\/strong>\n   - <strong>Endpoint:<\/strong> <code>GET /v1/me/feed<\/code>\n   - <strong>Params:<\/strong> <code>auth_token<\/code> (authentication).<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h3>Feed Publishing<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"11. News Feed System/images/feed-publishing.png\" alt=\"Feed Publishing\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>User Interaction:<\/strong> The user publishes a post via the feed publishing API.<\/li>\n<li><strong>Load Balancer:<\/strong> Distributes traffic to web servers.<\/li>\n<li><strong>Web Servers:<\/strong> Authenticate requests and redirect to services.<\/li>\n<li><strong>Post Service:<\/strong> Stores the post in the database and cache.<\/li>\n<li><strong>Fanout Service:<\/strong> Propagates the post to friends’ news feeds in the cache.<\/li>\n<li><strong>Notification Service:<\/strong> Sends notifications to friends.<\/li>\n<\/ol>\n<hr />\n<h3>News Feed Building<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"11. News Feed System/images/news-feed-building.png\" alt=\"News Feed Building\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>User Interaction:<\/strong> The user requests their news feed via the retrieval API.<\/li>\n<li><strong>Load Balancer:<\/strong> Distributes traffic to web servers.<\/li>\n<li><strong>Web Servers:<\/strong> Forward requests to the news feed service.<\/li>\n<li><strong>News Feed Service:<\/strong> Fetches post IDs from the news feed cache and retrieves complete post details from the database or cache.<\/li>\n<\/ol>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Feed Publishing Deep Dive<\/h3>\n<ol>\n<li>\n<p><strong>Web Servers:<\/strong>\n   - Authenticate users using <code>auth_token<\/code>.\n   - Enforce rate limits to prevent spam.<\/p>\n<\/li>\n<li>\n<p><strong>Fanout Service:<\/strong>\n   - <strong>Fanout on Write:<\/strong> Push posts to friends’ feeds at write time.<\/p>\n<ul>\n<li><strong>Pros:<\/strong> Real-time updates, fast feed retrieval.<\/li>\n<li><strong>Cons:<\/strong> Resource-intensive for users with many friends.<\/li>\n<li><strong>Fanout on Read:<\/strong> Pull posts at read time.<\/li>\n<li><strong>Pros:<\/strong> Efficient for inactive users.<\/li>\n<li><strong>Cons:<\/strong> Slower feed retrieval.<\/li>\n<li>\n<p><strong>Hybrid Approach:<\/strong> Use a push model for most users and a pull model for high-connection users (e.g., celebrities).<\/p>\n<p><img src=\"11. News Feed System/images/feed-publishing-deep-dive.png\" alt=\"Feed Publishing Deep Dive\" width=\"500\"><\/p>\n<\/li>\n<\/ul>\n<p>The <strong>fanout service<\/strong> works as following:<\/p>\n<ol>\n<li><strong>Fetch Friend IDs:<\/strong> Retrieve the friend list from a graph database.<\/li>\n<li><strong>Filter Friends from Cache:<\/strong> Access user settings in the cache to exclude certain friends (e.g., muted friends or selective sharing preferences).<\/li>\n<li><strong>Send to Message Queue:<\/strong> Send the filtered friend list along with the new post ID to a message queue for processing.<\/li>\n<li><strong>Fanout Workers:<\/strong> Workers retrieve data from the message queue and update the news feed cache. The cache stores <code>&lt;post_id, user_id&gt;<\/code> mappings instead of full user and post objects to save memory.<\/li>\n<li>\n<p><strong>Store in News Feed Cache:<\/strong> Append new post IDs to the friends’ news feed cache. A configurable limit ensures that only recent posts are stored, as most users focus on the latest content, keeping cache memory consumption manageable.<\/p>\n<p><img src=\"11. News Feed System/images/fanout-service.png\" alt=\"Fanout Service\" width=\"500\"><\/p>\n<\/li>\n<\/ol>\n<\/li>\n<\/ol>\n<h2>News Feed Retrieval Deep Dive<\/h2>\n<h3>Cache Architecture<\/h3>\n<p>The cache is divided into five layers:\n1. <strong>News Feed Cache:<\/strong> Stores post IDs for quick retrieval.\n2. <strong>Content Cache:<\/strong> Stores post details (popular posts in hot cache).\n3. <strong>Social Graph Cache:<\/strong> Stores user relationship data.\n4. <strong>Action Cache:<\/strong> Tracks user actions (likes, replies, shares).\n5. <strong>Counter Cache:<\/strong> Maintains counts for likes, replies, followers, etc.<\/p>\n<pre><code>&lt;img src=\"11. News Feed System/images/cache-architecture.png\" alt=\"Cache Architecture\" width=\"500\"&gt;\n<\/code><\/pre>\n<hr />\n<h2>Key Optimizations<\/h2>\n<h3>Scaling<\/h3>\n<ol>\n<li><strong>Database Scaling:<\/strong>\n   - Horizontal scaling and sharding.\n   - Use of read replicas for high-traffic queries.<\/li>\n<li><strong>Stateless Web Tier:<\/strong> Keep web servers stateless to enable horizontal scaling.<\/li>\n<\/ol>\n<h3>Caching<\/h3>\n<ol>\n<li>Store frequently accessed data in memory.<\/li>\n<li>Use cache layers to reduce latency and database load.<\/li>\n<\/ol>\n<h3>Reliability<\/h3>\n<ol>\n<li><strong>Consistent Hashing:<\/strong> Distribute requests evenly across servers.<\/li>\n<li><strong>Message Queues:<\/strong> Decouple system components and buffer traffic.<\/li>\n<\/ol>\n<h3>Monitoring<\/h3>\n<ol>\n<li>Track key metrics like QPS (queries per second) and latency.<\/li>\n<li>Monitor cache hit rates and adjust configurations accordingly.<\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p><strong>信息流系统（news feed system）<\/strong> 展示一个不断更新的帖子列表（状态更新、照片、视频和链接），这些帖子来自用户的社交关系。典型例子包括 Facebook 的信息流、Instagram 的动态和 Twitter 的时间线。本章探讨如何设计一个可扩展的信息流系统。<\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>需求<\/h3>\n<ol>\n<li><strong>平台：<\/strong> 系统同时支持网页和移动应用。<\/li>\n<li><strong>功能：<\/strong>\n   - 用户可以发布帖子。\n   - 用户可以在自己的信息流中查看好友发布的帖子。<\/li>\n<li><strong>排序：<\/strong> 为简单起见，信息流按<strong>逆时间顺序（reverse chronological order）<\/strong>排序。<\/li>\n<li><strong>规模：<\/strong>\n   - 用户最多可有 5,000 个好友。\n   - 1000 万日活跃用户（DAU）。\n   - 信息流可能包含文本、图片和视频。<\/li>\n<\/ol>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>概述<\/h3>\n<p>该设计包含两条主要流程：\n1. <strong>信息流发布（Feed Publishing）：<\/strong> 用户发布一条帖子，该帖子被写入数据库，并传播到其好友的信息流中。\n2. <strong>信息流构建（News Feed Building）：<\/strong> 用户通过按逆时间顺序聚合好友的帖子来检索自己的信息流。<\/p>\n<hr />\n<h3>信息流 API<\/h3>\n<ol>\n<li>\n<p><strong>信息流发布 API：<\/strong>\n   - <strong>端点（Endpoint）：<\/strong> <code>POST /v1/me/feed<\/code>\n   - <strong>参数：<\/strong> <code>content<\/code>（帖子文本）和 <code>auth_token<\/code>（认证）。<\/p>\n<\/li>\n<li>\n<p><strong>信息流检索 API：<\/strong>\n   - <strong>端点：<\/strong> <code>GET /v1/me/feed<\/code>\n   - <strong>参数：<\/strong> <code>auth_token<\/code>（认证）。<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h3>信息流发布<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"11. News Feed System/images/feed-publishing.png\" alt=\"信息流发布\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>用户交互：<\/strong> 用户通过信息流发布 API 发布一条帖子。<\/li>\n<li><strong>负载均衡器：<\/strong> 将流量分发到 Web 服务器。<\/li>\n<li><strong>Web 服务器：<\/strong> 认证请求，并将其转发给相应的服务。<\/li>\n<li><strong>帖子服务（Post Service）：<\/strong> 将帖子存入数据库和缓存。<\/li>\n<li><strong>扇出服务（Fanout Service）：<\/strong> 将该帖子传播到缓存中各好友的信息流。<\/li>\n<li><strong>通知服务（Notification Service）：<\/strong> 向好友发送通知。<\/li>\n<\/ol>\n<hr />\n<h3>信息流构建<\/h3>\n<div style=\"margin-left:3rem\">\n      <img src=\"11. News Feed System/images/news-feed-building.png\" alt=\"信息流构建\" width=\"400\">\n   <\/div>\n\n<ol>\n<li><strong>用户交互：<\/strong> 用户通过检索 API 请求自己的信息流。<\/li>\n<li><strong>负载均衡器：<\/strong> 将流量分发到 Web 服务器。<\/li>\n<li><strong>Web 服务器：<\/strong> 将请求转发给信息流服务。<\/li>\n<li><strong>信息流服务（News Feed Service）：<\/strong> 从信息流缓存中获取帖子 ID，并从数据库或缓存中检索完整的帖子详情。<\/li>\n<\/ol>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3>信息流发布深入剖析<\/h3>\n<ol>\n<li>\n<p><strong>Web 服务器：<\/strong>\n   - 使用 <code>auth_token<\/code> 认证用户。\n   - 执行限流以防止垃圾内容。<\/p>\n<\/li>\n<li>\n<p><strong>扇出服务：<\/strong>\n   - <strong>写时扇出（Fanout on Write）：<\/strong> 在写入时将帖子推送到好友的信息流。<\/p>\n<ul>\n<li><strong>优点：<\/strong> 实时更新，信息流检索快。<\/li>\n<li><strong>缺点：<\/strong> 对于好友众多的用户来说资源消耗大。<\/li>\n<li><strong>读时扇出（Fanout on Read）：<\/strong> 在读取时拉取帖子。<\/li>\n<li><strong>优点：<\/strong> 对不活跃用户效率高。<\/li>\n<li><strong>缺点：<\/strong> 信息流检索较慢。<\/li>\n<li>\n<p><strong>混合方案（Hybrid Approach）：<\/strong> 对大多数用户采用推送模型（push model），对好友关系众多的用户（例如名人）采用拉取模型（pull model）。<\/p>\n<p><img src=\"11. News Feed System/images/feed-publishing-deep-dive.png\" alt=\"信息流发布深入剖析\" width=\"500\"><\/p>\n<\/li>\n<\/ul>\n<p><strong>扇出服务（fanout service）<\/strong>的工作方式如下：<\/p>\n<ol>\n<li><strong>获取好友 ID：<\/strong> 从图数据库中检索好友列表。<\/li>\n<li><strong>从缓存中过滤好友：<\/strong> 访问缓存中的用户设置，以排除某些好友（例如被静音的好友或选择性分享偏好）。<\/li>\n<li><strong>发送到消息队列：<\/strong> 将过滤后的好友列表连同新帖子 ID 一起发送到消息队列进行处理。<\/li>\n<li><strong>扇出工作进程（Fanout Workers）：<\/strong> 工作进程从消息队列中检索数据，并更新信息流缓存。缓存存储的是 <code>&lt;post_id, user_id&gt;<\/code> 映射，而不是完整的用户和帖子对象，以节省内存。<\/li>\n<li>\n<p><strong>存入信息流缓存：<\/strong> 将新帖子 ID 追加到各好友的信息流缓存中。一个可配置的上限确保只存储最近的帖子，因为大多数用户只关注最新内容，从而使缓存内存消耗保持在可控范围。<\/p>\n<p><img src=\"11. News Feed System/images/fanout-service.png\" alt=\"扇出服务\" width=\"500\"><\/p>\n<\/li>\n<\/ol>\n<\/li>\n<\/ol>\n<h2>信息流检索深入剖析<\/h2>\n<h3>缓存架构<\/h3>\n<p>缓存分为五层：\n1. <strong>信息流缓存（News Feed Cache）：<\/strong> 存储帖子 ID，以便快速检索。\n2. <strong>内容缓存（Content Cache）：<\/strong> 存储帖子详情（热门帖子放在热缓存中）。\n3. <strong>社交图谱缓存（Social Graph Cache）：<\/strong> 存储用户关系数据。\n4. <strong>行为缓存（Action Cache）：<\/strong> 跟踪用户行为（点赞、回复、分享）。\n5. <strong>计数器缓存（Counter Cache）：<\/strong> 维护点赞、回复、粉丝等的计数。<\/p>\n<pre><code>&lt;img src=\"11. News Feed System/images/cache-architecture.png\" alt=\"缓存架构\" width=\"500\"&gt;\n<\/code><\/pre>\n<hr />\n<h2>关键优化<\/h2>\n<h3>扩展性<\/h3>\n<ol>\n<li><strong>数据库扩展：<\/strong>\n   - 水平扩展和分片（sharding）。\n   - 使用读副本（read replica）应对高流量查询。<\/li>\n<li><strong>无状态 Web 层：<\/strong> 保持 Web 服务器无状态，以支持水平扩展。<\/li>\n<\/ol>\n<h3>缓存<\/h3>\n<ol>\n<li>将频繁访问的数据存入内存。<\/li>\n<li>使用缓存层来降低延迟和数据库负载。<\/li>\n<\/ol>\n<h3>可靠性<\/h3>\n<ol>\n<li><strong>一致性哈希（Consistent Hashing）：<\/strong> 将请求均匀地分布到各服务器。<\/li>\n<li><strong>消息队列：<\/strong> 解耦系统组件并缓冲流量。<\/li>\n<\/ol>\n<h3>监控<\/h3>\n<ol>\n<li>跟踪每秒查询数（QPS，queries per second）和延迟等关键指标。<\/li>\n<li>监控缓存命中率，并据此调整配置。<\/li>\n<\/ol>", "enTitle": "Chapter 11: Design a News Feed System", "zhTitle": "第 11 章：设计信息流系统", "short": "News Feed System", "num": "11"}, "12. Chat System": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>chat system<\/strong> supports real-time messaging between users. This chapter focuses on designing a chat app that includes:\n- <strong>One-on-One Chat<\/strong>\n- <strong>Group Chat (max 100 users)<\/strong>\n- <strong>Online Presence Indicators<\/strong>\n- <strong>Multiple Device Support<\/strong>\n- <strong>Push Notifications<\/strong><\/p>\n<p>The system targets <strong>50 million daily active users (DAU)<\/strong> and stores chat history permanently.<\/p>\n<hr />\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Requirements<\/h3>\n<ol>\n<li><strong>Features:<\/strong>\n   - One-on-one and group chat (max 100 members).\n   - Text-based messages (up to 100,000 characters).\n   - Online/offline indicators.\n   - Support for multiple devices.\n   - Push notifications.<\/li>\n<li><strong>Scale:<\/strong> Design for 50 million DAU.<\/li>\n<li><strong>Storage:<\/strong> Permanent chat history.<\/li>\n<\/ol>\n<hr />\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Communication Protocols<\/h3>\n<ol>\n<li>\n<p><strong>Sender Side:<\/strong> HTTP for sending messages, leveraging persistent connections for efficiency.<\/p>\n<p><div style=\"margin-left:2rem\">\n  <img src=\"12. Chat System/images/basic-design.png\" alt=\"Basic Design\" width=\"500\">  <br />\n  <div><\/p>\n<\/li>\n<li>\n<p><strong>Receiver Side:<\/strong>\n   - <strong>Polling:<\/strong><\/p>\n<ul>\n<li>Client periodically asks the server if there are messages available.<\/li>\n<li>\n<p>Inefficient due to frequent, redundant requests.<\/p>\n<p><img src=\"12. Chat System/images/polling.png\" alt=\"Polling\" width=\"400\">    <\/p>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<ul>\n<li>\n<p><strong>Long Polling:<\/strong> <\/p>\n<ul>\n<li>Keeps the connection open until messages arrive. <\/li>\n<li>\n<p>Inefficient for inactive users.<\/p>\n<p><img src=\"12. Chat System/images/long-polling.png\" alt=\"Long Polling\" width=\"400\"><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>WebSocket:<\/strong> <\/p>\n<ul>\n<li>A bi-directional, persistent connection for real-time communication, chosen for both sending and receiving messages.<\/li>\n<li>\n<p>Uses WebSockets (ws) protocol for sending and recieving messages.<\/p>\n<p><img src=\"12. Chat System/images/websocket.png\" alt=\"Websocket\"  width=\"400\" >    <\/p>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>Components<\/h3>\n<div style=\"margin-left:5rem\">\n   <img src=\"12. Chat System/images/high-level-stateless-arch.png\" alt=\"High Level Architecture\" height=\"350\">    \n   <img src=\"12. Chat System/images/high-level-statefull-arch.png\" alt=\"High Level Architecture\" height=\"350\" width=\"550\">\n<\/div>\n\n<ol>\n<li><strong>Stateless Services:<\/strong>\n   - Handle signup, login, and user profile management.\n   - Integrated with service discovery to recommend the best chat server.<\/li>\n<li><strong>Stateful Services:<\/strong>\n   - Chat servers maintain persistent WebSocket connections.\n   - Responsible for message delivery and synchronization.<\/li>\n<li><strong>Third-Party Integration:<\/strong>\n   - Push notification services notify users about new messages.\n   - Refer Notification System chapter for notifications implementation.<\/li>\n<\/ol>\n<hr />\n<h3>Design<\/h3>\n<p>The client maintains a persistent WebSocket connection to a chat server for real-time messaging.<\/p>\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/high-level-design.png\" alt=\"High Level Design\" width=\"450\"> \n<\/div>\n\n<ul>\n<li>Chat servers facilitate message sending/receiving.<\/li>\n<li>Presence servers manage online/offline status.<\/li>\n<li>API servers handle everything including user login, signup, change profile, etc.<\/li>\n<li>Notification servers send push notifications.<\/li>\n<li>Finally, the key-value store is used to store chat history.Key-value stores for the database of the chat history data for following reasons:<\/li>\n<li>It allows easy horizontal scaling.<\/li>\n<li>KV stores provide very low latency to access data.<\/li>\n<li>Relational databases do not handle long tail of data well. When the indexes grow\n   large, random access is expensive.<\/li>\n<li>KV stores are adopted by other proven reliable chat applications. For example,\n   both Facebook messenger and Discord.<\/li>\n<\/ul>\n<p>Following are the data models for one-to-one chat and group chat.\n   - The primary key is message id, which helps to decide message sequence.\n   - For the group chat the composite primary key is (channel_id, message_id). \n      - IDs can be generated using a global 64-bit sequence number generator like Snowflake.\n      - A better approach is to use local sequence number generator. Local means IDs are only unique within a group.\n      - The reason why local IDs work is that maintaining message sequence within one-on-one channel or a group channel is sufficient. <\/p>\n<pre><code>  &lt;img src=\"12. Chat System/images/one-to-one-chat.png\" alt=\"One to one chat design\" width=\"300\"&gt;   \n  &lt;img src=\"12. Chat System/images/group-chat.png\" alt=\"Group chat design\" width=\"300\"&gt;\n<\/code><\/pre>\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Service Discovery<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/zookeeper.png\" alt=\"Zookeeper\" width=\"400\">   \n<\/div>\n\n<ul>\n<li>The primary role of service discovery is to recommend the best chat server for a client based\non the criteria like geographical location, server capacity. <\/li>\n<li>Uses <strong>Apache Zookeeper<\/strong> to allocate chat servers based on criteria like geographic location and server capacity.<\/li>\n<li>Ensures efficient load distribution and minimizes latency.<\/li>\n<\/ul>\n<h3>Messaging Flows<\/h3>\n<h4>One-on-One Chat<\/h4>\n<ol>\n<li>User A sends a message to Chat Server 1.<\/li>\n<li>Chat Server 1 assigns a unique message ID and stores the message in a key-value store.<\/li>\n<li>If User B is online, the message is forwarded to Chat Server 2, maintaining a persistent WebSocket connection.<\/li>\n<li>If User B is offline, a push notification is sent.<\/li>\n<\/ol>\n<h4>Group Chat<\/h4>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/group-chat-flow.png\" alt=\"Group Chat Flow\" width=\"400\">  \n<\/div>\n\n<ul>\n<li>Messages are copied to individual inboxes for each recipient in the group.<\/li>\n<li>Simplifies synchronization but becomes expensive for larger groups.<\/li>\n<li>On the recipient side, a recipient can receive messages from multiple users. Each recipient\nhas an inbox (message sync queue) which contains messages from different senders.<\/li>\n<\/ul>\n<hr />\n<h4>Message Synchronization<\/h4>\n<p>Many users have multiple devices. We need to synchronize the message across the devices.\nEach device maintains a variable called cur_max_message_id, which keeps track of the latest\nmessage ID on the device. Messages that satisfy the following two conditions are considered\nas news messages:<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/message-synchronization.png\" alt=\"Message Synchronization\"  width=\"400\">  \n<\/div>\n\n<ul>\n<li>The recipient ID is equal to the currently logged-in user ID.<\/li>\n<li>Message ID in the key-value store is larger than cur_max_message_id<\/li>\n<\/ul>\n<hr />\n<h3>Online Presence<\/h3>\n<ol>\n<li><strong>Heartbeat Mechanism:<\/strong> \n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/heartbeat-mechanism.png\" alt=\"Heartbeat Mechanism\" width=\"400\"> \n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>Clients send periodic heartbeats to presence servers to indicate they are online. <\/li>\n<li>If no heartbeat is received within a threshold (for eg x = 30), the user is marked offline.<\/li>\n<\/ul>\n<ol start=\"2\">\n<li><strong>Fanout Model:<\/strong> <\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/fanout-presence.png\" alt=\"Fanout Presence\" width=\"400\"> \n   <\/div>\n\n<ul>\n<li>Presence updates are pushed to friends using a publish-subscribe model in which each friend pair maintains a channel.<\/li>\n<li>When User A’s online status changes, it publishes the event to three channels, channel A-B, A-C, and A-D. <\/li>\n<li>Those three channels are subscribed by User B, C, and D, respectively which get the online status updates.<\/li>\n<li>The above design is effective for a small user groups.<\/li>\n<\/ul>\n<hr />\n<h2>Additional Considerations<\/h2>\n<h3>Scalability<\/h3>\n<ul>\n<li><strong>Horizontal Scaling:<\/strong> Add servers as user count increases.<\/li>\n<li><strong>Load Balancing:<\/strong> Distribute traffic evenly across servers.<\/li>\n<li><strong>Caching:<\/strong> Reduce database load and improve latency.<\/li>\n<\/ul>\n<h3>Error Handling<\/h3>\n<ul>\n<li><strong>Retry Mechanisms:<\/strong> Handle message delivery failures with retries and queuing.<\/li>\n<li><strong>Server Failures:<\/strong> Use service discovery to allocate new servers in case of failures.<\/li>\n<\/ul>\n<h3>Future Extensions<\/h3>\n<ol>\n<li><strong>Media Support:<\/strong> Add handling for photos and videos, including compression and cloud storage.<\/li>\n<li><strong>End-to-End Encryption:<\/strong> Ensure message privacy.<\/li>\n<li><strong>Client-Side Caching:<\/strong> Reduce data transfer for better performance.<\/li>\n<li><strong>Improved Load Times:<\/strong> Use geographically distributed caching networks.<\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p><strong>聊天系统（chat system）<\/strong> 支持用户之间的实时消息收发。本章聚焦于设计一个聊天应用，它包含：\n- <strong>单聊（One-on-One Chat）<\/strong>\n- <strong>群聊（Group Chat，最多 100 人）<\/strong>\n- <strong>在线状态指示（Online Presence Indicators）<\/strong>\n- <strong>多设备支持<\/strong>\n- <strong>推送通知（Push Notifications）<\/strong><\/p>\n<p>该系统目标为<strong>5000 万日活跃用户（DAU）<\/strong>，并永久存储聊天历史。<\/p>\n<hr />\n<h2>第 1 步：理解问题<\/h2>\n<h3>需求<\/h3>\n<ol>\n<li><strong>功能：<\/strong>\n   - 单聊和群聊（最多 100 名成员）。\n   - 基于文本的消息（最多 100,000 个字符）。\n   - 在线/离线状态指示。\n   - 支持多设备。\n   - 推送通知。<\/li>\n<li><strong>规模：<\/strong> 按 5000 万 DAU 进行设计。<\/li>\n<li><strong>存储：<\/strong> 永久保存聊天历史。<\/li>\n<\/ol>\n<hr />\n<h2>第 2 步：高层设计<\/h2>\n<h3>通信协议<\/h3>\n<ol>\n<li>\n<p><strong>发送方侧：<\/strong> 使用 HTTP 发送消息，并利用持久连接以提升效率。<\/p>\n<p><div style=\"margin-left:2rem\">\n  <img src=\"12. Chat System/images/basic-design.png\" alt=\"基础设计\" width=\"500\">  <br />\n  <div><\/p>\n<\/li>\n<li>\n<p><strong>接收方侧：<\/strong>\n   - <strong>轮询（Polling）：<\/strong><\/p>\n<ul>\n<li>客户端周期性地询问服务器是否有可用消息。<\/li>\n<li>\n<p>由于频繁、冗余的请求，效率较低。<\/p>\n<p><img src=\"12. Chat System/images/polling.png\" alt=\"轮询\" width=\"400\">    <\/p>\n<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<ul>\n<li>\n<p><strong>长轮询（Long Polling）：<\/strong> <\/p>\n<ul>\n<li>保持连接打开，直到消息到达。 <\/li>\n<li>\n<p>对不活跃用户效率较低。<\/p>\n<p><img src=\"12. Chat System/images/long-polling.png\" alt=\"长轮询\" width=\"400\"><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>WebSocket：<\/strong> <\/p>\n<ul>\n<li>一种双向、持久的连接，用于实时通信，发送和接收消息均选用它。<\/li>\n<li>\n<p>使用 WebSocket（ws）协议发送和接收消息。<\/p>\n<p><img src=\"12. Chat System/images/websocket.png\" alt=\"WebSocket\"  width=\"400\">    <\/p>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>组件<\/h3>\n<div style=\"margin-left:5rem\">\n   <img src=\"12. Chat System/images/high-level-stateless-arch.png\" alt=\"高层架构（无状态）\" height=\"350\">    \n   <img src=\"12. Chat System/images/high-level-statefull-arch.png\" alt=\"高层架构（有状态）\" height=\"350\" width=\"550\">\n<\/div>\n\n<ol>\n<li><strong>无状态服务（Stateless Services）：<\/strong>\n   - 处理注册、登录和用户资料管理。\n   - 与服务发现（service discovery）集成，以推荐最合适的聊天服务器。<\/li>\n<li><strong>有状态服务（Stateful Services）：<\/strong>\n   - 聊天服务器维护持久的 WebSocket 连接。\n   - 负责消息投递与同步。<\/li>\n<li><strong>第三方集成：<\/strong>\n   - 推送通知服务就新消息通知用户。\n   - 通知的实现请参考「通知系统」一章。<\/li>\n<\/ol>\n<hr />\n<h3>设计<\/h3>\n<p>客户端与某台聊天服务器维持一条持久的 WebSocket 连接，以进行实时消息收发。<\/p>\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/high-level-design.png\" alt=\"高层设计\" width=\"450\"> \n<\/div>\n\n<ul>\n<li>聊天服务器负责消息的发送/接收。<\/li>\n<li>在线状态服务器（Presence servers）管理在线/离线状态。<\/li>\n<li>API 服务器处理一切事务，包括用户登录、注册、修改资料等。<\/li>\n<li>通知服务器发送推送通知。<\/li>\n<li>最后，键值存储（key-value store）用于存储聊天历史。聊天历史数据的数据库选用键值存储，原因如下：<\/li>\n<li>它易于水平扩展。<\/li>\n<li>键值存储提供极低的数据访问延迟。<\/li>\n<li>关系型数据库不能很好地处理数据的长尾分布。当索引变得很大时，随机访问代价高昂。<\/li>\n<li>键值存储已被其他经过验证、可靠的聊天应用采用，例如 Facebook Messenger 和 Discord。<\/li>\n<\/ul>\n<p>以下是单聊和群聊的数据模型。\n   - 主键是消息 ID，它有助于确定消息的顺序。\n   - 对于群聊，复合主键是 <code>(channel_id, message_id)<\/code>。 \n      - ID 可以使用全局 64 位序列号生成器生成，例如雪花算法（Snowflake）。\n      - 更好的做法是使用本地序列号生成器。「本地」意味着 ID 仅在一个群组内唯一。\n      - 本地 ID 之所以可行，是因为在单聊频道或群聊频道内维护消息顺序就足够了。 <\/p>\n<pre><code>  &lt;img src=\"12. Chat System/images/one-to-one-chat.png\" alt=\"单聊设计\" width=\"300\"&gt;   \n  &lt;img src=\"12. Chat System/images/group-chat.png\" alt=\"群聊设计\" width=\"300\"&gt;\n<\/code><\/pre>\n<h2>第 3 步：深入设计<\/h2>\n<h3>服务发现<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/zookeeper.png\" alt=\"ZooKeeper\" width=\"400\">   \n<\/div>\n\n<ul>\n<li>服务发现的主要作用是，根据地理位置、服务器容量等标准，为客户端推荐最合适的聊天服务器。 <\/li>\n<li>使用 <strong>Apache ZooKeeper<\/strong>，根据地理位置和服务器容量等标准分配聊天服务器。<\/li>\n<li>确保高效的负载分配，并将延迟降至最低。<\/li>\n<\/ul>\n<h3>消息流程<\/h3>\n<h4>单聊<\/h4>\n<ol>\n<li>用户 A 向聊天服务器 1 发送一条消息。<\/li>\n<li>聊天服务器 1 分配一个唯一的消息 ID，并将该消息存入键值存储。<\/li>\n<li>如果用户 B 在线，则将消息转发到聊天服务器 2（维持一条持久的 WebSocket 连接）。<\/li>\n<li>如果用户 B 离线，则发送一条推送通知。<\/li>\n<\/ol>\n<h4>群聊<\/h4>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/group-chat-flow.png\" alt=\"群聊流程\" width=\"400\">  \n<\/div>\n\n<ul>\n<li>消息被复制到群组中每个接收者各自的收件箱（inbox）。<\/li>\n<li>这简化了同步，但对于更大的群组来说代价高昂。<\/li>\n<li>在接收方一侧，一个接收者可能从多个用户那里接收消息。每个接收者都有一个收件箱（消息同步队列），其中包含来自不同发送者的消息。<\/li>\n<\/ul>\n<hr />\n<h4>消息同步<\/h4>\n<p>许多用户拥有多台设备。我们需要在这些设备之间同步消息。\n每台设备维护一个名为 <code>cur_max_message_id<\/code> 的变量，用于跟踪该设备上最新的消息 ID。满足以下两个条件的消息被视为新消息：<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"12. Chat System/images/message-synchronization.png\" alt=\"消息同步\"  width=\"400\">  \n<\/div>\n\n<ul>\n<li>接收者 ID 等于当前登录用户的 ID。<\/li>\n<li>键值存储中的消息 ID 大于 <code>cur_max_message_id<\/code><\/li>\n<\/ul>\n<hr />\n<h3>在线状态<\/h3>\n<ol>\n<li><strong>心跳机制（Heartbeat Mechanism）：<\/strong> \n <br />\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/heartbeat-mechanism.png\" alt=\"心跳机制\" width=\"400\"> \n   <\/div>\n<\/li>\n<\/ol>\n<ul>\n<li>客户端定期向在线状态服务器发送心跳，以表明自己在线。 <\/li>\n<li>如果在一个阈值内（例如 x = 30）未收到心跳，则将该用户标记为离线。<\/li>\n<\/ul>\n<ol start=\"2\">\n<li><strong>扇出模型（Fanout Model）：<\/strong> <\/li>\n<\/ol>\n<div style=\"margin-left:3rem\">\n      <img src=\"12. Chat System/images/fanout-presence.png\" alt=\"在线状态扇出\" width=\"400\"> \n   <\/div>\n\n<ul>\n<li>在线状态更新通过发布-订阅模型推送给好友，其中每一对好友都维护一个频道（channel）。<\/li>\n<li>当用户 A 的在线状态发生变化时，它将该事件发布到三个频道：频道 A-B、A-C 和 A-D。 <\/li>\n<li>这三个频道分别由用户 B、C 和 D 订阅，从而获得在线状态更新。<\/li>\n<li>上述设计对于小型用户群体是有效的。<\/li>\n<\/ul>\n<hr />\n<h2>附加考虑<\/h2>\n<h3>可扩展性<\/h3>\n<ul>\n<li><strong>水平扩展：<\/strong> 随着用户数量增长增加服务器。<\/li>\n<li><strong>负载均衡：<\/strong> 将流量均匀地分发到各服务器。<\/li>\n<li><strong>缓存：<\/strong> 降低数据库负载并改善延迟。<\/li>\n<\/ul>\n<h3>错误处理<\/h3>\n<ul>\n<li><strong>重试机制：<\/strong> 通过重试和排队来处理消息投递失败。<\/li>\n<li><strong>服务器故障：<\/strong> 发生故障时，使用服务发现分配新的服务器。<\/li>\n<\/ul>\n<h3>未来扩展<\/h3>\n<ol>\n<li><strong>媒体支持：<\/strong> 增加对照片和视频的处理，包括压缩和云存储。<\/li>\n<li><strong>端到端加密：<\/strong> 确保消息隐私。<\/li>\n<li><strong>客户端缓存：<\/strong> 减少数据传输以获得更好的性能。<\/li>\n<li><strong>改善加载时间：<\/strong> 使用地理上分布式的缓存网络。<\/li>\n<\/ol>", "enTitle": "Chapter 12: Design a Chat System", "zhTitle": "第 12 章：设计聊天系统", "short": "Chat System", "num": "12"}, "13. Search Autocomplete": {"en": "\n<h2>Introduction<\/h2>\n<p>Autocomplete, also known as typeahead or incremental search, provides real-time suggestions to users as they type in search boxes. The system must efficiently deliver top-k relevant and popular suggestions based on historical query data.<\/p>\n<h3>Key Features<\/h3>\n<ul>\n<li>Suggest up to <strong>5 autocomplete results<\/strong>.<\/li>\n<li>Based on <strong>query popularity<\/strong> (frequency).<\/li>\n<li>Support only <strong>lowercase English characters<\/st
