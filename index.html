 to the others.<\/p>\n<p>We could use a technique called write sharding, where we append a partition number for each key, calculated via <code>user_id % num_partitions<\/code>:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-3.png\" alt=\"chess-game-leaderboard-table-3\" width=\"500\" />\n<\/div>\n\n<p>An important trade-off to consider is how many partitions we should use:\n- The more partitions there are, the higher the write scalability\n- However, read scalability suffers as we need to query more partitions to collect aggregate results<\/p>\n<p>Using this approach requires that we use the \"scatter-gather\" technique we saw earlier, which grows in time complexity as we add more partitions:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/scatter-gather-2.png\" alt=\"scatter-gather-2\" width=\"500\" />\n<\/div>\n\n<p>To make a good evaluation on the number of partitions, we'd need to do some benchmarking.<\/p>\n<p>This NoSQL approach still has one major downside - it is hard to calculate the specific rank of a user.<\/p>\n<p>If we have sufficient scale to require us to shard, we could then perhaps tell users what \"percentile\" of scores they're in.<\/p>\n<p>A cron job can periodically run to analyze score distributions, based on which a user's percentile is determined, eg:<\/p>\n<pre><code>10th percentile = score &lt; 100\n20th percentile = score &lt; 500\n...\n90th percentile = score &lt; 6500\n<\/code><\/pre>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Other things to discuss if time permits:\n- <strong>Faster retrieval<\/strong> - We can cache the user object via a Redis hash with mapping <code>user_id -&gt; user object<\/code>. This enables faster retrieval vs. querying the database.\n- <strong>Breaking ties<\/strong> - When two players have the same score, we can break the tie by sorting them based on last played game.\n- <strong>System failure recovery<\/strong> - In the event of a large-scale Redis outage, we can recreate the leaderboard by going through the MySQL WAL entries and recreate it via an ad-hoc script<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>我们要为一款在线手机游戏设计一个<strong>排行榜（leaderboard）<\/strong>：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard.png\" alt=\"排行榜\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 1 步：理解问题并确定设计范围<\/h2>\n<ul>\n<li>候选人（C）：排行榜的分数是如何计算的？<\/li>\n<li>面试官（I）：用户每赢得一场比赛就得一分。<\/li>\n<li>候选人（C）：所有玩家都包含在排行榜中吗？<\/li>\n<li>面试官（I）：是的<\/li>\n<li>候选人（C）：排行榜是否关联某个时间段？<\/li>\n<li>面试官（I）：每个月都会开始新的赛季（tournament），从而开启一个新的排行榜。<\/li>\n<li>候选人（C）：我们可以假设只关心前 10 名用户吗？<\/li>\n<li>面试官（I）：我们想展示前 10 名用户，以及特定用户的名次。如果时间允许，我们可以讨论展示排行榜中某一特定用户周围的用户。<\/li>\n<li>候选人（C）：一个赛季有多少用户？<\/li>\n<li>面试官（I）：500 万 DAU 和 2500 万 MAU<\/li>\n<li>候选人（C）：一个赛季期间平均进行多少场比赛？<\/li>\n<li>面试官（I）：每个玩家平均每天进行 10 场比赛<\/li>\n<li>候选人（C）：如果两个玩家分数相同，我们如何确定排名？<\/li>\n<li>面试官（I）：在这种情况下，他们的排名相同。如果时间允许，我们可以讨论如何打破平局。<\/li>\n<li>候选人（C）：排行榜需要实时吗？<\/li>\n<li>面试官（I）：是的，我们希望呈现实时结果，或尽可能接近实时。呈现批量处理的历史结果是不可接受的。<\/li>\n<\/ul>\n<h3><strong>功能需求<\/strong><\/h3>\n<ul>\n<li>在排行榜上展示前 10 名玩家<\/li>\n<li>显示某用户的具体排名<\/li>\n<li>展示给定用户前后各四名用户（加分项）<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li>分数的实时更新<\/li>\n<li>分数更新实时反映到排行榜上<\/li>\n<li>一般的可扩展性、可用性、可靠性<\/li>\n<\/ul>\n<h3><strong>粗略估算（Back-of-the-envelope estimation）<\/strong><\/h3>\n<p>如果有 5000 万 DAU，且游戏在 24 小时内玩家分布均匀，那么平均每秒有 50 个用户。\n然而，由于分布通常不均匀，我们可以估计峰值在线用户约为每秒 250 个。<\/p>\n<p>用户得分的 QPS——按平均每天 10 场游戏计算，50 用户/秒 * 10 = 500 QPS。峰值 QPS = 2500。<\/p>\n<p>获取排行榜前 10 名的 QPS——假设用户平均每天打开一次，QPS 为 50。<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<h3><strong>API 设计<\/strong><\/h3>\n<p>我们需要的第一个 API 是更新用户分数：<\/p>\n<pre><code>POST /v1/scores\n<\/code><\/pre>\n<p>这个 API 接收两个参数——<code>user_id<\/code> 和赢得一场游戏所得的 <code>points<\/code>。<\/p>\n<p>这个 API 应该只允许游戏服务器访问，而不允许终端客户端访问。<\/p>\n<p>下一个 API 用于获取排行榜前 10 名玩家：<\/p>\n<pre><code>GET /v1/scores\n<\/code><\/pre>\n<p>响应示例：<\/p>\n<pre><code>{\n  &quot;data&quot;: [\n    {\n      &quot;user_id&quot;: &quot;user_id1&quot;,\n      &quot;user_name&quot;: &quot;alice&quot;,\n      &quot;rank&quot;: 1,\n      &quot;score&quot;: 12543\n    },\n    {\n      &quot;user_id&quot;: &quot;user_id2&quot;,\n      &quot;user_name&quot;: &quot;bob&quot;,\n      &quot;rank&quot;: 2,\n      &quot;score&quot;: 11500\n    }\n  ],\n  ...\n  &quot;total&quot;: 10\n}\n<\/code><\/pre>\n<p>你也可以获取特定用户的分数：<\/p>\n<pre><code>GET /v1/scores/{:user_id}\n<\/code><\/pre>\n<p>响应示例：<\/p>\n<pre><code>{\n    &quot;user_info&quot;: {\n        &quot;user_id&quot;: &quot;user5&quot;,\n        &quot;score&quot;: 1000,\n        &quot;rank&quot;: 6,\n    }\n}\n<\/code><\/pre>\n<h3><strong>高层架构<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/high-level-architecture.png\" alt=\"高层架构\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>当玩家赢得一场游戏时，客户端向游戏服务发送请求<\/li>\n<li>游戏服务验证该胜利是否有效，并调用排行榜服务来更新玩家的分数<\/li>\n<li>排行榜服务在排行榜存储中更新用户的分数<\/li>\n<li>玩家调用排行榜服务来获取排行榜数据，例如前 10 名玩家和给定玩家的排名<\/li>\n<\/ul>\n<p>另一个被考虑过的设计是客户端直接在排行榜服务中更新自己的分数：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/alternative-design.png\" alt=\"备选设计\" width=\"500\" />\n<\/div>\n\n<p>这个选项不安全，因为它容易受到中间人攻击（man-in-the-middle attack）。玩家可以挂一个代理，随意修改自己的分数。<\/p>\n<p>另一个注意事项是，对于游戏逻辑由服务器管理的游戏，客户端不需要显式调用服务器来记录自己的胜利。\n服务器会根据游戏逻辑自动为他们记录。<\/p>\n<p>另一个需要考虑的问题是，我们是否应该在游戏服务器和排行榜服务之间放一个消息队列。如果其他服务对游戏结果感兴趣，这会很有用，但面试到目前为止这并不是一个明确的需求，因此没有包含在设计中：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/message-queue-based-comm.png\" alt=\"基于消息队列的通信\" width=\"500\" />\n<\/div>\n\n<h3><strong>数据模型<\/strong><\/h3>\n<p>让我们讨论存储排行榜数据的可选方案——关系型数据库、Redis、NoSQL。<\/p>\n<p>NoSQL 方案在深入设计一节中讨论。<\/p>\n<h4>关系型数据库方案<\/h4>\n<p>如果规模不重要、用户也不多，关系型数据库就能很好地满足我们的需求。<\/p>\n<p>我们可以从一个简单的排行榜表开始，每月一张表（作者注——这没有道理。你完全可以只加一个 <code>month<\/code> 列，避免每月维护新表的麻烦）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard-table.png\" alt=\"排行榜表\" width=\"500\" />\n<\/div>\n\n<p>还有一些额外的数据需要包含在内，但这与我们要运行的查询无关，因此省略了。<\/p>\n<p>当用户赢得一分时会发生什么？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-wins-point.png\" alt=\"用户得分\" width=\"500\" />\n<\/div>\n\n<p>如果用户在表中尚不存在，我们需要先插入他们：<\/p>\n<pre><code>INSERT INTO leaderboard (user_id, score) VALUES ('mary1934', 1);\n<\/code><\/pre>\n<p>在后续调用中，我们只需更新他们的分数：<\/p>\n<pre><code>UPDATE leaderboard set score=score + 1 where user_id='mary1934';\n<\/code><\/pre>\n<p>我们如何找到排行榜的顶尖玩家？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/find-leaderboard-position.png\" alt=\"查找排行榜位置\" width=\"500\" />\n<\/div>\n\n<p>我们可以运行以下查询：<\/p>\n<pre><code>SELECT (@rownum := @rownum + 1) AS rank, user_id, score\nFROM leaderboard\nORDER BY score DESC;\n<\/code><\/pre>\n<p>但这性能不佳，因为它会进行一次全表扫描来对数据库表中的所有记录排序。<\/p>\n<p>我们可以通过在 <code>score<\/code> 上添加索引并使用 <code>LIMIT<\/code> 操作来优化它，以避免扫描所有内容：<\/p>\n<pre><code>SELECT (@rownum := @rownum + 1) AS rank, user_id, score\nFROM leaderboard\nORDER BY score DESC\nLIMIT 10;\n<\/code><\/pre>\n<p>然而，如果用户不在排行榜顶部，而你又想定位他们的排名，这种方法的可扩展性就不好。<\/p>\n<h4>Redis 方案<\/h4>\n<p>我们希望找到一种即使在面对数百万玩家时也能良好工作的解决方案，而不必求助于复杂的数据库查询。<\/p>\n<p>Redis 是一种内存数据存储，它速度快是因为在内存中工作，并且有一种合适的数据结构来满足我们的需求——有序集合（sorted set）。<\/p>\n<p>有序集合是一种类似于编程语言中集合的数据结构，它允许你按照给定条件对数据结构进行排序。\n在内部，它使用哈希表（hash-map）来维护键（user_id）与值（score）之间的映射，并使用跳表（skip list）按排序顺序将分数映射到用户：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/sorted-set.png\" alt=\"有序集合\" width=\"500\" />\n<\/div>\n\n<p>跳表是如何工作的？\n- 它是一种支持快速查找的链表\n- 它由一个有序链表和多级索引组成<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/skip-list.png\" alt=\"跳表\" width=\"500\" />\n<\/div>\n\n<p>当数据集足够大时，这种结构使我们能够快速搜索特定值。\n在下面的示例中（64 个节点），在基础链表中查找给定值需要遍历 62 个节点，而在跳表中只需遍历 11 个节点：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/skip-list-performance.png\" alt=\"跳表性能\" width=\"500\" />\n<\/div>\n\n<p>有序集合比关系型数据库性能更高，因为数据始终保持排序，代价是 O(logN) 的添加和查找操作。<\/p>\n<p>相比之下，下面是在关系型数据库中查找给定用户排名所需运行的嵌套查询示例：<\/p>\n<pre><code>SELECT *,(SELECT COUNT(*) FROM leaderboard lb2\nWHERE lb2.score &gt;= lb1.score) RANK\nFROM leaderboard lb1\nWHERE lb1.user_id = {:user_id};\n<\/code><\/pre>\n<p>我们需要哪些操作来在 Redis 中操作排行榜？\n- <strong>ZADD<\/strong>——如果用户不在集合中，则将其插入。否则，更新分数。O(logN) 时间复杂度。\n- <strong>ZINCRBY<\/strong>——将用户的分数增加给定数值。如果用户不存在，分数从零开始。O(logN) 时间复杂度。\n- <strong>ZRANGE/ZREVRANGE<\/strong>——获取一段用户，按其分数排序。我们可以指定顺序（ASC/DESC）、偏移量和结果数量。O(logN+M) 时间复杂度，其中 M 是结果数量。\n- <strong>ZRANK/ZREVRANK<\/strong>——按 ASC/DESC 顺序获取给定用户的位置（排名）。O(logN) 时间复杂度。<\/p>\n<p>当用户得分时会发生什么？<\/p>\n<pre><code>ZINCRBY leaderboard_feb_2021 1 'mary1934'\n<\/code><\/pre>\n<p>每个月都会创建一个新的排行榜，而旧的排行榜会被移到历史存储中。<\/p>\n<p>当用户获取前 10 名玩家时会发生什么？<\/p>\n<pre><code>ZREVRANGE leaderboard_feb_2021 0 9 WITHSCORES\n<\/code><\/pre>\n<p>结果示例：<\/p>\n<pre><code>[(user2,score2),(user1,score1),(user5,score5)...]\n<\/code><\/pre>\n<p>那用户获取自己在排行榜中的位置呢？<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/leaderboard-position-of-user.png\" alt=\"用户在排行榜中的位置\" width=\"500\" />\n<\/div>\n\n<p>假设我们已经知道用户在排行榜中的位置，这可以很容易地通过以下查询实现：<\/p>\n<pre><code>ZREVRANGE leaderboard_feb_2021 357 365\n<\/code><\/pre>\n<p>用户的位置可以使用 <code>ZREVRANK &lt;user-id&gt;<\/code> 获取。<\/p>\n<p>让我们看看存储需求是什么：\n- 假设最坏情况：2500 万 MAU 全部在给定月份参与游戏\n- ID 是 24 个字符的字符串，分数是 16 位整数，我们需要 26 字节 * 2500 万 = 约 650MB 的存储\n- 即使由于跳表的开销而使存储成本翻倍，这也能轻松放进一个现代的 Redis 集群<\/p>\n<p>另一个需要考虑的非功能需求是支持每秒 2500 次更新。这完全在单台 Redis 服务器的能力范围内。<\/p>\n<p>其他注意事项：\n- 我们可以启动一个 Redis 副本，以避免在 Redis 服务器崩溃时丢失数据\n- 我们仍然可以利用 Redis 持久化，以在崩溃时不丢失数据\n- 我们需要在 MySQL 中使用两张辅助表来获取用户详情（如用户名、显示名等），以及记录用户何时赢得游戏\n- MySQL 中的第二张表可用于在基础设施故障时重建排行榜\n- 作为一个小的性能优化，我们可以缓存前 10 名玩家的用户详情，因为它们会被频繁访问<\/p>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3><strong>使用云服务商还是自己部署<\/strong><\/h3>\n<p>我们可以选择自行部署和管理服务，或者使用云服务商来替我们管理。<\/p>\n<p>如果选择自己管理服务，我们将使用 Redis 存储排行榜数据，使用 MySQL 存储用户资料，如果想扩展数据库，还可能为用户资料加一层缓存：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/manage-services-ourselves.png\" alt=\"自行管理服务\" width=\"500\" />\n<\/div>\n\n<p>或者，我们可以使用云产品来替我们管理许多服务。例如，我们可以使用 AWS API Gateway 将 API 调用路由到 AWS Lambda 函数：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/api-gateway-mapping.png\" alt=\"API 网关映射\" width=\"500\" />\n<\/div>\n\n<p>AWS Lambda 使我们无需自行管理或配置服务器即可运行代码。它仅在需要时运行，并自动扩展。<\/p>\n<p>用户得分示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-scoring-point-lambda.png\" alt=\"用户在 Lambda 中得分\" width=\"500\" />\n<\/div>\n\n<p>用户获取排行榜示例：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/user-retrieve-leaderboard.png\" alt=\"用户获取排行榜\" width=\"500\" />\n<\/div>\n\n<p>Lambda 是无服务器（serverless）架构的一种实现。我们不需要管理扩展和环境配置。<\/p>\n<p>作者建议，如果我们是从零开始构建游戏，就采用这种方式。<\/p>\n<h3><strong>扩展 Redis<\/strong><\/h3>\n<p>对于 500 万 DAU，无论是从存储还是 QPS 角度看，单台 Redis 实例都足以应付。<\/p>\n<p>然而，如果设想用户群增长 10 倍到 5 亿 DAU，那么我们将需要 65GB 存储，QPS 也会达到 25 万。<\/p>\n<p>这种规模将需要分片。<\/p>\n<p>实现它的一种方法是对数据进行范围分区（range-partitioning）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/range-partition.png\" alt=\"范围分区\" width=\"500\" />\n<\/div>\n\n<p>在本例中，我们将根据用户的分数进行分片。我们会在应用代码中维护 user_id 与分片之间的映射。\n我们可以通过 MySQL 或另一个缓存来保存这个映射本身。<\/p>\n<p>要获取前 10 名玩家，我们会查询分数最高的分片（<code>[900-1000]<\/code>）。<\/p>\n<p>要获取用户的排名，我们需要计算该用户在其分片内的排名，再加上其他分片中分数更高的所有用户。\n后者是一个 O(1) 操作，因为每个分片的总记录数可以通过 info keyspace 命令快速获取。<\/p>\n<p>或者，我们可以通过 Redis Cluster 使用哈希分区（hash partitioning）。它是一个代理，基于类似于一致性哈希的分区方式将数据分布到 Redis 节点上，但又不完全相同：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/hash-partition.png\" alt=\"哈希分区\" width=\"500\" />\n<\/div>\n\n<p>在这种设置下，计算前 10 名玩家具有挑战性。我们需要获取每个分片的前 10 名玩家，并在应用中合并结果：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/top-10-players-calculation.png\" alt=\"前 10 名玩家的计算\" width=\"500\" />\n<\/div>\n\n<p>哈希分区有一些局限：\n- 如果我们需要获取前 K 名用户，而 K 很大，延迟会增加，因为我们需要从所有分片中获取大量数据\n- 延迟会随着分区数量的增长而增加\n- 没有直接的方法来确定用户的排名<\/p>\n<p>综合考虑，作者倾向于在这个问题上使用固定分区。<\/p>\n<p>其他注意事项：\n- 一个最佳实践是为写密集型 Redis 节点分配两倍于所需的内存，以便在需要时容纳快照\n- 我们可以使用一个名为 Redis-benchmark 的工具来跟踪 Redis 设置的性能，并做出数据驱动的决策<\/p>\n<h3><strong>备选方案：NoSQL<\/strong><\/h3>\n<p>另一个值得考虑的方案是使用合适的 NoSQL 数据库，它针对以下方面做了优化：\n- 重写入\n- 高效地按分数对同一分区内的条目排序<\/p>\n<p>DynamoDB、Cassandra 或 MongoDB 都是不错的选择。<\/p>\n<p>在本章中，作者决定使用 DynamoDB。它是一个全托管的 NoSQL 数据库，提供可靠的性能和出色的可扩展性。\n当我们需要查询不属于主键的字段时，它还支持使用全局二级索引（global secondary index）。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/dynamo-db.png\" alt=\"DynamoDB\" width=\"500\" />\n<\/div>\n\n<p>让我们从一张为国际象棋游戏存储排行榜的表开始：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-1.png\" alt=\"国际象棋游戏排行榜表 1\" width=\"500\" />\n<\/div>\n\n<p>这很好用，但如果需要按分数查询任何内容，它的可扩展性就不好。因此，我们可以把分数作为排序键（sort key）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-2.png\" alt=\"国际象棋游戏排行榜表 2\" width=\"500\" />\n<\/div>\n\n<p>这个设计的另一个问题是我们按月进行分区。这会导致热点分区（hotspot partition），因为最新月份相比其他月份会被不均匀地访问。<\/p>\n<p>我们可以使用一种称为写分片（write sharding）的技术，为每个键附加一个分区编号，通过 <code>user_id % num_partitions<\/code> 计算：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/chess-game-leaderboard-table-3.png\" alt=\"国际象棋游戏排行榜表 3\" width=\"500\" />\n<\/div>\n\n<p>一个需要考虑的重要权衡是应该使用多少个分区：\n- 分区越多，写入可扩展性越高\n- 然而，读取可扩展性会受损，因为我们需要查询更多分区来收集聚合结果<\/p>\n<p>使用这种方法需要用到我们之前看到的「分散-收集」（scatter-gather）技术，随着分区数量增加，其时间复杂度也会增长：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"25. Real-time Gaming Leaderboard/images/scatter-gather-2.png\" alt=\"分散-收集 2\" width=\"500\" />\n<\/div>\n\n<p>要对分区数量做出合理的评估，我们需要做一些基准测试。<\/p>\n<p>这种 NoSQL 方法还有一个主要缺点——很难计算用户的具体排名。<\/p>\n<p>如果我们的规模大到需要分片，那么也许可以告诉用户他们的分数处于哪个「百分位（percentile）」。<\/p>\n<p>可以定期运行一个定时任务（cron job）来分析分数分布，据此确定用户的百分位，例如：<\/p>\n<pre><code>10th percentile = score &lt; 100\n20th percentile = score &lt; 500\n...\n90th percentile = score &lt; 6500\n<\/code><\/pre>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>如果时间允许，还可以讨论的其他内容：\n- <strong>更快的检索<\/strong>——我们可以通过 Redis 哈希缓存用户对象，映射关系为 <code>user_id -&gt; user object<\/code>。相比查询数据库，这样检索更快。\n- <strong>打破平局<\/strong>——当两个玩家分数相同时，我们可以根据他们最近一场游戏的时间来排序，从而打破平局。\n- <strong>系统故障恢复<\/strong>——在大规模 Redis 中断的情况下，我们可以通过遍历 MySQL 的 WAL 条目，用一个临时脚本（ad-hoc script）重建排行榜<\/p>", "enTitle": "Chapter 25: Real-time Gaming Leaderboard", "zhTitle": "第 25 章：实时游戏排行榜", "short": "Real-time Gaming Leaderboard", "num": "25"}, "26. Payment System": {"en": "\n<h2>Introduction<\/h2>\n<p>We'll design a <strong>payment system<\/strong> in this chapter, which underpins all of modern <strong>e-commerce<\/strong>.<\/p>\n<p>A <strong>payment system<\/strong> is used to settle financial transactions, transferring monetary value.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: What kind of payment system are we building?<\/li>\n<li>I: A payment backend for an e-commerce system, similar to Amazon.com. It handles everything related to money movement.<\/li>\n<li>C: What payment options are supported - Credit cards, PayPal, bank cards, etc?<\/li>\n<li>I: The system should support all these options in real life. For the purposes of the interview, we can use credit card payments.<\/li>\n<li>C: Do we handle credit card processing ourselves?<\/li>\n<li>I: No, we use a third-party provider like Stripe, Braintree, Square, etc.<\/li>\n<li>C: Do we store credit card data in our system?<\/li>\n<li>I: Due to compliance reasons, we do not store credit card data directly in our systems. We rely on third-party payment processors.<\/li>\n<li>C: Is the application global? Do we need to support different currencies and international payments?<\/li>\n<li>I: The application is global, but we assume only one currency is used for the purposes of the interview.<\/li>\n<li>C: How many payment transactions per day do we support?<\/li>\n<li>I: 1mil transactions per day.<\/li>\n<li>C: Do we need to support the payout flow to eg payout to payers each month?<\/li>\n<li>I: Yes, we need to support that<\/li>\n<li>C: Is there anything else I should pay attention to?<\/li>\n<li>I: We need to support reconciliations to fix any inconsistencies in communicating with internal and external systems.<\/li>\n<\/ul>\n<h3><strong>Functional requirements<\/strong><\/h3>\n<ul>\n<li>Pay-in flow - payment system receives money from customers on behalf of merchants<\/li>\n<li>Pay-out flow - payment system sends money to sellers around the world<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li>Reliability and fault-tolerance. Failed payments need to be carefully handled<\/li>\n<li>A reconciliation between internal and external systems needs to be setup.<\/li>\n<\/ul>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<p>The system needs to process 1mil transactions per day, which is 10 transactions per second.<\/p>\n<p>This is not a high throughput for any database system, so it's not the focus of this interview.<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>At a high-level, we have three actors, participating in money movement:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/high-level-flow.png\" alt=\"high-level-flow\" width=\"500\" />\n<\/div>\n\n<h3><strong>Pay-in flow<\/strong><\/h3>\n<p>Here's the high-level overview of the pay-in flow:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/payin-flow-high-level.png\" alt=\"pay-in-flow-high-level\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Payment service - accepts payment events and coordinates the payment process. It typically also does a risk check using a third-party provider for AML violations or criminal activity.<\/li>\n<li>Payment executor - executes a single payment order via the Payment Service Provider (PSP). Payment events may contain several payment orders.<\/li>\n<li>Payment service provider (PSP) - moves money from one account to another, eg from buyer's credit card account to e-commerce site's bank account.<\/li>\n<li>Card schemes - organizations that process credit card operations, eg Visa MasterCard, etc.<\/li>\n<li>Ledger - keeps financial record of all payment transactions.<\/li>\n<li>Wallet - keeps the account balance for all merchants.<\/li>\n<\/ul>\n<p>Here's an example pay-in flow:\n * user clicks \"place order\" and a payment event is sent to the payment service\n * payment service stores the event in its database\n * payment service calls the payment executor for all payment orders, part of that payment event\n * payment executor stores the payment order in its database\n * payment executor calls external PSP to process the credit card payment\n * After the payment executor processes the payment, the payment service updates the wallet to record how much money the seller has\n * wallet service stores updated balance information in its database\n * payment service calls the ledger to record all money movements<\/p>\n<h3><strong>APIs for payment service<\/strong><\/h3>\n<pre><code>POST /v1/payments\n{\n  &quot;buyer_info&quot;: {...},\n  &quot;checkout_id&quot;: &quot;some_id&quot;,\n  &quot;credit_card_info&quot;: {...},\n  &quot;payment_orders&quot;: [{...}, {...}, {...}]\n}\n<\/code><\/pre>\n<p>Example <code>payment_order<\/code>:<\/p>\n<pre><code>{\n  &quot;seller_account&quot;: &quot;SELLER_IBAN&quot;,\n  &quot;amount&quot;: &quot;3.15&quot;,\n  &quot;currency&quot;: &quot;USD&quot;,\n  &quot;payment_order_id&quot;: &quot;globally_unique_payment_id&quot;\n}\n<\/code><\/pre>\n<p>Caveats:\n * The <code>payment_order_id<\/code> is forwarded to the PSP to deduplicate payments, ie it is the idempotency key.\n * The amount field is <code>string<\/code> as <code>double<\/code> is not appropriate for representing monetary values.<\/p>\n<pre><code>GET /v1/payments/{:id}\n<\/code><\/pre>\n<p>This endpoint returns the execution status of a single payment, based on the <code>payment_order_id<\/code>.<\/p>\n<h3><strong>Payment service data model<\/strong><\/h3>\n<p>We need to maintain two tables - <code>payment_events<\/code> and <code>payment_orders<\/code>.<\/p>\n<p>For payments, performance is typically not an important factor. Strong consistency, however, is.<\/p>\n<p>Other considerations for choosing the database:\n * Strong market of DBAs to hire to administer the databaseS\n * Proven track-record where the database has been used by other big financial institutions\n * Richness of supporting tools\n * Traditional SQL over NoSQL/NewSQL for its ACID guarantees<\/p>\n<p>Here's what the <code>payment_events<\/code> table contains:\n * <code>checkout_id<\/code> - string, primary key\n * <code>buyer_info<\/code> - string (personal note - prob a foreign key to another table is more appropriate)\n * <code>seller_info<\/code> - string (personal note - same remark as above)\n * <code>credit_card_info<\/code> - depends on card provider\n * <code>is_payment_done<\/code> - boolean<\/p>\n<p>Here's what the <code>payment_orders<\/code> table contains:\n * <code>payment_order_id<\/code> - string, primary key\n * <code>buyer_account<\/code> - string\n * <code>amount<\/code> - string\n * <code>currency<\/code> - string\n * <code>checkout_id<\/code> - string, foreign key\n * <code>payment_order_status<\/code> - enum (<code>NOT_STARTED<\/code>, <code>EXECUTING<\/code>, <code>SUCCESS<\/code>, <code>FAILED<\/code>)\n * <code>ledger_updated<\/code> - boolean\n * <code>wallet_updated<\/code> - boolean<\/p>\n<p>Caveats:\n * there are many payment orders, linked to a given payment event\n * we don't need the <code>seller_info<\/code> for the pay-in flow. That's required on pay-out only\n * <code>ledger_updated<\/code> and <code>wallet_updated<\/code> are updated when the respective service is called to record the result of a payment\n * payment transitions are managed by a background job, which checks updates of in-flight payments and triggers an alert if a payment is not processed in a reasonable timeframe<\/p>\n<h3><strong>Double-entry ledger system<\/strong><\/h3>\n<p>The double-entry accounting mechanism is key to any payment system. It is a mechanism of tracking money movements by always applying money operations to two accounts, where one's account balance increases (credit) and the other decreases (debit):<\/p>\n<table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Debit<\/th>\n<th>Credit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>buyer<\/td>\n<td>$1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>seller<\/td>\n<td><\/td>\n<td>$1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Sum of all transaction entries is always zero. This mechanism provides end-to-end traceability of all money movements within the system.<\/p>\n<h3><strong>Hosted payment page<\/strong><\/h3>\n<p>To avoid storing credit card information and having to comply with various heavy regulations, most companies prefer utilizing a widget, provided by PSPs, which store and handle credit card payments for you:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/hosted-payment-page.png\" alt=\"hosted-payment-page\" width=\"500\" />\n<\/div>\n\n<h3><strong>Pay-out flow<\/strong><\/h3>\n<p>The components of the pay-out flow are very similar to the pay-in flow.<\/p>\n<p>Main differences:\n * money is moved from e-commerce site's bank account to merchant's bank account\n * we can utilize a third-party account payable provider such as Tipalti\n * There's a lot of bookkeeping and regulatory requirements to handle with regards to pay-outs as well<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>This section focuses on making the system faster, more robust and secure.<\/p>\n<h3><strong>PSP Integration<\/strong><\/h3>\n<p>If our system can directly connect to banks or card schemes, payment can be made without a PSP.\nThese kinds of connections are very rare and uncommon, typically done at large companies which can justify the investment.<\/p>\n<p>If we go down the traditional route, a PSP can be integrated in one of two ways:\n * Through API, if our payment system can collect payment information\n * Through a hosted payment page to avoid dealing with payment information regulations<\/p>\n<p>Here's how the hosted payment page workflow works:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/hosted-payment-page-workflow.png\" alt=\"hosted-payment-page-workflow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>User clicks \"checkout\" button in the browser<\/li>\n<li>Client calls the payment service with the payment order information<\/li>\n<li>After receiving payment order information, the payment service sends a payment registration request to the PSP.<\/li>\n<li>The PSP receives payment info such as currency, amount, expiration, etc, as well as a UUID for idempotency purposes. Typically the UUID of the payment order.<\/li>\n<li>The PSP returns a token back which uniquely identifies the payment registration. The token is stored in the payment service database.<\/li>\n<li>Once token is stored, the user is served with a PSP-hosted payment page. It is initialized using the token as well as a redirect URL for success/failure. <\/li>\n<li>User fills in payment details on the PSP page, PSP processes payment and returns the payment status<\/li>\n<li>User is now redirected back to the redirectURL. Example redirect url - <code>https://your-company.com/?tokenID=JIOUIQ123NSF&amp;payResult=X324FSa<\/code><\/li>\n<li>Asynchronously, the PSP calls our payment service via a webhook to inform our backend of the payment result<\/li>\n<li>Payment service records the payment result based on the webhook received<\/li>\n<\/ul>\n<h3><strong>Reconciliation<\/strong><\/h3>\n<p>The previous section explains the happy path of a payment. Unhappy paths are detected and reconciled using a background reconciliation process.<\/p>\n<p>Every night, the PSP sends a settlement file which our system uses to compare the external system's state against our internal system's state.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/settlement-report.png\" alt=\"settlement-report\" width=\"500\" />\n<\/div>\n\n<p>This process can also be used to detect internal inconsistencies between eg the ledger and the wallet services.<\/p>\n<p>Mismatches are handled manually by the finance team. Mismatches are handled as:\n * classifiable, hence, it is a known mismatch which can be adjusted using a standard procedure\n * classifiable, but can't be automated. Manually adjusted by the finance team\n * unclassifiable. Manually investigated and adjusted by the finance team<\/p>\n<h3><strong>Handling payment processing delays<\/strong><\/h3>\n<p>There are cases, where a payment can take hours to complete, although it typically takes seconds.<\/p>\n<p>This can happen due to:\n * a payment being flagged as high-risk and someone has to manually review it\n * credit card requires extra protection, eg 3D Secure Authentication, which requires extra details from card holder to complete<\/p>\n<p>These situations are handled by:\n * waiting for the PSP to send us a webhook when a payment is complete or polling its API if the PSP doesn't provide webhooks\n * showing a \"pending\" status to the user and giving them a page, where they can check-in for payment updates. We could also send them an email once their payment is complete<\/p>\n<h3><strong>Communication among internal services<\/strong><\/h3>\n<p>There are two types of communication patterns services use to communicate with one another - synchronous and asynchronous.<\/p>\n<p>Synchronous communication (ie HTTP) works well for small-scale systems, but suffers as scale increases:\n * low performance - request-response cycle is long as more services get involved in the call chain\n * poor failure isolation - if PSPs or any other service fails, user will not receive a response\n * tight coupling - sender needs to know the receiver\n * hard to scale - not easy to support sudden increase in traffic due to not having a buffer<\/p>\n<p>Asynchronous communication can be divided into two categories.<\/p>\n<p>Single receiver - multiple receivers subscribe to the same topic and messages are processed only once:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/single-receiver.png\" alt=\"single-receiver\" width=\"500\" />\n<\/div>\n\n<p>Multiple receivers - multiple receivers subscribe to the same topic, but messages are forwarded to all of them:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/multiple-receiver.png\" alt=\"multiple-receiver\" width=\"500\" />\n<\/div>\n\n<p>Latter model works well for our payment system as a payment can trigger multiple side effects, handled by different services.<\/p>\n<p>In a nutshell, synchronous communication is simpler but doesn't allow services to be autonomous. \nAsync communication trades simplicity and consistency for scalability and resilience.<\/p>\n<h3><strong>Handling failed payments<\/strong><\/h3>\n<p>Every payment system needs to address failed payments. Here are some of the mechanism we'll use to achieve that:\n * Tracking payment state - whenever a payment fails, we can determine whether to retry/refund based on the payment state.\n * Retry queue - payments which we'll retry are published to a retry queue\n * Dead-letter queue - payments which have terminally failed are pushed to a dead-letter queue, where the failed payment can be debugged and inspected.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/failed-payments.png\" alt=\"failed-payments\" width=\"500\" />\n<\/div>\n\n<h3><strong>Exactly-once delivery<\/strong><\/h3>\n<p>We need to ensure a payment gets processed exactly-once to avoid double-charging a customer.<\/p>\n<p>An operation is executed exactly-once if it is executed at-least-once and at-most-once at the same time.<\/p>\n<p>To achieve the at-least-once guarantee, we'll use a retry mechanism:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/retry-mechanism.png\" alt=\"retry-mechanism\" width=\"500\" />\n<\/div>\n\n<p>Here are some common strategies on deciding the retry intervals:\n * immediate retry - client immediately sends another request after failure\n * fixed intervals - wait a fixed amount of time before retrying a payment\n * incremental intervals - incrementally increase retry interval between each retry\n * exponential back-off - double retry interval between subsequent retries\n * cancel - client cancels the request. This happens when the error is terminal or retry threshold is reached<\/p>\n<p>As a rule of thumb, default to an exponential back-off retry strategy. A good practice is for the server to specify a retry interval using a <code>Retry-After<\/code> header.<\/p>\n<p>An issue with retries is that the server can potentially process a payment twice:\n * client clicks the \"pay button\" twice, hence, they are charged twice\n * payment is successfully processed by PSP, but not by downstream services (ledger, wallet). Retry causes the payment to be processed by the PSP again<\/p>\n<p>To address the double payment problem, we need to use an idempotency mechanism - a property that an operation applied multiple times is processed only once.<\/p>\n<p>From an API perspective, clients can make multiple calls which produce the same result. \nIdempotency is managed by a special header in the request (eg <code>idempotency-key<\/code>), which is typically a UUID.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/idempotency-example.png\" alt=\"idempotency-example\" width=\"500\" />\n<\/div>\n\n<p>Idempotency can be achieved using the database's mechanism of adding unique key constraints:\n * server attempts to insert a new row in the database\n * the insertion fails due to a unique key constraint violation\n * server detects that error and instead returns the existing object back to the client<\/p>\n<p>Idempotency is also applied at the PSP side, using the nonce, which was previously discussed. PSPs will take care to not process payments with the same nonce twice.<\/p>\n<h3><strong>Consistency<\/strong><\/h3>\n<p>There are several stateful services called throughout a payment's lifecycle - PSP, ledger, wallet, payment service.<\/p>\n<p>Communication between any two services can fail. \nWe can ensure eventual data consistency between all services by implementing exactly-once processing and reconciliation.<\/p>\n<p>If we use replication, we'll have to deal with replication lag, which can lead to users observing inconsistent data between primary and replica databases.<\/p>\n<p>To mitigate that, we can serve all reads and writes from the primary database and only utilize replicas for redundancy and fail-over.\nAlternatively, we can ensure replicas are always in-sync by utilizing a consensus algorithm such as Paxos or Raft.\nWe could also use a consensus-based distributed database such as YugabyteDB or CockroachDB.<\/p>\n<h3><strong>Payment security<\/strong><\/h3>\n<p>Here are some mechanisms we can use to ensure payment security:\n * Request/response eavesdropping - we can use HTTPS to secure all communication\n * Data tampering - enforce encryption and integrity monitoring\n * Man-in-the-middle attacks - use SSL \\w certificate pinning\n * Data loss - replicate data across multiple regions and take data snapshots\n * DDoS attack - implement rate limiting and firewall\n * Card theft - use tokens instead of storing real card information in our system\n * PCI compliance - a security standard for organizations which handle branded credit cards\n * Fraud - address verification, card verification value (CVV), user behavior analysis, etc<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Other talking points:\n * Monitoring and alerting\n * Debugging tools - we need tools which make it easy to understand why a payment has failed\n * Currency exchange - important when designing a payment system for international use\n * Geography - different regions might have different payment methods\n * Cash payment - very common in places like India and Brazil\n * Google/Apple Pay integration<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>本章将设计一个<strong>支付系统（payment system）<\/strong>，它支撑着整个现代<strong>电子商务（e-commerce）<\/strong>。<\/p>\n<p><strong>支付系统<\/strong>用于结算金融交易，转移货币价值。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<ul>\n<li>C：我们要构建什么样的支付系统？<\/li>\n<li>I：一个面向电商系统的支付后端，类似于 Amazon.com。它处理与资金流转相关的一切事务。<\/li>\n<li>C：支持哪些支付方式——信用卡、PayPal、银行卡等？<\/li>\n<li>I：现实中的系统应支持所有这些方式。在面试场景下，我们可以只使用信用卡支付。<\/li>\n<li>C：我们自己处理信用卡收单吗？<\/li>\n<li>I：不，我们使用第三方服务商，如 Stripe、Braintree、Square 等。<\/li>\n<li>C：我们在系统中存储信用卡数据吗？<\/li>\n<li>I：出于合规原因，我们不直接在系统中存储信用卡数据，而是依赖第三方支付处理商。<\/li>\n<li>C：应用是全球性的吗？我们需要支持不同货币和国际支付吗？<\/li>\n<li>I：应用是全球性的，但面试中我们假设只使用一种货币。<\/li>\n<li>C：每天支持多少笔支付交易？<\/li>\n<li>I：每天 100 万笔交易。<\/li>\n<li>C：我们需要支持出金流程吗，比如每月向付款方打款？<\/li>\n<li>I：是的，我们需要支持。<\/li>\n<li>C：还有其他需要注意的吗？<\/li>\n<li>I：我们需要支持对账，以修复与内外部系统交互中的任何不一致。<\/li>\n<\/ul>\n<h3><strong>功能需求<\/strong><\/h3>\n<ul>\n<li>入金流程（pay-in flow）——支付系统代表商家从客户那里收款<\/li>\n<li>出金流程（pay-out flow）——支付系统向全球各地的卖家付款<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li>可靠性与容错性。失败的支付需要被谨慎处理<\/li>\n<li>需要在内部系统与外部系统之间建立对账机制<\/li>\n<\/ul>\n<h3><strong>粗略估算<\/strong><\/h3>\n<p>系统每天需要处理 100 万笔交易，即每秒 10 笔交易。<\/p>\n<p>对于任何数据库系统来说，这都不算高吞吐量，因此它不是本次面试的重点。<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<p>在高层上，有三个参与资金流转的角色：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/high-level-flow.png\" alt=\"高层流程\" width=\"500\" />\n<\/div>\n\n<h3><strong>入金流程<\/strong><\/h3>\n<p>以下是入金流程的高层概览：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/payin-flow-high-level.png\" alt=\"入金流程高层视图\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>支付服务（Payment service）——接收支付事件并协调整个支付流程。它通常还会借助第三方服务商做风险检查，排查反洗钱（AML）违规或犯罪活动。<\/li>\n<li>支付执行器（Payment executor）——通过支付服务商（Payment Service Provider, PSP）执行单笔支付订单。一个支付事件可能包含多个支付订单。<\/li>\n<li>支付服务商（PSP）——把资金从一个账户转移到另一个账户，例如从买家的信用卡账户转移到电商网站的银行账户。<\/li>\n<li>卡组织（Card schemes）——处理信用卡操作的机构，例如 Visa、MasterCard 等。<\/li>\n<li>分类账（Ledger）——保存所有支付交易的财务记录。<\/li>\n<li>钱包（Wallet）——保存所有商家的账户余额。<\/li>\n<\/ul>\n<p>下面是一个入金流程的示例：\n * 用户点击「下单」，一个支付事件被发送到支付服务\n * 支付服务把事件存入自己的数据库\n * 支付服务针对该支付事件包含的所有支付订单调用支付执行器\n * 支付执行器把支付订单存入自己的数据库\n * 支付执行器调用外部 PSP 处理信用卡支付\n * 支付执行器处理完支付后，支付服务更新钱包，记录卖家持有的金额\n * 钱包服务把更新后的余额信息存入数据库\n * 支付服务调用分类账，记录所有资金变动<\/p>\n<h3><strong>支付服务的 API<\/strong><\/h3>\n<pre><code>POST /v1/payments\n{\n  &quot;buyer_info&quot;: {...},\n  &quot;checkout_id&quot;: &quot;some_id&quot;,\n  &quot;credit_card_info&quot;: {...},\n  &quot;payment_orders&quot;: [{...}, {...}, {...}]\n}\n<\/code><\/pre>\n<p><code>payment_order<\/code> 示例：<\/p>\n<pre><code>{\n  &quot;seller_account&quot;: &quot;SELLER_IBAN&quot;,\n  &quot;amount&quot;: &quot;3.15&quot;,\n  &quot;currency&quot;: &quot;USD&quot;,\n  &quot;payment_order_id&quot;: &quot;globally_unique_payment_id&quot;\n}\n<\/code><\/pre>\n<p>注意事项：\n * <code>payment_order_id<\/code> 会被转发给 PSP 用于支付去重，也就是说，它就是幂等键（idempotency key）。\n * amount 字段使用 <code>string<\/code> 类型，因为 <code>double<\/code> 不适合表示货币金额。<\/p>\n<pre><code>GET /v1/payments/{:id}\n<\/code><\/pre>\n<p>该端点基于 <code>payment_order_id<\/code> 返回单笔支付的执行状态。<\/p>\n<h3><strong>支付服务数据模型<\/strong><\/h3>\n<p>我们需要维护两张表——<code>payment_events<\/code> 和 <code>payment_orders<\/code>。<\/p>\n<p>对于支付而言，性能通常不是重要因素，而强一致性才是。<\/p>\n<p>选择数据库时的其他考虑：\n * 有充足的市场供给，可以雇到 DBA 来管理数据库\n * 有良好的记录——该数据库已被其他大型金融机构使用\n * 配套工具丰富\n * 传统 SQL 优于 NoSQL/NewSQL，因为它提供 ACID 保证<\/p>\n<p><code>payment_events<\/code> 表包含以下内容：\n * <code>checkout_id<\/code>——string，主键\n * <code>buyer_info<\/code>——string（个人备注：用外键关联到另一张表可能更合适）\n * <code>seller_info<\/code>——string（个人备注：同上）\n * <code>credit_card_info<\/code>——取决于卡组织\n * <code>is_payment_done<\/code>——boolean<\/p>\n<p><code>payment_orders<\/code> 表包含以下内容：\n * <code>payment_order_id<\/code>——string，主键\n * <code>buyer_account<\/code>——string\n * <code>amount<\/code>——string\n * <code>currency<\/code>——string\n * <code>checkout_id<\/code>——string，外键\n * <code>payment_order_status<\/code>——枚举（<code>NOT_STARTED<\/code>、<code>EXECUTING<\/code>、<code>SUCCESS<\/code>、<code>FAILED<\/code>）\n * <code>ledger_updated<\/code>——boolean\n * <code>wallet_updated<\/code>——boolean<\/p>\n<p>注意事项：\n * 一个支付事件会关联多个支付订单\n * 入金流程不需要 <code>seller_info<\/code>，它只在出金时需要\n * <code>ledger_updated<\/code> 和 <code>wallet_updated<\/code> 在调用相应服务记录支付结果时更新\n * 支付状态流转由后台任务管理，该任务检查进行中支付的更新情况，如果一笔支付在合理时间内未被处理，则触发告警<\/p>\n<h3><strong>复式记账分类账系统<\/strong><\/h3>\n<p>复式记账机制是任何支付系统的核心。它通过始终把资金操作同时记到两个账户上来追踪资金变动——一个账户余额增加（贷方，credit），另一个减少（借方，debit）：<\/p>\n<table>\n<thead>\n<tr>\n<th>账户<\/th>\n<th>借方（Debit）<\/th>\n<th>贷方（Credit）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>买家<\/td>\n<td>$1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>卖家<\/td>\n<td><\/td>\n<td>$1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>所有交易分录之和恒为零。这一机制为系统内所有资金变动提供了端到端的可追溯性。<\/p>\n<h3><strong>托管支付页<\/strong><\/h3>\n<p>为了避免存储信用卡信息、也为了避免遵守各种繁重的监管要求，大多数公司更愿意使用 PSP 提供的挂件（widget），由它替你存储和处理信用卡支付：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/hosted-payment-page.png\" alt=\"托管支付页\" width=\"500\" />\n<\/div>\n\n<h3><strong>出金流程<\/strong><\/h3>\n<p>出金流程的组件与入金流程非常相似。<\/p>\n<p>主要区别：\n * 资金从电商网站的银行账户转移到商家的银行账户\n * 我们可以使用第三方应付账款服务商，例如 Tipalti\n * 出金方面也有大量簿记和监管要求需要处理<\/p>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>本节聚焦于让系统更快、更健壮、更安全。<\/p>\n<h3><strong>PSP 集成<\/strong><\/h3>\n<p>如果我们的系统能直连银行或卡组织，就可以不经过 PSP 完成支付。<\/p>\n<p>这类直连非常少见，通常只有那些能证明这笔投资划算的大公司才会这样做。<\/p>\n<p>如果走传统路线，PSP 可以通过以下两种方式之一集成：\n * 通过 API——如果我们的支付系统可以自己采集支付信息\n * 通过托管支付页——以避免处理支付信息相关的监管问题<\/p>\n<p>托管支付页工作流的运行方式如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/hosted-payment-page-workflow.png\" alt=\"托管支付页工作流\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>用户在浏览器中点击「结账」按钮<\/li>\n<li>客户端携带支付订单信息调用支付服务<\/li>\n<li>支付服务收到支付订单信息后，向 PSP 发送支付注册请求<\/li>\n<li>PSP 收到货币、金额、有效期等支付信息，以及一个用于幂等目的的 UUID，通常就是支付订单的 UUID<\/li>\n<li>PSP 返回一个 token，唯一标识该支付注册。该 token 存储在支付服务数据库中<\/li>\n<li>token 存储好后，用户会被展示一个由 PSP 托管的支付页。该页面使用该 token 以及成功/失败后的跳转 URL 初始化<\/li>\n<li>用户在 PSP 页面填写支付详情，PSP 处理支付并返回支付状态<\/li>\n<li>用户随后被重定向回 redirectURL。跳转 URL 示例——<code>https://your-company.com/?tokenID=JIOUIQ123NSF&amp;payResult=X324FSa<\/code><\/li>\n<li>同时，PSP 通过 webhook 异步调用我们的支付服务，通知后端支付结果<\/li>\n<li>支付服务根据收到的 webhook 记录支付结果<\/li>\n<\/ul>\n<h3><strong>对账<\/strong><\/h3>\n<p>上一节讲的是支付的正常路径。异常路径则通过后台对账流程来发现和纠正。<\/p>\n<p>每天晚上，PSP 会发送一份结算文件，我们的系统用它把外部系统的状态与内部系统的状态进行比对。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/settlement-report.png\" alt=\"结算报告\" width=\"500\" />\n<\/div>\n\n<p>该流程也可以用来检测内部不一致，例如分类账服务与钱包服务之间的不一致。<\/p>\n<p>差异由财务团队人工处理。差异按以下方式处理：\n * 可分类——即已知差异，可以通过标准流程调整\n * 可分类但无法自动化——由财务团队人工调整\n * 不可分类——由财务团队人工调查并调整<\/p>\n<h3><strong>处理支付处理延迟<\/strong><\/h3>\n<p>有些情况下，一笔支付可能需要数小时才能完成，尽管它通常只需要几秒钟。<\/p>\n<p>这可能由以下原因导致：\n * 支付被标记为高风险，需要人工审核\n * 信用卡要求额外保护，例如 3D Secure 认证，需要持卡人提供额外信息才能完成<\/p>\n<p>这些情况按以下方式处理：\n * 等待 PSP 在支付完成后向我们发送 webhook；如果 PSP 不提供 webhook，则轮询其 API\n * 向用户展示「处理中」状态，并提供一个可以查看支付进度更新的页面。我们也可以在支付完成后给用户发一封邮件<\/p>\n<h3><strong>内部服务间通信<\/strong><\/h3>\n<p>服务之间有两种通信模式——同步和异步。<\/p>\n<p>同步通信（即 HTTP）适合小规模系统，但随着规模增大会暴露出问题：\n * 性能低——调用链涉及的服务越多，请求-响应周期越长\n * 故障隔离差——如果 PSP 或任何其他服务故障，用户将收不到响应\n * 紧耦合——发送方需要知道接收方是谁\n * 难以扩展——没有缓冲，难以应对流量突增<\/p>\n<p>异步通信可以分为两类。<\/p>\n<p>单接收方——多个接收方订阅同一主题，但消息只被处理一次：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/single-receiver.png\" alt=\"单接收方\" width=\"500\" />\n<\/div>\n\n<p>多接收方——多个接收方订阅同一主题，消息会被转发给所有接收方：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/multiple-receiver.png\" alt=\"多接收方\" width=\"500\" />\n<\/div>\n\n<p>后一种模型很适合我们的支付系统，因为一笔支付可能触发多个由不同服务处理的副作用。<\/p>\n<p>简而言之，同步通信更简单，但不允许服务自治；异步通信则以简单性和一致性换取可扩展性和韧性。<\/p>\n<h3><strong>处理支付失败<\/strong><\/h3>\n<p>每个支付系统都必须解决支付失败问题。我们将使用以下机制：\n * 追踪支付状态——每当支付失败时，我们可以根据支付状态决定是重试还是退款\n * 重试队列——需要重试的支付被发布到重试队列\n * 死信队列——彻底失败的支付被推入死信队列，可以在那里调试和检查失败的支付<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/failed-payments.png\" alt=\"失败的支付\" width=\"500\" />\n<\/div>\n\n<h3><strong>恰好一次投递<\/strong><\/h3>\n<p>我们需要确保一笔支付只被恰好处理一次，避免向客户重复扣款。<\/p>\n<p>一个操作如果同时满足至少一次（at-least-once）和至多一次（at-most-once），它就是被恰好一次（exactly-once）执行的。<\/p>\n<p>为了实现至少一次保证，我们使用重试机制：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/retry-mechanism.png\" alt=\"重试机制\" width=\"500\" />\n<\/div>\n\n<p>以下是决定重试间隔的一些常见策略：\n * 立即重试——客户端在失败后立即发送另一个请求\n * 固定间隔——在重试一笔支付前等待固定时长\n * 递增间隔——逐次增大每次重试之间的间隔\n * 指数退避（exponential back-off）——每次重试间隔翻倍\n * 取消——客户端取消请求。这发生在错误是终局性的或达到重试阈值时<\/p>\n<p>根据经验法则，默认使用指数退避重试策略。一个好的做法是服务器通过 <code>Retry-After<\/code> 响应头指定重试间隔。<\/p>\n<p>重试带来的一个问题是：服务器可能把一笔支付处理两次：\n * 客户端两次点击「支付按钮」，因此被扣款两次\n * 支付被 PSP 成功处理，但下游服务（分类账、钱包）没有处理。重试导致 PSP 再次处理该支付<\/p>\n<p>为了解决重复支付问题，我们需要使用幂等（idempotency）机制——即一个操作无论被执行多少次都只被处理一次的性质。<\/p>\n<p>从 API 角度看，客户端可以发起多次调用，而它们产生相同的结果。幂等通过请求中的一个特殊头（例如 <code>idempotency-key<\/code>）来管理，该头通常是一个 UUID。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"26. Payment System/images/idempotency-example.png\" alt=\"幂等示例\" width=\"500\" />\n<\/div>\n\n<p>幂等可以利用数据库添加唯一键约束的机制来实现：\n * 服务器尝试在数据库中插入新行\n * 插入因唯一键约束冲突而失败\n * 服务器检测到该错误，转而把已存在的对象返回给客户端<\/p>\n<p>幂等在 PSP 一侧同样适用，使用前面讨论过的 nonce。PSP 会确保不重复处理带有相同 nonce 的支付。<\/p>\n<h3><strong>一致性<\/strong><\/h3>\n<p>在一笔支付的生命周期中，会调用多个有状态服务——PSP、分类账、钱包、支付服务。<\/p>\n<p>任意两个服务之间的通信都可能失败。<\/p>\n<p>我们可以通过实现恰好一次处理和对账来保证所有服务之间的最终数据一致性。<\/p>\n<p>如果使用复制，就必须处理复制延迟，这可能导致用户在主库和副本库之间看到不一致的数据。<\/p>\n<p>为缓解这一问题，我们可以让所有读写都走主库，副本仅用于冗余和故障转移。<\/p>\n<p>或者，我们可以利用 Paxos 或 Raft 这类共识算法，确保副本始终与主库保持同步。我们也可以使用基于共识的分布式数据库，如 YugabyteDB 或 CockroachDB。<\/p>\n<h3><strong>支付安全<\/strong><\/h3>\n<p>以下是一些可以用来保障支付安全的机制：\n * 请求/响应窃听——我们可以使用 HTTPS 保护所有通信\n * 数据篡改——强制加密和完整性监控\n * 中间人攻击——使用带证书固定（certificate pinning）的 SSL\n * 数据丢失——跨多个区域复制数据并定期做数据快照\n * DDoS 攻击——实现限流和防火墙\n * 盗卡——使用 token，而不是在系统中存储真实卡信息\n * PCI 合规——针对处理品牌信用卡的组织的安全标准\n * 欺诈——地址验证、卡片验证码（CVV）、用户行为分析等<\/p>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>其他可讨论的话题：\n * 监控与告警\n * 调试工具——我们需要能帮助理解支付失败原因的工具\n * 货币兑换——在设计面向国际使用的支付系统时很重要\n * 地域——不同地区可能有不同的支付方式\n * 现金支付——在印度、巴西等地非常普遍\n * Google/Apple Pay 集成<\/p>", "enTitle": "Chapter 26: Payment System", "zhTitle": "第 26 章：支付系统", "short": "Payment System", "num": "26"}, "27.  Digital Wallet": {"en": "\n<h2>Introduction<\/h2>\n<p><strong>Payment platforms<\/strong> usually have a <strong>wallet service<\/strong>, where they allow clients to store funds within the application, which they can withdraw later.<\/p>\n<p>You can also use it to pay for goods &amp; services or transfer money to other users, who use the <strong>digital wallet<\/strong> service. That can be faster and cheaper than doing it via normal payment rails.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/digital-wallet.png\" alt=\"digital-wallet\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<ul>\n<li>C: Should we only focus on transfers between digital wallets? Should we support any other operations?<\/li>\n<li>I: Let's focus on transfers between digital wallets for now.<\/li>\n<li>C: How many transactions per second does the system need to support?<\/li>\n<li>I: Let's assume 1mil TPS<\/li>\n<li>C: A digital wallet has strict correctness requirements. Can we assume transactional guarantees are sufficient?<\/li>\n<li>I: Sounds good<\/li>\n<li>C: Do we need to prove correctness?<\/li>\n<li>I: We can do that via reconciliation, but that only detects discrepancies vs. showing us the root cause for them. Instead, we want to be able to replay data from the beginning to reconstruct the history.<\/li>\n<li>C: Can we assume availability requirement is 99.99%?<\/li>\n<li>I: Yes<\/li>\n<li>C: Do we need to take foreign exchange into consideration?<\/li>\n<li>I: No, it's out of scope<\/li>\n<\/ul>\n<p>Here's what we have to support in summary:\n * Support balance transfers between two accounts\n * Support 1mil TPS\n * Reliability is 99.99%\n * Support transactions\n * Support reproducibility<\/p>\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<p>A traditional relational database, provisioned in the cloud can support ~1000 TPS.<\/p>\n<p>In order to reach 1mil TPS, we'd need 1000 database nodes. But if each transfer has two legs, then we actually need to support 2mil TPS.<\/p>\n<p>One of our design goals would be to increase the TPS a single node can handle so that we can have less database nodes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Per-node TPS<\/th>\n<th>Node Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>100<\/td>\n<td>20,000<\/td>\n<\/tr>\n<tr>\n<td>1,000<\/td>\n<td>2,000<\/td>\n<\/tr>\n<tr>\n<td>10,000<\/td>\n<td>200<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3><strong>API Design<\/strong><\/h3>\n<p>We only need to support one endpoint for this interview:<\/p>\n<pre><code>POST /v1/wallet/balance_transfer - transfers balance from one wallet to another\n<\/code><\/pre>\n<p>Request parameters - from_account, to_account, amount (string to not lose precision), currency, transaction_id (idempotency key).<\/p>\n<p>Sample response:<\/p>\n<pre><code>{\n    &quot;status&quot;: &quot;success&quot;\n    &quot;transaction_id&quot;: &quot;01589980-2664-11ec-9621-0242ac130002&quot;\n}\n<\/code><\/pre>\n<h3><strong>In-memory sharding solution<\/strong><\/h3>\n<p>Our wallet application maintains account balances for every user account.<\/p>\n<p>One good data structure to represent this is a <code>map&lt;user_id, balance&gt;<\/code>, which can be implemented using an in-memory Redis store.<\/p>\n<p>Since one redis node cannot withstand 1mil TPS, we need to partition our redis cluster into multiple nodes.<\/p>\n<p>Example partitioning algorithm:<\/p>\n<pre><code>String accountID = &quot;A&quot;;\nInt partitionNumber = 7;\nInt myPartition = accountID.hashCode() % partitionNumber;\n<\/code><\/pre>\n<p>Zookeeper can be used to store the number of partitions and addresses of redis nodes as it's a highly-available configuration storage. <\/p>\n<p>Finally, a wallet service is a stateless service responsible for carrying out transfer operations. It can easily scale horizontally:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/wallet-service.png\" alt=\"wallet-service\" width=\"500\" />\n<\/div>\n\n<p>Although this solution addresses scalability concerns, it doesn't allow us to execute balance transfers atomically.<\/p>\n<h3><strong>Distributed transactions<\/strong><\/h3>\n<p>One approach for handling transactions is to use the two-phase commit protocol on top of standard, sharded relational databases:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/distributed-transactions-relational-dbs.png\" alt=\"distributed-transactions-relational-dbs\" width=\"500\" />\n<\/div>\n\n<p>Here's how the two-phase commit (2PC) protocol works:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/2pc-protocol.png\" alt=\"2pc-protocol\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Coordinator (wallet service) performs read and write operations on multiple databases as normal<\/li>\n<li>When application is ready to commit the transaction, coordinator asks all databases to prepare it<\/li>\n<li>If all databases replied with a \"yes\", then the coordinator asks the databases to commit the transaction.<\/li>\n<li>Otherwise, all databases are asked to abort the transaction<\/li>\n<\/ul>\n<p>Downsides to the 2PC approach:\n * Not performant due to lock contention\n * The coordinator is a single point of failure<\/p>\n<h3><strong>Distributed transaction using Try-Confirm/Cancel (TC/C)<\/strong><\/h3>\n<p>TC/C is a variation of the 2PC protocol, which works with compensating transactions:\n * Coordinator asks all databases to reserve resources for the transaction\n * Coordinator collects replies from DBs - if yes, DBs are asked to try-confirm. If no, DBs are asked to try-cancel.<\/p>\n<p>One important difference between TC/C and 2PC is that 2PC performs a single transaction, whereas in TC/C, there are two independent transactions.<\/p>\n<p>Here's how TC/C works in phases:<\/p>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Operation<\/th>\n<th>A<\/th>\n<th>C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Try<\/td>\n<td>Balance change: -$1<\/td>\n<td>Do nothing<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Confirm<\/td>\n<td>Do nothing<\/td>\n<td>Balance change: +$1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Cancel<\/td>\n<td>Balance change: +$1<\/td>\n<td>Do Nothing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Phase 1 - try:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/try-phase.png\" alt=\"try-phase\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>coordinator starts local transaction in A's DB to reduce A's balance by 1$<\/li>\n<li>C's DB is given a NOP instruction, which does nothing<\/li>\n<\/ul>\n<p>Phase 2a - confirm:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/confirm-phase.png\" alt=\"confirm-phase\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>if both DBs replied with \"yes\", confirm phase starts.<\/li>\n<li>A's DB receives NOP, whereas C's DB is instructed to increase C's balance by 1$ (local transaction)<\/li>\n<\/ul>\n<p>Phase 2b - cancel:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/cancel-phase.png\" alt=\"cancel-phase\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>If any of the operations in phase 1 fails, the cancel phase starts.<\/li>\n<li>A's DB is instructed to increase A's balance by 1$, C's DB receives NOP<\/li>\n<\/ul>\n<p>Here's a comparison between 2PC and TC/C:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>First Phase<\/th>\n<th>Second Phase: success<\/th>\n<th>Second Phase: fail<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2PC<\/td>\n<td>transactions are not done yet<\/td>\n<td>Commit/Cancel all transactions<\/td>\n<td>Cancel all transactions<\/td>\n<\/tr>\n<tr>\n<td>TC/C<\/td>\n<td>All transactions are completed - committed or canceled<\/td>\n<td>Execute new transactions if needed<\/td>\n<td>Reverse the already committed transaction<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>TC/C is also referred to as a distributed transaction by compensation. High-level operation is handled in the business logic.<\/p>\n<p>Other properties of TC/C:\n * database agnostic, as long as database supports transactions\n * Details and complexity of distributed transactions need to be handled in the business logic<\/p>\n<h3><strong>TC/C Failure modes<\/strong><\/h3>\n<p>If the coordinator dies mid-flight, it needs to recover its intermediary state. \nThat can be done by maintaining phase status tables, atomically updated within the database shards:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/phase-status-tables.png\" alt=\"phase-status-tables\" width=\"500\" />\n<\/div>\n\n<p>What does that table contain:\n * ID and content of distributed transaction\n * status of try phase - not sent, has been sent, response received\n * second phase name - confirm or cancel\n * status of second phase\n * out-of-order flag (explained later)<\/p>\n<p>One caveat when using TC/C is that there is a brief moment where the account states are inconsistent with each other while a distributed transaction is in-flight:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/unbalanced-state.png\" alt=\"unbalanced-state\" width=\"500\" />\n<\/div>\n\n<p>This is fine as long as we always recover from this state and that users cannot use the intermediary state to eg spend it. \nThis is guaranteed by always executing deductions prior to additions.<\/p>\n<table>\n<thead>\n<tr>\n<th>Try phase choices<\/th>\n<th>Account A<\/th>\n<th>Account C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Choice 1<\/td>\n<td>-$1<\/td>\n<td>NOP<\/td>\n<\/tr>\n<tr>\n<td>Choice 2 (invalid)<\/td>\n<td>NOP<\/td>\n<td>+$1<\/td>\n<\/tr>\n<tr>\n<td>Choice 3 (invalid)<\/td>\n<td>-$1<\/td>\n<td>+$1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note that choice 3 from table above is invalid because we cannot guarantee atomic execution of transactions across different databases without relying on 2PC.<\/p>\n<p>One edge-case to address is out of order execution:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/out-of-order-execution.png\" alt=\"out-of-order-execution\" width=\"500\" />\n<\/div>\n\n<p>It is possible that a database receives a cancel operation, before receiving a try. This edge case can be handled by adding an out of order flag in our phase status table.\nWhen we receive a try operation, we first check if the out of order flag is set and if so, a failure is returned.<\/p>\n<h3><strong>Distributed transaction using Saga<\/strong><\/h3>\n<p>Another popular approach is using Sagas - a standard for implementing distributed transactions with microservice architectures.<\/p>\n<p>Here's how it works:\n * all operations are ordered in a sequence. All operations are independent in their own databases.\n * operations are executed from first to last\n * when an operation fails, the entire process starts to roll back until the beginning with compensating operations<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/saga.png\" alt=\"saga\" width=\"500\" />\n<\/div>\n\n<p>How do we coordinate the workflow? There are two approaches we can take:\n * Choreography - all services involved in a saga subscribe to the related events and do their part in the saga\n * Orchestration - a single coordinator instructs all services to do their jobs in the correct order<\/p>\n<p>The challenge of using choreography is that business logic is split across multiple service, which communicate asynchronously.\nThe orchestration approach handles complexity well, so it is typically the preferred approach in a digital wallet system.<\/p>\n<p>Here's a comparison between TC/C and Saga:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>TC/C<\/th>\n<th>Saga<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Compensating action<\/td>\n<td>In Cancel phase<\/td>\n<td>In rollback phase<\/td>\n<\/tr>\n<tr>\n<td>Central coordination<\/td>\n<td>Yes<\/td>\n<td>Yes (orchestration mode)<\/td>\n<\/tr>\n<tr>\n<td>Operation execution order<\/td>\n<td>any<\/td>\n<td>linear<\/td>\n<\/tr>\n<tr>\n<td>Parallel execution possibility<\/td>\n<td>Yes<\/td>\n<td>No (linear execution)<\/td>\n<\/tr>\n<tr>\n<td>Could see the partial inconsistent status<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Application or database logic<\/td>\n<td>Application<\/td>\n<td>Application<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The main difference is that TC/C is parallelizable, so our decision is based on the latency requirement - if we need to achieve low latency, we should go for the TC/C approach.<\/p>\n<p>Regardless of the approach we take, we still need to support auditing and replaying history to recover from failed states.<\/p>\n<h3><strong>Event sourcing<\/strong><\/h3>\n<p>In real-life, a digital wallet application might be audited and we have to answer certain questions:\n * Do we know the account balance at any given time?\n * How do we know the historical and current balances are correct?\n * How do we prove the system logic is correct after a code change?<\/p>\n<p>Event sourcing is a technique which helps us answer these questions.<\/p>\n<p>It consists of four concepts:\n * command - intended action from the real world, eg transfer 1$ from account A to B. Need to have a global order, due to which they're put into a FIFO queue.\n   * commands, unlike events, can fail and have some randomness due to eg IO or invalid state.\n   * commands can produce zero or more events\n   * event generation can contain randomness such as external IO. This will be revisited later\n * event - historical facts about events which occured in the system, eg \"transferred 1$ from A to B\".\n   * unlike commands, events are facts that have happened within our system\n   * similar to commands, they need to be ordered, hence, they're enqueued in a FIFO queue\n * state - what has changed as a result of an event. Eg a key-value store between account and their balances.\n * state machine - drives the event sourcing process. It mainly validates commands and applies events to update the system state.\n   * the state machine should be deterministic, hence, it shouldn't read external IO or rely on randomness. <\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/event-sourcing.png\" alt=\"event-sourcing\" width=\"500\" />\n<\/div>\n\n<p>Here's a dynamic view of event sourcing:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/dynamic-event-sourcing.png\" alt=\"dynamic-event-sourcing\" width=\"500\" />\n<\/div>\n\n<p>For our wallet service, the commands are balance transfer requests. We can put them in a FIFO queue, such as Kafka:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/command-queue.png\" alt=\"command-queue\" width=\"500\" />\n<\/div>\n\n<p>Here's the full picture:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/wallet-service-state-macghine.png\" alt=\"wallet-service-state-machine\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>state machine reads commands from the command queue<\/li>\n<li>balance state is read from the database<\/li>\n<li>command is validated. If valid, two events for each of the accounts is generated<\/li>\n<li>next event is read and applied by updating the balance (state) in the database<\/li>\n<\/ul>\n<p>The main advantage of using event sourcing is its reproducibility. In this design, all state update operations are saved as immutable history of all balance changes.<\/p>\n<p>Historical balances can always be reconstructed by replaying events from the beginning. \nBecause the event list is immutable and the state machine is deterministic, we are guaranteed to succeed in replaying any of the intermediary states.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/historical-states.png\" alt=\"historical-states\" width=\"500\" />\n<\/div>\n\n<p>All audit-related questions asked in the beginning of the section can be addressed by relying on event sourcing:\n * Do we know the account balance at any given time? - events can be replayed from the start until the point which we are interested in\n * How do we know the historical and current balances are correct? - correctness can be verified by recalculating all events from the start\n * How do we prove the system logic is correct after a code change? - we can run different versions of the code against the events and verify their results are identical<\/p>\n<p>Answering client queries about their balance can be addressed using the CQRS architecture - there can be multiple read-only state machines which are responsible for querying the historical state, based on the immutable events list:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/cqrs-architecture.png\" alt=\"cqrs-architecture\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>In this section we'll explore some performance optimizations as we're still required to scale to 1mil TPS.<\/p>\n<h3><strong>High-performance event sourcing<\/strong><\/h3>\n<p>The first optimization we'll explore is to save commands and events into local disk store instead of an external store such as Kafka.<\/p>\n<p>This avoids the network latency and also, since we're only doing appends, that operation is generally fast for HDDs.<\/p>\n<p>The next optimization is to cache recent commands and events in-memory in order to save the time of loading them back from disk.<\/p>\n<p>At a low-level, we can achieve the aforementioned optimizations by leveraging a command called mmap, which stores data in local disk as well as cache it in-memory:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/mmap-optimization.png\" alt=\"mmap-optimization\" width=\"500\" />\n<\/div>\n\n<p>The next optimization we can do is also store state in the local file system using SQLite - a file-based local relational database. RocksDB is also another good option.<\/p>\n<p>For our purposes, we'll choose RocksDB because it uses a log-structured merge-tree (LSM), which is optimized for write operations.\nRead performance is optimized via caching.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/rocks-db-approach.png\" alt=\"rocks-db-approach\" width=\"500\" />\n<\/div>\n\n<p>To optimize the reproducibility, we can periodically save snapshots to disk so that we don't have to reproduce a given state from the very beginning every time. We could store snapshots as large binary files in distributed file storage, eg HDFS:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/snapshot-approach.png\" alt=\"snapshot-approach\" width=\"500\" />\n<\/div>\n\n<h3><strong>Reliable high-performance event sourcing<\/strong><\/h3>\n<p>All the optimizations done so far are great, but they make our service stateful. We need to introduce some form of replication for reliability purposes.<\/p>\n<p>Before we do that, we should analyze what kind of data needs high reliability in our system:\n * state and snapshot can always be regenerated by reproducing them from the events list. Hence, we only need to guarantee the event list reliability.\n * one might think we can always regenerate the events list from the command list, but that is not true, since commands are non-deterministic.\n * conclusion is that we need to ensure high reliability for the events list only<\/p>\n<p>In order to achieve high reliability for events, we need to replicate the list across multiple nodes. We need to guarantee:\n * that there is no data loss\n * the relative order of data within a log file remains the same across replicas<\/p>\n<p>To achieve this, we can employ a consensus algorithm, such as Raft.<\/p>\n<p>With Raft, there is a leader who is active and there are followers who are passive. If a leader dies, one of the followers picks up. \nAs long as more than half of the nodes are up, the system continues running.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/raft-replication.png\" alt=\"raft-replication\" width=\"500\" />\n<\/div>\n\n<p>With this approach, all nodes update the state, based on the events list. Raft ensures leader and followers have the same events list.<\/p>\n<h3><strong>Distributed event sourcing<\/strong><\/h3>\n<p>So far, we've managed to design a system which has high single-node performance and is reliable.<\/p>\n<p>Some limitations we have to tackle:\n * The capacity of a single raft group is limited. At some point, we need to shard the data and implement distributed transactions\n * In the CQRS architecture, the request/response flow is slow. A client would need to periodically poll the system to learn when their wallet has been updated<\/p>\n<p>Polling is not real-time, hence, it can take a while for a user to learn about an update in their balance. Also, it can overload the query services if the polling frequency is too high:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/polling-approach.png\" alt=\"polling-approach\" width=\"500\" />\n<\/div>\n\n<p>To mitigate the system load, we can introduce a reverse proxy, which sends commands on behalf of the user and polls for response on their behalf:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/reverse-proxy.png\" alt=\"reverse-proxy\" width=\"500\" />\n<\/div>\n\n<p>This alleviates the system load as we could fetch data for multiple users using a single request, but it still doesn't solve the real-time receipt requirement.<\/p>\n<p>One final change we could do is make the read-only state machines push responses back to the reverse proxy once it's available. This can give the user the sense that updates happen real-time:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/push-state-machines.png\" alt=\"push-state-machines\" width=\"500\" />\n<\/div>\n\n<p>Finally, to scale the system even further, we can shard the system into multiple raft groups, where we implement distributed transactions on top of them using an orchestrator either via TC/C or Sagas:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/sharded-raft-groups.png\" alt=\"sharded-raft-groups\" width=\"500\" />\n<\/div>\n\n<p>Here's an example lifecycle of a balance transfer request in our final system:\n * User A sends a distributed transaction to the Saga coordinator with two operations - <code>A-1<\/code> and <code>C+1<\/code>.\n * Saga coordinator creates a record in the phase status table to trace the status of the transaction\n * Coordinator determines which partitions it needs to send commands to.\n * Partition 1's raft leader receives the <code>A-1<\/code> command, validates it, converts it to an event and replicates it across other nodes in the raft group\n * Event result is synchronized to the read state machine, which pushes a response back to the coordinator\n * Coordinator creates a record indicating that the operation was successful and proceeds with the next operation - <code>C+1<\/code>\n * Next operation is executed similarly to the first one - partition is determined, command is sent, executed, read state machine pushes back a response\n * Coordinator creates a record indicating operation 2 was also successful and finally informs the client of the result<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>Here's the evolution of our design:\n * We started from a solution using an in-memory Redis. The problem with this approach is that it is not durable storage.\n * We moved on to using relational databases, on top of which we execute distributed transactions using 2PC, TC/C or distributed saga.\n * Next, we introduced event sourcing in order to make all the operations auditable\n * We started by storing the data into external storage using external database and queue, but that's not performant\n * We proceeded to store data in local file storage, leveraging the performance of append-only operations. We also used caching to optimize the read path\n * The previous approach, although performant, wasn't durable. Hence, we introduced Raft consensus with replication to avoid single points of failure\n * We also adopted CQRS with a reverse proxy to manage a transaction's lifecycle on behalf of our users\n * Finally, we partitioned our data across multiple raft groups, which are orchestrated using a distributed transaction mechanism - TC/C or distributed saga<\/p>", "zh": "\n<h2>引言<\/h2>\n<p><strong>支付平台（payment platform）<\/strong>通常都有一个<strong>钱包服务（wallet service）<\/strong>，允许客户在应用内存储资金，之后再提现。<\/p>\n<p>你也可以用它来支付商品和服务，或者把钱转账给其他使用<strong>数字钱包（digital wallet）<\/strong>服务的用户。相比走普通支付通道，这样做可能更快、更便宜。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/digital-wallet.png\" alt=\"数字钱包\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<ul>\n<li>C：我们是否只关注数字钱包之间的转账？还需要支持其他操作吗？<\/li>\n<li>I：我们先聚焦数字钱包之间的转账。<\/li>\n<li>C：系统需要支持每秒多少笔交易？<\/li>\n<li>I：假设 100 万 TPS<\/li>\n<li>C：数字钱包有严格的正确性要求。我们可以认为事务保证就足够了吗？<\/li>\n<li>I：听起来不错<\/li>\n<li>C：我们需要证明正确性吗？<\/li>\n<li>I：我们可以通过对账来做到，但对账只能发现差异，而不能告诉我们差异的根因。相反，我们希望能够从头重放数据，以重建历史。<\/li>\n<li>C：可用性要求可以定为 99.99% 吗？<\/li>\n<li>I：可以<\/li>\n<li>C：我们需要考虑外汇吗？<\/li>\n<li>I：不需要，它不在范围内<\/li>\n<\/ul>\n<p>总结一下我们需要支持的内容：\n * 支持两个账户之间的余额转账\n * 支持 100 万 TPS\n * 可靠性为 99.99%\n * 支持事务\n * 支持可复现性<\/p>\n<h3><strong>粗略估算<\/strong><\/h3>\n<p>在云上部署的传统关系数据库大约可以支持 1000 TPS。<\/p>\n<p>为了达到 100 万 TPS，我们需要 1000 个数据库节点。但如果每笔转账都涉及转出和转入两侧，那实际上需要支持 200 万 TPS。<\/p>\n<p>我们的设计目标之一是提升单个节点能处理的 TPS，从而减少所需的数据库节点数量。<\/p>\n<table>\n<thead>\n<tr>\n<th>单节点 TPS<\/th>\n<th>节点数量<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>100<\/td>\n<td>20,000<\/td>\n<\/tr>\n<tr>\n<td>1,000<\/td>\n<td>2,000<\/td>\n<\/tr>\n<tr>\n<td>10,000<\/td>\n<td>200<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<h3><strong>API 设计<\/strong><\/h3>\n<p>面试中我们只需要支持一个端点：<\/p>\n<pre><code>POST /v1/wallet/balance_transfer - transfers balance from one wallet to another\n<\/code><\/pre>\n<p>请求参数——from_account、to_account、amount（用 string 以避免丢失精度）、currency、transaction_id（幂等键）。<\/p>\n<p>响应示例：<\/p>\n<pre><code>{\n    &quot;status&quot;: &quot;success&quot;\n    &quot;transaction_id&quot;: &quot;01589980-2664-11ec-9621-0242ac130002&quot;\n}\n<\/code><\/pre>\n<h3><strong>内存分片方案<\/strong><\/h3>\n<p>我们的钱包应用为每个用户账户维护账户余额。<\/p>\n<p>表示这一数据的一个好结构是 <code>map&lt;user_id, balance&gt;<\/code>，可以用内存版 Redis 存储来实现。<\/p>\n<p>由于单个 Redis 节点扛不住 100 万 TPS，我们需要把 Redis 集群分区到多个节点上。<\/p>\n<p>分区算法示例：<\/p>\n<pre><code>String accountID = &quot;A&quot;;\nInt partitionNumber = 7;\nInt myPartition = accountID.hashCode() % partitionNumber;\n<\/code><\/pre>\n<p>Zookeeper 可以用来存储分区数量和各 Redis 节点的地址，因为它是一个高可用的配置存储。<\/p>\n<p>最后，钱包服务是一个无状态服务，负责执行转账操作。它可以轻松地水平扩展：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/wallet-service.png\" alt=\"钱包服务\" width=\"500\" />\n<\/div>\n\n<p>虽然这个方案解决了可扩展性问题，但它不支持原子地执行余额转账。<\/p>\n<h3><strong>分布式事务<\/strong><\/h3>\n<p>处理事务的一种方法是在标准的、分片的关系数据库之上使用两阶段提交协议（2PC）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/distributed-transactions-relational-dbs.png\" alt=\"基于关系数据库的分布式事务\" width=\"500\" />\n<\/div>\n\n<p>两阶段提交（two-phase commit, 2PC）协议的工作方式如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/2pc-protocol.png\" alt=\"2PC 协议\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>协调者（钱包服务）像平常一样在多个数据库上执行读写操作<\/li>\n<li>当应用准备提交事务时，协调者要求所有数据库 prepare（预提交）<\/li>\n<li>如果所有数据库都回复「yes」，协调者再要求各数据库提交事务<\/li>\n<li>否则，要求所有数据库中止事务<\/li>\n<\/ul>\n<p>2PC 方案的缺点：\n * 因锁竞争而性能不佳\n * 协调者是单点故障<\/p>\n<h3><strong>使用 Try-Confirm/Cancel（TC/C）的分布式事务<\/strong><\/h3>\n<p>TC/C 是 2PC 协议的一个变体，它使用补偿事务：\n * 协调者要求所有数据库为事务预留资源\n * 协调者收集各数据库的回复——如果是 yes，要求各数据库 try-confirm；如果是 no，要求各数据库 try-cancel<\/p>\n<p>TC/C 与 2PC 的一个重要区别是：2PC 执行单个事务，而在 TC/C 中有两个独立的事务。<\/p>\n<p>TC/C 分阶段的工作方式如下：<\/p>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>操作<\/th>\n<th>A<\/th>\n<th>C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Try<\/td>\n<td>余额变动：-$1<\/td>\n<td>无操作<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Confirm<\/td>\n<td>无操作<\/td>\n<td>余额变动：+$1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Cancel<\/td>\n<td>余额变动：+$1<\/td>\n<td>无操作<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>阶段 1——try（尝试）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/try-phase.png\" alt=\"try 阶段\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>协调者在 A 的数据库中开启本地事务，把 A 的余额减少 $1<\/li>\n<li>给 C 的数据库下发一条 NOP 指令，什么也不做<\/li>\n<\/ul>\n<p>阶段 2a——confirm（确认）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/confirm-phase.png\" alt=\"confirm 阶段\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>如果两个数据库都回复「yes」，进入 confirm 阶段<\/li>\n<li>A 的数据库收到 NOP，而 C 的数据库被指示把 C 的余额增加 $1（本地事务）<\/li>\n<\/ul>\n<p>阶段 2b——cancel（取消）：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/cancel-phase.png\" alt=\"cancel 阶段\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>如果阶段 1 中有任何操作失败，进入 cancel 阶段<\/li>\n<li>A 的数据库被指示把 A 的余额增加 $1，C 的数据库收到 NOP<\/li>\n<\/ul>\n<p>下面是 2PC 与 TC/C 的对比：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>第一阶段<\/th>\n<th>第二阶段：成功<\/th>\n<th>第二阶段：失败<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2PC<\/td>\n<td>事务尚未完成<\/td>\n<td>提交/取消所有事务<\/td>\n<td>取消所有事务<\/td>\n<\/tr>\n<tr>\n<td>TC/C<\/td>\n<td>所有事务都已完成——已提交或已取消<\/td>\n<td>按需执行新事务<\/td>\n<td>回滚已提交的事务<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>TC/C 也被称为基于补偿的分布式事务。高层操作在业务逻辑中处理。<\/p>\n<p>TC/C 的其他特性：\n * 与数据库无关，只要数据库支持事务即可\n * 分布式事务的细节和复杂性需要在业务逻辑中处理<\/p>\n<h3><strong>TC/C 失败模式<\/strong><\/h3>\n<p>如果协调者在中途宕机，它需要恢复其中间状态。这可以通过维护阶段状态表来实现，并在各数据库分片内原子更新：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/phase-status-tables.png\" alt=\"阶段状态表\" width=\"500\" />\n<\/div>\n\n<p>该表包含的内容：\n * 分布式事务的 ID 和内容\n * try 阶段的状态——未发送、已发送、已收到回复\n * 第二阶段名称——confirm 或 cancel\n * 第二阶段的状态\n * 乱序标志（稍后解释）<\/p>\n<p>使用 TC/C 时的一个注意事项是：在分布式事务进行中，会有一小段时间各账户状态彼此不一致：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/unbalanced-state.png\" alt=\"不平衡状态\" width=\"500\" />\n<\/div>\n\n<p>只要我们总能从这种状态中恢复、并且用户不能利用这种中间状态（例如把它花掉），那就没问题。这一点由「始终先执行扣款、再执行入账」来保证。<\/p>\n<table>\n<thead>\n<tr>\n<th>Try 阶段的选择<\/th>\n<th>账户 A<\/th>\n<th>账户 C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>选择 1<\/td>\n<td>-$1<\/td>\n<td>NOP<\/td>\n<\/tr>\n<tr>\n<td>选择 2（无效）<\/td>\n<td>NOP<\/td>\n<td>+$1<\/td>\n<\/tr>\n<tr>\n<td>选择 3（无效）<\/td>\n<td>-$1<\/td>\n<td>+$1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>注意，上表中的选择 3 是无效的，因为如果不依赖 2PC，我们无法保证跨不同数据库的事务原子执行。<\/p>\n<p>一个需要处理的边缘情况是乱序执行：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/out-of-order-execution.png\" alt=\"乱序执行\" width=\"500\" />\n<\/div>\n\n<p>数据库有可能先收到 cancel 操作、后收到 try 操作。这个边缘情况可以通过在阶段状态表中加一个乱序标志来处理。当我们收到 try 操作时，先检查乱序标志是否已设置；如果已设置，则返回失败。<\/p>\n<h3><strong>使用 Saga 的分布式事务<\/strong><\/h3>\n<p>另一种流行的方法是使用 Saga——在微服务架构中实现分布式事务的标准。<\/p>\n<p>它的工作方式：\n * 所有操作按一个序列排好。每个操作在自己的数据库内是独立的\n * 操作从头至尾依次执行\n * 当某个操作失败时，整个流程开始用补偿操作回滚，一直回滚到起点<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/saga.png\" alt=\"Saga\" width=\"500\" />\n<\/div>\n\n<p>我们如何协调工作流？有两种方法：\n * 编排（Choreography）——参与 Saga 的所有服务订阅相关事件，各自完成 Saga 中自己的部分\n * 协同（Orchestration）——由一个协调者指示所有服务按正确顺序完成各自的工作<\/p>\n<p>使用编排方式的挑战在于：业务逻辑被分散到多个异步通信的服务中。协同方式能很好地处理复杂性，因此它通常是数字钱包系统中的首选方案。<\/p>\n<p>下面是 TC/C 与 Saga 的对比：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>TC/C<\/th>\n<th>Saga<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>补偿动作<\/td>\n<td>在 Cancel 阶段<\/td>\n<td>在回滚阶段<\/td>\n<\/tr>\n<tr>\n<td>集中协调<\/td>\n<td>有<\/td>\n<td>有（协同模式）<\/td>\n<\/tr>\n<tr>\n<td>操作执行顺序<\/td>\n<td>任意<\/td>\n<td>线性<\/td>\n<\/tr>\n<tr>\n<td>并行执行可能性<\/td>\n<td>有<\/td>\n<td>无（线性执行）<\/td>\n<\/tr>\n<tr>\n<td>可能看到部分不一致状态<\/td>\n<td>有<\/td>\n<td>有<\/td>\n<\/tr>\n<tr>\n<td>应用或数据库逻辑<\/td>\n<td>应用<\/td>\n<td>应用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>主要区别在于 TC/C 可以并行化，因此我们的决策基于延迟要求——如果需要低延迟，就应该选 TC/C 方案。<\/p>\n<p>无论采用哪种方案，我们仍然需要支持审计和历史重放，以便从失败状态中恢复。<\/p>\n<h3><strong>事件溯源<\/strong><\/h3>\n<p>在现实中，数字钱包应用可能会被审计，我们必须回答某些问题：\n * 我们知道任意给定时刻的账户余额吗？\n * 我们如何知道历史余额和当前余额是正确的？\n * 代码变更后，我们如何证明系统逻辑是正确的？<\/p>\n<p>事件溯源（event sourcing）是一种帮助我们回答这些问题的技术。<\/p>\n<p>它包含四个概念：\n * 命令（command）——来自现实世界的意图动作，例如把 $1 从账户 A 转到 B。由于需要全局顺序，命令被放入 FIFO 队列。\n   * 与事件不同，命令可能失败，并带有一定随机性（例如 IO 问题或状态无效）。\n   * 命令可以产生零个或多个事件\n   * 事件生成可能包含随机性，例如外部 IO。这一点后面会重新讨论\n * 事件（event）——系统中已发生事件的历史事实，例如「已把 $1 从 A 转到 B」。\n   * 与命令不同，事件是在我们系统内已经发生的事实\n   * 与命令类似，它们也需要排序，因此也被放入 FIFO 队列\n * 状态（state）——某个事件导致的变化结果。例如账户与其余额之间的键值存储。\n * 状态机（state machine）——驱动事件溯源流程。它主要负责校验命令并应用事件来更新系统状态。\n   * 状态机应该是确定性的，因此它不应该读取外部 IO 或依赖随机性。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/event-sourcing.png\" alt=\"事件溯源\" width=\"500\" />\n<\/div>\n\n<p>下面是事件溯源的动态视图：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/dynamic-event-sourcing.png\" alt=\"动态事件溯源\" width=\"500\" />\n<\/div>\n\n<p>对于我们的钱包服务，命令就是余额转账请求。我们可以把它们放进一个 FIFO 队列，例如 Kafka：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/command-queue.png\" alt=\"命令队列\" width=\"500\" />\n<\/div>\n\n<p>完整图景如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/wallet-service-state-macghine.png\" alt=\"钱包服务状态机\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>状态机从命令队列读取命令<\/li>\n<li>余额状态从数据库读取<\/li>\n<li>校验命令。如果有效，为每个账户生成两个事件<\/li>\n<li>读取下一个事件并应用——更新数据库中的余额（状态）<\/li>\n<\/ul>\n<p>使用事件溯源的主要优势是它的可复现性。在这个设计中，所有状态更新操作都被保存为不可变的余额变更历史。<\/p>\n<p>历史余额总是可以通过从头重放事件来重建。由于事件列表是不可变的、状态机是确定性的，我们保证能成功重放出任何中间状态。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/historical-states.png\" alt=\"历史状态\" width=\"500\" />\n<\/div>\n\n<p>本节开头提出的所有审计相关问题，都可以依靠事件溯源来回答：\n * 我们知道任意给定时刻的账户余额吗？——可以从头开始重放事件，一直重放到我们关心的时刻\n * 我们如何知道历史余额和当前余额是正确的？——可以从头重新计算所有事件来验证正确性\n * 代码变更后，我们如何证明系统逻辑是正确的？——可以用不同版本的代码跑同一批事件，验证它们的结果完全一致<\/p>\n<p>回答客户关于余额的查询，可以使用 CQRS（命令查询职责分离）架构——可以有多个只读状态机，负责基于不可变的事件列表查询历史状态：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/cqrs-architecture.png\" alt=\"CQRS 架构\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>在本节中，我们将探讨一些性能优化，因为我们仍然需要扩展到 100 万 TPS。<\/p>\n<h3><strong>高性能事件溯源<\/strong><\/h3>\n<p>我们要探讨的第一个优化是：把命令和事件保存到本地磁盘存储，而不是 Kafka 这类外部存储。<\/p>\n<p>这样既避免了网络延迟，又因为我们只做追加写，这种操作对 HDD 来说通常很快。<\/p>\n<p>下一个优化是在内存中缓存近期的命令和事件，以节省从磁盘重新加载它们的时间。<\/p>\n<p>在底层，我们可以利用 mmap 调用来实现上述优化，它把数据既存到本地磁盘、又缓存在内存中：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/mmap-optimization.png\" alt=\"mmap 优化\" width=\"500\" />\n<\/div>\n\n<p>接下来还可以做的优化是：用 SQLite——一个基于文件的本地关系数据库——把状态也存到本地文件系统中。RocksDB 也是一个不错的选择。<\/p>\n<p>就我们的目的而言，我们选择 RocksDB，因为它使用 LSM 树（log-structured merge-tree），针对写操作做了优化。读性能则通过缓存来优化。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"27.  Digital Wallet/images/rocks-db-approach.png\" alt=\"RocksDB 方案\" width=\"500\" />\n<\/div>\n\n<p>为了优化可复现性，我们可以定期把快照保存到磁盘，这样就不必每次都从头重建某个状态。我们可以把快照作为大型二进制文件存储在分布式文件存储中，例如 HDFS：<\/p>\n<div style=\
