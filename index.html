s not practical for a mobile app with flaky connection and tight power consumption constraints.<\/p>\n<p>A more practical approach is to use a shared backend as a fan-out mechanism towards friends you want to reach:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/fan-out-backend.png\" alt=\"fan-out-backend\" width=\"500\" />\n<\/div>\n\n<p>What does the backend do?\n * Receives location updates from all active users\n * For each location update, find all active users which should receive it and forward it to them\n * Do not forward location data if distance between friends is beyond the configured threshold<\/p>\n<p>This sounds simple but the challenge is to design the system for the scale we're operating with.<\/p>\n<p>We'll start with a simpler design at first and discuss a more advanced approach in the deep dive:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/simple-high-level-design.png\" alt=\"simple-high-level-design\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Load balancer<\/strong>: spreads traffic across rest API servers as well as bidirectional web socket servers<\/li>\n<li><strong>Rest API servers<\/strong>: handles auxiliary tasks such as managing friends, updating profiles, etc<\/li>\n<li><strong>Websocket servers<\/strong>: stateful servers, which forward location update requests to respective clients. It also manages seeding the mobile client with nearby friends locations at initialization (discussed in detail later).<\/li>\n<li><strong>Redis location cache<\/strong>: used to store most recent location data for each active user. There is a TTL set on each entry in the cache. When the TTL expires, user is no longer active and their data is removed from the cache.<\/li>\n<li><strong>User database<\/strong>: stores user and friendship data. Either a relational or NoSQL database can be used for this purpose.<\/li>\n<li><strong>Location history database<\/strong>: stores a history of user location data, not necessarily used directly within nearby friends feature, but instead used to track historical data for analytical purposes<\/li>\n<li><strong>Redis pubsub<\/strong>: used as a lightweight message bus which enables different topics for each user channel for location updates.<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/redis-pubsub-usage.png\" alt=\"redis-pubsub-usage\" width=\"500\" />\n<\/div>\n\n<p>In the above example, websocket servers subscribe to channels for the users which are connected to them &amp; forward location updates whenever they receive them to appropriate users.<\/p>\n<h3><strong>Periodic location update<\/strong><\/h3>\n<p>Here's how the periodic location update flow works:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/periodic-location-update.png\" alt=\"periodic-location-update\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Mobile client sends a location update to the load balancer<\/li>\n<li>Load balancer forwards location update to the websocket server's persistent connection for that client<\/li>\n<li>Websocket server saves location data to location history database<\/li>\n<li>Location data is updated in location cache. Websocket server also saves location data in-memory for subsequent distance calculations for that user<\/li>\n<li>Websocket server publishes location data in user's channel via redis pub sub<\/li>\n<li>Redis pubsub broadcasts location update to all subscribers for that user channel, ie servers responsible for the friends of that user<\/li>\n<li>Subscribed web socket servers receive location update, calculate which users the update should be sent to and sends it<\/li>\n<\/ul>\n<p>Here's a more detailed version of the same flow:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/detailed-periodic-location-update.png\" alt=\"detailed-periodic-location-update\" width=\"500\" />\n<\/div>\n\n<p>On average, there's going to be 40 location updates to forward as a user has 400 friends on average and 10% of them are online at a time.<\/p>\n<h3><strong>API Design<\/strong><\/h3>\n<p>Websocket Routines we'll need to support:\n * periodic location update - user sends location data to websocket server\n * client receives location update - server sends friend location data and timestamp\n * websocket client initialization - client sends user location, server sends back nearby friends location data\n * Subscribe to a new friend - websocket server sends a friend ID mobile client is supposed to track eg when friend appears online for the first time\n * Unsubscribe a friend - websocket server sends a friend ID, mobile client is supposed to unsubscribe from due to eg friend going offline<\/p>\n<p>HTTP API - traditional request/response payloads for auxiliary responsibilities.<\/p>\n<h3><strong>Data model<\/strong><\/h3>\n<ul>\n<li>The location cache will store a mapping between <code>user_id<\/code> and <code>lat,long,timestamp<\/code>. Redis is a great choice for this cache as we only care about current location and it supports TTL eviction which we need for our use-case.<\/li>\n<li>Location history table stores the same data but in a relational table \\w the four columns stated above. Cassandra can be used for this data as it is optimized for write-heavy loads.<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>Let's discuss how we scale the high-level design so that it works at the scale we're targetting.<\/p>\n<h3><strong>How well does each component scale?<\/strong><\/h3>\n<ul>\n<li><strong>API servers<\/strong>: can be easily scaled via autoscaling groups and replicating server instances<\/li>\n<li><strong>Websocket servers<\/strong>: we can easily scale out the ws servers, but we need to ensure we gracefully shutdown existing connections when tearing down a server. Eg we can mark a server as \"draining\" in the load balancer and stop sending connections to it, prior to being finally removed from the server pool<\/li>\n<li><strong>Client initialization<\/strong>: when a client first connects to a server, it fetches the user's friends, subscribes to their channels on redis pubsub, fetches their location from cache and finally forwards to client<\/li>\n<li><strong>User database<\/strong>: We can shard the database based on user_id. It might also make sense to expose user/friends data via a dedicated service and API, managed by a dedicated team<\/li>\n<li><strong>Location cache<\/strong>: We can shard the cache easily by spinning up several redis nodes. Also, the TTL puts a limit on the max memory we could have taken up at a time. But we still want to handle the large write load<\/li>\n<li><strong>Redis pub/sub server<\/strong>: we leverage the fact that no memory is consumed if there are channels initialized but are not in use. Hence, we can pre-allocate channels for all users who use the nearby friends feature to avoid having to deal with eg bringing up a new channel when a user comes online and notifying active websocket servers<\/li>\n<\/ul>\n<h3><strong>Scaling deep-dive on redis pub/sub component<\/strong><\/h3>\n<p>We will need around 200gb of memory to maintain all pub/sub channels. This can be achieved by using 2 redis servers with 100gb each.<\/p>\n<p>Given that we need to push ~14mil location updates per second, we will however need at least 140 redis servers to handle that amount of load, assuming that a single server can handle ~100k pushes per second.<\/p>\n<p>Hence, we'll need a distributed redis server cluster to handle the intense CPU load.<\/p>\n<p>In order to support a distributed redis cluster, we'll need to utilize a service discovery component, such as zookeeper or etcd, to keep track of which servers are alive.<\/p>\n<p>What we need to encode in the service discovery component is this data:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/channel-distribution-data.png\" alt=\"channel-distribution-data\" width=\"500\" />\n<\/div>\n\n<p>Web socket servers use that encoded data, fetched from zookeeper to determine where a particular channel lives. For efficiency, the hash ring data can be cached in-memory on each websocket server.<\/p>\n<p>In terms of scaling the server cluster up or down, we can setup a daily job to scale the cluster as needed based on historical traffic data. We can also overprovision the cluster to handle spikes in loads.<\/p>\n<p>The redis cluster can be treated as a stateful storage server as there is some state maintained for the channels and there is a need for coordination with subscribers so that they hand-off to newly provisioned nodes in the cluster.<\/p>\n<p>We have to be mindful of some potential issues during scaling operations:\n * There will be a lot of resubscription requests from the web socket servers due to channels being moved around\n * Some location updates might be missed from clients during the operation, which is acceptable for this problem, but we should still minimize it from happening. Consider doing such operation when traffic is at lowest point of the day.\n * We can leverage consistent hashing to minimize amount of channels moved in the event of adding/removing servers<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/consistent-hashing.png\" alt=\"consistent-hashing\" width=\"500\" />\n<\/div>\n\n<h3><strong>Adding/removing friends<\/strong><\/h3>\n<p>Whenever a friend is added/removed, websocket server responsible for affected user needs to subscribe/unsubscribe from the friend's channel.<\/p>\n<p>Since the \"nearby friends\" feature is part of a larger app, we can assume that a callback on the mobile client side can be registered whenever any of the events occur and the client will send a message to the websocket server to do the appropriate action.<\/p>\n<h3><strong>Users with many friends<\/strong><\/h3>\n<p>We can put a cap on the total number of friends one can have, eg facebook has a cap of 5000 max friends.<\/p>\n<p>The websocket server handling the \"whale\" user might have a higher load on its end, but as long as we have enough web socket servers, we should be okay.<\/p>\n<h3><strong>Nearby random person<\/strong><\/h3>\n<p>What if the interviewer wants to update the design to include a feature where we can occasionally see a random person pop up on our nearby friends map?<\/p>\n<p>One way to handle this is to define a pool of pubsub channels, based on geohash:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/geohash-pubsub.png\" alt=\"geohash-pubsub\" width=\"500\" />\n<\/div>\n\n<p>Anyone within the geohash subscribes to the appropriate channel to receive location updates for random users:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/location-updates-geohash.png\" alt=\"location-updates-geohash\" width=\"500\" />\n<\/div>\n\n<p>We could also subscribe to several geohashes to handle cases where someone is close but in a bordering geohash:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/geohash-borders.png\" alt=\"geohash-borders\" width=\"500\" />\n<\/div>\n\n<h3><strong>Alternative to Redis pub/sub<\/strong><\/h3>\n<p>An alternative to using Redis for pub/sub is to leverage Erlang - a general programming language, optimized for distributed computing applications.<\/p>\n<p>With it, we can spawn millions of small, erland processes which communicate with each other. We can handle both websocket connections and pub/sub channels within the distributed erlang application.<\/p>\n<p>A challenge with using Erlang, though, is that it's a niche programming language and it could be hard to source strong erlang developers.<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>We successfully designed a system, supporting the nearby friends features.<\/p>\n<p>Core components:\n- <strong>Web socket servers<\/strong>: real-time comms between client and server\n- <strong>Redis<\/strong>: fast read and write of location data + pub/sub channels<\/p>\n<p>We also explored how to scale restful api servers, websocket servers, data layer, redis pub/sub servers and we also explored an alternative to using Redis Pub/Sub. We also explored a \"random nearby person\" feature.<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>本章聚焦于为一款应用设计可扩展的后端，该应用支持用户分享自己的位置，并发现<strong>附近的<\/strong>好友。<\/p>\n<p>与邻近服务（proximity service）一章的主要区别在于：在这个问题中，<strong>位置是不断变化的<\/strong>，而那一章里，商户地址大体上保持不变。<\/p>\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<p>一些用于引导面试的问题：\n * C：地理上多近才算\"附近\"？\n * I：5 英里，这个数字应该是可配置的\n * C：距离是按直线距离计算，还是会考虑比如朋友之间隔着一条河？\n * I：是的，这是个合理的假设\n * C：应用有多少用户？\n * I：10 亿用户，其中 10% 使用附近的人功能\n * C：我们需要存储位置历史吗？\n * I：是的，这对比如机器学习很有价值\n * C：我们可以假设不活跃的好友会在 10 分钟后从功能中消失吗？\n * I：可以\n * C：我们需要考虑 GDPR 等合规问题吗？\n * I：不需要，为简化起见<\/p>\n<h3><strong>功能需求<\/strong><\/h3>\n<ul>\n<li>用户应该能在移动应用上看到附近的好友。每个好友都带有距离和时间戳，指示该位置是何时更新的<\/li>\n<li>附近好友列表应该每隔几秒更新一次<\/li>\n<\/ul>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li><strong>低延迟<\/strong>：接收位置更新时不应有太大延迟，这一点很重要<\/li>\n<li><strong>可靠性<\/strong>：偶尔丢失数据点是可以接受的，但系统整体应当可用<\/li>\n<li><strong>最终一致性<\/strong>：位置数据存储不需要强一致性。不同副本之间接收位置数据时存在几秒延迟是可以接受的<\/li>\n<\/ul>\n<h3><strong>粗略估算<\/strong><\/h3>\n<p>一些用于确定潜在规模的估算：\n * 附近的好友指 5 英里半径内的好友\n * 位置刷新间隔为 30 秒。人类步行速度很慢，因此不需要过于频繁地更新位置\n * 平均每天有 1 亿用户使用该功能，并发用户占 10%，即 1000 万\n * 平均而言，一个用户有 400 个好友，他们都使用附近的人功能\n * 应用每页显示 20 个附近好友\n * <strong>位置更新 QPS<\/strong> = 1000 万 / 30 == 每秒约 33.4 万次更新<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<p>在探讨 API 和数据模型设计之前，我们先研究一下将要使用的通信协议，因为它不像传统的请求-响应通信模型那样无处不在。<\/p>\n<h3><strong>高层设计<\/strong><\/h3>\n<p>在高层层面，我们希望在对等节点之间建立有效的消息传递。这可以通过对等网络（peer-to-peer）协议实现，但对于连接不稳定、功耗受限的移动应用来说并不现实。<\/p>\n<p>更实用的方法是使用共享后端，作为向你想要触达的好友进行扇出（fan-out）的机制：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/fan-out-backend.png\" alt=\"扇出后端\" width=\"500\" />\n<\/div>\n\n<p>后端做什么？\n * 接收所有活跃用户的位置更新\n * 对于每次位置更新，找出所有应该接收它的活跃用户，并将其转发给他们\n * 如果好友之间的距离超出配置的阈值，则不转发位置数据<\/p>\n<p>这听起来简单，但挑战在于要为我们所处的规模设计系统。<\/p>\n<p>我们先从一个较简单的设计开始，并在深入探讨部分讨论更高级的方案：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/simple-high-level-design.png\" alt=\"简单高层设计\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>负载均衡器<\/strong>：将流量分发到 REST API 服务器以及双向 WebSocket 服务器<\/li>\n<li><strong>REST API 服务器<\/strong>：处理辅助任务，如管理好友关系、更新资料等<\/li>\n<li><strong>WebSocket 服务器<\/strong>：有状态服务器，将位置更新请求转发给相应的客户端。它还负责在初始化时向移动客户端播种附近好友的位置（稍后详细讨论）<\/li>\n<li><strong>Redis 位置缓存<\/strong>：用于存储每个活跃用户的最新位置数据。缓存中的每个条目都设置了生存时间（TTL）。当 TTL 到期时，该用户不再活跃，其数据从缓存中移除<\/li>\n<li><strong>用户数据库<\/strong>：存储用户和好友关系数据。可以使用关系型数据库或 NoSQL 数据库<\/li>\n<li><strong>位置历史数据库<\/strong>：存储用户位置数据的历史记录，不一定直接用于附近的人功能，而是用于跟踪历史数据以做分析<\/li>\n<li><strong>Redis 发布订阅<\/strong>：用作轻量级消息总线，为每个用户频道提供不同的主题（topic），用于位置更新<\/li>\n<\/ul>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/redis-pubsub-usage.png\" alt=\"Redis 发布订阅的使用\" width=\"500\" />\n<\/div>\n\n<p>在上面的示例中，WebSocket 服务器为连接到它们的用户订阅频道，并在收到位置更新时将其转发给合适的用户。<\/p>\n<h3><strong>周期性位置更新<\/strong><\/h3>\n<p>周期性位置更新流程的工作方式如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/periodic-location-update.png\" alt=\"周期性位置更新\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>移动客户端向负载均衡器发送位置更新<\/li>\n<li>负载均衡器将位置更新转发到该客户端对应的 WebSocket 服务器的持久连接上<\/li>\n<li>WebSocket 服务器将位置数据保存到位置历史数据库<\/li>\n<li>位置数据在位置缓存中更新。WebSocket 服务器还会在内存中保存该用户的位置数据，用于后续的距离计算<\/li>\n<li>WebSocket 服务器通过 Redis 发布订阅在用户的频道中发布位置数据<\/li>\n<li>Redis 发布订阅将位置更新广播给该用户频道的所有订阅者，即负责该用户好友的服务器<\/li>\n<li>订阅的 WebSocket 服务器收到位置更新，计算出应该把更新发送给哪些用户，并发送出去<\/li>\n<\/ul>\n<p>同一流程的更详细版本：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/detailed-periodic-location-update.png\" alt=\"详细的周期性位置更新\" width=\"500\" />\n<\/div>\n\n<p>平均而言，由于一个用户平均有 400 个好友，其中 10% 同时在线，因此需要转发 40 次位置更新。<\/p>\n<h3><strong>API 设计<\/strong><\/h3>\n<p>我们需要支持的 WebSocket 例程：\n * 周期性位置更新 —— 用户向 WebSocket 服务器发送位置数据\n * 客户端接收位置更新 —— 服务器发送好友的位置数据和时间戳\n * WebSocket 客户端初始化 —— 客户端发送用户位置，服务器返回附近好友的位置数据\n * 订阅新好友 —— WebSocket 服务器发送一个好友 ID，移动客户端应开始跟踪（例如当好友首次上线时）\n * 退订好友 —— WebSocket 服务器发送一个好友 ID，移动客户端应退订（例如好友下线时）<\/p>\n<p>HTTP API —— 用于辅助职责的传统请求/响应负载。<\/p>\n<h3><strong>数据模型<\/strong><\/h3>\n<ul>\n<li>位置缓存将存储 <code>user_id<\/code> 与 <code>lat,long,timestamp<\/code> 之间的映射。Redis 是这种缓存的绝佳选择，因为我们只关心当前位置，而且它支持 TTL 淘汰，这正是我们的用例所需。<\/li>\n<li>位置历史表存储相同的数据，但存放在关系表中，包含上述四列。Cassandra 可用于存储这些数据，因为它针对写密集型负载做了优化。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<p>我们来讨论如何扩展高层设计，使其能够在目标规模下工作。<\/p>\n<h3><strong>每个组件的扩展能力如何？<\/strong><\/h3>\n<ul>\n<li><strong>API 服务器<\/strong>：可以通过自动扩缩容组（autoscaling group）和复制服务器实例轻松扩展<\/li>\n<li><strong>WebSocket 服务器<\/strong>：我们可以轻松地水平扩展 ws 服务器，但在拆除服务器时需要确保优雅地关闭现有连接。例如，我们可以在负载均衡器中将一台服务器标记为\"排空（draining）\"状态，停止向其发送连接，然后再将其从服务器池中移除<\/li>\n<li><strong>客户端初始化<\/strong>：当客户端首次连接到服务器时，它会获取用户的好友列表，在 Redis 发布订阅上订阅他们的频道，从缓存中获取他们的位置，最后转发给客户端<\/li>\n<li><strong>用户数据库<\/strong>：我们可以基于 <code>user_id<\/code> 对数据库进行分片。通过由专门团队管理的专用服务和 API 来暴露用户/好友数据，可能也是合理的做法<\/li>\n<li><strong>位置缓存<\/strong>：我们可以很容易地通过启动多个 Redis 节点来分片缓存。此外，TTL 限制了我们在任一时刻可能占用的最大内存。但我们仍然需要处理大写入负载<\/li>\n<li><strong>Redis 发布订阅服务器<\/strong>：我们利用这样一个事实：如果频道已初始化但未被使用，就不会消耗内存。因此，我们可以为所有使用附近的人功能的用户预分配频道，以避免处理诸如用户上线时新建频道并通知活跃 WebSocket 服务器之类的问题<\/li>\n<\/ul>\n<h3><strong>Redis 发布订阅组件的扩展性深入探讨<\/strong><\/h3>\n<p>我们需要大约 200GB 内存来维护所有发布订阅频道。这可以通过使用两台各 100GB 的 Redis 服务器来实现。<\/p>\n<p>鉴于我们需要每秒推送约 1400 万次位置更新，假设单台服务器每秒可以处理约 10 万次推送，我们至少需要 140 台 Redis 服务器来处理这样的负载。<\/p>\n<p>因此，我们需要一个分布式 Redis 服务器集群来处理高强度的 CPU 负载。<\/p>\n<p>为了支持分布式 Redis 集群，我们需要利用服务发现组件，例如 ZooKeeper 或 etcd，来跟踪哪些服务器存活。<\/p>\n<p>我们需要在服务发现组件中编码的数据如下：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/channel-distribution-data.png\" alt=\"频道分布数据\" width=\"500\" />\n<\/div>\n\n<p>WebSocket 服务器使用从 ZooKeeper 获取的这份编码数据来确定某个频道位于何处。为提高效率，哈希环数据可以缓存在每个 WebSocket 服务器的内存中。<\/p>\n<p>在扩展服务器集群方面，我们可以设置一个每日任务，根据历史流量数据按需扩展集群。我们还可以对集群进行超额配置，以应对负载尖峰。<\/p>\n<p>Redis 集群可以被视为有状态存储服务器，因为频道维护了一些状态，并且需要与订阅者协调，以便他们将工作交接给集群中新配置的节点。<\/p>\n<p>在扩展操作期间，我们必须注意一些潜在问题：\n * 由于频道被移动，WebSocket 服务器会产生大量的重新订阅请求\n * 操作期间客户端可能会错过一些位置更新，这对于本问题是可以接受的，但我们仍应尽量减少这种情况。考虑在当天流量最低点进行此类操作\n * 我们可以利用一致性哈希（consistent hashing），在添加/移除服务器时尽量减少被移动的频道数量<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/consistent-hashing.png\" alt=\"一致性哈希\" width=\"500\" />\n<\/div>\n\n<h3><strong>添加/移除好友<\/strong><\/h3>\n<p>每当添加/移除好友时，负责该受影响用户的 WebSocket 服务器需要订阅/退订该好友的频道。<\/p>\n<p>由于\"附近的人\"功能是一个更大应用的一部分，我们可以假设：无论上述哪个事件发生，都可以在移动客户端侧注册一个回调，客户端会向 WebSocket 服务器发送消息以执行相应操作。<\/p>\n<h3><strong>好友众多的用户<\/strong><\/h3>\n<p>我们可以对一个人能拥有的好友总数设上限，例如 Facebook 的好友上限为 5000。<\/p>\n<p>处理这种\"鲸鱼\"用户的 WebSocket 服务器在其端可能负载更高，但只要我们有足够多的 WebSocket 服务器，应该就没问题。<\/p>\n<h3><strong>附近的陌生人<\/strong><\/h3>\n<p>如果面试官想扩展设计，增加一个功能：我们偶尔能在附近好友地图上看到随机冒出来的人，该怎么办？<\/p>\n<p>处理方法之一是基于地理哈希（geohash）定义一组发布订阅频道池：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/geohash-pubsub.png\" alt=\"基于地理哈希的发布订阅\" width=\"500\" />\n<\/div>\n\n<p>该地理哈希范围内的任何人都订阅相应频道，以接收随机用户的位置更新：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/location-updates-geohash.png\" alt=\"基于地理哈希的位置更新\" width=\"500\" />\n<\/div>\n\n<p>我们还可以订阅多个地理哈希，以处理某人很近但位于相邻地理哈希中的情况：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"17. Nearby Friends/images/geohash-borders.png\" alt=\"地理哈希边界\" width=\"500\" />\n<\/div>\n\n<h3><strong>Redis 发布订阅的替代方案<\/strong><\/h3>\n<p>使用 Redis 做发布订阅的替代方案是利用 Erlang —— 一种通用编程语言，为分布式计算应用而优化。<\/p>\n<p>借助它，我们可以生成数百万个小型的 Erlang 进程，它们相互通信。我们可以在分布式 Erlang 应用中同时处理 WebSocket 连接和发布订阅频道。<\/p>\n<p>不过，使用 Erlang 的一个挑战在于它是一门小众编程语言，可能很难招募到优秀的 Erlang 开发者。<\/p>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>我们成功设计了一个支持附近的人功能的系统。<\/p>\n<p>核心组件：\n- <strong>WebSocket 服务器<\/strong>：客户端与服务器之间的实时通信\n- <strong>Redis<\/strong>：位置数据的快速读写 + 发布订阅频道<\/p>\n<p>我们还探讨了如何扩展 RESTful API 服务器、WebSocket 服务器、数据层、Redis 发布订阅服务器，并探讨了 Redis 发布订阅的替代方案。我们还探讨了\"附近的陌生人\"功能。<\/p>", "enTitle": "Chapter 17: Nearby Friends", "zhTitle": "第 17 章：附近的人（Nearby Friends）", "short": "Nearby Friends", "num": "17"}, "18. Google Maps": {"en": "\n<h2>Introduction<\/h2>\n<p>We'll design a simple version of <strong>Google Maps<\/strong>.<\/p>\n<p>Some facts about google maps:\n * Started in 2005\n * Provides various services - satellite imagery, street maps, real-time traffic conditions, route planning\n * By 2021, had 1bil daily active users, 99% coverage of the world, 25mil updates daily of real-time location info<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<p>Sample Q&amp;A between candidate and interviewer:\n * C: How many daily active users are we dealing with?\n * I: 1bil DAU\n * C: What features should we focus on?\n * I: Location update, navigation, ETA, map rendering\n * C: How large is road data? Do we have access to it?\n * I: We obtained road data from various sources, it's TBs of raw data\n * C: Should we take traffic conditions into consideration?\n * I: Yes, we should for accurate time estimations\n * C: How about different travel modes - by foot, biking, driving?\n * I: We should support those\n * C: How about multi-stop directions?\n * I: Let's not focus on that for scope of interview\n * C: Business places and photos?\n * I: Good question, but no need to consider those<\/p>\n<p>We'll focus on three key features - user location update, navigation service including ETA, map rendering.<\/p>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>Accuracy<\/strong>: user shouldn't get wrong directions<\/li>\n<li><strong>Smooth navigation<\/strong>: Users should experience smooth map rendering<\/li>\n<li><strong>Data and battery usage<\/strong>: Client should use as little data and battery as possible. Important for mobile devices.<\/li>\n<li>General availability and scalability requirements<\/li>\n<\/ul>\n<h3><strong>Map 101<\/strong><\/h3>\n<p>Before jumping into the design, there are some map-related concepts we should understand.<\/p>\n<h4>Positioning system<\/h4>\n<p>World is a sphere, rotating on its axis. Positiions are defined by latitude (how far north/south you are) and longitude (how far east/west you are):<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/partitioning-system.png\" alt=\"partitioning-system\" width=\"500\" />\n<\/div>\n\n<h4>Going from 3D to 2D<\/h4>\n<p>The process of translating points from 3D to 2D plane is called \"map projection\".<\/p>\n<p>There are different ways to do it and each comes with its pros and cons. Almost all distort the actual geometry.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-projections.png\" alt=\"map-projections\" width=\"500\" />\n<\/div>\n\n<p>Google maps selected a modified version of Mercator projection called \"Web Mercator\".<\/p>\n<h4>Geocoding<\/h4>\n<p>Geocoding is the process of converting addresses to geographic coordinates. <\/p>\n<p>The reverse process is called \"reverse geocoding\".<\/p>\n<p>One way to achieve this is to use interpolation - leveraging data from different sources (eg GIS-es) where street network is mapped to geo coordinate space.<\/p>\n<h4>Geohashing<\/h4>\n<p>Geohashing is an encoding system which encodes a geographic area into a string of letters and digits.<\/p>\n<p>It depicts the world as a flattened surface and recursively sub-divides it into four quadrants:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/geohashing.png\" alt=\"geohashing\" width=\"500\" />\n<\/div>\n\n<h4>Map rendering<\/h4>\n<p>Map rendering happens via tiling. Instead of rendering entire map as one big custom image, world is broken up into smaller tiles.<\/p>\n<p>Client only downloads relevant tiles and renders them like stitching together a mosaic.<\/p>\n<p>There are different tiles for different zoom levels. Client chooses appropriate tiles based on the client's zoom level.<\/p>\n<p>Eg, zooming out the entire world would download only a single 256x256 tile, representing the whole world.<\/p>\n<h4>Road data processing for navigation algorithms<\/h4>\n<p>In most routing algorithms, intersections are represented as nodes and roads are represented as edges:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/road-representation.png\" alt=\"road-representation\" width=\"500\" />\n<\/div>\n\n<p>Most navigation algorithms use a modified version of Djikstra or A* algorithms.<\/p>\n<p>Pathfinding performance is sensitive to the size of the graph. To work at scale, we can't represent the whole world as a graph and run the algorithm on it.<\/p>\n<p>Instead, we use a technique similar to tiling - we subdivide the world into smaller and smaller graphs.<\/p>\n<p>Routing tiles hold references to neighboring tiles and algorithms can stitch together a bigger road graph as it traverses interconnected tiles:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/routing-tiles.png\" alt=\"routing-tiles\" width=\"500\" />\n<\/div>\n\n<p>This technique enables us to significantly reduce memory bandwidth and only load the tiles we need for the given source/destination pair.<\/p>\n<p>However, for larger routes, stitching together small, detailed routing tiles would still be time/memory consuming. Instead, there are routing tiles with different level of detail and the algorithm uses the appropriately-detailed tiles, based on the destination we're headed for:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-routing-hierarchical.png\" alt=\"map-routing-hierarchical\" width=\"500\" />\n<\/div>\n\n<h3><strong>Back-of-the-envelope estimation<\/strong><\/h3>\n<p>For storage, we need to store:\n * map of the world - estimated as ~70pb based on all the tiles we need to store, but factoring in compression of very similar tiles (eg vast desert)\n * metadata - negligible in size, so we can skip it from calculation\n * Road info - stored as routing tiles<\/p>\n<p>Estimated QPS for navigation requests - 1bil DAU at 35min of usage per week -&gt; 5bil minutes per day. \nAssuming gps update requests are batched, we arrive at 200k QPS and 1mil QPS at peak load<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/high-level-design.png\" alt=\"high-level-design\" width=\"500\" />\n<\/div>\n\n<h3><strong>Location service<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-service.png\" alt=\"location-service\" width=\"500\" />\n<\/div>\n\n<p>It is responsible for recording a user's location updates:\n * location updates are sent every <code>t<\/code> seconds\n * location data streams can be used to improve the service over time, eg provide more accurate ETAs, monitor traffic data, detect closed roads, analyze user behavior, etc<\/p>\n<p>Instead of sending location updates to the server all the time, we can batch the updates on the client-side and send batches instead:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-update-batches.png\" alt=\"location-update-batches\" width=\"500\" />\n<\/div>\n\n<p>Despite this optimization, for a system of Google Maps scale, load will still be significant. Therefore, we can leverage a database, optimized for heavy writes such as Cassandra.<\/p>\n<p>We can also leverage Kafka for efficient stream processing of location updates, meant for further analysis.<\/p>\n<p>Example location update request payload:<\/p>\n<pre><code>POST /v1/locations\nParameters\n  locs: JSON encoded array of (latitude, longitude, timestamp) tuples.\n<\/code><\/pre>\n<h3><strong>Navigation service<\/strong><\/h3>\n<p>This component is responsible for finding fast routes between A and B in a reasonable time (a little bit of latency is okay). Route need not be the fastest, but accuracy is important.<\/p>\n<p>Example request payload:<\/p>\n<pre><code>GET /v1/nav?origin=1355+market+street,SF&amp;destination=Disneyland\n<\/code><\/pre>\n<p>Example response:<\/p>\n<pre><code class=\"language-json\">{\n  &quot;distance&quot;: {&quot;text&quot;:&quot;0.2 mi&quot;, &quot;value&quot;: 259},\n  &quot;duration&quot;: {&quot;text&quot;: &quot;1 min&quot;, &quot;value&quot;: 83},\n  &quot;end_location&quot;: {&quot;lat&quot;: 37.4038943, &quot;Ing&quot;: -121.9410454},\n  &quot;html_instructions&quot;: &quot;Head &lt;b&gt;northeast&lt;/b&gt; on &lt;b&gt;Brandon St&lt;/b&gt; toward &lt;b&gt;Lumin Way&lt;/b&gt;&lt;div style=\\&quot;font-size:0.9em\\&quot;&gt;Restricted usage road&lt;/div&gt;&quot;,\n  &quot;polyline&quot;: {&quot;points&quot;: &quot;_fhcFjbhgVuAwDsCal&quot;},\n  &quot;start_location&quot;: {&quot;lat&quot;: 37.4027165, &quot;lng&quot;: -121.9435809},\n  &quot;geocoded_waypoints&quot;: [\n    {\n       &quot;geocoder_status&quot; : &quot;OK&quot;,\n       &quot;partial_match&quot; : true,\n       &quot;place_id&quot; : &quot;ChIJwZNMti1fawwRO2aVVVX2yKg&quot;,\n       &quot;types&quot; : [ &quot;locality&quot;, &quot;political&quot; ]\n    },\n    {\n       &quot;geocoder_status&quot; : &quot;OK&quot;,\n       &quot;partial_match&quot; : true,\n       &quot;place_id&quot; : &quot;ChIJ3aPgQGtXawwRLYeiBMUi7bM&quot;,\n       &quot;types&quot; : [ &quot;locality&quot;, &quot;political&quot; ]\n    }\n  ],\n  &quot;travel_mode&quot;: &quot;DRIVING&quot;\n}\n<\/code><\/pre>\n<p>Traffic changes and reroutes are not taken into consideration yet, those will be tackled in the deep dive section.<\/p>\n<h3><strong>Map rendering<\/strong><\/h3>\n<p>Holding the entire data set of mapping tiles on the client-side is not feasible as it's petabytes in size.<\/p>\n<p>They need to be fetched on-demand from the server, based on the client's location and zoom level.<\/p>\n<p>When should new tiles be fetched - while user is zooming in/out and during navigation, while they're going towards a new tile.<\/p>\n<p>How should the map tiles be served to the client?\n * They can be built dynamically, but that puts a huge load on the server and also makes caching hard\n * Map tiles are served statically, based on their geohash, which a client can calculate. They can be statically stored &amp; served from a CDN<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/static-map-tiles.png\" alt=\"static-map-tiles\" width=\"500\" />\n<\/div>\n\n<p>CDNs enable users to fetch map tiles from point-of-presence servers (POP) which are closest to users in order to minimize latency:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/cdn-vs-no-cdn.png\" alt=\"cdn-vs-no-cdn\" width=\"500\" />\n<\/div>\n\n<p>Options to consider for determining map tiles:\n * geohash for map tile can be calculated on the client-side. If that's the case, we should be careful that we commit to this type of map tile calculation for the long-term as forcing clients to update is hard\n * alternatively, we can have simple API which calculates the map tile URLs on behalf of the clients at the cost of additional API call<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-tile-url-calculation.png\" alt=\"map-tile-url-calculation\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3><strong>Data model<\/strong><\/h3>\n<p>Let's discuss how we store the different types of data we're dealing with.<\/p>\n<h4>Routing tiles<\/h4>\n<p>Initial road data set is obtained from different sources. It is improved over time based on location updates data.<\/p>\n<p>The road data is unstructured. We have a periodic offline processing pipeline, which transforms this raw data into the graph-based routing tiles our app needs.<\/p>\n<p>Instead of storing these tiles in a database as we don't need any database features. We can store them in S3 object storage, while caching them agressively.<\/p>\n<p>We can also leverage libraries to compress adjacency lists into binary files efficiently.<\/p>\n<h4>User location data<\/h4>\n<p>User location data is very useful for updaring traffic conditions and doing all sorts of other analysis.<\/p>\n<p>We can use Cassandra for storing this kind of data as its nature is to be write-heavy.<\/p>\n<p>Example row:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/user-location-data-torw.png\" alt=\"user-location-data-row\" width=\"500\" />\n<\/div>\n\n<h4>Geocoding database<\/h4>\n<p>This database stores a key-value pair of lat/long pairs and places.<\/p>\n<p>We can use Redis for its fast read access speed, as we have frequent read and infrequent writes.<\/p>\n<h4>Precomputed images of the world map<\/h4>\n<p>As we discussed, we will precompute map tiling images and store them in CDN.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/precomputed-map-tile-image.png\" alt=\"precomputed-map-tile-image\" width=\"500\" />\n<\/div>\n\n<h3><strong>Services<\/strong><\/h3>\n<h4>Location service<\/h4>\n<p>Let's focus on the database design and how user location is stored in detail for this service.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-service-diagram.png\" alt=\"location-service-diagram\" width=\"500\" />\n<\/div>\n\n<p>We can use a NoSQL database to facilitate the heavy write load we have on location updates. We prioritize availability over consistency as user location data often changes and becomes stale as new updates arrive.<\/p>\n<p>We'll choose Cassandra as our database choice as it nicely fits all our requirements.<\/p>\n<p>Example row we're going to store:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/user-location-row-example.png\" alt=\"user-location-row-example\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><code>user_id<\/code> is the partition key in order to quickly access all location updates for a particular user<\/li>\n<li><code>timestamp<\/code> is the clustering key in order to store the data sorted by the time a location update is received<\/li>\n<\/ul>\n<p>We also leverage Kafka to stream location updates to various other service which need the location updates for various purposes:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-update-streaming.png\" alt=\"location-update-streaming\" width=\"500\" />\n<\/div>\n\n<h4>Rendering map<\/h4>\n<p>Map tiles are stored at various zoom levels. At the lowest zoom level, the entire world is represented by a single 256x256 tile.<\/p>\n<p>As zoom levels increase, the number of map tiles quadruples:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/zoom-level-increases.png\" alt=\"zoom-level-increases\" width=\"500\" />\n<\/div>\n\n<p>One optimization we can use is to not send the entire image information over the network, but instead represent tiles as vectors (paths &amp; polygons) and let the client render the tiles dynamically.<\/p>\n<p>This will have substantial bandwidth savings.<\/p>\n<h4>Navigation service<\/h4>\n<p>This service is responsible for finding the fastest routes:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/navigation-service.png\" alt=\"navigation-service\" width=\"500\" />\n<\/div>\n\n<p>Let's go through each component in this sub-system.<\/p>\n<p>First, we have the geocoding service which resolves an address to a location of lat/long pair.<\/p>\n<p>Example request:<\/p>\n<pre><code>https://maps.googleapis.com/maps/api/geocode/json?address=1600+Amphitheatre+Parkway,+Mountain+View,+CA\n<\/code><\/pre>\n<p>Example response:<\/p>\n<pre><code class=\"language-json\">{\n   &quot;results&quot; : [\n      {\n         &quot;formatted_address&quot; : &quot;1600 Amphitheatre Parkway, Mountain View, CA 94043, USA&quot;,\n         &quot;geometry&quot; : {\n            &quot;location&quot; : {\n               &quot;lat&quot; : 37.4224764,\n               &quot;lng&quot; : -122.0842499\n            },\n            &quot;location_type&quot; : &quot;ROOFTOP&quot;,\n            &quot;viewport&quot; : {\n               &quot;northeast&quot; : {\n                  &quot;lat&quot; : 37.4238253802915,\n                  &quot;lng&quot; : -122.0829009197085\n               },\n               &quot;southwest&quot; : {\n                  &quot;lat&quot; : 37.4211274197085,\n                  &quot;lng&quot; : -122.0855988802915\n               }\n            }\n         },\n         &quot;place_id&quot; : &quot;ChIJ2eUgeAK6j4ARbn5u_wAGqWA&quot;,\n         &quot;plus_code&quot;: {\n            &quot;compound_code&quot;: &quot;CWC8+W5 Mountain View, California, United States&quot;,\n            &quot;global_code&quot;: &quot;849VCWC8+W5&quot;\n         },\n         &quot;types&quot; : [ &quot;street_address&quot; ]\n      }\n   ],\n   &quot;status&quot; : &quot;OK&quot;\n}\n<\/code><\/pre>\n<p>The route planner service computes a suggested route, optimized for travel time according to current traffic conditions.<\/p>\n<p>The shortest-path service runs a variation of the A* algorithm against the routing tiles in object storage to compute an optimal path:\n * It receives the source/destination pairs, converts them to lat/long pairs and derives the geohashes from those pairs to derive the routing tiles\n * The algorithm starts from the initial routing tile and starts traversing it until a good enough path is found to the destination tile<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/shortest-path-service.png\" alt=\"shortest-path-service\" width=\"500\" />\n<\/div>\n\n<p>The ETA service is called by the route planner to get estimated time based on machine learning algorithms, predicting ETA based on traffic data.<\/p>\n<p>The ranker service is responsible to rank different possible paths based on filters, passed by the user, ie flags to avoid toll roads or freeways.<\/p>\n<p>The updater service asynchronously update some of the important databases to keep them up-to-date.<\/p>\n<h4>Improvement - adaptive ETA and rerouting<\/h4>\n<p>One improvement we can do is to adaptively update in-flight routes based on newly available traffic data.<\/p>\n<p>One way to implement this is to store users who are currently navigating through a route in the database by storing all the tiles they're supposed to go through.<\/p>\n<p>Data might look like this:<\/p>\n<pre><code>user_1: r_1, r_2, r_3, …, r_k\nuser_2: r_4, r_6, r_9, …, r_n\nuser_3: r_2, r_8, r_9, …, r_m\n...\nuser_n: r_2, r_10, r21, ..., r_l\n<\/code><\/pre>\n<p>If a traffic accident happens on some tile, we can identify all users whose path goes through that tile and re-route them.<\/p>\n<p>To reduce the amount of tiles we store in the database, we can instead store the origin routing tile and several routing tiles in different resolution levels until the destination tile is also included:<\/p>\n<pre><code>user_1, r_1, super(r_1), super(super(r_1)), ...\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/adaptive-eta-data-storage.png\" alt=\"adaptive-eta-data-storage\" width=\"500\" />\n<\/div>\n\n<p>Using this, we only need to check if the final tile of a user includes the traffic accident tile to see if user is impacted.<\/p>\n<p>We can also keep track of all possible routes for a navigating user and notify them if a faster re-route is available.<\/p>\n<h4>Delivery protocols<\/h4>\n<p>We have several options, which enable us to proactively push data to clients from the server:\n * Mobile push notifications don't work because payload is limited and it's not available for web apps\n * WebSocket is generally a better option than long-polling as it has less compute footprint on servers\n * We can also use server-sent events (SSE) but lean towards web sockets as they support bi-directional communication which can come in handy for eg a last-mile delivery feature<\/p>\n<hr />\n<h2>Step 4: Wrap Up<\/h2>\n<p>This is our final design:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/final-design.png\" alt=\"final-design\" width=\"500\" />\n<\/div>\n\n<p>One additional feature we could provide is multi-stop navigation which can be sold to enterprise customers such as Uber or Lyft in order to determine optimal path for visiting a set of locations.<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>我们将设计一个简单版的<strong>谷歌地图（Google Maps）<\/strong>。<\/p>\n<p>关于谷歌地图的一些事实：\n * 始于 2005 年\n * 提供各种服务 —— 卫星图像、街道地图、实时路况、路径规划\n * 到 2021 年，拥有 10 亿日活跃用户，覆盖全球 99% 区域，每天 2500 万次实时位置信息更新<\/p>\n<hr />\n<h2>第 1 步：理解问题并确立设计范围<\/h2>\n<p>候选人与面试官之间的问答示例：\n * C：我们要应对多少日活跃用户？\n * I：10 亿 DAU\n * C：我们应该聚焦哪些功能？\n * I：位置更新、导航、ETA、地图渲染\n * C：道路数据有多大？我们能拿到吗？\n * I：我们从各种来源获得道路数据，是 TB 级的原始数据\n * C：我们应该考虑路况吗？\n * I：是的，为了准确的时间估算应该考虑\n * C：不同出行方式呢 —— 步行、骑自行车、开车？\n * I：我们应该支持这些\n * C：多站点导航呢？\n * I：为控制面试范围，先不聚焦于此\n * C：商户地点和照片呢？\n * I：好问题，但不需要考虑这些<\/p>\n<p>我们将聚焦三个关键功能 —— 用户位置更新、包含预计到达时间（ETA）的导航服务、地图渲染。<\/p>\n<h3><strong>非功能需求<\/strong><\/h3>\n<ul>\n<li><strong>准确性<\/strong>：用户不应该得到错误的路线指引<\/li>\n<li><strong>流畅的导航<\/strong>：用户应体验到流畅的地图渲染<\/li>\n<li><strong>数据和电量消耗<\/strong>：客户端应尽可能少地使用数据和电量。这对移动设备很重要<\/li>\n<li>一般的可用性和可扩展性需求<\/li>\n<\/ul>\n<h3><strong>地图入门（Map 101）<\/strong><\/h3>\n<p>在进入设计之前，我们应该了解一些与地图相关的概念。<\/p>\n<h4>定位系统<\/h4>\n<p>地球是一个球体，绕轴自转。位置由纬度（你在南北方向上的位置）和经度（你在东西方向上的位置）定义：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/partitioning-system.png\" alt=\"定位系统\" width=\"500\" />\n<\/div>\n\n<h4>从 3D 到 2D<\/h4>\n<p>将点从 3D 平面转换到 2D 平面的过程称为\"地图投影（map projection）\"。<\/p>\n<p>有多种实现方式，每种都有优缺点。几乎所有投影都会扭曲真实的几何形状。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-projections.png\" alt=\"地图投影\" width=\"500\" />\n<\/div>\n\n<p>谷歌地图选择了墨卡托投影的修改版本，称为\"Web 墨卡托（Web Mercator）\"。<\/p>\n<h4>地理编码<\/h4>\n<p>地理编码（geocoding）是将地址转换为地理坐标的过程。<\/p>\n<p>反向过程称为\"逆地理编码（reverse geocoding）\"。<\/p>\n<p>实现方法之一是使用插值 —— 利用来自不同来源（如 GIS）的数据，其中街道网络被映射到地理坐标空间。<\/p>\n<h4>地理哈希<\/h4>\n<p>地理哈希（geohashing）是一种编码系统，将地理区域编码为一串字母和数字。<\/p>\n<p>它将世界描绘成一个平面，并递归地将其细分为四个象限：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/geohashing.png\" alt=\"地理哈希\" width=\"500\" />\n<\/div>\n\n<h4>地图渲染<\/h4>\n<p>地图渲染通过切片（tiling）进行。不是把整张地图渲染成一张大的自定义图片，而是把世界切分成更小的瓦片（tile）。<\/p>\n<p>客户端只下载相关的瓦片，像拼马赛克一样把它们渲染出来。<\/p>\n<p>不同缩放级别对应不同的瓦片。客户端根据自己的缩放级别选择合适的瓦片。<\/p>\n<p>例如，缩小到整个世界时，只会下载一张 256x256 的瓦片，代表整个世界。<\/p>\n<h4>面向导航算法的道路数据处理<\/h4>\n<p>在大多数路径规划算法中，交叉口表示为节点，道路表示为边：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/road-representation.png\" alt=\"道路表示\" width=\"500\" />\n<\/div>\n\n<p>大多数导航算法使用 Dijkstra 或 A* 算法的修改版本。<\/p>\n<p>寻路性能对图的规模很敏感。为了实现大规模运行，我们不能把整个世界表示为一张图然后在上面运行算法。<\/p>\n<p>相反，我们使用一种类似于切片的技术 —— 把世界细分成越来越小的图。<\/p>\n<p>路径规划瓦片保存着对相邻瓦片的引用，算法在遍历相互连接的瓦片时，可以把更大的道路图拼接起来：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/routing-tiles.png\" alt=\"路径规划瓦片\" width=\"500\" />\n<\/div>\n\n<p>这项技术使我们能够显著减少内存带宽，只为给定的起点/终点对加载所需的瓦片。<\/p>\n<p>然而，对于更长的路线，拼接小而详细的路径规划瓦片仍然会耗费时间和内存。因此，存在不同细节层级的路径规划瓦片，算法根据我们前往的目的地使用细节程度合适的瓦片：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-routing-hierarchical.png\" alt=\"分层路径规划\" width=\"500\" />\n<\/div>\n\n<h3><strong>粗略估算<\/strong><\/h3>\n<p>在存储方面，我们需要存储：\n * 世界地图 —— 根据需要存储的所有瓦片估算约 70PB，但要把非常相似的瓦片（如广袤的沙漠）的压缩考虑在内\n * 元数据 —— 大小可忽略，所以我们可以从计算中略去\n * 道路信息 —— 以路径规划瓦片的形式存储<\/p>\n<p>导航请求的估算 QPS —— 10 亿 DAU，每周人均使用 35 分钟 -&gt; 每天 50 亿分钟。\n假设 GPS 更新请求是批量处理的，我们得出 20 万 QPS，峰值负载时 100 万 QPS。<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/high-level-design.png\" alt=\"高层设计\" width=\"500\" />\n<\/div>\n\n<h3><strong>位置服务<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-service.png\" alt=\"位置服务\" width=\"500\" />\n<\/div>\n\n<p>它负责记录用户的位置更新：\n * 位置更新每隔 <code>t<\/code> 秒发送一次\n * 位置数据流可用于随时间改进服务，例如提供更准确的 ETA、监控路况数据、检测封闭道路、分析用户行为等<\/p>\n<p>我们可以不在客户端一直向服务器发送位置更新，而是在客户端批量收集更新，然后按批次发送：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-update-batches.png\" alt=\"批量位置更新\" width=\"500\" />\n<\/div>\n\n<p>尽管做了这个优化，对于谷歌地图这种规模的系统，负载仍然很大。因此，我们可以利用为重写入优化的数据库，如 Cassandra。<\/p>\n<p>我们还可以利用 Kafka 对位置更新进行高效的流处理，用于进一步分析。<\/p>\n<p>位置更新请求负载示例：<\/p>\n<pre><code>POST /v1/locations\nParameters\n  locs: JSON encoded array of (latitude, longitude, timestamp) tuples.\n<\/code><\/pre>\n<h3><strong>导航服务<\/strong><\/h3>\n<p>该组件负责在合理时间内在 A 地和 B 地之间找出快速路线（可以接受一点点延迟）。路线不一定是最快的，但准确性很重要。<\/p>\n<p>请求负载示例：<\/p>\n<pre><code>GET /v1/nav?origin=1355+market+street,SF&amp;destination=Disneyland\n<\/code><\/pre>\n<p>响应示例：<\/p>\n<pre><code class=\"language-json\">{\n  &quot;distance&quot;: {&quot;text&quot;:&quot;0.2 mi&quot;, &quot;value&quot;: 259},\n  &quot;duration&quot;: {&quot;text&quot;: &quot;1 min&quot;, &quot;value&quot;: 83},\n  &quot;end_location&quot;: {&quot;lat&quot;: 37.4038943, &quot;Ing&quot;: -121.9410454},\n  &quot;html_instructions&quot;: &quot;Head &lt;b&gt;northeast&lt;/b&gt; on &lt;b&gt;Brandon St&lt;/b&gt; toward &lt;b&gt;Lumin Way&lt;/b&gt;&lt;div style=\\&quot;font-size:0.9em\\&quot;&gt;Restricted usage road&lt;/div&gt;&quot;,\n  &quot;polyline&quot;: {&quot;points&quot;: &quot;_fhcFjbhgVuAwDsCal&quot;},\n  &quot;start_location&quot;: {&quot;lat&quot;: 37.4027165, &quot;lng&quot;: -121.9435809},\n  &quot;geocoded_waypoints&quot;: [\n    {\n       &quot;geocoder_status&quot; : &quot;OK&quot;,\n       &quot;partial_match&quot; : true,\n       &quot;place_id&quot; : &quot;ChIJwZNMti1fawwRO2aVVVX2yKg&quot;,\n       &quot;types&quot; : [ &quot;locality&quot;, &quot;political&quot; ]\n    },\n    {\n       &quot;geocoder_status&quot; : &quot;OK&quot;,\n       &quot;partial_match&quot; : true,\n       &quot;place_id&quot; : &quot;ChIJ3aPgQGtXawwRLYeiBMUi7bM&quot;,\n       &quot;types&quot; : [ &quot;locality&quot;, &quot;political&quot; ]\n    }\n  ],\n  &quot;travel_mode&quot;: &quot;DRIVING&quot;\n}\n<\/code><\/pre>\n<p>路况变化和改道尚未考虑，这些将在深入设计部分处理。<\/p>\n<h3><strong>地图渲染<\/strong><\/h3>\n<p>在客户端保存全部地图瓦片数据集是不可行的，因为它有 PB 级大小。<\/p>\n<p>瓦片需要根据客户端的位置和缩放级别，按需从服务器获取。<\/p>\n<p>什么时候应该获取新瓦片 —— 在用户放大/缩小地图时，以及在导航过程中驶向新瓦片区域时。<\/p>\n<p>应该如何向客户端提供地图瓦片？\n * 可以动态构建瓦片，但这会给服务器带来巨大负载，也使缓存变得困难\n * 地图瓦片基于其地理哈希静态提供，客户端可以自己计算地理哈希。瓦片可以静态存储在 CDN 上并从 CDN 提供<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/static-map-tiles.png\" alt=\"静态地图瓦片\" width=\"500\" />\n<\/div>\n\n<p>CDN 让用户可以从最接近用户的边缘节点（POP）服务器获取地图瓦片，以最小化延迟：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/cdn-vs-no-cdn.png\" alt=\"使用 CDN 与不使用 CDN 的对比\" width=\"500\" />\n<\/div>\n\n<p>确定地图瓦片时可考虑的选项：\n * 地图瓦片的地理哈希可以在客户端计算。如果这样做，我们应该谨慎：我们要长期承诺这种瓦片计算方式，因为强制客户端升级很困难\n * 或者，我们可以提供一个简单的 API，代替客户端计算地图瓦片 URL，代价是多一次 API 调用<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/map-tile-url-calculation.png\" alt=\"地图瓦片 URL 的计算\" width=\"500\" />\n<\/div>\n\n<hr />\n<h2>第 3 步：深入设计<\/h2>\n<h3><strong>数据模型<\/strong><\/h3>\n<p>我们来讨论如何存储正在处理的不同类型的数据。<\/p>\n<h4>路径规划瓦片<\/h4>\n<p>初始道路数据集从不同来源获取。它会根据位置更新数据随时间不断改进。<\/p>\n<p>道路数据是非结构化的。我们有一个周期性的离线处理流水线，把这些原始数据转换为应用所需的基于图的路径规划瓦片。<\/p>\n<p>我们不需要数据库的任何特性，因此不把这些瓦片存入数据库，而是存储在 S3 对象存储中，同时积极地缓存它们。<\/p>\n<p>我们还可以利用库将邻接表高效地压缩成二进制文件。<\/p>\n<h4>用户位置数据<\/h4>\n<p>用户位置数据对于更新路况和进行各种其他分析非常有用。<\/p>\n<p>由于这类数据的性质是写密集型的，我们可以使用 Cassandra 存储。<\/p>\n<p>示例行：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/user-location-data-torw.png\" alt=\"用户位置数据行\" width=\"500\" />\n<\/div>\n\n<h4>地理编码数据库<\/h4>\n<p>该数据库存储经纬度坐标与地点之间的键值对。<\/p>\n<p>由于读多写少，我们可以使用 Redis 以获得快速的读取访问速度。<\/p>\n<h4>预计算的世界地图图像<\/h4>\n<p>如前所述，我们将预计算地图切片图像并存储在 CDN 中。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/precomputed-map-tile-image.png\" alt=\"预计算的地图瓦片图像\" width=\"500\" />\n<\/div>\n\n<h3><strong>服务<\/strong><\/h3>\n<h4>位置服务<\/h4>\n<p>我们聚焦于该服务的数据库设计，以及用户位置的详细存储方式。<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-service-diagram.png\" alt=\"位置服务架构图\" width=\"500\" />\n<\/div>\n\n<p>我们可以使用 NoSQL 数据库来应对位置更新上的重写入负载。我们优先考虑可用性而非一致性，因为用户位置数据经常变化，随着新更新到来，旧数据会过时。<\/p>\n<p>我们选择 Cassandra 作为数据库，因为它很好地满足了我们所有的需求。<\/p>\n<p>我们要存储的示例行：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/user-location-row-example.png\" alt=\"用户位置行示例\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><code>user_id<\/code> 是分区键（partition key），以便快速访问某个特定用户的所有位置更新<\/li>\n<li><code>timestamp<\/code> 是聚簇键（clustering key），以便按接收位置更新的时间排序存储数据<\/li>\n<\/ul>\n<p>我们还利用 Kafka 将位置更新流式传输给其他各种需要位置更新的服务：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/location-update-streaming.png\" alt=\"位置更新流处理\" width=\"500\" />\n<\/div>\n\n<h4>地图渲染<\/h4>\n<p>地图瓦片以不同缩放级别存储。在最低缩放级别，整个世界由一张 256x256 的瓦片表示。<\/p>\n<p>随着缩放级别提高，地图瓦片数量变为原来的四倍：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/zoom-level-increases.png\" alt=\"缩放级别提高\" width=\"500\" />\n<\/div>\n\n<p>我们可以使用的一个优化是：不在网络上发送完整的图像信息，而是将瓦片表示为矢量（路径和多边形），让客户端动态渲染瓦片。<\/p>\n<p>这将大幅节省带宽。<\/p>\n<h4>导航服务<\/h4>\n<p>该服务负责寻找最快路线：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/navigation-service.png\" alt=\"导航服务\" width=\"500\" />\n<\/div>\n\n<p>我们来逐一介绍这个子系统中的每个组件。<\/p>\n<p>首先，我们有地理编码服务，它把地址解析为经纬度坐标位置。<\/p>\n<p>请求示例：<\/p>\n<pre><code>https://maps.googleapis.com/maps/api/geocode/json?address=1600+Amphitheatre+Parkway,+Mountain+View,+CA\n<\/code><\/pre>\n<p>响应示例：<\/p>\n<pre><code class=\"language-json\">{\n   &quot;results&quot; : [\n      {\n         &quot;formatted_address&quot; : &quot;1600 Amphitheatre Parkway, Mountain View, CA 94043, USA&quot;,\n         &quot;geometry&quot; : {\n            &quot;location&quot; : {\n               &quot;lat&quot; : 37.4224764,\n               &quot;lng&quot; : -122.0842499\n            },\n            &quot;location_type&quot; : &quot;ROOFTOP&quot;,\n            &quot;viewport&quot; : {\n               &quot;northeast&quot; : {\n                  &quot;lat&quot; : 37.4238253802915,\n                  &quot;lng&quot; : -122.0829009197085\n               },\n               &quot;southwest&quot; : {\n                  &quot;lat&quot; : 37.4211274197085,\n                  &quot;lng&quot; : -122.0855988802915\n               }\n            }\n         },\n         &quot;place_id&quot; : &quot;ChIJ2eUgeAK6j4ARbn5u_wAGqWA&quot;,\n         &quot;plus_code&quot;: {\n            &quot;compound_code&quot;: &quot;CWC8+W5 Mountain View, California, United States&quot;,\n            &quot;global_code&quot;: &quot;849VCWC8+W5&quot;\n         },\n         &quot;types&quot; : [ &quot;street_address&quot; ]\n      }\n   ],\n   &quot;status&quot; : &quot;OK&quot;\n}\n<\/code><\/pre>\n<p>路径规划服务根据当前路况计算一条建议路线，针对出行时间优化。<\/p>\n<p>最短路径服务在对象存储中的路径规划瓦片上运行 A* 算法的一个变体，以计算最优路径：\n * 它接收起点/终点对，将其转换为经纬度坐标对，并从这些坐标对推导地理哈希，从而得到对应的路径规划瓦片\n * 算法从初始路径规划瓦片开始，遍历它，直到找到通往目标瓦片的足够好的路径<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/shortest-path-service.png\" alt=\"最短路径服务\" width=\"500\" />\n<\/div>\n\n<p>ETA 服务由路径规划服务调用，基于机器学习算法根据路况数据预测预计到达时间。<\/p>\n<p>排序器（ranker）服务负责根据用户传入的过滤器对不同的可能路径进行排序，即避开收费公路或高速公路的标志位。<\/p>\n<p>更新器服务异步更新一些重要数据库，使其保持最新。<\/p>\n<h4>改进 —— 自适应 ETA 与改道<\/h4>\n<p>我们可以做的一项改进是：基于新获得的路况数据，自适应地更新正在进行中的路线。<\/p>\n<p>实现方法之一是：把正在某条路线上导航的用户正在经过的所有瓦片存储到数据库中。<\/p>\n<p>数据可能如下所示：<\/p>\n<pre><code>user_1: r_1, r_2, r_3, …, r_k\nuser_2: r_4, r_6, r_9, …, r_n\nuser_3: r_2, r_8, r_9, …, r_m\n...\nuser_n: r_2, r_10, r21, ..., r_l\n<\/code><\/pre>\n<p>如果某个瓦片上发生交通事故，我们可以识别出所有路径经过该瓦片的用户，并为他们重新规划路线。<\/p>\n<p>为了减少数据库中存储的瓦片数量，我们可以改为存储起点路径规划瓦片以及不同分辨率层级的若干路径规划瓦片，直到把目标瓦片也包含进来：<\/p>\n<pre><code>user_1, r_1, super(r_1), super(super(r_1)), ...\n<\/code><\/pre>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/adaptive-eta-data-storage.png\" alt=\"自适应 ETA 数据存储\" width=\"500\" />\n<\/div>\n\n<p>使用这种方式，我们只需检查用户的最终瓦片是否包含事故瓦片，就能判断该用户是否受影响。<\/p>\n<p>我们还可以跟踪正在导航的用户的所有可能路线，如果有更快的改道方案可用，就通知他们。<\/p>\n<h4>交付协议<\/h4>\n<p>我们有几个选项，可以让服务器主动向客户端推送数据：\n * 移动推送通知不适用，因为其负载有限，而且对 Web 应用不可用\n * WebSocket 通常是比长轮询更好的选择，因为它在服务器上的计算开销更小\n * 我们也可以使用服务器发送事件（SSE），但更倾向于 WebSocket，因为它支持双向通信，这在例如最后一公里配送功能中会很有用<\/p>\n<hr />\n<h2>第 4 步：总结<\/h2>\n<p>这是我们的最终设计：<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"18. Google Maps/images/final-design.png\" alt=\"最终设计\" width=\"500\" />\n<\/div>\n\n<p>我们可以提供的另一项功能是多站点导航，可以卖给 Uber 或 Lyft 等企业客户，用于规划访问一组地点的最优路径。<\/p>", "enTitle": "Chapter 18: Google Maps", "zhTitle": "第 18 章：设计谷歌地图（Google Maps）", "short": "Google Maps", "num": "18"}, "19. Distributed Message Queue": {"en": "\n<h2>Introduction<\/h2>\n<p>We'll be designing a <strong>distributed message queue<\/strong> in this chapter.<\/p>\n<p>Benefits of message queues:\n- <strong>Decoupling<\/strong>: Eliminates tight coupling between components. Let them update separately.\n- <strong>Improved scalability<\/strong>: Producers and consumers can be scaled independently based on traffic.\n- <strong>Increased availability<\/strong>: If one part of the system goes down, other parts continue interacting with the queue.\n- <strong>Better performance<\/strong>: Producers can produce messages without waiting for consumer confirmation.<\/p>\n<p>Some popular message queue implementations - Kafka, RabbitMQ, RocketMQ, Apache Pulsar, ActiveMQ, ZeroMQ.<\/p>\n<p>Strictly speaking, Kafka and Pulsar are not message queues. They are event streaming platforms.\nThere is however a convergence of features which blurs the distinction between message queues and event streaming platforms.<\/p>\n<p>In this chapter, we'll be building a message queue with support for more advanced features such as long data retention, repeated message consumption, etc.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<p>Message queues ought to support few basic features - producers produce messages and consumers consume them.\nThere are, however, different considerations with regards to performance, message delivery, data retention, etc.<\/p>\n<p>Here's a set of potential questions between Candidate and Interviewer:\n * C: What's the format and average message size? Is it text only?\n * I: Messages are text-only and usually a few KBs\n * C: Can messages be repeatedly consumed?\n * I: Yes, messages can be repeatedly consumed by different consumers. This is an added requirement, which traditional message queues don't support.\n * C: Are messages consumed in the same order they were produced?\n * I: Yes, order guarantee should be preserved. This is an added requirement, traditional message queues don't support this.\n * C: What are the data retention requirements?\n * I: Messages need to have a retention of two weeks. This is an added requirement.\n * C: How many producers and consumers do we want to support?\n * I: The more, the better.\n * C: What data delivery semantic do we want to support? At-most-once, at-least-once, exactly-once?\n * I: We definitely want to support at-least-once. Ideally, we can support all and make them configurable.\n * C: What's the target throughput for end-to-end latency?\n * I: It should support high throughput for use cases like log aggregation and low throughput for more traditional use cases.<\/p>\n<h3><strong>Functional requirements<\/strong><\/h3>\n<ul>\n<li>Producers send messages to a message queue<\/li>\n<li>Consumers consume messages from the queue<\/li>\n<li>Messages can be consumed once or repeatedly<\/li>\n<li>Historical data can be truncated<\/li>\n<li>Message size is in the KB range<\/li>\n<li>Order of messages needs to be preserved<\/li>\n<li>Data delivery semantics is configurable - at-most-once/at-least-once/exactly-once.<\/li>\n<\/ul>\n<h3><strong>Non-functional requirements<\/strong><\/h3>\n<ul>\n<li><strong>High throughput or low latency<\/strong>: Configurable based on use-case<\/li>\n<li><strong>Scalable<\/strong>: system should be distributed and support a sudden surge in message volume<\/li>\n<li><strong>Persistent and durable<\/strong>: data should be persisted on disk and replicated among nodes<\/li>\n<\/ul>\n<p>Traditional message queues typically don't support data retention and don't provide ordering guarantees. This greatly simplifies the design and we'll discuss it.<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<p>Key components of a message queue:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-queue-components.png\" alt=\"message-queue-components\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Producer sends messages to a queue<\/li>\n<li>Consumer subscribes to a queue and consumes the subscribed messages<\/li>\n<li>Message queue is a service in the middle which decouples producers from consumers, letting them scale independently.<\/li>\n<li>Producer and consumer are both clients, while the message queue is the server.<\/li>\n<\/ul>\n<h3><strong>Messaging models<\/strong><\/h3>\n<p>The first type of messaging model is point-to-point and it's commonly found in traditional message queues:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/point-to-point-model.png\" alt=\"point-to-point-model\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>A message is sent to a queue and it's consumed by exactly one consumer.<\/li>\n<li>There can be multiple consumers, but a message is consumed only once.<\/li>\n<li>Once message is acknowledged as consumed, it is removed from the queue.<\/li>\n<li>There is no data retention in the point-to-point model, but there is such in our design.<\/li>\n<\/ul>\n<p>On the other hand, the publish-subscribe model is more common for event streaming platforms:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/publish-subscribe-model.png\" alt=\"publish-subscribe-model\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>In this model, messages are associated to a topic.<\/li>\n<li>Consumers are subscribed to a topic and they receive all messages sent to this topic.<\/li>\n<\/ul>\n<h3><strong>Topics, partitions and brokers<\/strong><\/h3>\n<p>What if the data volume for a topic is too large? One way to scale is by splitting a topic into partitions (aka sharding):<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/partitions.png\" alt=\"partitions\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Messages sent to a topic are evenly distributed across partitions<\/li>\n<li>The servers that host partitions are called brokers<\/li>\n<li>Each topic operates like a queue using FIFO for message processing. Message order is preserved within a partition.<\/li>\n<li>The position of a message within the partition is called an <strong>offset<\/strong>.<\/li>\n<li>Each message produced is sent to a specific partition. A partition key specifies which partition a message should land in. <\/li>\n<li>Eg a <code>user_id<\/code> can be used as a partition key to guarantee order of messages for the same user.<\/li>\n<li>Each consumer subscribes to one or more partitions. When there are multiple consumers for the same messages, they form a consumer group.<\/li>\n<\/ul>\n<h3><strong>Consumer groups<\/strong><\/h3>\n<p>Consumer groups are a set of consumers working together to consume messages from a topic:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-groups.png\" alt=\"consumer-groups\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Messages are replicated per consumer group (not per consumer).<\/li>\n<li>Each consumer group maintains its own offset.<\/li>\n<li>Reading messages in parallel by a consumer group improves throughput but hampers the ordering guarantee.<\/li>\n<li>This can be mitigated by only allowing one consumer from a group to be subscribed to a partition. <\/li>\n<li>This means that we can't have more consumers in a group than there are partitions.<\/li>\n<\/ul>\n<h3><strong>High-level architecture<\/strong><\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/high-level-architecture.png\" alt=\"high-level-architecture\" width=\"500\" />\n<\/div>\n\n<ul>\n<li><strong>Clients<\/strong>: producer and consumer. Producer pushes messages to a designated topic. Consumer group subscribes to messages from a topic.<\/li>\n<li><strong>Brokers<\/strong>: hold multiple partitions. A partition holds a subset of messages for a topic.<\/li>\n<li><strong>Data storage<\/strong>: stores messages in partitions.<\/li>\n<li><strong>State storage<\/strong>: keeps the consumer states.<\/li>\n<li><strong>Metadata storage<\/strong>: stores configuration and topic properties<\/li>\n<li><strong>Coordination service<\/strong>: responsible for service discovery (which brokers are alive) and leader election (which broker is leader, responsible for assigning partitions).<\/li>\n<\/ul>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<p>In order to achieve high throughput and preserve the high data retention requirement, we made some important design choices:\n * We chose an on-disk data structure which takes advantage of the properties of modern HDD and disk caching strategies of modern OS-es.\n * The message data structure is immutable to avoid extra copying, which we want to avoid in a high volume/high traffic system.\n * We designed our writes around batching as small I/O is an enemy of high throughput.<\/p>\n<h3><strong>Data storage<\/strong><\/h3>\n<p>In order to find the best data store for messages, we must examine a message's properties:\n * Write-heavy, read-heavy\n * No update/delete operations. In traditional message queues, there is a \"delete\" operation as messages are not retained.\n * Predominantly sequential read/write access pattern.<\/p>\n<p>What are our options:\n- <strong>Database<\/strong>: not ideal as typical databases don't support well both write and read heavy systems.\n- <strong>Write-ahead log (WAL)<\/strong>: a plain text file which only supports appending to it and is very HDD-friendly. \n  * We split partitions into segments to avoid maintaining a very large file.\n  * Old segments are read-only. Writes are accepted by latest segment only.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/wal-example.png\" alt=\"wal-example\" width=\"500\" />\n<\/div>\n\n<p>WAL files are extremely efficient when used with traditional HDDs. <\/p>\n<p>There is a misconception that HDD acces is slow, but that hugely depends on the access pattern.\nWhen the access pattern is sequential (as in our case), HDDs can achieve several MB/s write/read speed which is sufficient for our needs.\nWe also piggyback on the fact that the OS caches disk data in memory aggressively.<\/p>\n<h3><strong>Message data structure<\/strong><\/h3>\n<p>It is important that the message schema is compliant between producer, queue and consumer to avoid extra copying. This allows much more efficient processing.<\/p>\n<p>Example message structure:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/message-structure.png\" alt=\"message-structure\" width=\"500\" />\n<\/div>\n\n<p>The key of the message specifies which partition a message belongs to. An example mapping is <code>hash(key) % numPartitions<\/code>.\nFor more flexibility, the producer can override default keys in order to control which partitions messages are distributed to.<\/p>\n<p>The message value is the payload of a message. It can be plaintext or a compressed binary block.<\/p>\n<p><strong>Note:<\/strong> Message keys, unlike traditional KV stores, need not be unique. It is acceptable to have duplicate keys and for it to even be missing.<\/p>\n<p>Other message files:\n- <strong>Topic<\/strong>: topic the message belongs to\n- <strong>Partition<\/strong>: The ID of the partition a message belongs to\n- <strong>Offset<\/strong>: The position of the message in a partition. A message can be located via <code>topic<\/code>, <code>partition<\/code>, <code>offset<\/code>.\n- <strong>Timestamp<\/strong>: When the message is stored\n- <strong>Size<\/strong>: the size of this message\n- <strong>CRC<\/strong>: checksum to ensure message integrity<\/p>\n<p>Additional features such as filtering can be supported by adding additional fields.<\/p>\n<h3><strong>Batching<\/strong><\/h3>\n<p>Batching is critical for the performance of our system. We apply it in the producer, consumer and message queue.<\/p>\n<p>It is critical because:\n * It allows the operating system to group messages together, amortizing the cost of expensive network round trips\n * Messages are written to the WAL in groups sequentially, which leads to a lot of sequential writes and disk caching.<\/p>\n<p>There is a trade-off between latency and throughput:\n * High batching leads to high throughput and higher latency. \n * Less batching leads to lower throughput and lower latency.<\/p>\n<p>If we need to support lower latency since the system is deployed as a traditional message queue, the system could be tuned to use a smaller batch size.<\/p>\n<p>If tuned for throughput, we might need more partitions per topic to compensate for the slower sequential disk write throughput.<\/p>\n<h3><strong>Producer flow<\/strong><\/h3>\n<p>If a producer wants to send a message to a partition, which broker should it connect to?<\/p>\n<p>One option is to introduce a routing layer, which route messages to the correct broker. If replication is enabled, the correct broker is the leader replica:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/routing-layer.png\" alt=\"routing-layer\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Routing layer reads the replication plan from the metadata store and caches it locally.<\/li>\n<li>Producer sends a message to the routing layer.<\/li>\n<li>Message is forwarded to broker 1 who is the leader of the given partition<\/li>\n<li>Follower replicas pull the new message from the leader. Once enough confirmations are received, the leader commits the data and responds to the producer.<\/li>\n<\/ul>\n<p>The reason for having replicas is to enable fault tolerance.<\/p>\n<p>This approach works but has some drawbacks:\n * Additional network hops due to the extra component\n * The design doesn't enable batching messages<\/p>\n<p>To mitigate these issues, we can embed the routing layer into the producer:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/routing-layer-producer.png\" alt=\"routing-layer-producer\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Fewer network hops lead to lower latency<\/li>\n<li>Producers can control which partition a message is routed to<\/li>\n<li>The buffer allows us to batch messages in-memory and send out larger batches in a single request, which increases throughput.<\/li>\n<\/ul>\n<p>The batch size choice is a classical trade-off between throughput and latency. <\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/batch-size-throughput-vs-latency.png\" alt=\"batch-size-throughput-vs-latency\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Larger batch size leads to longer wait time before batch is committed. <\/li>\n<li>Smaller batch size leads to request being sent sooner and having lower latency but lower throughput.<\/li>\n<\/ul>\n<h3><strong>Consumer flow<\/strong><\/h3>\n<p>The consumer specifies its offset in a partition and receives a chunk of messages, beginning from that offset:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-example.png\" alt=\"consumer-example\" width=\"500\" />\n<\/div>\n\n<p>One important consideration when designing the consumer is whether to use a push or a pull model:\n- <strong>Push model<\/strong>: leads to lower latency as broker pushes messages to consumer as it receives them.\n  * However, if rate of consumption falls behind the rate of production, the consumer can be overwhelmed.\n  * It is challenging to deal with consumers with varying processing power as the broker controls the rate of consumption.\n- <strong>Pull model<\/strong>: leads to the consumer controlling the consumption rate. \n  * If rate of consumption is slow, consumer will not be overwhelmed and we can scale it to catch up.\n  * The pull model is more suitable for batch processing, because with the push model, the broker can't know how many messages a consumer can handle. \n  * With the pull model, on the other hand, consumers can aggressively fetch large message batches.\n  * The down side is the higher latency and extra network calls when there are no new messages. Latter issue can be mitigated using long polling.<\/p>\n<p>Hence, most message queues (and us) choose the pull model.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-flow.png\" alt=\"consumer-flow\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>A new consumer subscribes to topic A and joins group 1.<\/li>\n<li>The correct broker node is found by hashing the group name. This way, all consumers in a group connect to the same broker.<\/li>\n<li>Note that this consumer group coordinator is different from the coordination service (ZooKeeper).<\/li>\n<li>Coordinator confirms that the consumer has joined the group and assigns partition 2 to that consumer.<\/li>\n<li>There are different partition assignment strategies - round-robin, range, etc.<\/li>\n<li>Consumer fetches latest messages from the last offset. The state storage keeps the consumer offsets.<\/li>\n<li>Consumer processes messages and commits the offset to the broker. The order of those operations affects the message delivery semantics.<\/li>\n<\/ul>\n<h3><strong>Consumer rebalancing<\/strong><\/h3>\n<p>Consumer rebalancing is responsible for deciding which consumers are responsible for which partition.<\/p>\n<p>This process occurs when a consumer joins/leaves or a partition is added/removed.<\/p>\n<p>The broker, acting as a coordinator plays a huge role in orchestrating the rebalancing workflow.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-rebalancing.png\" alt=\"consumer-rebalancing\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>All consumers from the same group are connected to the same coordinator. The coordinator is found by hashing the group name.<\/li>\n<li>When the consumer list changes, the coordinator chooses a new leader of the group.<\/li>\n<li>The leader of the group calculates a new partition dispatch plan and reports it back to the coordinator, which broadcasts it to the other consumers.<\/li>\n<\/ul>\n<p>When the coordinator stops receiving heartbeats from the consumers in a group, a rebalancing is triggered:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-rebalance-example.png\" alt=\"consumer-rebalance-example\" width=\"500\" />\n<\/div>\n\n<p>Let's explore what happens when a consumer joins a group:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-join-group-usecase.png\" alt=\"consumer-join-group-usecase\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Initially, only consumer A is in the group and it consumes all partitions.<\/li>\n<li>Consumer B sends a request to join the group.<\/li>\n<li>The coordinator notifies all group members that it's time to rebalance passively - as a response to the heartbeat.<\/li>\n<li>Once all consumers rejoin the group, the coordinator chooses a leader and notifies the rest about the election result.<\/li>\n<li>The leader generates the partition dispatch plan and sends it to the coordinator. Others wait for the dispatch plan.<\/li>\n<li>Consumers start consuming from the newly assigned partitions.<\/li>\n<\/ul>\n<p>Here's what happens when a consumer leaves the group:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-leaves-group-usecase.png\" alt=\"consumer-leaves-group-usecase\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Consumer A and B are in the same group<\/li>\n<li>Consumer B asks to leave the group<\/li>\n<li>When coordinator receives A's heartbeat, it informs them that it's time to rebalance.<\/li>\n<li>The rest of the steps are the same.<\/li>\n<\/ul>\n<p>The process is similar when a consumer doesn't send a heartbeat for a long time:<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/consumer-no-heartbeat-usecase.png\" alt=\"consumer-no-heartbeat-usecase\" width=\"500\" />\n<\/div>\n\n<h3><strong>State storage<\/strong><\/h3>\n<p>The state storage stores mapping between partitions and consumers, as well as the last consumed offsets for a partition.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/state-storage.png\" alt=\"state-storage\" width=\"500\" />\n<\/div>\n\n<p>Group 1's offset is at 6, meaning all previous messages are consumed. If a consumer crashes, the new consumer will continue from that message on wards.<\/p>\n<p>Data access patterns for consumer states:\n * Frequent read/write operations, but low volume\n * Data is updated frequently, but rarely deleted\n * Random read/write\n * Data consistency is important<\/p>\n<p>Given these requirements, a fast KV storage like Zookeeper is ideal.<\/p>\n<h3><strong>Metadata storage<\/strong><\/h3>\n<p>The metadata storage stores configuration and topic properties - partition number, retention period, replica distribution.<\/p>\n<p>Metadata doesn't change often and volume is small, but there is a high consistency requirement.\nZookeeper is a good choice for this storage.<\/p>\n<h3><strong>ZooKeeper<\/strong><\/h3>\n<p>Zookeeper is essential for building distributed message queues.<\/p>\n<p>It is a hierarchical key-value store, commonly used for a distributed configuration, synchronization service and naming registry (ie service discovery).<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/zookeeper.png\" alt=\"zookeeper\" width=\"500\" />\n<\/div>\n\n<p>With this change, the broker only needs to maintain data for the messages. Metadata and state storage is in Zookeeper.<\/p>\n<p>Zookeeper also helps with leader election of the broker replicas.<\/p>\n<h3><strong>Replication<\/strong><\/h3>\n<p>In distributed systems, hardware issues are inevitable. We can tackle this via replication to achieve high availability.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/replication-example.png\" alt=\"replication-example\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Each partition is replicated across multiple brokers, but there is only one leader replica.<\/li>\n<li>Producers send messages to leader replicas<\/li>\n<li>Followers pull the replicated messages from the leader<\/li>\n<li>Once enough replicas are synchronized, the leader returns acknowledgment to the producer<\/li>\n<li>Distribution of replicas for each partition is called the replica distribution plan.<\/li>\n<li>The leader for a given partition creates the replica distribution plan and saves it in Zookeeper<\/li>\n<\/ul>\n<h3><strong>In-sync replicas<\/strong><\/h3>\n<p>One problem we need to tackle is keeping messages in-sync between the leader and the followers for a given partition.<\/p>\n<p>In-sync replicas (ISR) are replicas for a partition that stay in-sync with the leader.<\/p>\n<p>The <code>replica.lag.max.messages<\/code> defines how many messages can a replica be lagging behind the leader to be considered in-sync.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/in-sync-replicas-example.png\" alt=\"in-sync-replicas-example\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Committed offset is 13<\/li>\n<li>Two new messages are written to the leader, but not committed yet.<\/li>\n<li>A message is committed once all replicas in the ISR have synchronized that message<\/li>\n<li>Replica 2 and 3 have fully caught up with leader, hence, they are in ISR<\/li>\n<li>Replica 4 has lagged behind, hence, is removed from ISR for now<\/li>\n<\/ul>\n<p>ISR reflects a trade-off between performance and durability.\n * In order for producers not to lose messages, all replicas should be in sync before sending an acknowledgment\n * But a slow replica will cause the whole partition to become unavailable<\/p>\n<p>Acknowledgment handling is configurable.<\/p>\n<p><code>ACK=all<\/code> means that all replicas in ISR have to sync a message. Message sending is slow, but message durability is highest.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-all.png\" alt=\"ack-all\" width=\"500\" />\n<\/div>\n\n<p><code>ACK=1<\/code> means that producer receives acknowledgment once leader receives the message. Message sending is fast, but message durability is low.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-1.png\" alt=\"ack-1\" width=\"500\" />\n<\/div>\n\n<p><code>ACK=0<\/code> means that producer sends messages without waiting for any acknowledgment from leader. Message sending is fastest, message durability is lowest.<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/ack-0.png\" alt=\"ack-0\" width=\"500\" />\n<\/div>\n\n<p>On the consumer side, we can connect all consumers to the leader for a partition and let them read messages from it:\n * This makes for the simplest design and easiest operation\n * Messages in a partition are sent to only one consumer in a group, which limits the connections to the leader replica\n * The number of connections to leader replica is typically not high as long as the topic is not super hot\n * We can scale a hot topic by increasing the number of partitions and consumers\n * In certain scenarios, it might make sense to let a consumer lead from an ISR, eg if they're located in a separate DC<\/p>\n<p>The ISR list is maintained by the leader who tracks the lag between itself and each replica.<\/p>\n<h3><strong>Scalability<\/strong><\/h3>\n<p>Let's evaluate how we can scale different parts of the system.<\/p>\n<h4>Producer<\/h4>\n<p>The producer is much smaller than the consumer. Its scalability can easily be achieved by adding/removing new producer instances.<\/p>\n<h4>Consumer<\/h4>\n<p>Consumer groups are isolated from each other. It is easy to add/remove consumer groups at will.<\/p>\n<p>Rebalancing help handle the case when consumers are added/removed from a group gracefully.<\/p>\n<p>Consumer groups are rebalancing help us achieve scalability and fault tolerance.<\/p>\n<h4>Broker<\/h4>\n<p>How do brokers handle failure?<\/p>\n<div style=\"margin-left:3rem\">\n    <img src=\"19. Distributed Message Queue/images/broker-failure-recovery.png\" alt=\"broker-failure-recovery\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Once a broker fails, there are still enough replicas to avoid partition data loss<\/li>\n<li>A new leader is elected and the broker coordinator redistributes partitions which were at the failed broker to existing replicas<\/li>\n<li>Existing replicas pick up the new partitions and act as followers until they're caught up with the leader and become ISR<\/li>\n<\/ul>\n<p>Additional considerations to make the broker fault-tolerant:\n * The minimum number of ISRs balances latency and safety. You can fine-tune it to meet your needs.\n * If all replicas of a partition are in the same node, then it's a waste of resources. Replicas should be across different brokers.\n * If all replicas of a partition crash, then the data is lost forever. Spreading replicas across data centers can help, but it adds up a lot of latency. One option is to use <a href=\"https://cwiki.apache.org/confluence/pages/viewpage.action?pageId=27846330\">data
