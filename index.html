<html lang="zh-CN">
<head>

<title>System Design Interview Notes · 系统设计面试笔记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1B2E'/%3E%3Cpath d='M7 9h18M7 15h11M7 21h15' stroke='%23E8A33D' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='9' r='1.6' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
/* ===== 设计令牌 ===== */
:root{
  --navy:#0D1B2E; --navy-2:#14263F; --navy-3:#1D3352;
  --paper:#F3F5F9; --card:#FFFFFF;
  --ink:#1A2438; --ink-soft:#56627A; --ink-faint:#8B97AB;
  --line:#DDE4EE; --accent:#E8A33D; --accent-deep:#B9771B;
  --code-bg:#0F1E33; --link:#1F66B0;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --topbar-h:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.topbar-in{display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 14px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand-sub{display:none;font-size:11px;color:#93A4C2;margin-top:1px}
.brand-txt{min-width:0}
.spacer{flex:1}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px;gap:2px}
.lang-btn{border:0;background:transparent;color:#AFC0DC;font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;letter-spacing:.4px;transition:background .15s,color .15s}
.lang-btn:hover{color:#fff}
.lang-btn.active{background:var(--accent);color:var(--navy)}
.menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff}
.progress{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);transition:width .1s linear}

/* ===== 布局 ===== */
.layout{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--navy);transform:translateX(-105%);transition:transform .28s ease;z-index:70;display:flex;flex-direction:column;padding-top:14px}
.sidebar.open{transform:none}
.drawer-mask{position:fixed;inset:0;background:rgba(6,12,22,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:65}
.drawer-mask.show{opacity:1;pointer-events:auto}
.side-search{padding:0 14px 12px}
.side-search .box{display:flex;align-items:center;gap:8px;background:var(--navy-2);border:1px solid #2A4266;border-radius:8px;padding:8px 10px}
.side-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#E6EDF8;font-size:14px}
.side-search input::placeholder{color:#7E90AE}
.side-search svg{flex:none;color:#7E90AE}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 10px;font-size:12px;font-weight:700;letter-spacing:1.6px;color:#7E90AE}
.ch-list{flex:1;overflow-y:auto;padding:0 8px 16px}
.ch-list::-webkit-scrollbar{width:6px}
.ch-list::-webkit-scrollbar-thumb{background:#2A4266;border-radius:3px}
.ch-item{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:9px 12px 9px 9px;transition:background .15s}
.ch-item:hover{background:rgba(255,255,255,.06)}
.ch-item.active{background:rgba(232,163,61,.10);border-left-color:var(--accent)}
.ch-no{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:#6C7FA0;padding-top:3px;width:22px}
.ch-item.active .ch-no{color:var(--accent)}
.ch-names{min-width:0}
.nm-en{display:block;font-size:14px;font-weight:600;color:#C6D3E8;line-height:1.45}
.nm-zh{display:block;font-size:12.5px;color:#8295B5;line-height:1.45;margin-top:1px}
body[data-lang="zh"] .nm-zh{color:#EDF2FA;font-weight:600}
body[data-lang="zh"] .nm-en{color:#8295B5;font-weight:500}
.ch-empty{padding:26px 14px;color:#8295B5;font-size:13px;text-align:center}
.side-foot{padding:12px 14px;border-top:1px solid #1D3352;font-size:11.5px;color:#7E90AE;line-height:1.6}

/* ===== 主内容 ===== */
.main{min-height:100vh}
.ch-head{padding:34px 20px 6px;max-width:860px;margin:0 auto}
.ch-meta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ch-num{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent-deep)}
.ch-other{font-size:12.5px;color:var(--ink-faint)}
.ch-title{font-size:27px;font-weight:800;line-height:1.35;letter-spacing:.2px}
.content{padding:10px 20px 0;max-width:860px;margin:0 auto}
.content>p,.content>ul,.content>ol,.content>table,.content>pre,.content>blockquote,.content>div{margin:0 0 18px}
.content p{color:var(--ink);overflow-wrap:break-word}
.content h2{font-size:20px;font-weight:800;color:var(--navy);margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.content h3{font-size:16.5px;font-weight:700;color:var(--navy);margin:26px 0 10px}
.content h4{font-size:15px;font-weight:700;color:var(--navy-3);margin:20px 0 8px}
.content ul,.content ol{padding-left:24px}
.content li{margin:4px 0;overflow-wrap:break-word}
.content li>ul,.content li>ol{margin-top:4px}
.content a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(31,102,176,.35)}
.content a:hover{color:#174E8C;border-bottom-color:currentColor}
.content img{max-width:100%;height:auto;display:block;margin:18px auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.content table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:22px}
.content th{background:#E9EEF6;color:var(--navy);font-weight:700;text-align:left;padding:9px 12px;border:1px solid var(--line)}
.content td{padding:8px 12px;border:1px solid var(--line);vertical-align:top;overflow-wrap:break-word}
.content tr:nth-child(even) td{background:#F8FAFD}
.content code{font-family:var(--mono);font-size:13px;background:#E7EDF6;color:#0F4C81;padding:2px 6px;border-radius:5px}
.content pre{background:var(--code-bg);color:#D8E3F5;padding:15px 16px;border-radius:10px;overflow-x:auto;line-height:1.6}
.content pre code{background:transparent;color:inherit;padding:0;font-size:13px}
.content blockquote{border-left:3px solid var(--accent);background:#FFF8EC;padding:10px 16px;border-radius:0 8px 8px 0;color:var(--ink-soft)}
.content blockquote p{margin:0;color:inherit}
.content hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.lang-note{background:#FFF8EC;border:1px solid #F0DCB6;color:#7A5A17;font-size:13.5px;padding:10px 14px;border-radius:8px;margin-bottom:20px}

/* 分页导航 */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:860px;margin:44px auto 0;padding:0 20px}
.pg-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 16px;text-align:left;transition:border-color .15s,box-shadow .15s}
.pg-btn:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(13,27,46,.08)}
.pg-btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.pg-btn.next{text-align:right}
.pg-label{font-size:11px;letter-spacing:1px;color:var(--ink-faint);font-weight:700}
.pg-title{font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-foot{max-width:860px;margin:36px auto 0;padding:22px 20px 44px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);line-height:1.8}

/* ===== 桌面端 ===== */
@media (min-width:960px){
  .brand-sub{display:block}
  .menu-btn{display:none}
  .layout{display:grid;grid-template-columns:300px 1fr;align-items:start}
  .sidebar{position:sticky;top:0;height:100vh;transform:none;z-index:30;padding-top:18px;transition:none}
  .drawer-mask{display:none}
  .main{min-width:0}
  .ch-head{padding-top:44px}
}
</style>

<script>
const NOTES = {"01. Scaling": {"en": "\n<h2>Introduction<\/h2>\n<p>Scaling a system to support millions of users is a complex, iterative journey requiring refinement and optimization. This chapter outlines how to begin with a single server setup and scale the architecture step by step to handle millions of users.<\/p>\n<hr />\n<h2>Section 1: Single Server Setup<\/h2>\n<p>Initially, all components (web app, database, cache) run on a single server. <\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/single-server.png\" width=\"400\" />\n<\/div>\n\n<h3>Request Flow<\/h3>\n<ol>\n<li>Users access the application via domain names (e.g., <code>api.mysite.com<\/code>), resolved to IP addresses using DNS.<\/li>\n<li>IP address of the web-server is returned to the browser or mobile app.<\/li>\n<li>HTTP requests are sent to the web server, which returns HTML or JSON responses.<\/li>\n<\/ol>\n<h3>Traffic Sources<\/h3>\n<ol>\n<li><strong>Web Applications:<\/strong> Use server-side languages (e.g., Python, Java) for business logic and client-side languages (e.g., JavaScript, HTML) for presentation.<\/li>\n<li><strong>Mobile Applications:<\/strong> Communicate with the web server using HTTP and JSON for lightweight data exchange.<\/li>\n<\/ol>\n<hr />\n<h2>Section 2: Database Separation<\/h2>\n<p>As the user base grows, the database is moved to a dedicated server to allow independent scaling of web and database tiers.<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/database.png\" width=\"400\" />\n<\/div>\n\n<h3>Database Choices<\/h3>\n<ol>\n<li><strong>Relational Databases (SQL):<\/strong> Structured data stored in tables. Examples: MySQL, PostgreSQL.<\/li>\n<li><strong>Non-Relational Databases (NoSQL):<\/strong> Suitable for unstructured data or low-latency requirements. Categories include:\n   - Key-Value Stores\n   - Graph Databases\n   - Column Stores\n   - Document Stores<\/li>\n<\/ol>\n<ul>\n<li>Non-relational databases might be the right choice if:<\/li>\n<li>application requires super-low latency.<\/li>\n<li>data is unstructured, or  there is no relational data.<\/li>\n<li>only need to serialize and deserialize data (JSON, XML, YAML, etc.).<\/li>\n<li>need to store a massive amount of data.<\/li>\n<\/ul>\n<hr />\n<h2>Section 3: Vertical vs Horizontal Scaling<\/h2>\n<h3>Vertical Scaling<\/h3>\n<ul>\n<li>Adds more resources (CPU, RAM) to existing servers.<\/li>\n<li>Limited by hardware constraints and lacks redundancy.<\/li>\n<\/ul>\n<h3>Horizontal Scaling<\/h3>\n<ul>\n<li>Adds more servers to the pool, making it more suitable for large-scale systems.<\/li>\n<li>A load balancer is used to handle the request routing between the servers.<\/li>\n<\/ul>\n<hr />\n<h2>Section 4: Load Balancer<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/load-balancer.png\" width=\"400\" />\n<\/div>\n\n<p>A <strong>load balancer<\/strong> distributes traffic among multiple servers. Benefits include:\n1. Redundancy: If a server goes offline, traffic is rerouted.\n   -  If server 1 goes offline, all the traffic will be routed to server 2.\n2. Scalability: Easily add servers to handle traffic spikes.\n   -  If the website traffic grows rapidly, subsequent servers can be added to handle the additional traffic.<\/p>\n<hr />\n<h2>Section 5: Database Replication<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/database-replication.png\" width=\"400\" />\n<\/div>\n\n<h3>Master-Slave Model<\/h3>\n<ul>\n<li><strong>Master Database:<\/strong> Handles write operations.<\/li>\n<li>All the data-modifying commands like insert, delete, or update must be sent to the master database.<\/li>\n<li><strong>Slave Databases:<\/strong> Handle read operations, improving performance and reliability.<\/li>\n<li>Since the ratio of reads to writes is higher in most applications; thus, the number of slave\ndatabases in a system is usually larger than the number of master databases.<\/li>\n<\/ul>\n<h3>Benefits<\/h3>\n<ol>\n<li>Improved performance through parallel read operations.<\/li>\n<li>High availability and data reliability through redundancy.<\/li>\n<\/ol>\n<h3>Failure Handling<\/h3>\n<ul>\n<li>If only one slave database is available and it goes offline, read operations will be directed\nto the master database temporarily.<\/li>\n<li>In case multiple slave databases are available, read operations are\nredirected to other healthy slave databases and a new server will replace the old one. <\/li>\n<li>If the master database goes offline, a slave database will be promoted to be the new\nmaster.<\/li>\n<li>In production system the chosen slave database might not be up to date, hence data needs to be updated by running data\nrecovery scripts (methods like multi-masters and circular replication could help).<\/li>\n<\/ul>\n<hr />\n<h2>Section 6: Caching<\/h2>\n<p>A <strong>cache<\/strong> stores frequently accessed data in memory to reduce database load. The cache tier is a temporary data store layer, much faster than the database. <\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/cache.png\" width=\"500\" />\n<\/div>\n\n<h3>Caching considerations<\/h3>\n<ol>\n<li><strong>Use case<\/strong>: Consider using cache when data is read frequently but modified infrequently.<\/li>\n<li><strong>Expiration Policies:<\/strong> Once cached data is expired, it is removed from the cache. When there is no expiration policy, cached\ndata will be stored in the memory permanently.<\/li>\n<li><strong>Consistency:<\/strong> This means keeping the data store and the cache in sync. Inconsistency\ncan happen because data-modifying operations on the data store and cache are not in a single transaction. <\/li>\n<li><strong>Mitigating failures<\/strong>: A single cache server represents a potential single point of failure, multiple\ncache servers across different data centers are recommended to avoid SPOF.<\/li>\n<li><strong>Eviction Policies:<\/strong>: Once the cache is full, items need to be evicted to free up memory. LRU is the most popular cache eviction policy.<\/li>\n<\/ol>\n<hr />\n<h2>Section 7: Content Delivery Network (CDN)<\/h2>\n<p>A <strong>CDN<\/strong> improves load times by caching static content (images, CSS, JavaScript) on geographically distributed servers.<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/cdn.png\" width=\"400\" />\n<\/div>\n\n<h3>Workflow<\/h3>\n<ol>\n<li>User requests content from the nearest CDN server.<\/li>\n<li>If unavailable, content is fetched from the origin server and cached.<\/li>\n<\/ol>\n<h3>CDN considerations<\/h3>\n<ol>\n<li><strong>Cost:<\/strong> CDNs are run by third-party providers which charge for data transfers in and out of the CDN.<\/li>\n<li><strong>Cache Expiry:<\/strong> The cache expiry time should neither be too long nor too short.<\/li>\n<li><strong>CDN fallback:<\/strong> If there is a temporary CDN outage, clients should be able to detect the problem\nand request resources from the origin.<\/li>\n<li><strong>Invalidating files:<\/strong> If files are updated the cache should be invalidated to point to the updated files.<\/li>\n<\/ol>\n<hr />\n<h2>Section 8: Stateless Web Tier<\/h2>\n<p>By moving session data to a shared datastore, web servers become stateless. This allows:\n1. Easier horizontal scaling.\n2. Auto-scaling based on traffic.<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/stateless.png\" width=\"400\" />\n<\/div>\n\n<hr />\n<h2>Section 9: Multi-Data Center Setup<\/h2>\n<p>Deploying across multiple data centers improves availability and reduces latency. Strategies include:<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/data-center.png\" width=\"400\" />\n<\/div>\n\n<ol>\n<li><strong>GeoDNS Routing:<\/strong> Direct users to the nearest data center.<\/li>\n<li><strong>Data Replication:<\/strong> Synchronize data across centers to prevent inconsistencies.<\/li>\n<\/ol>\n<h3>Key considerations<\/h3>\n<ul>\n<li><strong>Traffic redirection:<\/strong> Effective tools are needed to direct traffic to the correct data center.<\/li>\n<li><strong>Data synchronization:<\/strong> A common strategy is to replicate data across multiple data centers. <\/li>\n<li><strong>Test and deployment:<\/strong>  Automated deployment tools are vital to keep services consistent through all the data centers.<\/li>\n<\/ul>\n<hr />\n<h2>Section 10: Message Queue<\/h2>\n<p>A <strong>message queue<\/strong> is a durable component, stored in memory, that supports asynchronous\ncommunication. It serves as a buffer and distributes asynchronous requests.<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/message-queue.png\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>Input services, called producers/publishers, create messages, and publish them to a message queue.<\/li>\n<li>Other services called consumers/subscribers, connect to the queue, and perform actions defined by the messages.<\/li>\n<\/ul>\n<hr />\n<h2>Section 11: Logging, Metrics, and Automation<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/logging.png\" width=\"400\" />\n<\/div>\n\n<h3>Importance<\/h3>\n<ol>\n<li><strong>Logging:<\/strong> Tracks errors and system health.<\/li>\n<li><strong>Metrics:<\/strong> Provides insights into performance and user activity.<\/li>\n<li><strong>Automation:<\/strong> Streamlines testing, deployment, and scaling.<\/li>\n<\/ol>\n<hr />\n<h2>Section 12: Database Scaling<\/h2>\n<h3>Vertical Scaling<\/h3>\n<ul>\n<li>Adds hardware resources but has physical and cost limitations.<\/li>\n<li>Has multiple drawbacks:<\/li>\n<li>Greater risk of single point of failures.<\/li>\n<li>Overall cost of vertical scaling is high<\/li>\n<\/ul>\n<h3>Horizontal Scaling (Sharding)<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/horizontal-scaling.png\" width=\"400\" />\n<\/div>\n\n<ul>\n<li>Divides data across multiple shards using keys (e.g., <code>user_id<\/code>).<\/li>\n<li>Sharding separates large databases into smaller, more easily managed parts called shards.<\/li>\n<li>Each shard shares the same schema, though the actual data on each shard is unique to the shard.<\/li>\n<li>Sharding key is critical when implementing a sharding strategy. When choosing a sharding key it is important to choose a key that can evenly distribute data.<\/li>\n<\/ul>\n<h4>Challenges<\/h4>\n<ol>\n<li>\n<p><strong>Resharding data:<\/strong> Resharding data is needed when:\n   - Single shard could no longer hold more data due to rapid growth. \n   - Certain shards might experience shard exhaustion faster than others due to uneven data distribution.\n   - Consistent Hashing is used to overcome these problems<\/p>\n<\/li>\n<li>\n<p><strong>Celebrity problem:<\/strong>  Excessive access to a specific shard could cause server overload.\n   - To solve this problem, we may need to allocate a shard for each celebrity.<\/p>\n<\/li>\n<li>\n<p><strong>Join and de-normalization:<\/strong> Once a database has been sharded across multiple servers, it is hard to perform join operations across database shards.\n   -  A common workaround is to de-normalize the database so that queries can be performed in a single table.<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h2>Conclusion<\/h2>\n<h3>Key Takeaways<\/h3>\n<ol>\n<li>Keep the web tier stateless.<\/li>\n<li>Build redundancy at every tier.<\/li>\n<li>Use caching and CDNs to optimize performance.<\/li>\n<li>Scale the data tier with sharding.<\/li>\n<li>Decouple components for flexibility.<\/li>\n<\/ol>\n<p>This chapter provides a solid foundation for building scalable systems that can handle millions of users.<\/p>", "zh": "\n<h2>引言<\/h2>\n<p>将系统扩展到支持百万级用户是一段复杂、迭代的旅程，需要不断打磨与优化。本章介绍如何从单服务器架构起步，逐步扩展架构，以承载百万级用户。<\/p>\n<hr />\n<h2>第 1 节：单服务器架构<\/h2>\n<p>起初，所有组件（Web 应用、数据库、缓存）都运行在同一台服务器上。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/single-server.png\" width=\"400\" />\n<\/div>\n\n<h3>请求流程<\/h3>\n<ol>\n<li>用户通过域名（例如 <code>api.mysite.com<\/code>）访问应用，域名经域名系统（DNS）解析为 IP 地址。<\/li>\n<li>Web 服务器的 IP 地址返回给浏览器或移动应用。<\/li>\n<li>HTTP 请求被发送到 Web 服务器，服务器返回 HTML 或 JSON 响应。<\/li>\n<\/ol>\n<h3>流量来源<\/h3>\n<ol>\n<li><strong>Web 应用：<\/strong> 使用服务端语言（如 Python、Java）实现业务逻辑，使用客户端语言（如 JavaScript、HTML）负责页面呈现。<\/li>\n<li><strong>移动应用：<\/strong> 使用 HTTP 与 Web 服务器通信，以 JSON 进行轻量级数据交换。<\/li>\n<\/ol>\n<hr />\n<h2>第 2 节：数据库分离<\/h2>\n<p>随着用户规模增长，数据库被迁移到专用服务器上，以便 Web 层与数据库层可以独立扩展。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/database.png\" width=\"400\" />\n<\/div>\n\n<h3>数据库选型<\/h3>\n<ol>\n<li><strong>关系型数据库（SQL）：<\/strong> 以表格形式存储结构化数据。示例：MySQL、PostgreSQL。<\/li>\n<li><strong>非关系型数据库（NoSQL）：<\/strong> 适合非结构化数据或低延迟需求。类别包括：\n   - 键值存储\n   - 图数据库\n   - 列式存储\n   - 文档存储<\/li>\n<\/ol>\n<ul>\n<li>非关系型数据库可能是正确的选择，当：<\/li>\n<li>应用要求极低延迟。<\/li>\n<li>数据是非结构化的，或者不存在关系型数据。<\/li>\n<li>只需要对数据进行序列化和反序列化（JSON、XML、YAML 等）。<\/li>\n<li>需要存储海量数据。<\/li>\n<\/ul>\n<hr />\n<h2>第 3 节：垂直扩展与水平扩展<\/h2>\n<h3>垂直扩展<\/h3>\n<ul>\n<li>为现有服务器增加更多资源（CPU、内存）。<\/li>\n<li>受硬件限制，且缺乏冗余。<\/li>\n<\/ul>\n<h3>水平扩展<\/h3>\n<ul>\n<li>向服务器池中加入更多服务器，更适合大规模系统。<\/li>\n<li>使用负载均衡器（load balancer）在服务器之间处理请求路由。<\/li>\n<\/ul>\n<hr />\n<h2>第 4 节：负载均衡器<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/load-balancer.png\" width=\"400\" />\n<\/div>\n\n<p><strong>负载均衡器<\/strong>将流量分发到多台服务器。其好处包括：\n1. 冗余：如果某台服务器下线，流量会被重新路由。\n   - 如果服务器 1 下线，所有流量将被路由到服务器 2。\n2. 可扩展性：轻松增加服务器以应对流量高峰。\n   - 如果网站流量快速增长，可以增加后续服务器来处理额外流量。<\/p>\n<hr />\n<h2>第 5 节：数据库复制<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/database-replication.png\" width=\"400\" />\n<\/div>\n\n<h3>主从模型<\/h3>\n<ul>\n<li><strong>主数据库（Master）：<\/strong> 处理写操作。<\/li>\n<li>所有修改数据的命令（如 insert、delete 或 update）都必须发送到主数据库。<\/li>\n<li><strong>从数据库（Slave）：<\/strong> 处理读操作，提升性能与可靠性。<\/li>\n<li>由于大多数应用的读远多于写，因此系统中从数据库的数量通常大于主数据库的数量。<\/li>\n<\/ul>\n<h3>好处<\/h3>\n<ol>\n<li>通过并行读操作提升性能。<\/li>\n<li>通过冗余实现高可用性与数据可靠性。<\/li>\n<\/ol>\n<h3>故障处理<\/h3>\n<ul>\n<li>如果只有一台从数据库可用且它下线了，读操作将临时转向主数据库。<\/li>\n<li>如果有多个从数据库可用，读操作会被重定向到其他健康的从数据库，并用一台新服务器替换旧的。<\/li>\n<li>如果主数据库下线，一台从数据库将被提升为新的主数据库。<\/li>\n<li>在生产系统中，被选中的从数据库可能并不是最新的，因此需要运行数据恢复脚本来更新数据（多主复制、环形复制等方法会有帮助）。<\/li>\n<\/ul>\n<hr />\n<h2>第 6 节：缓存<\/h2>\n<p><strong>缓存（cache）<\/strong>把频繁访问的数据存储在内存中，以减轻数据库负载。缓存层是一个临时的数据存储层，比数据库快得多。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/cache.png\" width=\"500\" />\n<\/div>\n\n<h3>缓存注意事项<\/h3>\n<ol>\n<li><strong>使用场景：<\/strong> 当数据读多写少的时候，考虑使用缓存。<\/li>\n<li><strong>过期策略：<\/strong> 缓存数据一旦过期就会被从缓存中移除。如果没有过期策略，缓存数据将永久存储在内存中。<\/li>\n<li><strong>一致性：<\/strong> 这意味着保持数据存储与缓存同步。由于对数据存储和缓存的修改操作不在同一个事务中，因此可能出现不一致。<\/li>\n<li><strong>缓解故障：<\/strong> 单台缓存服务器是潜在的单点故障；建议在不同数据中心部署多台缓存服务器，以避免单点故障（SPOF）。<\/li>\n<li><strong>淘汰策略：<\/strong> 缓存一旦写满，就需要淘汰部分条目以释放内存。LRU（最近最少使用）是最流行的缓存淘汰策略。<\/li>\n<\/ol>\n<hr />\n<h2>第 7 节：内容分发网络（CDN）<\/h2>\n<p><strong>内容分发网络（CDN）<\/strong>通过在地理上分布的服务器上缓存静态内容（图片、CSS、JavaScript）来提升加载速度。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/cdn.png\" width=\"400\" />\n<\/div>\n\n<h3>工作流程<\/h3>\n<ol>\n<li>用户向最近的 CDN 服务器请求内容。<\/li>\n<li>如果未命中，则从源站获取内容并缓存。<\/li>\n<\/ol>\n<h3>CDN 注意事项<\/h3>\n<ol>\n<li><strong>成本：<\/strong> CDN 由第三方提供商运营，按进出 CDN 的数据传输量收费。<\/li>\n<li><strong>缓存过期：<\/strong> 缓存过期时间既不宜过长，也不宜过短。<\/li>\n<li><strong>CDN 回退：<\/strong> 如果 CDN 临时故障，客户端应能检测到问题并转而从源站请求资源。<\/li>\n<li><strong>文件失效：<\/strong> 如果文件更新了，应使缓存失效，指向更新后的文件。<\/li>\n<\/ol>\n<hr />\n<h2>第 8 节：无状态 Web 层<\/h2>\n<p>通过将会话数据移到共享数据存储中，Web 服务器变为无状态（stateless）。这带来：\n1. 更容易进行水平扩展。\n2. 基于流量自动扩缩容。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/stateless.png\" width=\"400\" />\n<\/div>\n\n<hr />\n<h2>第 9 节：多数据中心部署<\/h2>\n<p>跨多个数据中心部署可提升可用性并降低延迟。策略包括：<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/data-center.png\" width=\"400\" />\n<\/div>\n\n<ol>\n<li><strong>GeoDNS 路由：<\/strong> 将用户引导至最近的数据中心。<\/li>\n<li><strong>数据复制：<\/strong> 在各数据中心之间同步数据，防止不一致。<\/li>\n<\/ol>\n<h3>关键注意事项<\/h3>\n<ul>\n<li><strong>流量重定向：<\/strong> 需要有效的工具将流量引导到正确的数据中心。<\/li>\n<li><strong>数据同步：<\/strong> 一种常见策略是在多个数据中心之间复制数据。<\/li>\n<li><strong>测试与部署：<\/strong> 自动化部署工具对于保持所有数据中心的服务一致性至关重要。<\/li>\n<\/ul>\n<hr />\n<h2>第 10 节：消息队列<\/h2>\n<p><strong>消息队列（message queue）<\/strong>是一个持久化的组件，存储在内存中，支持异步通信。它充当缓冲区，分发异步请求。<\/p>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/message-queue.png\" width=\"500\" />\n<\/div>\n\n<ul>\n<li>输入服务称为生产者（producer）/发布者（publisher），它们创建消息并发布到消息队列。<\/li>\n<li>其他服务称为消费者（consumer）/订阅者（subscriber），它们连接到队列，并执行消息所定义的操作。<\/li>\n<\/ul>\n<hr />\n<h2>第 11 节：日志、指标与自动化<\/h2>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/logging.png\" width=\"400\" />\n<\/div>\n\n<h3>重要性<\/h3>\n<ol>\n<li><strong>日志：<\/strong> 跟踪错误与系统健康状况。<\/li>\n<li><strong>指标：<\/strong> 洞察性能与用户活动。<\/li>\n<li><strong>自动化：<\/strong> 简化测试、部署与扩展。<\/li>\n<\/ol>\n<hr />\n<h2>第 12 节：数据库扩展<\/h2>\n<h3>垂直扩展<\/h3>\n<ul>\n<li>增加硬件资源，但存在物理与成本上的限制。<\/li>\n<li>有多个缺点：<\/li>\n<li>单点故障风险更高。<\/li>\n<li>垂直扩展的总体成本很高<\/li>\n<\/ul>\n<h3>水平扩展（分片）<\/h3>\n<div style=\"margin-left:3rem\">\n   <img src=\"01. Scaling/images/horizontal-scaling.png\" width=\"400\" />\n<\/div>\n\n<ul>\n<li>使用键（例如 <code>user_id<\/code>）将数据划分到多个分片（shard）中。<\/li>\n<li>分片把大型数据库拆分为更小、更易于管理的部分，称为分片。<\/li>\n<li>每个分片共享相同的模式（schema），但每个分片上的实际数据是该分片独有的。<\/li>\n<li>实现分片策略时，分片键至关重要。选择分片键时，重要的是选择一个能够均匀分布数据的键。<\/li>\n<\/ul>\n<h4>挑战<\/h4>\n<ol>\n<li>\n<p><strong>数据重分片：<\/strong> 在以下情况需要重新分片：\n   - 单个分片因快速增长而无法再容纳更多数据。\n   - 由于数据分布不均，某些分片可能比其他分片更快地耗尽。\n   - 一致性哈希（Consistent Hashing）用于解决这些问题。<\/p>\n<\/li>\n<li>\n<p><strong>名人问题（celebrity problem）：<\/strong> 对某个分片的过度访问可能导致服务器过载。\n   - 要解决这个问题，我们可能需要为每个名人单独分配一个分片。<\/p>\n<\/li>\n<li>\n<p><strong>连接与反规范化：<\/strong> 一旦数据库被分片到多台服务器上，就很难跨数据库分片执行连接（join）操作。\n   - 一种常见的变通做法是对数据库进行反规范化，使查询可以在单张表中完成。<\/p>\n<\/li>\n<\/ol>\n<hr />\n<h2>结语<\/h2>\n<h3>关键要点<\/h3>\n<ol>\n<li>保持 Web 层无状态。<\/li>\n<li>在每一层都构建冗余。<\/li>\n<li>使用缓存和 CDN 优化性能。<\/li>\n<li>通过分片扩展数据层。<\/li>\n<li>解耦组件以获得灵活性。<\/li>\n<\/ol>\n<p>本章为构建可扩展、能够承载百万级用户的系统打下了坚实的基础。<\/p>", "enTitle": "Chapter 1: Scale from Zero to Millions of Users", "zhTitle": "第 1 章：从零扩展到百万级用户", "short": "Scaling", "num": "01"}, "02. Back Of the Envelope Estimation": {"en": "\n<h2>Introduction<\/h2>\n<p>Back-of-the-envelope estimation is a crucial skill in system design interviews. It involves making quick, rough calculations to assess system capacity or performance. According to Jeff Dean, Google Senior Fellow, these estimates help evaluate whether designs meet requirements through thought experiments and common performance benchmarks.<\/p>\n<p>This chapter covers key concepts, methodologies, and examples to build proficiency in scalability and estimation.<\/p>\n<hr />\n<h2>Section 1: Key Concepts<\/h2>\n<h3>Power of Two<\/h3>\n<p>Understanding data volume in terms of powers of two is fundamental:<\/p>\n<p><img src=\"02. Back Of the Envelope Estimation/images/power-of-two.png\" alt=\"power-of-two\" width=\"500\" /><\/p>\n<p>This knowledge helps in performing accurate storage and bandwidth calculations.<\/p>\n<hr />\n<h3>Latency Numbers Every Programmer Should Know<\/h3>\n<p>Latency numbers represent the time taken for various operations in computing systems. These provide insights into relative performance:<\/p>\n<table>\n<thead>\n<tr>\n<th>Operation<\/th>\n<th>Latency (2020)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L1 Cache Access<\/td>\n<td>0.5 ns<\/td>\n<\/tr>\n<tr>\n<td>L2 Cache Access<\/td>\n<td>7 ns<\/td>\n<\/tr>\n<tr>\n<td>Main Memory Access<\/td>\n<td>100 ns<\/td>\n<\/tr>\n<tr>\n<td>SSD Random Read<\/td>\n<td>150 µs<\/td>\n<\/tr>\n<tr>\n<td>HDD Random Seek<\/td>\n<td>10 ms<\/td>\n<\/tr>\n<tr>\n<td>Round-Trip in Data Center<\/td>\n<td>500 µs<\/td>\n<\/tr>\n<tr>\n<td>Inter-Region Data Center<\/td>\n<td>150 ms<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Key Insights:<\/strong>\n- Memory is fast, disk is slow.\n- Avoid disk seeks whenever possible.\n- Compress data before transmitting over the internet to save bandwidth.<\/p>\n<hr />\n<h3>Availability Numbers<\/h3>\n<p>High availability (HA) ensures minimal downtime. Availability is expressed in <strong>nines<\/strong>:\n- <strong>99% (Two Nines):<\/strong> ~3.65 days/year of downtime\n- <strong>99.9% (Three Nines):<\/strong> ~8.8 hours/year of downtime\n- <strong>99.99% (Four Nines):<\/strong> ~52 minutes/year of downtime\n- <strong>99.999% (Five Nines):<\/strong> ~5.3 minutes/year of downtime\n- <strong>99.9999% (Six Nines):<\/strong> ~31.56 seconds/year of downtime<\/p>\n<p>Cloud providers like Amazon, Google, and Microsoft aim for SLAs (Service Level Agreements) of <strong>99.9% or higher<\/strong>.<\/p>\n<hr />\n<h2>Section 2: Example Estimation - Twitter QPS and Storage Requirements<\/h2>\n<h3>Assumptions<\/h3>\n<ul>\n<li><strong>300 million monthly active users (MAU).<\/strong><\/li>\n<li><strong>50% daily active users (DAU).<\/strong><\/li>\n<li><strong>Average tweets/user/day:<\/strong> 2.<\/li>\n<li><strong>10% of tweets contain media.<\/strong><\/li>\n<li><strong>Data retention:<\/strong> 5 years.<\/li>\n<\/ul>\n<h3>Estimations<\/h3>\n<ol>\n<li>\n<p><strong>Query Per Second (QPS):<\/strong>\n   - DAU = ( 300M x 50\\% = 150M )\n   - Tweets QPS = ( 150M x 2 tweets / 24 hour / 3600 seconds = ~3500 )\n   - Peak QPS = ( 2 x 3500 = ~7000 )<\/p>\n<\/li>\n<li>\n<p><strong>Media Storage:<\/strong>\n   - <strong>Tweet Size Components:<\/strong><\/p>\n<ul>\n<li><code>tweet_id<\/code>: 64 bytes<\/li>\n<li><code>text<\/code>: 140 bytes<\/li>\n<li><code>media<\/code>: 1 MB<\/li>\n<li><strong>Daily Media Storage:<\/strong> ( 150M x 2 x 10\\% x 1MB = 30TB per day )<\/li>\n<li><strong>5-Year Storage:<\/strong> ( 30TB x 365 x 5 = ~55PB )<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr />\n<h2>Section 3: Tips for Effective Estimation<\/h2>\n<h3>1. Rounding and Approximation<\/h3>\n<p>Precision is not critical; focus on the process. Simplify complex calculations using round numbers. For example:\n- ( 99987 / 9.1 ) can be approximated as ( 100,000 / 10 = 10,000 ).<\/p>\n<h3>2. Write Down Assumptions<\/h3>\n<p>Document assumptions clearly for future reference.<\/p>\n<h3>3. Label Units<\/h3>\n<p>Avoid ambiguity by labeling units (e.g., <code>5 MB<\/code> instead of <code>5<\/code>).<\/p>\n<h3>4. Common Estimation Scenarios<\/h3>\n<ul>\n<li><strong>QPS (Queries Per Second):<\/strong> Measure traffic intensity.<\/li>\n<li><strong>Peak QPS:<\/strong> Account for traffic spikes.<\/li>\n<li><strong>Storage Requirements:<\/strong> Estimate total data needs.<\/li>\n<li><strong>Cache Requirements:<\/strong> Evaluate memory requirements for caching.<\/li>\n<li><strong>Number of Servers:<\/strong> Calculate hardware needs based on workload.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>粗略估算（back-of-the-envelope estimation）是系统设计面试中的一项关键技能。它要求进行快速、粗略的计算，以评估系统的容量或性能。正如谷歌高级研究员（Google Senior Fellow）Jeff Dean 所言，这些估算有助于通过思维实验和常见的性能基准，判断设计是否满足需求。<\/p>\n<p>本章将介绍关键概念、方法论和示例，帮助你熟练掌握扩展性与估算能力。<\/p>\n<hr />\n<h2>第 1 节：关键概念<\/h2>\n<h3>2 的幂（Power of Two）<\/h3>\n<p>用 2 的幂来理解数据量是基础：<\/p>\n<p><img src=\"02. Back Of the Envelope Estimation/images/power-of-two.png\" alt=\"2 的幂\" width=\"500\" /><\/p>\n<p>掌握这一知识有助于进行精确的存储和带宽计算。<\/p>\n<hr />\n<h3>程序员都应该知道的延迟数字（Latency Numbers Every Programmer Should Know）<\/h3>\n<p>延迟数字表示计算系统中各种操作所花费的时间，这些数字有助于理解操作的相对性能：<\/p>\n<table>\n<thead>\n<tr>\n<th>操作<\/th>\n<th>延迟（2020 年）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L1 缓存访问<\/td>\n<td>0.5 ns<\/td>\n<\/tr>\n<tr>\n<td>L2 缓存访问<\/td>\n<td>7 ns<\/td>\n<\/tr>\n<tr>\n<td>主内存访问<\/td>\n<td>100 ns<\/td>\n<\/tr>\n<tr>\n<td>SSD 随机读<\/td>\n<td>150 µs<\/td>\n<\/tr>\n<tr>\n<td>HDD 随机寻道<\/td>\n<td>10 ms<\/td>\n<\/tr>\n<tr>\n<td>数据中心内往返<\/td>\n<td>500 µs<\/td>\n<\/tr>\n<tr>\n<td>跨区域数据中心往返<\/td>\n<td>150 ms<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>关键结论：<\/strong>\n- 内存很快，磁盘很慢。\n- 尽可能避免磁盘寻道。\n- 在互联网上传输数据前先压缩，以节省带宽。<\/p>\n<hr />\n<h3>可用性数字<\/h3>\n<p>高可用性（high availability, HA）要求停机时间尽可能短。可用性用「几个九」（nines）来表示：\n- <strong>99%（两个九）：<\/strong> 每年停机约 3.65 天\n- <strong>99.9%（三个九）：<\/strong> 每年停机约 8.8 小时\n- <strong>99.99%（四个九）：<\/strong> 每年停机约 52 分钟\n- <strong>99.999%（五个九）：<\/strong> 每年停机约 5.3 分钟\n- <strong>99.9999%（六个九）：<\/strong> 每年停机约 31.56 秒<\/p>\n<p>亚马逊（Amazon）、谷歌（Google）、微软（Microsoft）等云服务提供商的目标都是提供 <strong>99.9% 或更高<\/strong>的服务等级协议（SLA, Service Level Agreement）。<\/p>\n<hr />\n<h2>第 2 节：示例估算 —— Twitter 的 QPS 与存储需求<\/h2>\n<h3>假设<\/h3>\n<ul>\n<li><strong>3 亿月活跃用户（MAU）。<\/strong><\/li>\n<li><strong>50% 日活跃用户（DAU）。<\/strong><\/li>\n<li><strong>每个用户每天平均发布 2 条推文。<\/strong><\/li>\n<li><strong>10% 的推文包含媒体。<\/strong><\/li>\n<li><strong>数据保留期：5 年。<\/strong><\/li>\n<\/ul>\n<h3>估算<\/h3>\n<ol>\n<li>\n<p><strong>每秒查询数（QPS）：<\/strong>\n   - DAU = ( 300M x 50\\% = 150M )\n   - 推文 QPS = ( 150M x 2 tweets / 24 hour / 3600 seconds = ~3500 )\n   - 峰值 QPS = ( 2 x 3500 = ~7000 )<\/p>\n<\/li>\n<li>\n<p><strong>媒体存储：<\/strong>\n   - <strong>推文大小组成：<\/strong><\/p>\n<ul>\n<li><code>tweet_id<\/code>：64 字节<\/li>\n<li><code>text<\/code>：140 字节<\/li>\n<li><code>media<\/code>：1 MB<\/li>\n<li><strong>每日媒体存储量：<\/strong> ( 150M x 2 x 10\\% x 1MB = 30TB per day )<\/li>\n<li><strong>5 年存储量：<\/strong> ( 30TB x 365 x 5 = ~55PB )<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr />\n<h2>第 3 节：高效估算的技巧<\/h2>\n<h3>1. 四舍五入与近似<\/h3>\n<p>精度并不重要，重要的是过程。用整数来简化复杂计算。例如：\n- ( 99987 / 9.1 ) 可以近似为 ( 100,000 / 10 = 10,000 )。<\/p>\n<h3>2. 写下假设<\/h3>\n<p>清楚记录假设，以便日后参考。<\/p>\n<h3>3. 标注单位<\/h3>\n<p>通过标注单位来避免歧义（例如用 <code>5 MB<\/code> 而不是 <code>5<\/code>）。<\/p>\n<h3>4. 常见的估算场景<\/h3>\n<ul>\n<li><strong>QPS（每秒查询数）：<\/strong> 衡量流量强度。<\/li>\n<li><strong>峰值 QPS：<\/strong> 考虑流量尖峰。<\/li>\n<li><strong>存储需求：<\/strong> 估算总数据量需求。<\/li>\n<li><strong>缓存需求：<\/strong> 评估缓存所需的内存。<\/li>\n<li><strong>服务器数量：<\/strong> 根据工作负载计算硬件需求。<\/li>\n<\/ul>", "enTitle": "Chapter 2: Back-of-the-Envelope Estimation", "zhTitle": "第 2 章：粗略估算（Back-of-the-Envelope Estimation）", "short": "Back Of the Envelope Estimation", "num": "02"}, "03. System Design Framework": {"en": "\n<h2>Introduction<\/h2>\n<p>System design interviews are a key part of the hiring process, simulating real-life problem-solving scenarios. These interviews evaluate not just technical skills but also collaboration, communication, and the ability to handle ambiguous requirements.<\/p>\n<p>This chapter introduces a <strong>4-step framework<\/strong> for navigating system design interviews effectively.<\/p>\n<hr />\n<h2>Step 1: Understand the Problem and Establish Design Scope<\/h2>\n<h3>Key Objectives<\/h3>\n<ul>\n<li>Clarify requirements and assumptions.<\/li>\n<li>Avoid jumping into solutions prematurely.<\/li>\n<li>Showcase critical thinking by asking good questions.<\/li>\n<\/ul>\n<h3>Approach<\/h3>\n<ul>\n<li><strong>Ask Clarifying Questions:<\/strong><\/li>\n<li>What are the most important features?<\/li>\n<li>What scale does the system need to handle?<\/li>\n<li>Are we building for web, mobile, or both?<\/li>\n<li>\n<p>Are there existing technologies or constraints?<\/p>\n<\/li>\n<li>\n<p><strong>Document Assumptions:<\/strong> Write assumptions on a whiteboard or paper for reference.<\/p>\n<\/li>\n<\/ul>\n<h3>Example<\/h3>\n<p><strong>Problem:<\/strong> Design a news feed system.<br />\n<strong>Questions:<\/strong>\n- Is it a mobile app, web app, or both?\n- How many friends can a user have?\n- Should the feed include images and videos?\n- Is the feed sorted by reverse chronological order?<\/p>\n<hr />\n<h2>Step 2: Propose High-Level Design and Get Buy-In<\/h2>\n<h3>Key Objectives<\/h3>\n<ul>\n<li>Develop a high-level architecture.<\/li>\n<li>Collaborate with the interviewer to refine the design.<\/li>\n<\/ul>\n<h3>Approach<\/h3>\n<ul>\n<li><strong>Draft a Blueprint:<\/strong><\/li>\n<li>Use box diagrams for key components (e.g., clients, APIs, databases, caches, CDNs).<\/li>\n<li>\n<p>Treat the interviewer as a teammate to refine the design.<\/p>\n<\/li>\n<li>\n<p><strong>Perform Back-of-the-Envelope Calculations:<\/strong><\/p>\n<\/li>\n<li>\n<p>Ensure the design can handle the scale constraints.<\/p>\n<\/li>\n<li>\n<p><strong>Walk Through Use Cases:<\/strong> Identify edge cases and validate design assumptions.<\/p>\n<\/li>\n<\/ul>\n<h3>Example<\/h3>\n<p>For a news feed system, divide the design into:\n1. <strong>Feed Publishing Flow:<\/strong> Writing posts into databases and populating friends' feeds.\n2. <strong>Feed Retrieval Flow:<\/strong> Aggregating and displaying friends' posts in reverse chronological order.<\/p>\n<hr />\n<h2>Step 3: Design Deep Dive<\/h2>\n<h3>Key Objectives<\/h3>\n<ul>\n<li>Dive into critical components.<\/li>\n<li>Showcase depth of understanding and adaptability.<\/li>\n<\/ul>\n<h3>Approach<\/h3>\n<ul>\n<li><strong>Prioritize Key Components:<\/strong> Focus on areas most relevant to the problem.<\/li>\n<li><strong>Discuss Bottlenecks:<\/strong> Identify potential performance issues and propose solutions.<\/li>\n<li><strong>Balance Detail:<\/strong> Avoid over-engineering or unnecessary deep dives.<\/li>\n<\/ul>\n<h3>Example Topics<\/h3>\n<ul>\n<li><strong>URL Shortener:<\/strong> Focus on hash function design.<\/li>\n<li><strong>Chat System:<\/strong> Explore latency reduction and online/offline status handling.<\/li>\n<li><strong>News Feed System:<\/strong> Examine feed publishing and retrieval processes.<\/li>\n<\/ul>\n<hr />\n<h2>Step 4: Wrap-Up<\/h2>\n<h3>Key Objectives<\/h3>\n<ul>\n<li>Highlight areas for improvement.<\/li>\n<li>Recap the design and discuss follow-ups.<\/li>\n<\/ul>\n<h3>Approach<\/h3>\n<ul>\n<li><strong>Identify Bottlenecks:<\/strong> Discuss potential limitations and scaling strategies.<\/li>\n<li><strong>Summarize Design:<\/strong> Recap major design decisions and trade-offs.<\/li>\n<li><strong>Propose Enhancements:<\/strong><\/li>\n<li>How to scale from 1 million to 10 million users.<\/li>\n<li>Error handling for server failures or network issues.<\/li>\n<\/ul>\n<hr />\n<h2>Best Practices<\/h2>\n<h3>Dos<\/h3>\n<ul>\n<li><strong>Ask Questions:<\/strong> Clarify ambiguities before diving into solutions.<\/li>\n<li><strong>Communicate:<\/strong> Share your thought process with the interviewer.<\/li>\n<li><strong>Iterate with the Interviewer:<\/strong> Treat them as a collaborator.<\/li>\n<li><strong>Show Flexibility:<\/strong> Suggest alternative approaches and refine your design.<\/li>\n<li><strong>Focus on Critical Components:<\/strong> Prioritize key parts of the system.<\/li>\n<\/ul>\n<h3>Don’ts<\/h3>\n<ul>\n<li><strong>Avoid Premature Solutions:<\/strong> Don’t design before understanding the requirements.<\/li>\n<li><strong>Don’t Go Silent:<\/strong> Communicate regularly during the process.<\/li>\n<li><strong>Avoid Over-Engineering:<\/strong> Focus on practical, scalable solutions.<\/li>\n<\/ul>\n<hr />\n<h2>Time Management<\/h2>\n<h3>Suggested Time Allocation (for 45-Minute Interviews):<\/h3>\n<ol>\n<li><strong>Understand Problem and Scope:<\/strong> 3–10 minutes<\/li>\n<li><strong>High-Level Design and Buy-In:<\/strong> 10–15 minutes<\/li>\n<li><strong>Deep Dive:<\/strong> 10–25 minutes<\/li>\n<li><strong>Wrap-Up:<\/strong> 3–5 minutes<\/li>\n<\/ol>", "zh": "\n<h2>引言<\/h2>\n<p>系统设计面试（system design interview）是招聘流程中的关键环节，模拟真实场景下的问题求解过程。这类面试不仅考察技术能力，还考察协作、沟通以及处理模糊需求的能力。<\/p>\n<p>本章介绍一个 <strong>4 步框架<\/strong>，帮助你从容应对系统设计面试。<\/p>\n<hr />\n<h2>第 1 步：理解问题并明确设计范围<\/h2>\n<h3>关键目标<\/h3>\n<ul>\n<li>厘清需求与假设。<\/li>\n<li>避免过早跳入解决方案。<\/li>\n<li>通过提出好问题来展现批判性思维。<\/li>\n<\/ul>\n<h3>方法<\/h3>\n<ul>\n<li><strong>提出澄清性问题：<\/strong><\/li>\n<li>最重要的功能有哪些？<\/li>\n<li>系统需要承载多大规模？<\/li>\n<li>我们是为 Web、移动端还是两者兼做？<\/li>\n<li>\n<p>是否已有现成技术或约束？<\/p>\n<\/li>\n<li>\n<p><strong>记录假设：<\/strong> 把假设写在白板或纸上，以便随时参考。<\/p>\n<\/li>\n<\/ul>\n<h3>示例<\/h3>\n<p><strong>问题：<\/strong> 设计一个信息流（news feed）系统。<br />\n<strong>问题清单：<\/strong>\n- 是移动应用、Web 应用，还是两者都有？\n- 一个用户可以有多少个好友？\n- 信息流中是否应包含图片和视频？\n- 信息流是否按时间倒序排列？<\/p>\n<hr />\n<h2>第 2 步：提出高层设计并获得认可<\/h2>\n<h3>关键目标<\/h3>\n<ul>\n<li>形成高层架构。<\/li>\n<li>与面试官协作，共同打磨设计。<\/li>\n<\/ul>\n<h3>方法<\/h3>\n<ul>\n<li><strong>起草蓝图：<\/strong><\/li>\n<li>用方框图表示关键组件（如客户端、API、数据库、缓存、CDN）。<\/li>\n<li>\n<p>把面试官当作队友，一起完善设计。<\/p>\n<\/li>\n<li>\n<p><strong>进行粗略估算（back-of-the-envelope calculation）：<\/strong><\/p>\n<\/li>\n<li>\n<p>确保设计能够承载规模约束。<\/p>\n<\/li>\n<li>\n<p><strong>走查用例：<\/strong> 识别边界情况，并验证设计假设。<\/p>\n<\/li>\n<\/ul>\n<h3>示例<\/h3>\n<p>对于信息流系统，将设计划分为：\n1. <strong>信息流发布流程：<\/strong> 把帖子写入数据库，并推送到好友的信息流中。\n2. <strong>信息流获取流程：<\/strong> 按时间倒序聚合并展示好友的帖子。<\/p>\n<hr />\n<h2>第 3 步：深入设计细节<\/h2>\n<h3>关键目标<\/h3>\n<ul>\n<li>深入剖析关键组件。<\/li>\n<li>展现理解深度与应变能力。<\/li>\n<\/ul>\n<h3>方法<\/h3>\n<ul>\n<li><strong>优先处理关键组件：<\/strong> 聚焦与问题最相关的部分。<\/li>\n<li><strong>讨论瓶颈：<\/strong> 识别潜在的性能问题并提出解决方案。<\/li>\n<li><strong>权衡详略：<\/strong> 避免过度设计或不必要的深挖。<\/li>\n<\/ul>\n<h3>示例主题<\/h3>\n<ul>\n<li><strong>URL 缩短服务：<\/strong> 聚焦哈希函数的设计。<\/li>\n<li><strong>聊天系统：<\/strong> 探讨如何降低延迟，以及如何处理在线/离线状态。<\/li>\n<li><strong>信息流系统：<\/strong> 研究信息流的发布与获取流程。<\/li>\n<\/ul>\n<hr />\n<h2>第 4 步：收尾总结<\/h2>\n<h3>关键目标<\/h3>\n<ul>\n<li>指出可改进之处。<\/li>\n<li>回顾设计，并讨论后续可扩展点。<\/li>\n<\/ul>\n<h3>方法<\/h3>\n<ul>\n<li><strong>识别瓶颈：<\/strong> 讨论潜在局限与扩展策略。<\/li>\n<li><strong>总结设计：<\/strong> 回顾主要设计决策与权衡取舍。<\/li>\n<li><strong>提出增强方向：<\/strong><\/li>\n<li>如何从 100 万用户扩展到 1000 万用户。<\/li>\n<li>服务器故障或网络问题时的错误处理。<\/li>\n<\/ul>\n<hr />\n<h2>最佳实践<\/h2>\n<h3>应该做的<\/h3>\n<ul>\n<li><strong>多提问：<\/strong> 在跳入解决方案之前先澄清模糊之处。<\/li>\n<li><strong>勤沟通：<\/strong> 与面试官分享你的思考过程。<\/li>\n<li><strong>与面试官迭代：<\/strong> 把对方当作协作者。<\/li>\n<li><strong>展现灵活性：<\/strong> 提出备选方案并打磨你的设计。<\/li>\n<li><strong>聚焦关键组件：<\/strong> 优先处理系统的核心部分。<\/li>\n<\/ul>\n<h3>不应该做的<\/h3>\n<ul>\n<li><strong>避免过早给方案：<\/strong> 在理解需求之前不要开始设计。<\/li>\n<li><strong>不要沉默：<\/strong> 在整个过程中持续沟通。<\/li>\n<li><strong>避免过度设计：<\/strong> 聚焦于实用、可扩展的解决方案。<\/li>\n<\/ul>\n<hr />\n<h2>时间管理<\/h2>\n<h3>建议的时间分配（针对 45 分钟面试）：<\/h3>\n<ol>\n<li><strong>理解问题与范围：<\/strong> 3–10 分钟<\/li>\n<li><strong>高层设计与达成共识：<\/strong> 10–15 分钟<\/li>\n<li><strong>深入细节：<\/strong> 10–25 分钟<\/li>\n<li><strong>收尾总结：<\/strong> 3–5 分钟<\/li>\n<\/ol>", "enTitle": "Chapter 3: A Framework for System Design Interviews", "zhTitle": "第 3 章：系统设计面试框架", "short": "System Design Framework", "num": "03"}, "04. Rate Limiter": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter explores the design and implementation of a rate limiter—a system component used to control traffic rates sent by clients or services. Rate limiters are crucial for preventing abuse, reducing costs, and ensuring the stability of server resources. Examples of their use include limiting posts, account creations, and reward claims.<\/p>\n<h2>Benefits of Rate Limiting<\/h2>\n<ul>\n<li><strong>Preventing DoS Attacks:<\/strong> Blocking excess calls to avoid resource starvation.<\/li>\n<li><strong>Cost Reduction:<\/strong> Limiting unnecessary requests to reduce server expenses.<\/li>\n<li><strong>Preventing Overloads:<\/strong> Filtering out excessive requests to stabilize server performance.<\/li>\n<\/ul>\n<h2>Step 1: Understanding the Problem<\/h2>\n<h3>Key Features<\/h3>\n<ul>\n<li>Server-side API rate limiter.<\/li>\n<li>Support for multiple throttle rules.<\/li>\n<li>Handle large-scale systems in distributed environments.<\/li>\n<li>Option for a standalone service or application-level code.<\/li>\n<li>Inform users when throttled.<\/li>\n<\/ul>\n<h3>Requirements<\/h3>\n<ul>\n<li>Accurate request throttling.<\/li>\n<li>Minimal latency.<\/li>\n<li>Low memory usage.<\/li>\n<li>Distributed capability.<\/li>\n<li>Clear exception handling.<\/li>\n<li>High fault tolerance.<\/li>\n<\/ul>\n<h2>Step 2: High-Level Design<\/h2>\n<h3>Placement Options<\/h3>\n<div style=\"margin-left:2rem\">\n    <img src=\"04. Rate Limiter/images/rate_limiter_architecture.png\"  alt=\"Rate Limiting Middleware Architecture\" width=\"550\">\n<\/div>\n\n<ol>\n<li><strong>Client-Side Implementation:<\/strong> Unreliable due to potential misuse.<\/li>\n<li><strong>Server-Side Implementation:<\/strong> Preferred for control and reliability.<\/li>\n<li><strong>Middleware (API Gateway):<\/strong> A flexible option for integrated rate limiting.<\/li>\n<\/ol>\n<h3>Guidelines for Placement<\/h3>\n<ul>\n<li>Evaluate current tech stack and choose efficient options.<\/li>\n<li>Select appropriate algorithms based on business needs.<\/li>\n<li>Use an API gateway if microservices are employed.<\/li>\n<li>Opt for commercial solutions if resources are limited.<\/li>\n<\/ul>\n<h2>Step 3: Rate Limiting Algorithms<\/h2>\n<h3>1. Token Bucket<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/token-bucket.png\"  alt=\"Token Bucket Algorithm\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Description:<\/strong> Tokens are added to a bucket at a fixed rate; each request consumes a token.<\/li>\n<li><strong>Parameters:<\/strong> Bucket size and refill rate.<\/li>\n<li><strong>Pros:<\/strong> Easy to implement, memory-efficient, supports traffic bursts.<\/li>\n<li><strong>Cons:<\/strong> Requires careful parameter tuning.<\/li>\n<\/ul>\n<h3>2. Leaking Bucket<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/leaking-bucket.png\"  alt=\"Leaking Bucket Algorithm\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Description:<\/strong> Processes requests at a fixed rate using a FIFO queue.<\/li>\n<li><strong>Pros:<\/strong> Memory-efficient, stable outflow rate.<\/li>\n<li><strong>Cons:<\/strong> Traffic bursts may delay recent requests.<\/li>\n<\/ul>\n<p>Example: https://github.com/uber-go/ratelimit<\/p>\n<h3>3. Fixed Window Counter<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/fixed-window-counter.png\"  alt=\"Fixed Window Counter\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Description:<\/strong> Divides time into fixed intervals and uses counters to limit requests.<\/li>\n<li><strong>Pros:<\/strong> Simple, efficient for specific use cases.<\/li>\n<li>\n<p><strong>Cons:<\/strong> Traffic spikes at window edges can exceed limits.<\/p>\n<\/li>\n<li>\n<p>Sudden burst of traffic at the edges of time windows\ncould cause more requests than allowed quota to go through.<\/p>\n<\/li>\n<\/ul>\n<p><img src=\"04. Rate Limiter/images/fixed-window-issue.png\"  alt=\"Fixed Window Issue\" width=\"550\"><\/p>\n<h3>4. Sliding Window Log<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/sliding-window-log.png\"  alt=\"Sliding Window Log\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Description:<\/strong> Tracks timestamps to allow a rolling time window.<\/li>\n<li><strong>Pros:<\/strong> Accurate rate limiting.<\/li>\n<li><strong>Cons:<\/strong> High memory consumption.<\/li>\n<\/ul>\n<h3>5. Sliding Window Counter<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/sliding-window-counter.png\"  alt=\"Fixed Window Counter\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Description:<\/strong> Combines fixed window and sliding log methods for smoothing spikes.<\/li>\n<li><strong>Pros:<\/strong> Memory-efficient, handles traffic bursts.<\/li>\n<li><strong>Cons:<\/strong> Approximation may not be perfectly strict.<\/li>\n<\/ul>\n<h2>High-Level Architecture<\/h2>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/architecture.png\" style=\"margin-left: 40px; margin-top: 40px; margin-bottom: 20px;\" alt=\"Architecture\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>Data Storage:<\/strong> Use in-memory caching (e.g., Redis) for fast counter operations.<\/li>\n<li><strong>Steps:<\/strong>\n  1. Client sends request to middleware.\n  2. Middleware checks counters in Redis.\n  3. Request is processed or rejected based on limits.<\/li>\n<\/ul>\n<h2>Advanced Considerations<\/h2>\n<h3>Distributed Environments<\/h3>\n<ul>\n<li><strong>Challenges:<\/strong> Race conditions, synchronization issues.<\/li>\n<li><strong>Solutions:<\/strong> Use locks, Lua scripts, or sorted sets in Redis. Employ centralized data stores for synchronization.<\/li>\n<\/ul>\n<h3>Performance Optimizations<\/h3>\n<ul>\n<li>Multi-data center setups for reduced latency.<\/li>\n<li>Eventual consistency models for synchronization.<\/li>\n<\/ul>\n<h3>Monitoring<\/h3>\n<ul>\n<li>Regular analytics to ensure algorithm effectiveness and adjust rules as needed.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>本章探讨限流器（rate limiter）的设计与实现。限流器是一种系统组件，用于控制客户端或服务发送的流量速率。限流器对于防止滥用、降低成本、确保服务器资源稳定至关重要。例如，它可以用于限制发帖、创建账号和领取奖励的频率。<\/p>\n<h2>限流的好处<\/h2>\n<ul>\n<li><strong>防范 DoS 攻击：<\/strong> 拦截过量调用，避免资源耗尽。<\/li>\n<li><strong>降低成本：<\/strong> 限制不必要的请求，减少服务器开销。<\/li>\n<li><strong>防止过载：<\/strong> 过滤掉过量请求，稳定服务器性能。<\/li>\n<\/ul>\n<h2>第 1 步：理解问题<\/h2>\n<h3>关键特性<\/h3>\n<ul>\n<li>服务端 API 限流器。<\/li>\n<li>支持多种限流规则。<\/li>\n<li>支持分布式环境中的大规模系统。<\/li>\n<li>可选择独立服务或应用级代码实现。<\/li>\n<li>被限流时告知用户。<\/li>\n<\/ul>\n<h3>需求<\/h3>\n<ul>\n<li>准确的请求限流。<\/li>\n<li>极低的延迟。<\/li>\n<li>低内存占用。<\/li>\n<li>分布式能力。<\/li>\n<li>清晰的异常处理。<\/li>\n<li>高容错性。<\/li>\n<\/ul>\n<h2>第 2 步：高层设计<\/h2>\n<h3>部署位置选项<\/h3>\n<div style=\"margin-left:2rem\">\n    <img src=\"04. Rate Limiter/images/rate_limiter_architecture.png\"  alt=\"限流中间件架构\" width=\"550\">\n<\/div>\n\n<ol>\n<li><strong>客户端实现：<\/strong> 由于可能被滥用，不可靠。<\/li>\n<li><strong>服务端实现：<\/strong> 更受青睐，可控且可靠。<\/li>\n<li><strong>中间件（API 网关）：<\/strong> 集成限流的一种灵活方案。<\/li>\n<\/ol>\n<h3>部署位置的选择指南<\/h3>\n<ul>\n<li>评估现有技术栈，选择高效方案。<\/li>\n<li>根据业务需求选择合适的算法。<\/li>\n<li>若采用微服务架构，可考虑使用 API 网关。<\/li>\n<li>若资源有限，可选择商业解决方案。<\/li>\n<\/ul>\n<h2>第 3 步：限流算法<\/h2>\n<h3>1. 令牌桶（Token Bucket）<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/token-bucket.png\"  alt=\"令牌桶算法\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>描述：<\/strong> 以固定速率向桶中添加令牌，每个请求消耗一个令牌。<\/li>\n<li><strong>参数：<\/strong> 桶的容量和补充速率。<\/li>\n<li><strong>优点：<\/strong> 易于实现、内存效率高、支持流量突发。<\/li>\n<li><strong>缺点：<\/strong> 需要仔细调整参数。<\/li>\n<\/ul>\n<h3>2. 漏桶（Leaking Bucket）<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/leaking-bucket.png\"  alt=\"漏桶算法\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>描述：<\/strong> 使用 FIFO 队列以固定速率处理请求。<\/li>\n<li><strong>优点：<\/strong> 内存效率高，流出速率稳定。<\/li>\n<li><strong>缺点：<\/strong> 流量突发时，新到达的请求可能被延迟。<\/li>\n<\/ul>\n<p>示例：https://github.com/uber-go/ratelimit<\/p>\n<h3>3. 固定窗口计数器（Fixed Window Counter）<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/fixed-window-counter.png\"  alt=\"固定窗口计数器\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>描述：<\/strong> 将时间划分为固定间隔，使用计数器来限制请求。<\/li>\n<li><strong>优点：<\/strong> 简单，适合特定场景。<\/li>\n<li>\n<p><strong>缺点：<\/strong> 窗口边界处的流量尖峰可能超出限制。<\/p>\n<\/li>\n<li>\n<p>时间窗口边界处突发的流量\n可能导致超过配额限制的请求通过。<\/p>\n<\/li>\n<\/ul>\n<p><img src=\"04. Rate Limiter/images/fixed-window-issue.png\"  alt=\"固定窗口的问题\" width=\"550\"><\/p>\n<h3>4. 滑动窗口日志（Sliding Window Log）<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/sliding-window-log.png\"  alt=\"滑动窗口日志\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>描述：<\/strong> 跟踪时间戳，实现滚动的时间窗口。<\/li>\n<li><strong>优点：<\/strong> 限流准确。<\/li>\n<li><strong>缺点：<\/strong> 内存消耗高。<\/li>\n<\/ul>\n<h3>5. 滑动窗口计数器（Sliding Window Counter）<\/h3>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/sliding-window-counter.png\"  alt=\"滑动窗口计数器\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>描述：<\/strong> 结合固定窗口与滑动日志的方法，平滑流量尖峰。<\/li>\n<li><strong>优点：<\/strong> 内存效率高，能处理流量突发。<\/li>\n<li><strong>缺点：<\/strong> 近似计算可能不够严格。<\/li>\n<\/ul>\n<h2>高层架构<\/h2>\n<div style=\"margin-left:2rem\">\n  <img src=\"04. Rate Limiter/images/architecture.png\" style=\"margin-left: 40px; margin-top: 40px; margin-bottom: 20px;\" alt=\"架构\" width=\"550\">\n<\/div>\n\n<ul>\n<li><strong>数据存储：<\/strong> 使用内存缓存（如 Redis）进行快速的计数器操作。<\/li>\n<li><strong>流程：<\/strong>\n  1. 客户端向中间件发送请求。\n  2. 中间件检查 Redis 中的计数器。\n  3. 根据限制处理或拒绝请求。<\/li>\n<\/ul>\n<h2>进阶考虑<\/h2>\n<h3>分布式环境<\/h3>\n<ul>\n<li><strong>挑战：<\/strong> 竞态条件（race condition）、同步问题。<\/li>\n<li><strong>解决方案：<\/strong> 使用锁、Lua 脚本或 Redis 中的有序集合。采用集中式数据存储进行同步。<\/li>\n<\/ul>\n<h3>性能优化<\/h3>\n<ul>\n<li>多数据中心部署以降低延迟。<\/li>\n<li>使用最终一致性模型进行同步。<\/li>\n<\/ul>\n<h3>监控<\/h3>\n<ul>\n<li>定期分析，确保算法有效，并按需调整规则。<\/li>\n<\/ul>", "enTitle": "Chapter 4: Design a Rate Limiter", "zhTitle": "第 4 章：设计限流器", "short": "Rate Limiter", "num": "04"}, "05. Consistent Hashing": {"en": "\n<h2>Introduction<\/h2>\n<p>This chapter explores consistent hashing, a technique essential for achieving horizontal scaling by efficiently distributing requests and data across servers. It minimizes data redistribution when servers are added or removed and ensures an even distribution of data to mitigate issues like server hotspots.<\/p>\n<h2>The Rehashing Problem<\/h2>\n<h3>Explanation<\/h3>\n<p>In traditional hashing methods, such as <code>serverIndex = hash(key) % N<\/code>, data redistribution becomes problematic when the number of servers changes. For example:\n- Removing a server causes most keys to be reassigned, leading to cache misses.\n- Adding a server results in unnecessary key redistributions.<\/p>\n<p><img src=\"05. Consistent Hashing/images/server-hashing.png\"  alt=\"Server hashing\" width=\"450\"><\/p>\n<ul>\n<li>This approach works well when the size of the server pool is fixed. However, problems arise when new servers are added, or existing servers are removed.<\/li>\n<\/ul>\n<p><img src=\"05. Consistent Hashing/images/server-hashing-miss.png\"  alt=\"Server hashing Miss\" width=\"450\"><\/p>\n<h3>Key Issue<\/h3>\n<p>Redistribution of most keys when server count changes causes inefficiency and overload.<\/p>\n<h2>Consistent Hashing<\/h2>\n<h3>Definition<\/h3>\n<p>Consistent hashing ensures that only a fraction of keys are remapped when servers are added or removed. This minimizes disruptions and enhances scalability.<\/p>\n<h3>Key Concepts<\/h3>\n<ol>\n<li><strong>Hash Space and Ring:<\/strong> The hash space forms a continuous ring, with hash values distributed from <code>0<\/code> to <code>2^160-1<\/code> (e.g., using hash function like SHA-1). By connecting both ends we get a ring.\n    <p align=\"center\">\n    <img src=\"05. Consistent Hashing/images/hash-ring.png\"  alt=\"Hash Ring\" width=\"450\">\n    <\/p><\/li>\n<\/ol>\n<ul>\n<li>\n<p>Using the same hash function f, we map servers based on server IP or name onto the ring.  <\/p>\n<p><p align=\"center\">\n<img src=\"05. Consistent Hashing/images/server-ring.png\"  alt=\"Server Ring\" width=\"450\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<ol>\n<li><strong>Server Lookup<\/strong>\n- A key's server is determined by traversing clockwise on the ring until a server is found.<\/li>\n<\/ol>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-lookup.png\"  alt=\"Server Lookup\" width=\"450\">\n  <\/p>\n\n<ol start=\"2\">\n<li><strong>Adding and Removing Servers<\/strong>\n- Adding a server redistributes only nearby keys. Only a fraction of keys are redistributed to the new server.<\/li>\n<\/ol>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/adding-server.png\"  alt=\"Adding Server\" width=\"450\">\n  <\/p>\n\n<ul>\n<li>Removing a server affects only the keys in its range. Only keys from the removed server are reassigned to the next server clockwise.<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/removing-server.png\"  alt=\"Removing Server\" width=\"450\">\n  <\/p>\n\n<h2>Challenges and Solutions<\/h2>\n<h3>Two Issues in Basic Approach<\/h3>\n<ol>\n<li><strong>Uneven Partition Sizes:<\/strong> Servers may have unequal data partitions.<\/li>\n<li><strong>Non-uniform Key Distribution:<\/strong> Some servers may receive significantly more keys than others.<\/li>\n<\/ol>\n<h3>Solution: Virtual Nodes<\/h3>\n<ul>\n<li>Each server is represented by multiple virtual nodes on the ring uniformly distrubuted on the ring.<\/li>\n<li>Virtual nodes improve key distribution and balance load. As the number of virtual nodes increases, the distribution of keys       becomes more balanced. This is because the standard deviation gets smaller with more virtual nodes, leading to balanced data distribution.<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/virtual-nodes.png\"   alt=\"Virtual Nodes\" width=\"450\">\n  <\/p>\n\n<h2>Affected Keys<\/h2>\n<p>When servers are added or removed:\n- <strong>Added Server:<\/strong> Affected keys are those between the new server and its predecessor.\n  In the following example server 4 is added onto the ring. The affected range starts from s4 (newly\n  added node) and moves anticlockwise around the ring until a server is found (s3). Thus, keys\n  located between s3 and s4 need to be redistributed to s4.<\/p>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-addition.png\"   alt=\"Server Addition\" width=\"450\">\n  <\/p>\n\n<ul>\n<li><strong>Removed Server:<\/strong> Affected keys are those between the removed server and its predecessor. In the following example when a server (s1) is removed, the affected range starts from s1\n(removed node) and moves anticlockwise around the ring until a server is found (s0). Thus, keys located between s0 and s1 must be redistributed to s2.<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-removed.png\"   alt=\"Server Removed\" width=\"450\">\n  <\/p>\n\n<h2>Benefits of Consistent Hashing<\/h2>\n<ul>\n<li><strong>Minimized Redistribution:<\/strong> Only a fraction of keys are reassigned.<\/li>\n<li><strong>Scalability:<\/strong> Enables horizontal scaling.<\/li>\n<li><strong>Mitigates Hotspots:<\/strong> Balances data distribution to avoid server overload.<\/li>\n<\/ul>\n<h2>Real-World Applications<\/h2>\n<ul>\n<li>Amazon Dynamo DB<\/li>\n<li>Apache Cassandra<\/li>\n<li>Discord<\/li>\n<li>Akamai CDN<\/li>\n<li>Maglev Load Balancer<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p>本章探讨一致性哈希（consistent hashing），这是一种通过在服务器之间高效分发请求与数据来实现水平扩展的关键技术。它能在增加或移除服务器时最大限度地减少数据重新分布，并确保数据均匀分布，从而缓解服务器热点等问题。<\/p>\n<h2>重新哈希问题<\/h2>\n<h3>解释<\/h3>\n<p>在传统的哈希方法中，例如 <code>serverIndex = hash(key) % N<\/code>，当服务器数量发生变化时，数据重新分布就会成为问题。例如：\n- 移除一台服务器会导致大部分键被重新分配，从而引发缓存未命中（cache miss）。\n- 增加一台服务器会导致不必要的键重新分布。<\/p>\n<p><img src=\"05. Consistent Hashing/images/server-hashing.png\"  alt=\"服务器哈希\" width=\"450\"><\/p>\n<ul>\n<li>当服务器池规模固定时，这种方法效果很好。然而，当新增服务器或移除现有服务器时，问题就出现了。<\/li>\n<\/ul>\n<p><img src=\"05. Consistent Hashing/images/server-hashing-miss.png\"  alt=\"服务器哈希未命中\" width=\"450\"><\/p>\n<h3>核心问题<\/h3>\n<p>当服务器数量变化时，大部分键都要重新分布，这会导致效率低下和过载。<\/p>\n<h2>一致性哈希<\/h2>\n<h3>定义<\/h3>\n<p>一致性哈希保证在增加或移除服务器时，只有一小部分键被重新映射。这最大限度地减少了扰动，并增强了可扩展性。<\/p>\n<h3>关键概念<\/h3>\n<ol>\n<li><strong>哈希空间与环：<\/strong> 哈希空间构成一个连续的环，哈希值从 <code>0<\/code> 分布到 <code>2^160-1<\/code>（例如使用 SHA-1 这样的哈希函数）。把两端连接起来就得到一个环。\n    <p align=\"center\">\n    <img src=\"05. Consistent Hashing/images/hash-ring.png\"  alt=\"哈希环\" width=\"450\">\n    <\/p><\/li>\n<\/ol>\n<ul>\n<li>\n<p>使用同一个哈希函数 f，我们根据服务器的 IP 或名称把服务器映射到环上。  <\/p>\n<p><p align=\"center\">\n<img src=\"05. Consistent Hashing/images/server-ring.png\"  alt=\"服务器环\" width=\"450\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<ol>\n<li><strong>服务器查找<\/strong>\n- 一个键对应的服务器，是通过在环上顺时针遍历直到找到一台服务器来确定的。<\/li>\n<\/ol>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-lookup.png\"  alt=\"服务器查找\" width=\"450\">\n  <\/p>\n\n<ol start=\"2\">\n<li><strong>添加与移除服务器<\/strong>\n- 添加一台服务器只会重新分布邻近的键。只有一小部分键被重新分配到新服务器上。<\/li>\n<\/ol>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/adding-server.png\"  alt=\"添加服务器\" width=\"450\">\n  <\/p>\n\n<ul>\n<li>移除一台服务器只会影响其范围内的键。只有被移除服务器上的键会被重新分配到顺时针方向的下一台服务器。<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/removing-server.png\"  alt=\"移除服务器\" width=\"450\">\n  <\/p>\n\n<h2>挑战与解决方案<\/h2>\n<h3>基本方案中的两个问题<\/h3>\n<ol>\n<li><strong>分区大小不均：<\/strong> 各服务器上的数据分区可能并不相等。<\/li>\n<li><strong>键分布不均匀：<\/strong> 某些服务器可能比其他服务器接收到多得多的键。<\/li>\n<\/ol>\n<h3>解决方案：虚拟节点<\/h3>\n<ul>\n<li>每台服务器由环上多个均匀分布的虚拟节点（virtual node）来表示。<\/li>\n<li>虚拟节点改善了键的分布并均衡了负载。随着虚拟节点数量增加，键的分布变得更加均衡。这是因为虚拟节点越多，标准差越小，从而带来均衡的数据分布。<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/virtual-nodes.png\"   alt=\"虚拟节点\" width=\"450\">\n  <\/p>\n\n<h2>受影响的键<\/h2>\n<p>当添加或移除服务器时：\n- <strong>新增服务器：<\/strong> 受影响的键是位于新服务器与其前驱之间的那些键。\n  在下面的例子中，服务器 4 被添加到环上。受影响的范围从 s4（新加入的节点）开始，沿环逆时针移动，直到找到一台服务器（s3）。因此，位于 s3 与 s4 之间的键需要被重新分布到 s4。<\/p>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-addition.png\"   alt=\"服务器添加\" width=\"450\">\n  <\/p>\n\n<ul>\n<li><strong>移除服务器：<\/strong> 受影响的键是位于被移除服务器与其前驱之间的那些键。在下面的例子中，当一台服务器（s1）被移除时，受影响的范围从 s1（被移除的节点）开始，沿环逆时针移动，直到找到一台服务器（s0）。因此，位于 s0 与 s1 之间的键必须被重新分布到 s2。<\/li>\n<\/ul>\n<p align=\"center\">\n  <img src=\"05. Consistent Hashing/images/server-removed.png\"   alt=\"服务器移除\" width=\"450\">\n  <\/p>\n\n<h2>一致性哈希的好处<\/h2>\n<ul>\n<li><strong>重新分布最小化：<\/strong> 只有一小部分键被重新分配。<\/li>\n<li><strong>可扩展性：<\/strong> 支持水平扩展。<\/li>\n<li><strong>缓解热点：<\/strong> 均衡数据分布，避免服务器过载。<\/li>\n<\/ul>\n<h2>实际应用<\/h2>\n<ul>\n<li>Amazon Dynamo DB<\/li>\n<li>Apache Cassandra<\/li>\n<li>Discord<\/li>\n<li>Akamai CDN<\/li>\n<li>Maglev 负载均衡器<\/li>\n<\/ul>", "enTitle": "Chapter 5: Design Consistent Hashing", "zhTitle": "第 5 章：设计一致性哈希", "short": "Consistent Hashing", "num": "05"}, "06. Key-Value Store": {"en": "\n<h2>Introduction<\/h2>\n<p>A <strong>key-value store<\/strong> is a type of non-relational database where data is stored as key-value pairs. Each key is unique, and values are accessed using these keys. This chapter details how to design a scalable, high-availability distributed key-value store that supports operations like:\n- <code>put(key, value)<\/code> for inserting data.\n- <code>get(key)<\/code> for retrieving data.<\/p>\n<h3>Characteristics of the Design<\/h3>\n<ul>\n<li>Small key-value pairs (&lt;10 KB).<\/li>\n<li>Supports big data with high availability and scalability.<\/li>\n<li>Automatic scaling and tunable consistency.<\/li>\n<li>Low latency.<\/li>\n<\/ul>\n<hr />\n<h2>Single Server Key-Value Store<\/h2>\n<h3>Implementation<\/h3>\n<ul>\n<li>Use a <strong>hash table<\/strong> to store key-value pairs in memory.<\/li>\n<li>Optimizations:<\/li>\n<li>Data compression.<\/li>\n<li>Storing less frequently accessed data on disk.<\/li>\n<\/ul>\n<h3>Limitation<\/h3>\n<p>A single server's memory is limited, requiring a <strong>distributed approach<\/strong> for scalability.<\/p>\n<hr />\n<h2>Distributed Key-Value Store<\/h2>\n<p>A <strong>distributed key-value store<\/strong> partitions data across multiple servers and must address trade-offs outlined by the <strong>CAP theorem<\/strong>.<\/p>\n<h3>CAP Theorem<\/h3>\n<ol>\n<li><strong>Consistency:<\/strong> All clients see the same data simultaneously.<\/li>\n<li><strong>Availability:<\/strong> The system responds to every request, even if some nodes are down.<\/li>\n<li><strong>Partition Tolerance:<\/strong> The system continues to operate despite network partitions.<\/li>\n<\/ol>\n<p><strong>Trade-off:<\/strong> According to CAP theorem only two of the three guarantees can be achieved.<\/p>\n<p align=\"center\">\n  <img src=\"06. Key-Value Store/images/cap.png\" alt=\"CAP\" width=\"400\">\n<\/p>\n\n<h4>System Types:<\/h4>\n<ul>\n<li><strong>CP Systems:<\/strong> Consistency and partition tolerance while sacrificing availability (e.g., banking systems).<\/li>\n<li><strong>AP Systems:<\/strong> Availability and partition tolerance while sacrificing consistency (e.g., eventual consistency).<\/li>\n<li>\n<p><strong>CA Systems:<\/strong> Consistency and Availability while sacrificing partition tolerance.<\/p>\n<p><strong>Since network failure is unavoidable, a distributed system must tolerate network partition. Thus, a CA system cannot exist in real-world applications.<\/strong><\/p>\n<p>In a distributed system, partitions are inevitable. When a partition occurs, we must choose between consistency and availability. For example, if node n3 goes down, \nany data written to nodes n1 or n2 cannot be propagated to n3. Conversely, if data is written to n3 but not yet propagated to n1 and n2, nodes n1 and n2 will have stale data.<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/server-down.png\"  alt=\"Server down\" width=\"400\">\n<\/p><\/p>\n<\/li>\n<li>\n<p>If we choose CP system, we must block all write operations to n1 and n2 to avoid data inconsistency.<\/p>\n<\/li>\n<li>If we choose AP system, the system keeps accepting reads, even though it might return stale data. \nFor writes, n1 and n2 keep accepting writes,\nand data will be synced to n3 when the network partition is resolved.<\/li>\n<\/ul>\n<hr />\n<h2>System Components<\/h2>\n<h3>1. Data Partitioning<\/h3>\n<ul>\n<li><strong>Technique:<\/strong> Consistent Hashing is used to distribute data across multiple servers evenly.<\/li>\n<li><strong>Advantages:<\/strong><\/li>\n<li>Automatic scaling with server addition/removal.<\/li>\n<li>Heterogeneity through virtual nodes. The number of virtual nodes for a server is proportional to the server capacity.<\/li>\n<\/ul>\n<h3>2. Data Replication<\/h3>\n<ul>\n<li>Replicate data across <code>N<\/code> servers for high availability.<\/li>\n<li>\n<p>The N servers are chosen by walking clockwise from the server position and choose the first N servers on the ring to store data copies.Place replicas in distinct data centers to improve reliability in case of virtual nodes.<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/data-replication.png\" alt=\"Data replication\" width=\"300\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<h3>3. Consistency<\/h3>\n<p>Since data is replicated at multiple nodes, it must be synchronized across replicas.\n- <strong>Quorum Consensus:<\/strong>\n  - <code>N<\/code>: Total replicas.\n  - <code>W<\/code>: Write quorum size. For a write to be considered successful, write must be acknowledged from W replicas.\n  - <code>R<\/code>: Read quorum size. For a read to be considered as successful, read must wait for responses from at least R replicas.\n  - <strong>Rule:<\/strong> <code>W + R &gt; N<\/code> ensures strong consistency.\n  - The configuration of W, R and N is a typical tradeoff between latency and consistency. <\/p>\n<pre><code>&lt;p align=\"center\"&gt;\n&lt;img src=\"06. Key-Value Store/images/quorum-consensus.png\"   alt=\"Quorum consensus\" width=\"400\"&gt;\n&lt;/p&gt;\n\n- If R = 1 and W = N, the system is optimized for a fast read.\n- If W = 1 and R = N, the system is optimized for fast write.\n- If W + R &gt; N, strong consistency is guaranteed (Usually N = 3, W = R = 2).\n- If W + R &lt;= N, strong consistency is not guaranteed.\n<\/code><\/pre>\n<ul>\n<li><strong>Models<\/strong>:<\/li>\n<li><strong>Strong Consistency:<\/strong> A read operation returns a value corresponding to the result of the most updated write data item.<\/li>\n<li><strong>Weak Consistency:<\/strong> Subsequent read operations may not see the most updated value.<\/li>\n<li><strong>Eventual Consistency:<\/strong> Given enough time, all updates are propagated, and all replicas are consisten<\/li>\n<\/ul>\n<h3>4. Inconsistency Resolution<\/h3>\n<p>Replication gives high availability but causes inconsistencies among replicas. Versioning and\nvector locks are used to solve inconsistency problems.\n- <strong>Versioning:<\/strong> \n    - Use <strong>vector clocks<\/strong> to track data versions and resolve conflicts.\n    - Versioning means treating each data modification as a new immutable version of data.\n        <div>\n        <img src=\"06. Key-Value Store/images/consistent-server.png\"   alt=\"Consisten hashing\" width=\"400\">\n        <img src=\"06. Key-Value Store/images/inconsistent-server.png\"   alt=\"Inconsistent server\" height=\"230\">\n        <\/div><\/p>\n<pre><code>- Server 1 changes the name , and server 2 also changes the name. These two changes are performed simultaneously. Now, we have conflicting values, called versions v1 and v2.\n<\/code><\/pre>\n<ul>\n<li>\n<p><strong>Vector Clock<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Setup<\/strong>: A vector clock is a [server, version] pair associated with a data item. It can be used to check\n    if one version precedes, succeeds, or in conflict with others.<\/p>\n<ul>\n<li>Assume a vector clock represented by D([S1, v1], [S2, v2], …, [Sn, vn]), If data item D is written to server\nSi, the system must perform one of the following tasks.<\/li>\n<li>Where: <code>D<\/code> is the data item.<code>Si<\/code> is the server identifier.<code>vi<\/code> is the version counter for the data at server <code>Si<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Updating the Vector Clock:<\/strong>  When a data item is modified at a server:<\/p>\n<ul>\n<li>If the server exists in the vector clock, its version counter is incremented.<\/li>\n<li>Otherwise, a new entry is added to the vector clock.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Conflict Detection:<\/strong><\/p>\n<ul>\n<li><strong>No Conflict:<\/strong> A version X is an ancestor of version Y if all counters in X are less than or equal to those in Y.<\/li>\n<li><strong>Conflict Exists:<\/strong> Two versions are siblings if there is at least one counter in Y that is less than its counterpart in X.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Conflict Resolution:<\/strong> When conflicts are detected (sibling versions), the system relies on application-specific logic or client intervention to   reconcile the data.<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/vector-clock.png\"  alt=\"Server hashing\" width=\"500\">\n<\/p><\/p>\n<\/li>\n<\/ol>\n<\/li>\n<li>\n<p><strong>Challenges:<\/strong><\/p>\n<\/li>\n<li>Increased complexity for clients.<\/li>\n<li>Vector clock size may grow with many updates, requiring trimming strategies to limit its size.<\/li>\n<\/ul>\n<h3>5. Handling Failures<\/h3>\n<h4>a. Failure Detection<\/h4>\n<p>It is insufficient to believe that a server is down because another server says so.Usually, it requires at least two independent sources of information to mark a server down.\n- <strong>Gossip Protocol:<\/strong>\n    <div style=\"margin-left:3rem\">\n        <img src=\"06. Key-Value Store/images/gossip-protocol.png\"  alt=\"Gossip protocol\" width=\"600\">\n    <\/div><\/p>\n<pre><code>- Each node maintains member IDs and heartbeat counters.\n- Each node periodically increments its heartbeat counter.\n- Each node periodically sends heartbeats to a set of random nodes.\n- If the heartbeat has not increased for more than predefined periods, the member is\nconsidered as offline\n<\/code><\/pre>\n<h4>b. Temporary Failures<\/h4>\n<ul>\n<li>\n<p><strong>Sloppy Quorum:<\/strong> Use healthy nodes to maintain operations temporarily.\n        <p align=\"center\">\n        <img src=\"06. Key-Value Store/images/sloppy-quorum.png\"   alt=\"Sloppy Quorum\" width=\"400\">\n        <\/p><\/p>\n<ul>\n<li>After detecting failures, the system needs to deploy certain mechanisms to ensure availability<\/li>\n<li>Instead of enforcing the quorum requirement, the system chooses the first W healthy servers for writes and first R\nhealthy servers for reads on the hash ring. <\/li>\n<li>Offline servers are ignored. If a server is unavailable, another server will process requests temporarily<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Hinted Handoff:<\/strong> Offline servers catch up with changes upon recovery.<\/p>\n<ul>\n<li>When the down server is up, changes will be pushed back to achieve data consistency<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>c. Permanent Failures<\/h4>\n<ul>\n<li>\n<p>Use <strong>Merkle Trees<\/strong> for efficient synchronization between replicas.\n    A <strong>Merkle Tree<\/strong> (or hash tree) is a data structure to efficiently detect and resolve inconsistencies between replicas during permanent failures. <\/p>\n<\/li>\n<li>\n<p>Working<\/p>\n<ol>\n<li>\n<p><strong>Structure:<\/strong><\/p>\n<ul>\n<li><strong>Leaf Nodes<\/strong> store the hash of individual data blocks.<\/li>\n<li><strong>Non-Leaf Nodes<\/strong> store the hash of their child nodes.<\/li>\n<li>The <strong>root hash<\/strong> represents the combined state of all data in the tree.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Building a Merkle Tree:<\/strong><\/p>\n<ul>\n<li>\n<p><strong>Step 1:<\/strong> Divide the key space into buckets.<\/p>\n<p><img src=\"06. Key-Value Store/images/key-bucket.png\"   alt=\"Key Bucket\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Step 2:<\/strong> Hash each key in a bucket using uniform hashing.<\/p>\n<p><img src=\"06. Key-Value Store/images/hash-key-bucket.png\"   alt=\"Hash Key Bucket\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Step 3:<\/strong> Create a single hash for each bucket.<\/p>\n<p><img src=\"06. Key-Value Store/images/hash-bucket.png\"   alt=\"Hash Bucket\" width=\"500\"><\/p>\n<\/li>\n<li>\n<p><strong>Step 4:<\/strong> Combine hashes of buckets to compute higher-level hashes, culminating in the root hash.<\/p>\n<p><img src=\"06. Key-Value Store/images/merkel-tree.png\"   alt=\"Merkel Tree\" width=\"500\"><\/p>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Synchronization:<\/strong><\/p>\n<ul>\n<li>To synchronize two replicas:<ul>\n<li>Compare their root hashes.<\/li>\n<li>If the root hashes match, the replicas are consistent.<\/li>\n<li>If the root hashes differ, compare child hashes recursively to identify inconsistent buckets.<\/li>\n<\/ul>\n<\/li>\n<li>Only the inconsistent data is synchronized.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<li>\n<p>Advantages<\/p>\n<ul>\n<li><strong>Efficiency:<\/strong> Only inconsistent data is synchronized, reducing data transfer.<\/li>\n<li><strong>Scalability:<\/strong> Effective for large datasets with minimal synchronization overhead.<\/li>\n<li><strong>Reliability:<\/strong> Ensures data consistency across replicas.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>6. Handling Data Center Outages<\/h3>\n<ul>\n<li>Replicate data across multiple data centers to ensure availability during outages.<\/li>\n<\/ul>\n<hr />\n<h2>Write and Read Paths<\/h2>\n<h3>1. Write Path (Based on Cassandra architecture)<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"06. Key-Value Store/images/write-path.png\"   alt=\"Hash Bucket\" width=\"500\">\n<\/div>\n\n<ul>\n<li>Persist the write in a <strong>commit log<\/strong>.<\/li>\n<li>Save data to a <strong>memory cache<\/strong>.<\/li>\n<li>Flush data to <strong>SSTable<\/strong> (Sorted String Table) on disk when cache is full.<\/li>\n<\/ul>\n<h3>2. Read Path<\/h3>\n<div style=\"margin-left:3rem\">\n    <img src=\"06. Key-Value Store/images/read-path.png\"   alt=\"Hash Bucket\" width=\"500\">\n    <img src=\"06. Key-Value Store/images/read-path-without-cache.png\"   alt=\"Hash Bucket\" width=\"500\">\n<\/div>\n\n<ul>\n<li>Check <strong>memory cache<\/strong> for the data.<\/li>\n<li>If absent, use a <strong>Bloom Filter<\/strong> to locate the data in SSTables.<\/li>\n<li>Retrieve and return the data.<\/li>\n<\/ul>\n<hr />\n<h2>Final Architecture<\/h2>\n<p align=\"center\">\n<img src=\"06. Key-Value Store/images/final-architecture.png\"   alt=\"Hash Bucket\" width=\"500\">\n<\/p>\n\n<ul>\n<li>Clients communicate with the key-value store through simple APIs: get(key) and put(key,\nvalue).<\/li>\n<li>A coordinator is a node that acts as a proxy between the client and the key-value store.<\/li>\n<li>Nodes are distributed on a ring using consistent hashing.<\/li>\n<li>The system is completely decentralized so adding and moving nodes can be automatic.<\/li>\n<li>Data is replicated at multiple nodes.<\/li>\n<li>There is no single point of failure as every node has the same set of responsibilities.<\/li>\n<\/ul>", "zh": "\n<h2>引言<\/h2>\n<p><strong>键值存储（key-value store）<\/strong>是一种非关系型数据库，数据以键值对的形式存储。每个键都是唯一的，值通过这些键来访问。本章详细介绍如何设计一个可扩展、高可用的分布式键值存储，支持如下操作：\n- <code>put(key, value)<\/code>，用于插入数据。\n- <code>get(key)<\/code>，用于检索数据。<\/p>\n<h3>设计特点<\/h3>\n<ul>\n<li>键值对较小（&lt;10 KB）。<\/li>\n<li>支持大数据量，具备高可用性与可扩展性。<\/li>\n<li>自动扩展，一致性可调。<\/li>\n<li>低延迟。<\/li>\n<\/ul>\n<hr />\n<h2>单服务器键值存储<\/h2>\n<h3>实现<\/h3>\n<ul>\n<li>使用<strong>哈希表（hash table）<\/strong>在内存中存储键值对。<\/li>\n<li>优化手段：<\/li>\n<li>数据压缩（compression）。<\/li>\n<li>把访问较少的数据存到磁盘上。<\/li>\n<\/ul>\n<h3>局限<\/h3>\n<p>单台服务器的内存有限，因此要实现可扩展性就需要采用<strong>分布式方案<\/strong>。<\/p>\n<hr />\n<h2>分布式键值存储<\/h2>\n<p><strong>分布式键值存储<\/strong>把数据分区到多台服务器上，并且必须在 <strong>CAP 定理<\/strong>所列出的取舍之间做出权衡。<\/p>\n<h3>CAP 定理<\/h3>\n<ol>\n<li><strong>一致性（Consistency）：<\/strong> 所有客户端在同一时刻看到相同的数据。<\/li>\n<li><strong>可用性（Availability）：<\/strong> 即使部分节点宕机，系统仍能响应每一个请求。<\/li>\n<li><strong>分区容错（Partition Tolerance）：<\/strong> 即使发生网络分区，系统仍能继续运行。<\/li>\n<\/ol>\n<p><strong>取舍：<\/strong> 根据 CAP 定理，三项保证中最多只能同时满足两项。<\/p>\n<p align=\"center\">\n  <img src=\"06. Key-Value Store/images/cap.png\" alt=\"CAP\" width=\"400\">\n<\/p>\n\n<h4>系统类型：<\/h4>\n<ul>\n<li><strong>CP 系统：<\/strong> 保证一致性与分区容错，牺牲可用性（例如银行系统）。<\/li>\n<li><strong>AP 系统：<\/strong> 保证可用性与分区容错，牺牲一致性（例如最终一致性）。<\/li>\n<li>\n<p><strong>CA 系统：<\/strong> 保证一致性与可用性，牺牲分区容错。<\/p>\n<p><strong>由于网络故障不可避免，分布式系统必须能够容忍网络分区。因此，CA 系统在真实应用中不可能存在。<\/strong><\/p>\n<p>在分布式系统中，分区不可避免。当分区发生时，我们必须在一致性与可用性之间做出选择。例如，如果节点 n3 宕机，\n写入节点 n1 或 n2 的任何数据都无法传播到 n3。反过来，如果数据写入了 n3 但尚未传播到 n1 和 n2，节点 n1 和 n2 就会持有陈旧数据。<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/server-down.png\"  alt=\"服务器宕机\" width=\"400\">\n<\/p><\/p>\n<\/li>\n<li>\n<p>如果选择 CP 系统，我们必须阻塞所有发往 n1 和 n2 的写操作，以避免数据不一致。<\/p>\n<\/li>\n<li>如果选择 AP 系统，系统继续接受读请求，即使它可能返回陈旧数据。\n  对于写操作，n1 和 n2 继续接受写入，当网络分区恢复后，数据会同步到 n3。<\/li>\n<\/ul>\n<hr />\n<h2>系统组件<\/h2>\n<h3>1. 数据分区<\/h3>\n<ul>\n<li><strong>技术：<\/strong> 使用一致性哈希把数据均匀分布到多台服务器上。<\/li>\n<li><strong>优点：<\/strong><\/li>\n<li>服务器增减时自动扩展。<\/li>\n<li>通过虚拟节点实现异构性。一台服务器的虚拟节点数量与该服务器的容量成正比。<\/li>\n<\/ul>\n<h3>2. 数据复制<\/h3>\n<ul>\n<li>为高可用性，把数据复制到 <code>N<\/code> 台服务器上。<\/li>\n<li>\n<p>这 N 台服务器是这样选出的：从数据所在服务器位置开始沿环顺时针走，选取环上最靠前的 N 台服务器来存放数据副本。在引入虚拟节点的情况下，应把副本放在不同的数据中心，以提高可靠性。<\/p>\n<p><p align=\"center\">\n<img src=\"06. Key-Value Store/images/data-replication.png\" alt=\"数据复制\" width=\"300\">\n<\/p><\/p>\n<\/li>\n<\/ul>\n<h3
